# cargo-about configuration: https://embarkstudios.github.io/cargo-about/
# `cargo xtask licenses` generates THIRD_PARTY_LICENSES.html from this (see CLAUDE.md).

# Keep in sync with `[licenses] allow` in deny.toml.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "OFL-1.1",
  "CDLA-Permissive-2.0",
]

# Everything that ships: the platforms of the release workflow.
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "wasm32-unknown-unknown",
]

# Test-only crates (proptest, insta) never ship. `xtask` is left out by the xtask command, which
# scans the shipped packages only.
ignore-dev-dependencies = true
ignore-build-dependencies = false

# Our own crates (unpublished, GPL-3.0-only) are not third-party.
private = { ignore = true }
