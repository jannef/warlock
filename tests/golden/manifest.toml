move:E*2 move:SE*3 move:E*2 move:NE*2 move:SE move:E*3 move:SE*15 move:S move:SE move:E*6 move:SE*3
move:E*4 move:NE move:E move:SE*7 move:E move:S move:E*2 move:NE move:SE*5 move:E*4 move:SE*8 move:S
move:SE move:E*7 move:NE*2 move:SE*5 move:E*8 move:SE*9 move:E*2 move:NE move:E*2 move:NE*4 move:E*2
