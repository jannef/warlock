# The vast level's river (running water flowing south and south-west, boulders) by lantern light,
# at a lamp on its east bank (251,181), walked to from the start.
[[golden]]
name = "vast-river"
scenario = "vast"
actions = '''
move:NE*4 move:E move:NE*2 move:N move:NE*12 move:E*2 move:NE*3 move:E move:SE*5 move:E move:SE*2
move:E*2 move:SE*3 move:E*2 move:NE*2 move:SE move:E*3 move:SE*15 move:S move:SE move:E*6 move:SE*3
move:E*4 move:NE move:E move:SE*7 move:E move:S move:E*2 move:NE move:SE*5 move:E*4 move:SE*8 move:S
move:SE move:E*7 move:NE*2 move:SE*5 move:E*8 move:SE*9 move:E*2 move:NE move:E*2 move:NE*4 move:E*2
move:SE*2 move:E*2 move:NE move:E*4 move:NE*4 move:E move:NE move:E move:NE*3 move:SE*2 lantern
'''
window = "1280x720"

# The courtyard up the stairs nook's `<` (spec §5 "Sunlight"): short shadows due north at noon,
# long warm ones to the east at 17:30. `skip` moves the clock without turns passing.
[[golden]]
name = "courtyard-noon"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*67 open:S move:S*4 move:E*2 move:NE ascend move:E*22 skip:230m"

[[golden]]
name = "courtyard-dusk"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*67 open:S move:S*4 move:E*2 move:NE ascend move:E*22 skip:560m"

# The courtyard scenario at midnight under the full moon (spec §5 "Moonlight"; the 16th at
# 00:00): faint, slightly purple moonlight on open ground, short moon shadows due north, and the
# phase in the status bar.
[[golden]]
name = "courtyard-full-moon"
scenario = "courtyard"
actions = "move:E*20 skip:353h skip:28m"

# The overworld (`world` scenario): along the road from the Hall to the bridge over the Wendle,
# at 12:20 (sunlit, sight radius 9) and after a skip to 22:20 on the 14th (cold night light with
# a nearly full moon on top, sight radius 4).
[[golden]]
name = "overworld-noon"
scenario = "world"
actions = "move:E*2 move:NE move:E*6 move:NE move:E*3"

[[golden]]
name = "overworld-night"
scenario = "world"
actions = "move:E*2 move:NE move:E*6 move:NE move:E*3 skip:10h"

# A forest clearing at noon (#55): along the road west into the Thornwood and north onto a forest
# cell, `>` into its local area (arriving on its south side), back out, and `>` again into the
# glade in the middle; then the clock skips to 12:00 the next day. Short shadows due north of
# the trees; the strip seen on the first visit is remembered.
[[golden]]
name = "forest-noon"
scenario = "world"
actions = "move:W*11 move:SW move:W*10 move:N descend move:S descend skip:1120m"
