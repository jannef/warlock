# The courtyard up the stairs nook's `<` (spec §5 "Sunlight"): short shadows due north at noon,
# long warm ones to the east at 17:30. `skip` moves the clock without turns passing; the
# outdoor entries set a clear sky (`weather:clear`, spec §5 "Weather"), whatever the weather of
# the day.
[[golden]]
name = "courtyard-noon"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*67 open:S move:S*4 move:E*2 move:NE ascend move:E*22 skip:230m weather:clear"

[[golden]]
name = "courtyard-dusk"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*67 open:S move:S*4 move:E*2 move:NE ascend move:E*22 skip:560m weather:clear"

# The courtyard scenario at midnight under the full moon (spec §5 "Moonlight"; the 16th at
# 00:00): faint, slightly purple moonlight on open ground, short moon shadows due north, and the
# phase in the status bar.
[[golden]]
name = "courtyard-full-moon"
scenario = "courtyard"
actions = "move:E*20 skip:113h skip:28m weather:clear"

# Weather (spec §5 "Weather", §4.8): the courtyard at noon in rain (duller, flatter light, faint
# shadows, sparse slanted drops, splashes, rings on the pond) and the forest glade at noon in heavy
# rain (darker, denser drops).
[[golden]]
name = "courtyard-rain"
scenario = "courtyard"
actions = "move:E*20 skip:330m weather:rain"

[[golden]]
name = "forest-heavy-rain"
scenario = "forest"
actions = "skip:330m weather:heavy"

# The overworld (`world` scenario): along the road from the Hall to the bridge over the Wendle,
# at 12:12 (sunlit, sight radius 9; the ranger's survival makes the journeys a little quicker) and
# after a skip of three days and ten hours to 22:12 on the 14th of Darkening (cold night light with
# a nearly full moon on top, sight radius 4).
[[golden]]
name = "overworld-noon"
scenario = "world"
actions = "move:E*2 move:NE move:E*6 move:NE move:E*3 weather:clear"

[[golden]]
name = "overworld-night"
scenario = "world"
actions = "move:E*2 move:NE move:E*6 move:NE move:E*3 skip:82h weather:clear"

# A forest clearing at noon (#55): along the road west into the Thornwood and north onto a forest
# cell, `>` into its local area (arriving on its south side), back out, and `>` again into the
# glade in the middle (6 seconds each), at 16:44 (the ranger's survival makes the journeys a
# little quicker); then the clock skips to 12:00 the next day. Short shadows due north of the
# trees; the strip seen on the first visit is remembered.
[[golden]]
name = "forest-noon"
scenario = "world"
actions = "move:W*11 move:SW move:W*10 move:N descend move:S descend skip:1156m weather:clear"

# Ranged combat (spec §8 "Ranged combat", §6 "Targeting", §4.8 "Missiles"). In the arena's dark
# corner the player readies the bow and arrows lying beside them and aims (`--fire`, as `f`):
# the cursor on the nearest hostile creature, out of range and marked so, the faint line of fire.
[[golden]]
name = "ranged-aim"
scenario = "arena"
actions = "move:E pickup equip:missile_weapon:a equip:missiles:b wait"
args = ["--fire"]

# From the storeroom (a short bow and flaming arrows) to the patrol gallery's door, a flaming arrow
# shot into its dark middle: halfway (frozen time), lighting its way, then burning where it landed.
[[golden]]
name = "ranged-flight"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W*2 move:S pickup move:W pickup equip:missile_weapon:a equip:missiles:c move:NE move:E*2 move:N*4 move:E*20 open:S move:S fire:45,17"

# Weapon skills (#134): the arena's halfling thief readies the bow beside them and shoots into
# the brawl until the arrows run out; the weapon skills screen shows the class's and the race's
# ranks (daggers 2, thrown 1, slings 1) and half a bar of marks in bows.
[[golden]]
name = "weapon-skills-screen"
scenario = "arena"
actions = "move:E pickup equip:missile_weapon:a equip:missiles:b fire:30,16*12"
screen = "weapon-skills"

[[golden]]
name = "ranged-burning-arrow"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W*2 move:S pickup move:W pickup equip:missile_weapon:a equip:missiles:c move:NE move:E*2 move:N*4 move:E*20 open:S move:S fire:45,17 wait"

# Spell effects (spec §4.8 "Spell effects"), shown with the dev action `effect` (no time passes,
# so `freeze_time` is how long after the effect began): a fireball in the arena's pit at its peak
# (white-hot core cooling outward, its light on the floor around it, the rest of the arena
# darkened) and cooling (embers flying, the view easing back); a lightning bolt across the pit at
# its first flash; a fireball in the start room right beside the player (the room darkened, the
# view shaken a few pixels); and the same with reduced effects: a brief still flash of its cells.
[[golden]]
name = "spell-fireball"
scenario = "arena"
actions = "effect:fireball@30,14"
freeze_time = 0.12

[[golden]]
name = "spell-fireball-cooling"
scenario = "arena"
actions = "effect:fireball@30,14"
freeze_time = 0.3

[[golden]]
name = "spell-lightning"
scenario = "arena"
actions = "effect:lightning_bolt@21,17>58,17"
freeze_time = 0.07

[[golden]]
name = "spell-fireball-near"
scenario = "showcase"
actions = "effect:fireball@11,13"
freeze_time = 0.08

[[golden]]
name = "spell-still"
scenario = "showcase"
actions = "effect:fireball@11,13"
freeze_time = 0.1
args = ["--reduced-effects"]
