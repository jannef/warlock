# The arena (spec §3, factions and creature behavior): watched from the dark south-west corner.
# After four turns the kobold war band and the giant rats meet at the fire pit; after twelve the
# fight is on (combat: the first kobolds have fallen, their spears where they died), and the
# frozen moment shows the archer's shot in flight and the shaman's sparkle.
[[golden]]
name = "arena"
scenario = "arena"
actions = "wait*4"

[[golden]]
name = "arena-shot"
scenario = "arena"
actions = "wait*12"

# Combat (spec §8 "Combat"): the player lights the lantern in the arena's dark corner and the war
# band's archer shoots them down from the dark. The death screen opens by itself over the run as
# it ended. Every action must take a turn, so the walk ends with the killing one.
[[golden]]
name = "death-screen"
scenario = "arena"
actions = "lantern wait*16"

# A generated level (rooms generator, The Depths 1) from the scenario's fixed seed.
[[golden]]
name = "depths-1"
scenario = "depths"
actions = "wait"

# The pause menu over a running game: guards against overlays being wiped (#56).
[[golden]]
name = "pause-menu"
scenario = "showcase"
actions = "wait"
screen = "pause"

# The `?` help over a run: the controls list, read-only (#57). Tall enough for the whole list.
[[golden]]
name = "help-screen"
scenario = "showcase"
actions = "wait"
screen = "help"
window = "1280x912"

# Settings over a run, opened over the pause menu (#57).
[[golden]]
name = "settings-screen"
scenario = "showcase"
actions = "wait"
screen = "settings"

# Objects (#79): the door corridor's storeroom of arms and armor, from its doorway, lit by its
# torch; the start room's gold and pile are remembered behind.
[[golden]]
name = "storeroom"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W"

# Choosing what to pick up from the start room's pile (#80).
[[golden]]
name = "pick-up-screen"
scenario = "showcase"
actions = "move:SW*2"
screen = "pick-up"

# The inventory after picking up the start room's pile and gold (#80, #81): letters, glyphs,
# weights, and what the player carries and weighs.
[[golden]]
name = "inventory-screen"
scenario = "showcase"
actions = "move:SW*2 pickup move:NE*2 move:E*2 move:NE pickup"
screen = "inventory"

# Burden (#115): most of the storeroom picked up (20.9 kg; the showcase's thief, St 9 To 10, is
# burdened over 14 kg). The inventory names the burden and the weights at which it changes, and
# the status bar shows "Burdened" right after the hit points.
[[golden]]
name = "burdened-inventory"
scenario = "showcase"
actions = '''
move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W*2 move:N pickup move:S*2 pickup
move:NW move:W*2 move:N pickup move:SW pickup
'''
screen = "inventory"

# The character screen (#107, #108, #111): the player's name, race, gender, and class, their
# age, birthday, and birth sign, their score in each stat (never a modifier or a potential), and
# what they weigh, carrying the start room's pile.
[[golden]]
name = "character-screen"
scenario = "showcase"
actions = "move:SW*2 pickup"
screen = "character"

# The Skills screen (#132): the showcase's thief's trained skills (never an untrained one) with
# their values and, dimmer, how near each is to its next point; the first one's description.
[[golden]]
name = "skills-screen"
scenario = "showcase"
screen = "skills"

# Character creation (#108, #111, #118), over New run on the main menu (no run; the replay goes
# unused): the race step with the showcase's character's race preselected, and the summary of
# that character (race, gender, and class each preselected), with its age, birthday, and sign
# and its final scores (the dice rolled from the seed).
[[golden]]
name = "race-screen"
scenario = "showcase"
screen = "race"

[[golden]]
name = "character-summary"
scenario = "showcase"
screen = "summary"

# The equipment screen (#114): every slot by letter with what is in it, after arming in the
