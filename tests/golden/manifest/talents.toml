# Talents (spec §8 "Talents"): what a talent changes that the player sees. The run starts as a
# human ranger, is raised to level 3 with the dev `xp:`, spends the level's skill rolls, and takes
# the talent at the pick that level brings.

# Night eyes (#239): the darkness chamber's inner room as the darkvision entries see it
# (showcase.toml), with eyes that need half the light normal eyes do.
[[golden]]
name = "talent-night-eyes"
scenario = "showcase"
character = "human,male,ranger"
actions = "xp:4000 advance:survival*8 talent:night_eyes move:N*3 open:N move:N*2 move:E*30 open:N move:N*3 move:W*6 move:N*5 move:E*6 move:S*2"

# Weather-wise (#239): the courtyard at 07:30, the status bar's weather saying what is coming
# (`Clear, then overcast`) within three hours.
[[golden]]
name = "talent-weather-wise"
scenario = "courtyard"
character = "human,male,ranger"
actions = "xp:4000 advance:survival*8 talent:weather_wise skip:1h wait"
window = "1280x720"
