# The character: its screen, skills, status effects and diseases, and character creation.

# The character screen (#107, #108, #111): the player's name, race, gender, and class, their
# age, birthday, and birth sign, their score in each stat (never a modifier or a potential), level,
# hit points, Defence, Protection, and stance, and what they weigh, carrying the start room's
# pile, with the burden's thresholds. The character screens are 680 high: at 540 the panel cuts its last rows.
[[golden]]
name = "character-screen"
scenario = "showcase"
actions = "move:SW*2 pickup"
screen = "character"
window = "960x680"

# The Skills screen (#132): the showcase's thief's trained skills (never an untrained one) with
# their values and, dimmer, how practised each is (its ladder step); the first one's description.
[[golden]]
name = "skills-screen"
scenario = "showcase"
screen = "skills"

# The abilities menu (#156), with the storeroom's small shield in hand: the thief's skills used
# as actions greyed out ("not usable yet") but Disable device's use, Disarm a trap (#232), and
# Open lock's, Pick lock (#233), which can be used ("in a direction"), the first under the cursor
# (the first usable) and described below; then the shield bash, which can be used too.
[[golden]]
name = "abilities-menu"
scenario = "showcase"
actions = '''
move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W*2 move:N pickup:a
equip:off_hand:a
'''
screen = "abilities"

# Status effects (#138): four bites' worth of poison and a wound (the dev `afflict:` action), a
# turn later. The character screen names them (never how bad) and shows Strength and Dexterity
# lowered by the strong poison, in red; the status bar beneath names them after the hit points.
[[golden]]
name = "status-effects"
scenario = "showcase"
actions = "afflict:poisoned*4 afflict:bleeding wait"
screen = "character"
window = "960x680"

# Diseases (#139): the shakes caught (the dev `infect:` action), then rest. Hunger cuts the rests
# short ("You are getting hungry."), so it takes three: two days on, the disease has shown and
# progressed once, so the character screen names it on its own row below the status
# (`Diseased  The shakes`); the status bar beneath says only `Diseased` (and `Weak`: hunger
# lowers Strength and Dexterity, in red). 704 high, so the panel (one row taller with the
# alignment, #254) leaves the status bar in sight.
[[golden]]
name = "diseased"
scenario = "showcase"
actions = "infect:the_shakes rest:24h*3"
screen = "character"
window = "960x704"

# Character creation (#108, #111, #118, #218), over New run on the main menu (no run; the replay
# goes unused; a debug build, so New run has its seed field and the summary names the seed): the
# race step with the showcase's character's race preselected; the gender step on "other", which
# never names the stat it raises (#256: "+1 to one stat, chosen by fate."); the name step
# with a name typed (`k` types, though it moves the selection on other screens), the keys as
# bound, and the random name an empty field gives; and the summary of that character (race,
# gender, and class each preselected, the name left empty: the first of the race's random names),
# with its age, birthday, and sign and its final scores (the dice rolled from the seed); then the
# summary of an "other" (gender step: Down, then Enter through the class and an empty name),
# whose gender row says only "Other".
[[golden]]
name = "race-screen"
scenario = "showcase"
screen = "race"

# Born under the stars (#265), after the race step: the showcase's human's birth, sign, the
# legend of its animal and element, its gifts in words, and the sign's stat adjustments.
[[golden]]
name = "sign-screen"
scenario = "showcase"
screen = "sign"

# The same on a lucky day: seed 440 typed on New run (pinned by world/stars_tests.rs) gives the
# showcase's human the Water Kraken on the 11th, the Deep One, whose legend shows in the accent
# colour.
[[golden]]
name = "sign-screen-lucky"
scenario = "showcase"
screen = "new-run"
args = ["--keys", "4 4 0 Enter Enter"]

# The class step (#226), the thief preselected: below its stat adjustments, how fast its levels
# come, in words ("Levels come quickly.": a thief needs 95 % of the experience).
[[golden]]
name = "class-screen"
scenario = "showcase"
screen = "class"

[[golden]]
name = "gender-screen"
scenario = "showcase"
screen = "gender"
args = ["--keys", "Down"]

[[golden]]
name = "name-screen"
scenario = "showcase"
screen = "name"
args = ["--keys", "B r a k k a"]

[[golden]]
name = "character-summary"
scenario = "showcase"
screen = "summary"

[[golden]]
name = "character-summary-other"
scenario = "showcase"
screen = "gender"
args = ["--keys", "Down Enter Enter Enter"]
