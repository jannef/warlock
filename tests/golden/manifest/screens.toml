# The UI console over the main menu and over a run. Every other screen is a text snapshot
# (`crates/warlock/src/ui/screen_snapshots.rs`), not a golden.

# The main menu (no run; the replay goes unused).
[[golden]]
name = "main-menu"
scenario = "showcase"
screen = "main"

# The pause menu over a running game: guards against overlays being wiped (#56).
[[golden]]
name = "pause-menu"
scenario = "showcase"
actions = "wait"
screen = "pause"
