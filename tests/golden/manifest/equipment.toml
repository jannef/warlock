# Equipment and magic items.

# The equipment screen (#114): every slot by letter with what is in it, after arming in the
# storeroom: a helm, mail, a two-handed quarterstaff in both hands, boots, a bow and arrows.
[[golden]]
name = "equipment-screen"
scenario = "showcase"
actions = '''
move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W*2 move:N pickup move:S*2 pickup
move:NW move:W*2 move:N pickup move:SW pickup equip:head:f equip:body:e equip:main_hand:b
equip:missile_weapon:c equip:missiles:d equip:feet:i
'''
screen = "equipment"

# Choosing what goes in a slot (#114): the head, where the iron helm is worn (marked so; choosing
# it takes it off).
[[golden]]
name = "equip-item-screen"
scenario = "showcase"
actions = '''
move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W*2 move:N pickup move:S*2 pickup
move:NW move:W*2 move:N pickup move:SW pickup equip:head:f equip:body:e equip:main_hand:b
equip:missile_weapon:c equip:missiles:d equip:feet:i
'''
screen = "equip-item"

# Magic items (#149): the storeroom's magic arms picked up, names in their rarity's color (magic
# blue, rare yellow): a magic ring and a rare bow not yet identified, Dread Visage (a rare helm,
# worn), and a Sharp emerald-pommelled long sword of the Bear (#191).
[[golden]]
name = "magic-inventory"
scenario = "showcase"
actions = '''
move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W*5 pickup move:E pickup
equip:head:c
'''
screen = "inventory"

# The item description (#149): Dread Visage, the rare helm, identified and worn: what it is, its
# base stats in words, its item level, and each affix in plain words.
[[golden]]
name = "item-description"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W*4 pickup equip:head:a"
screen = "describe"

# An item set with a gem (#191): the storeroom's Sharp emerald-pommelled long sword of the Bear
# picked up alone, its gem in its name between the prefix and the base, every part (the emerald
# pommel too) in what it is, and the gem's size and cut on a line of its own.
[[golden]]
name = "ornament-description"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W*4 pickup:b"
screen = "describe"
