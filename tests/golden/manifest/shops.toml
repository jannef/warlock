# Shops (spec §7 "Shops"): Grimbold's General Store in the courtyard, walked into with the purse from
# the gazebo; look mode on the short sword says its price, and the inventory marks what is unpaid.
[[golden]]
name = "shop-look"
scenario = "courtyard"
actions = "move:E*36 move:S pickup move:NE move:NE pickup:b move:SE move:E*5 move:S*5 move:E*5 move:E move:NE"
freeze_time = 1.0
args = ["--look", "58,13"]

# Stealing (spec §8 "Stealing", #234): the same walk as a thief (the courtyard's own character is
# a druid, untrained in Steal), then the abilities menu's Steal at Grimbold, north; on this seed
# the hand goes unnoticed into his purse: "You steal 300 gold coins from Grimbold.", and the shop
# stays open.
[[golden]]
name = "shop-theft"
scenario = "courtyard"
seed = 4
character = "human,female,thief"
actions = "move:E*36 move:S pickup move:NE move:NE pickup:b move:SE move:E*5 move:S*5 move:E*5 steal:N"
freeze_time = 1.0

[[golden]]
name = "shop-unpaid"
scenario = "courtyard"
actions = "move:E*36 move:S pickup move:NE move:NE pickup:b move:SE move:E*5 move:S*5 move:E*5 move:E move:NE pickup move:E move:E pickup"
freeze_time = 1.0
screen = "inventory"

# The dialog (spec §6, §7 "Shops"): with the dagger unpaid (47 gold; the purse holds 60), a step
# out of the shop's door (`h`, as typed) asks first: what the player owes the keeper, then "Pay 47
# gold and leave" (y) or "Don't pay" (n, Esc), the safe option selected.
[[golden]]
name = "shop-leaving"
scenario = "courtyard"
actions = "move:E*36 move:S pickup move:NE move:NE pickup:b move:SE move:E*5 move:S*5 move:E*5 move:E move:NE pickup move:W move:SW"
freeze_time = 1.0
args = ["--keys", "h"]
