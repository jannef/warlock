# Starting kits (spec §8 "Character creation", #257): the world gives the character's kit (the
# showcase leaves it behind, so its own captures keep an empty pack).

# The world's ranger at the start: bow readied, arrows quivered, sword in hand, leathers on.
[[golden]]
name = "kit-equipment"
scenario = "world"
screen = "equipment"

[[golden]]
name = "kit-inventory"
scenario = "world"
screen = "inventory"

# New run on the world, a halfling male merchant: the summary lists the kit and the race's
# additions (two wool cloaks counted together), the gaps squeezed out at 960x540. A kit without
# magic, so new affixes elsewhere never change the capture.
[[golden]]
name = "kit-summary"
scenario = "world"
screen = "new-run"
args = [
    "--keys",
    "Down Down Down Down Down Down Down Down Enter Down Down Enter Enter Down Down Down Down Down Down Down Down Enter",
]
