# Starting kits (spec §8 "Character creation", #257): a run whose character the player chose
# starts with it (`kit = true`; the other entries walk the scenario's own pack).

# The world's ranger at the start: bow readied, arrows quivered, sword in hand, leathers on.
[[golden]]
name = "kit-equipment"
scenario = "world"
kit = true
screen = "equipment"

[[golden]]
name = "kit-inventory"
scenario = "world"
kit = true
screen = "inventory"

# New run on the world, a halfling male merchant (the name left to chance): the summary lists the kit and the race's
# additions (two wool cloaks counted together). A kit without magic, so new affixes elsewhere
# never change the capture; a taller window for its many lines.
[[golden]]
name = "kit-summary"
scenario = "world"
screen = "new-run"
window = "960x680"
args = [
    "--keys",
    "Down Down Down Down Down Down Down Down Enter Down Down Enter Enter Enter Down Down Down Down Down Down Down Down Enter Enter",
]
