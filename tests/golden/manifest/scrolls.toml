# Scrolls (spec §8 "Scrolls"): the trap hall's scrolls and unknown dagger picked up beside the
# arrival (in the pack: a dagger, b fireball, c lightning, d frost, e identify; the read list
# letters only the scrolls, a fireball to d identify).

# Aiming a scroll of lightning (`r`, its letter): the cursor on the nearest creature (Tab), the
# faint line of fire running through creatures, the prompt naming the read key.
[[golden]]
name = "scroll-aim"
scenario = "traps"
actions = "move:E pickup"
args = ["--keys", "r b Tab"]

# A scroll of fireball read at the cave beetle: the fireball in flight from the reader, lighting
# its way, before it bursts.
[[golden]]
name = "scroll-fireball"
scenario = "traps"
actions = "move:E pickup read:b:46,15"
freeze_time = 0.2

# The scroll of identify chosen: the read list's place taken by the unidentified stacks carried.
[[golden]]
name = "scroll-identify-list"
scenario = "traps"
actions = "move:E pickup"
args = ["--keys", "r d"]

# The read list (`r`): the scrolls carried under their class's header, no dagger.
[[golden]]
name = "scroll-read-list"
scenario = "traps"
actions = "move:E pickup"
screen = "read"

# A scroll of fireball aimed at the cell next to the reader: the dialog asks first.
[[golden]]
name = "scroll-too-close"
scenario = "traps"
actions = "move:E pickup"
args = ["--keys", "r a k Enter"]
