# Objects, doors, and burden: the storeroom, picking up, the inventory.

# Objects (#79): the door corridor's storeroom of arms and armor, from its doorway, lit by its
# torch; the start room's gold and pile are remembered behind.
[[golden]]
name = "storeroom"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W"

# Doors (#130): the pantry's locked west door, across the corridor from the storeroom, kicked
# in (it breaks on the fourth kick), seen from just inside the pantry: the broken door behind.
[[golden]]
name = "kicked-door"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 kick:E*4 move:E*2"

# Picking a lock (#233): the showcase's thief, trained in Open lock, picks the pantry's locked
# west door (the Pick lock ability, `pick:E`; with this seed it gives on the first try), and it
# swings open: "You pick the lock and open the door."
[[golden]]
name = "picked-lock"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 pick:E"

# Choosing what to pick up from the start room's pile (#80).
[[golden]]
name = "pick-up-screen"
scenario = "showcase"
actions = "move:SW*2"
screen = "pick-up"

# Item lists page (#188, #189): the start room's pile and gold and most of the storeroom, 13
# stacks of 11 item classes, are two pages of the drop list at 960x540. `a` marks the first
# stack, `>` turns the page, where letters start again at `a`, and `b` marks the gold coins: the
# page label, the class headers, and the page keys in the footer.
[[golden]]
name = "drop-page-2"
scenario = "showcase"
actions = '''
move:SW*2 pickup move:NE*2 move:E*2 move:NE pickup move:SW move:W*2 move:N*3 open:N move:N*2
move:E*16 open:S move:S*4 open:W move:W*2 move:N pickup move:S*2 pickup move:NW move:W*2 move:N
pickup move:SW pickup
'''
screen = "drop"
args = ["--keys", "a > b"]

# Gems (#191): the hub's secret closet emptied, its gold and two loose gems, each named by its
# size and cut and drawn in its gem's colour: a medium fine sapphire and an uncut tiny garnet,
# duller than a cut gem.
[[golden]]
name = "gem-inventory"
scenario = "showcase"
actions = "move:N*3 open:N move:N*2 move:E*16 open:S move:S*7 move:W*4 move:S move:W*3 pickup"
screen = "inventory"

# The same 13 stacks in the inventory, its second page (`>`): the margin and gaps gave way to fit
# more rows a page, as the console's height is what pages the list.
[[golden]]
name = "inventory-page-2"
scenario = "showcase"
actions = '''
move:SW*2 pickup move:NE*2 move:E*2 move:NE pickup move:SW move:W*2 move:N*3 open:N move:N*2
move:E*16 open:S move:S*4 open:W move:W*2 move:N pickup move:S*2 pickup move:NW move:W*2 move:N
pickup move:SW pickup
'''
screen = "inventory"
args = ["--keys", ">"]

# The inventory after picking up the start room's pile and gold (#80, #81): letters, glyphs,
# weights, and what the player carries and weighs, grouped by item class (#189).
[[golden]]
name = "inventory-screen"
scenario = "showcase"
actions = "move:SW*2 pickup move:NE*2 move:E*2 move:NE pickup"
screen = "inventory"

# Burden (#115): most of the storeroom picked up (20.9 kg; the showcase's thief, St 9 To 10, is
# burdened over 14 kg). The inventory names the burden and the weights at which it changes, and
# the status bar shows "Burdened" right after the hit points.
[[golden]]
name = "burdened-inventory"
scenario = "showcase"
actions = '''
move:N*3 open:N move:N*2 move:E*16 open:S move:S*4 open:W move:W*2 move:N pickup move:S*2 pickup
move:NW move:W*2 move:N pickup move:SW pickup
'''
screen = "inventory"
