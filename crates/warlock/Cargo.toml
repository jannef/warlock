[package]
name = "warlock"
description = "Warlock: GPU-rendered ASCII roguelike (Bevy app: rendering, input, UI, effects)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
bevy.workspace = true
clap.workspace = true
fontdue.workspace = true
image.workspace = true
serde.workspace = true
toml.workspace = true
warlock-core.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { workspace = true, features = ["multi_threaded"] }
directories.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["webgpu"] }
wasm-bindgen = "0.2"
# Only what browser storage and the page-hide hook need (see `storage.rs`), and the keymap's
# download and file picker (`settings/keymap.rs`: Blob to File).
web-sys = { version = "0.3", default-features = false, features = [
  "Window", "Document", "Storage", "Event", "EventTarget", "Location",
  "Blob", "BlobPropertyBag", "Element", "File", "FileList", "HtmlAnchorElement", "HtmlElement",
  "HtmlInputElement", "Url",
] }

[dev-dependencies]
insta.workspace = true

[lints]
workspace = true
