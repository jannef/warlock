[package]
name = "warlock-cli"
description = "Headless Warlock developer tool: scenarios, replays, state dumps. Does not link Bevy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
serde_json.workspace = true
warlock-core.workspace = true
workspace-hack.workspace = true

[features]
# The test world (`assets/campaigns/showcase/`), embedded only with this feature: on for every
# dev command, test, and benchmark; release builds and `cargo xtask web` turn it off with
# `--no-default-features` (docs/dev/campaign.md, "The test world in release builds").
default = ["showcase"]
# `default` too: `cargo test --workspace` turns on warlock-core's own default, and the same
# features give the same build of it (#1572).
showcase = ["warlock-core/default", "warlock-core/showcase"]

[lints]
workspace = true
