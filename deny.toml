# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Unmaintained crates deep in Bevy's tree are reported but don't fail the build.
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  "OFL-1.1",
  "CDLA-Permissive-2.0",
]

[licenses.private]
# Our own crates are unpublished and carry no license yet (spec §14).
ignore = true

[bans]
# Bevy's dependency tree has unavoidable duplicates.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
