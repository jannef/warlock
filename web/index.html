<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Warlock: a GPU-rendered ASCII roguelike. Play it in your browser.">
  <meta name="color-scheme" content="dark">
  <title>Warlock</title>
  <style>
    :root {
      --bg: #08080c;
      --panel: #121218;
      --line: #23232c;
      --text: #d8d4c8;
      --dim: #8e8a82;
      --accent: #e0b050;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
    body { display: flex; flex-direction: column; font: 14px/1.5 var(--mono); }
    a { color: var(--dim); text-decoration: none; }
    a:hover, a:focus-visible { color: var(--accent); }
    a:focus-visible, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

    header {
      display: flex; align-items: baseline; gap: 0.1rem 1.25rem; flex-wrap: wrap;
      padding: 0.45rem 16px; background: var(--panel); border-bottom: 1px solid var(--line);
    }
    .name { color: var(--accent); font-weight: 600; letter-spacing: 0.08em; }
    .version { color: var(--dim); font-size: 12px; }
    nav { display: flex; gap: 0.1rem 1.25rem; flex-wrap: wrap; margin-left: auto; font-size: 13px; }
    #fullscreen {
      font: inherit; font-size: 13px; color: var(--dim); background: none; border: 0; padding: 0;
      cursor: pointer;
    }
    #fullscreen:hover { color: var(--accent); }
    #fullscreen[hidden] { display: none; }

    #stage { position: relative; flex: 1 1 auto; min-height: 0; background: #000; }
    #warlock-canvas { display: block; width: 100%; height: 100%; outline: none; }

    #message {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 16px; text-align: center;
      background: #000;
    }
    #message[hidden] { display: none; }
    #message h1 { font-size: 1.2rem; margin: 0 0 0.75rem; color: var(--accent); font-weight: 600; }
    #message p { max-width: 36rem; margin: 0.25rem 0; color: var(--text); }
    #message a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    #message .dim { color: var(--dim); }
    #message.loading p { color: var(--dim); animation: breathe 1.8s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: 0.45; } }

    footer { padding: 0.3rem 16px; background: var(--panel); border-top: 1px solid var(--line);
      color: var(--dim); font-size: 12px; text-align: center; }
    #touch-note { display: none; margin: 0 0 0.15rem; }
    @media (pointer: coarse), (max-width: 640px) { #touch-note { display: block; } }
    @media (prefers-reduced-motion: reduce) { #message.loading p { animation: none; } }
  </style>
</head>
<body>
  <header>
    <span class="name">Warlock</span>
    <span class="version">v@VERSION@</span>
    <nav>
      <a href="https://github.com/jannef/warlock">Source</a>
      <a href="https://github.com/jannef/warlock/releases/latest">Downloads</a>
      <a href="https://github.com/jannef/warlock/blob/main/LICENSE">GPL-3.0</a>
      <button id="fullscreen" type="button" hidden>Fullscreen</button>
    </nav>
  </header>
  <main id="stage">
    <canvas id="warlock-canvas" tabindex="0" aria-label="Warlock game"></canvas>
    <div id="message" class="loading" role="status"><p id="status">Loading Warlock...</p></div>
  </main>
  <footer>
    <p id="touch-note">Warlock is played with a keyboard; on a phone or tablet you can look around, but not play.</p>
    Click the game to give it the keyboard · press ? for controls
  </footer>
  <script type="module">
    const message = document.getElementById("message");
    const canvas = document.getElementById("warlock-canvas");
    const stage = document.getElementById("stage");
    const fsButton = document.getElementById("fullscreen");
    const DOWNLOADS = "https://github.com/jannef/warlock/releases/latest";

    function fail(title, detail) {
      message.hidden = false;
      message.className = "";
      message.innerHTML = "";
      const h = document.createElement("h1");
      h.textContent = title;
      const p = document.createElement("p");
      p.textContent = detail;
      const q = document.createElement("p");
      q.className = "dim";
      q.append("You can also ");
      const a = document.createElement("a");
      a.href = DOWNLOADS;
      a.textContent = "download the desktop game";
      q.append(a, ".");
      message.append(h, p, q);
    }

    // The canvas keeps the keyboard: focus it on load and whenever the stage is clicked.
    stage.addEventListener("pointerdown", () => canvas.focus());

    // Fullscreen on the stage (not the canvas) so Bevy keeps sizing the canvas to its parent.
    // Esc leaves fullscreen in every browser; where the Keyboard Lock API exists (Chromium) we
    // ask for Esc so the game's pause menu gets it (hold Esc to leave fullscreen).
    const fsOn = () => document.fullscreenElement === stage;
    if (document.fullscreenEnabled) {
      fsButton.hidden = false;
      fsButton.addEventListener("click", async () => {
        try {
          if (fsOn()) await document.exitFullscreen();
          else await stage.requestFullscreen({ navigationUI: "hide" });
        } catch (err) {
          console.warn("fullscreen:", err);
        }
        canvas.focus();
      });
      document.addEventListener("fullscreenchange", () => {
        fsButton.textContent = fsOn() ? "Exit fullscreen" : "Fullscreen";
        try {
          if (fsOn()) navigator.keyboard?.lock?.(["Escape"]);
          else navigator.keyboard?.unlock?.();
        } catch {}
        canvas.focus();
      });
    }

    if (!("gpu" in navigator)) {
      fail(
        "WebGPU is not available",
        "Warlock needs WebGPU. Use a recent Chrome, Edge, or Safari (or Firefox on a " +
          "platform where WebGPU is enabled), over HTTPS or localhost."
      );
    } else {
      try {
        const adapter = await navigator.gpu.requestAdapter();
        if (!adapter) throw new Error("no suitable GPU adapter was found");
        const { default: init } = await import("./warlock.js");
        await init();
        message.hidden = true;
        canvas.focus();
      } catch (err) {
        // Bevy signals its normal exit by throwing a control-flow string; ignore that.
        if (String(err).includes("Using exceptions for control flow")) {
          message.hidden = true;
          canvas.focus();
        } else {
          console.error(err);
          fail("Warlock could not start", String(err));
        }
      }
    }
  </script>
</body>
</html>
