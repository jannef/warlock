# Windows and macOS test + playable builds.
#
# The repository is private, where Windows minutes cost 2x and macOS minutes 10x. Windows runs on
# every push to main; macOS runs on manual dispatch and release tags (development happens on macOS,
# where the full suite is run locally before every PR).
name: Platforms

on:
  push:
    branches: [main]
    paths: ["crates/**", "xtask/**", "assets/**", "Cargo.*", "rust-toolchain.toml", ".github/workflows/platforms.yml"]
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build and test on macOS"
        type: boolean
        default: true

concurrency:
  group: platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: warlock-linux-x86_64
            exe: warlock
          - name: Windows
            os: windows-latest
            artifact: warlock-windows-x86_64
            exe: warlock.exe
          - name: macOS
            os: macos-latest
            artifact: warlock-macos-arm64
            exe: warlock
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip macOS unless requested
        id: gate
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macOS" ] && [ "${{ github.event_name }}" != "workflow_dispatch" -o "${{ inputs.macos }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.gate.outputs.skip != 'true'
      - name: Install Linux dependencies
        if: steps.gate.outputs.skip != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libwayland-dev libxkbcommon-dev
      - name: Install pinned toolchain
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.skip != 'true'
      - name: Test
        if: steps.gate.outputs.skip != 'true' && runner.os != 'Linux'
        run: cargo test --workspace --locked
      - name: Release build
        if: steps.gate.outputs.skip != 'true'
        run: cargo build --release --locked --package warlock --package warlock-cli
      - name: Stage artifact
        if: steps.gate.outputs.skip != 'true'
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.exe }} dist/
          cp target/release/warlock-cli* dist/ 2>/dev/null || true
          rm -f dist/*.d dist/*.pdb
          cp assets/fonts/JuliaMono-OFL.txt dist/
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: ${{ matrix.artifact }}
          path: dist/
