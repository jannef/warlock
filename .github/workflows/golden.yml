name: Golden references

# Manual only. Reference screenshots are produced on Linux (Mesa lavapipe software Vulkan) because
# GPU and driver output differs across platforms. Run this deliberately after an intended visual
# change, download the artifact, review the images, and commit them. See CLAUDE.md,
# "Golden screenshots". Normal CI only compares (`cargo xtask golden`) and never updates.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  update:
    name: Regenerate golden references (Linux, lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate references
        env:
          WGPU_BACKEND: vulkan
        run: cargo xtask golden --update
      - uses: actions/upload-artifact@v4
        with:
          name: golden-references
          path: tests/golden/
          if-no-files-found: error
