# Release packaging: builds Linux, Windows, macOS and web archives and attaches them to a GitHub
# Release (pre-release for v0.x).
#
# Runs on tags `v*` (publishes a release with generated notes) and on manual dispatch (builds the
# archives and uploads them as workflow artifacts only; nothing is published, and the Pages
# deploy happens only with the `publish_pages` input). This is the only
# workflow that uses macOS and Windows runners: CI runs on Linux, and macOS is checked locally.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Also deploy the web build to GitHub Pages
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            platform: windows-x86_64
          - name: macOS arm64
            os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libwayland-dev libxkbcommon-dev
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release --locked --package warlock --package warlock-cli
      - name: Package
        env:
          REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          name="warlock-${REF_NAME}-${PLATFORM}"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          mkdir -p "dist/$name"
          cp "target/release/warlock$exe" "target/release/warlock-cli$exe" "dist/$name/"
          cp release/README.txt LICENSE assets/fonts/JuliaMono-OFL.txt "dist/$name/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            app="dist/$name/Warlock.app/Contents"
            mkdir -p "$app/MacOS"
            cp target/release/warlock "$app/MacOS/warlock"
            sed "s/@VERSION@/${REF_NAME#v}/g" release/Info.plist.in > "$app/Info.plist"
            (cd dist && zip -r -q "$name.zip" "$name")
          elif [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a -tzip -bso0 "$name.zip" "$name")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  web:
    name: Web (WebGPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The CLI must match the wasm-bindgen crate version in Cargo.lock exactly.
      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q " $version\$"; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
      # wasm-opt (binaryen) shrinks the wasm; xtask fails on CI if it is missing.
      - name: Install binaryen
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binaryen
      - run: cargo xtask web
      - name: Package
        env:
          REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
        run: |
          mkdir -p dist
          name="warlock-${REF_NAME}-web"
          cp -r target/web "dist/$name"
          cp release/README.txt LICENSE assets/fonts/JuliaMono-OFL.txt "dist/$name/"
          (cd dist && zip -r -q "$name.zip" "$name")
          rm -rf "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: dist/*
          if-no-files-found: error
      # The same build is the playable page on GitHub Pages (deployed by the `pages` job).
      - name: Assemble Pages site
        run: |
          mkdir -p pages
          cp -r target/web/. pages/
          cp LICENSE pages/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  # Deploys the latest web build to https://jannef.github.io/warlock/ on every release tag, and on
  # a manual run only when `publish_pages` is ticked.
  pages:
    name: Deploy to GitHub Pages
    if: github.ref_type == 'tag' || inputs.publish_pages
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [build, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Versions before 1.0 are published as pre-releases.
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* $prerelease \
            --title "Warlock $GITHUB_REF_NAME" --generate-notes --verify-tag
