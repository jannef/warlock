# Release packaging: builds Linux, Windows and macOS archives and attaches them to a GitHub Release.
#
# Runs on tags `v*` (publishes a release with generated notes) and on manual dispatch (builds the
# archives and uploads them as workflow artifacts only; nothing is published). This is the only
# workflow that uses macOS and Windows runners: CI runs on Linux, and macOS is checked locally.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            platform: linux-x86_64
          - name: Windows x86_64
            os: windows-latest
            platform: windows-x86_64
          - name: macOS arm64
            os: macos-latest
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libudev-dev libwayland-dev libxkbcommon-dev
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Release build
        run: cargo build --release --locked --package warlock --package warlock-cli
      - name: Package
        env:
          REF_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          name="warlock-${REF_NAME}-${PLATFORM}"
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          mkdir -p "dist/$name"
          cp "target/release/warlock$exe" "target/release/warlock-cli$exe" "dist/$name/"
          cp release/README.txt assets/fonts/JuliaMono-OFL.txt "dist/$name/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            app="dist/$name/Warlock.app/Contents"
            mkdir -p "$app/MacOS"
            cp target/release/warlock "$app/MacOS/warlock"
            sed "s/@VERSION@/${REF_NAME#v}/g" release/Info.plist.in > "$app/Info.plist"
            (cd dist && zip -r -q "$name.zip" "$name")
          elif [ "$RUNNER_OS" = "Windows" ]; then
            (cd dist && 7z a -tzip -bso0 "$name.zip" "$name")
          else
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Warlock $GITHUB_REF_NAME" --generate-notes --verify-tag
