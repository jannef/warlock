name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_golden:
        description: "Only regenerate golden references (Linux, lavapipe) and upload them as an artifact"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (fmt, clippy, test, smoke)
    if: ${{ !inputs.update_golden }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # The player wiki (wiki/, mdBook): its generated tables must be fresh and the book must build.
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: Wiki tables are up to date
        run: cargo xtask wiki --check
      - name: Build the wiki
        run: mdbook build wiki
      # --capture renders offscreen (no window), so no X server is needed; Mesa lavapipe
      # provides a software Vulkan adapter.
      - name: Screenshot smoke test (software Vulkan)
        env:
          WGPU_BACKEND: vulkan
        run: cargo xtask smoke
      # Advisory for now (#166): a wave of visual changes is landing, so the comparison runs and
      # uploads its diffs but doesn't fail the job. Remove `continue-on-error` when #166 restores
      # the references.
      - name: Golden screenshots (advisory, #166)
        if: hashFiles('tests/golden/*.png') != ''
        continue-on-error: true
        env:
          WGPU_BACKEND: vulkan
        run: cargo xtask golden
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-linux
          path: target/xtask/
          if-no-files-found: ignore

  wasm:
    name: wasm32 check
    if: ${{ !inputs.update_golden }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package warlock --package warlock-core --target wasm32-unknown-unknown --locked

  # Builds the browser version on main only; PRs get the quicker wasm32 check above.
  web:
    name: Web build (WebGPU)
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.update_golden)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The CLI must match the wasm-bindgen crate version in Cargo.lock exactly.
      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q " $version\$"; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
      # wasm-opt (binaryen) shrinks the wasm; xtask fails on CI if it is missing. Pinned to the
      # version used locally: Ubuntu's older apt binaryen exported the wrong table as
      # `__wbindgen_externrefs`, so the page could not start (`cargo xtask web` now checks this).
      - name: Install binaryen
        run: |
          version=133
          archive="binaryen-version_${version}-x86_64-linux.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/WebAssembly/binaryen/releases/download/version_${version}/${archive}"
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  ${archive}" | sha256sum -c -
          tar -xzf "$archive"
          echo "$PWD/binaryen-version_${version}/bin" >> "$GITHUB_PATH"
      - run: cargo xtask web
      - uses: actions/upload-artifact@v4
        with:
          name: warlock-web
          path: target/web/
          if-no-files-found: error

  deny:
    name: cargo-deny
    if: ${{ !inputs.update_golden }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
      # Third-party notices: fail when THIRD_PARTY_LICENSES.html is stale (run
      # `cargo xtask licenses` after changing dependencies).
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Third-party licenses are current
        run: cargo xtask licenses --check

  # Manual only: Actions > CI > Run workflow with "update_golden" ticked (or
  # `gh workflow run ci.yml --ref <branch> -f update_golden=true`). Reference screenshots are
  # produced on Linux (lavapipe) only, because GPU and driver output differs across platforms.
  # Download the artifact, review the images, and commit them deliberately (CLAUDE.md,
  # "Golden screenshots"). Normal CI only compares and never updates.
  golden-update:
    name: Regenerate golden references (Linux, lavapipe)
    if: github.event_name == 'workflow_dispatch' && inputs.update_golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate references
        env:
          WGPU_BACKEND: vulkan
        run: cargo xtask golden --update
      - uses: actions/upload-artifact@v4
        with:
          name: golden-references
          path: tests/golden/
          if-no-files-found: error
