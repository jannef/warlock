name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (fmt, clippy, test, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan1
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # --capture renders offscreen (no window), so no X server is needed; Mesa lavapipe
      # provides a software Vulkan adapter.
      - name: Screenshot smoke test (software Vulkan)
        env:
          WGPU_BACKEND: vulkan
        run: cargo xtask smoke
      - name: Golden screenshots
        if: hashFiles('tests/golden/*.png') != ''
        env:
          WGPU_BACKEND: vulkan
        run: cargo xtask golden
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures-linux
          path: target/xtask/
          if-no-files-found: ignore

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --package warlock --package warlock-core --target wasm32-unknown-unknown --locked

  # Builds the browser version on main only; PRs get the quicker wasm32 check above.
  web:
    name: Web build (WebGPU)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The CLI must match the wasm-bindgen crate version in Cargo.lock exactly.
      - name: Install wasm-bindgen-cli
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q " $version\$"; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi
      - run: cargo xtask web
      - uses: actions/upload-artifact@v4
        with:
          name: warlock-web
          path: target/web/
          if-no-files-found: error

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
