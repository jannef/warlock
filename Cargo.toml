[workspace]
resolver = "3"
members = ["crates/warlock-core", "crates/warlock-cli", "crates/warlock", "xtask"]
default-members = ["crates/warlock-core", "crates/warlock-cli", "crates/warlock"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
warlock-core = { path = "crates/warlock-core" }
bevy = { version = "0.20", default-features = false, features = [
  "default_app",
  "std",
  "bevy_winit",
  "x11",
  "wayland",
  "2d_bevy_render",
] }
directories = "6"
clap = { version = "4.6", features = ["derive"] }
flate2 ={ version = "1.1", default-features = false, features = ["rust_backend"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
insta = "1.49"
proptest = "1.12"
rand_chacha = { version = "0.10", features = ["serde"] }
rand_core = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
# Bevy systems routinely take many parameters and complex query types.
too_many_arguments = "allow"
type_complexity = "allow"

# Fast iteration: optimize dependencies (Bevy) even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4

# Browser build (`cargo xtask web`): trade a little speed for a much smaller download.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
