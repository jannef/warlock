[workspace]
resolver = "3"
members = [
  "crates/warlock-core",
  "crates/warlock-cli",
  "crates/warlock",
  "crates/workspace-hack",
  "xtask",
]
default-members = ["crates/warlock-core", "crates/warlock-cli", "crates/warlock"]

[workspace.package]
version = "0.17.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-only"
authors = ["Janne Lê Forsell <janne@jannef.com>"]
repository = "https://github.com/jannef/warlock"

[workspace.dependencies]
# Each member turns the test world on through its own `showcase` feature (docs/dev/campaign.md).
warlock-core = { path = "crates/warlock-core", default-features = false }
workspace-hack = { path = "crates/workspace-hack" }
# The leaf features the game uses (#1590): `default_app` and `2d_bevy_render` would add bevy_state,
# bevy_text, bevy_animation, and the gizmos, none of which it uses (glyphs are drawn with
# fontdue). `multi_threaded` (native) and `webgpu` (wasm) are added in crates/warlock.
bevy = { version = "0.20", default-features = false, features = [
  "std",
  "async_executor",
  "reflect_auto_register",
  "bevy_asset",
  "bevy_log",
  "bevy_winit",
  "x11",
  "wayland",
  "bevy_render",
  "bevy_core_pipeline",
  "bevy_post_process",
  "bevy_sprite_render",
  "bevy_camera",
  "bevy_color",
  "bevy_curve",
  "bevy_image",
  "bevy_material",
  "bevy_mesh",
  "bevy_shader",
  "bevy_window",
  "hdr",
  "png",
] }
directories = "6"
clap = { version = "4.6", features = ["derive"] }
# Default features (`rust_backend`): the game's tree (png) has them, so every tree builds the same
# flate2 (#1572).
flate2 = "1.1"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png"] }
insta = "1.49"
proptest = "1.12"
rand_chacha = { version = "0.10", features = ["serde"] }
rand_core = "0.10"
# `alloc`: the game's tree (Bevy) turns it on; named here so every tree builds the same serde
# (#1572).
serde = { version = "1", features = ["alloc", "derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Fast iteration: optimize dependencies (Bevy) even in dev builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Build scripts, proc macros, and their dependencies: without debug info, as Cargo's default, but
# set, so a crate shared with the game's runtime tree (Cargo then builds it with the dev debug
# info) is not another build of it, and of all above it, in the CLI's and xtask's trees (#1572).
[profile.dev.build-override]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4

# Browser build (`cargo xtask web`): trade a little speed for a much smaller download.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
