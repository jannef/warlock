# Vault (assets/vaults, spec §7): a pillared shrine with an altar, lit by four wall torches.
# Vaults use the level-file format. The edge must be solid except for entrance doors (not on a
# corner); no stairs or player start. Generators stamp the whole rectangle where it fits and join
# every entrance to the level.
name = "Shrine"
map = '''
####+####
#t.....t#
#.#.^.#.#
+..._...+
#.#.m.#.#
#t.....t#
#########
'''

[legend]
"t" = "sconce"
# Traps (spec §8 "Traps"): a hidden spear trap guards the offering, a piece of jewellery rolled when the level is generated.
"^" = { terrain = "floor", trap = "spear", loot = { pool = "jewellery" } }
# A reward (spec §8 "Magic items"): loot below the altar, rolled when the level is generated.
"m" = { terrain = "floor", loot = "any" }
