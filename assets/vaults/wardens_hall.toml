# Vault: the Warden's hall, the lair of every Pit's boss (#1298; docs/design/miscasts-review.md
# §7.4; spec §7 "The Pits"). The decision: the hoard behind the warden, or the stair back up while
# its gates are still few. A long hall walled in black stone with lava in its corners, the warden
# at its heart and four chests and the hoard about it. Hellegeat's boss row names it, so it is
# stamped on the fifth floor of every Pit, for certain, and nowhere else. The floor leads nowhere
# deeper, so it marks no `>`. Once the warden is dead its Pit is sealed, and a fifth floor made
# again has the hall and a hoard drawn anew, but no warden (`world/levels/pit.rs`).
name = "The Warden's hall"
dungeons = ["hellegeat"]
map = '''
#######################
#LL......C...C......LL#
#L...m...........r...L#
+..........W.....$....#
#L...o...........m...L#
#LL......C...C......LL#
#######################
'''

[legend]
"L" = "lava"
# The warden: it wakes to what it sees or hears.
"W" = { terrain = "floor", creature = "gatewarden" }
# The hoard: the chests are of the floor's band, the finds rolled as the floor is made.
"C" = { terrain = "chest", locked = true }
"o" = { terrain = "floor", loot = "any" }
"m" = { terrain = "floor", loot = "magic" }
"r" = { terrain = "floor", loot = { pool = ["weapons", "armour"], grade = "rare" } }
"$" = { terrain = "floor", objects = ["gold_coin*80"] }
