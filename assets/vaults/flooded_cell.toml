# Vault: a flooded cell with glowing fungus in its corners and a lamp over the dry middle.
name = "Flooded cell"
map = '''
#########
#,~~~~~,#
#~~~$~~~#
#~~.*.~~#
#,~~.~~,#
####+####
'''

[legend]
"," = "fungus"
"*" = { terrain = "floor", light = "lamp" }
# On the dry middle, under the lamp, what someone left out of the water's reach: money or
# jewellery of the floor's item level, rolled when the level is generated.
"$" = { terrain = "floor", loot = { pool = ["money", "jewellery"] } }
