# Vault: a guard post. A kobold paces the front room with two of the floor's own for company,
# drawn at its danger when the level is generated; a locked door hides a lamp-lit store room.
# The guard carries the brass key to it (spec §8 "Doors"): kobolds open doors, and a locked one
# only with its key. Take the key from the guard, or kick the door in.
name = "Guard post"
map = '''
###########
#g..g#....#
#.k..L.a*.#
#g..g#smf.#
###+#######
'''

[legend]
"k" = { terrain = "floor", creature = "kobold", route = "E2 W2", carry = ["brass_key"] }
# Whoever else is on duty: two of the floor's population on two of these four cells (none on a
# floor without a danger).
"g" = { terrain = "floor", monsters = { pool = "level", count = 2 } }
"*" = { terrain = "floor", light = "lamp" }
# A reward (spec §8 "Magic items"): something magic or rare left in the store room, rolled when
# the level is generated.
"m" = { terrain = "floor", loot = "magic" }
# The store (spec §8 "Magic items"): spare arms rolled when the level is generated, food and a
# skeleton key (which opens every lock) left as they are: food is no loot class, and the key is
# the way past the lock when the guard is dead or its key lost.
"a" = { terrain = "floor", loot = { pool = ["weapons", "armour"] } }
"f" = { terrain = "floor", objects = ["dried_meat*4"] }
"s" = { terrain = "floor", objects = ["skeleton_key"] }
"L" = { terrain = "door_closed", lock = "guard_post" }
