name = "Showcase"
description = "A hand-made tour of every engine capability, one room per feature. A safe place: its creatures keep to their rounds and leave you alone. For a fight, take the stairs down to the arena."
start_level = "hub"
seed = 1
# The player's character when the run does not choose one (New run and --character do): a
# race (data/races.toml), a gender (male, female, or other), and a class (data/classes.toml). The
# player's eyes, stats, and hit points come from it. A scenario without one gives them itself:
# `vision` (a profile in data/vision.toml; default "normal"), `stats` and `potential` by stat id
# (1 to 40; a missing score 10, the average; a missing potential the score; hidden from the
# player), and `hp`, the hit points beyond Toughness that a race and a class would give (default
# 0). Its `name` (optional, up to 20 characters) is the character's name in a run told none (a
# replay or a command line without `--name`); another character is given one of their race's names
# (data/names.toml).
character = { race = "human", gender = "female", class = "thief", name = "Tamsin" }
# The lantern the player carries (data/lights.toml; starts unlit).
lantern = "lantern"
# The start time (hh:mm); the date is the default, 11 Darkening 1444 (data/calendar.toml).
start_time = "08:00"
# A character chosen in character creation (New run, --character, --name) starts with their
# starting kit (data/classes.toml, data/races.toml); a scenario may give a pack on top, as level
# files place objects (`carry = ["ration*3"]`), which is all a launch on the scenario's own
# character starts with. The showcase gives none: its food is in the hub's pantry, its arms in
# the storeroom.
