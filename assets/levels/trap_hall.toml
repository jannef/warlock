# The trap hall (spec §3, §8 "Traps"): down the hub stairs nook's fourth staircase down (`T` in
# the hub's map), a lit hall to try traps in and to watch them catch creatures. The showcase
# itself has no traps. `<` leads back up to the hub. The `traps` scenario starts here.
#
# The proving row (north): seven bays, each with a known trap to try: an arrow trap (a), a spear
# trap (s), a pit (p), an alarm (b), a teleport trap (x), a lightning trap (l, its bolt runs south
# out of its bay and across the hall), and a fireball trap (f). Stepping onto a known trap asks
# first ("Really step onto the fireball trap?"); the fireball goes off once, the lightning twice.
#
# The crossing (south): creatures go their rounds across hidden traps, so within a few turns you
# watch them set them off, and from then on you know those traps too: a giant rat (1) runs over a
# spear trap (S), a torch-bearing kobold (2) walks into a fireball (F), a cave beetle (3) crawls
# onto a lightning trap (L) whose bolt runs west along its lane, and a second kobold (4) is shot
# from the south wall by an arrow trap (A). The rat and the kobolds are among the peaceful folk
# here and the beetle is wildlife, so nobody attacks you; the traps attack everybody. You arrive
# in the middle of the south wall, where the whole hall is in view: wait (`.`) and watch.
#
# Walls (spec §8 "Digging"): three pillars stand by the hidden fireball: packed earth (E) and
# stone (#) north of it, granite (G) south. Its blast breaks the two softer ones into rubble ("The
# walls collapse!"); the granite holds.
#
# The closets (north-west, spec §8 "Trapped doors"): three closets open onto the hall, each by a
# trapped door. A trap on a door goes off at whoever opens or kicks the door, never at whoever
# walks through the doorway. The west door shows its arrow trap (d): open it and an arrow shoots
# out of the wall beside it. The middle door hides a fireball (e): search (`s`) next to it first,
# or open it and find out (its blast bursts out on both sides of the door). The east door (o)
# stands open on a kobold's rounds (k) in and out of its closet, and hides an alarm: shut it (`c`)
# and watch the kobold open it again.
#
# Scrolls (spec §8 "Scrolls"): beside the arrival lie scrolls to try the same spells with, aimed
# where you like (`r`): fireball, lightning, and frost; and a scroll of identify for the dagger
# beside them, which nobody has identified.
arrival = "Scorch marks and old arrows litter the flagstones."
name = "The Trap Hall"
ambient = [48, 46, 42, 0]
map = '''
########################################################################
#...#...#...#.......#.......#.......#.......#.......#.......#.......####
#...#...#k..#...a...#...s...#...p...#...b...#...x...#...l...#...f...####
#...#...#...#.......#.......#.......#.......#.......#.......#.......####
##d###e##o###.......#.......#.......#.......#.......#.......#.......####
#t....................................................................t#
#......................................................................#
#......................................................................#
#.......................1...........S..................................#
#.........................E.#..........................................#
#......................................................................#
#.............2............F...........................................#
#......................................................................#
#..........................G...........................................#
#......................................................................#
#.......................................L...........3..................#
#......................................................................#
#......................................................................#
#...................4.............A....................................#
#t.................................<.@................................t#
########################################################################
'''

[legend]
"@" = { terrain = "floor", spawn = "player" }
"<" = { terrain = "stairs_up", to = "hub" }
"t" = "sconce"
# The proving row: known traps to try.
"a" = { terrain = "floor", trap = "arrow", known = true }
"s" = { terrain = "floor", trap = "spear", known = true }
"p" = { terrain = "floor", trap = "pit", known = true }
"b" = { terrain = "floor", trap = "alarm", known = true }
"x" = { terrain = "floor", trap = "teleport", known = true }
"l" = { terrain = "floor", trap = "lightning_bolt", known = true, dir = "S" }
"f" = { terrain = "floor", trap = "fireball", known = true }
# The crossing: creatures on their rounds, and the hidden traps across their way.
"1" = { terrain = "floor", creature = "rat", faction = "peaceful", route = "E20 W20" }
"2" = { terrain = "floor", creature = "kobold", faction = "peaceful", route = "E30 W30" }
"3" = { terrain = "floor", creature = "beetle", route = "W30 E30" }
"4" = { terrain = "floor", creature = "kobold", faction = "peaceful", route = "E24 W24" }
"S" = { terrain = "floor", trap = "spear" }
"F" = { terrain = "floor", trap = "fireball" }
"L" = { terrain = "floor", trap = "lightning_bolt", dir = "W" }
# The closets' trapped doors, and the kobold whose rounds lead through the open one.
"d" = { terrain = "door_closed", trap = "arrow", known = true }
"e" = { terrain = "door_closed", trap = "fireball" }
"o" = { terrain = "door_open", trap = "alarm" }
"k" = { terrain = "floor", creature = "kobold", faction = "peaceful", route = "S3 N3" }
# Pillars by the fireball: what its blast breaks and what it does not.
"E" = "packed_earth"
"G" = "granite"
"A" = { terrain = "floor", trap = "arrow" }

# The scrolls and the unknown dagger, east of the arrival.
[[pile]]
at = [38, 19]
objects = [
    "scroll_of_fireball*2", "scroll_of_lightning*2", "scroll_of_frost*2", "scroll_of_identify",
]

[[item]]
at = [38, 19]
object = "dagger"
affixes = ["sharp:1", "of_the_lynx:1"]
