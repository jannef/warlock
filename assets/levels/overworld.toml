# The overworld (spec §3): the Wildlands at map scale, 100x50. One step is a journey: it takes
# the terrain's `travel_minutes` (road 20, plains 45, grassland 50, forest 90, hills 120, swamp
# and dense forest 150). Mountains (M) and water are impassable: the river Wendle (arrows, the
# way it flows) and the deep water of Silvermere, the ponds, and the Grey Sea (w); the one bridge
# (b) carries the road over the Wendle. By day the traveller sees 9 cells, in twilight 5, at night
# 2; mountains and dense forest block sight. The sun and the sky light the land by day.
#
# Locations are stairs down: the Hall (H, the showcase hub), the mouth of the Vast Caverns (C) in
# the Hollowcrag, and the way into the Depths (D) in the Barrowdowns. Their levels' `<` lead back
# here. `>` anywhere else enters that cell's local area. Roads run from the Hall west through the
# Thornwood, south-west to the Depths, south to the Sallow Plains, and north-east over the bridge
# to the caverns. The `world` scenario starts on the road beside the Hall (@).
