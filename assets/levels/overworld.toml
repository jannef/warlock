"." = "plains"
'"' = "grassland"
"f" = "forest"
"F" = "dense_forest"
"h" = "hills"
"M" = "mountains"
"s" = "swamp"
# The river Wendle, drawn as arrows the way it flows.
"→" = { terrain = "river", flow = "E" }
"↘" = { terrain = "river", flow = "SE" }
"↓" = { terrain = "river", flow = "S" }
"w" = "lake"
"=" = "road"
"b" = "bridge"
"H" = { terrain = "hall", to = "hub" }
"C" = { terrain = "cave_mouth", to = "vast" }
"D" = { terrain = "dungeon_entrance", to = "depths:1" }
"@" = { terrain = "road", spawn = "player" }

