#..........................#...................#...............................#
#..........................#.ff................#t.........t.........t.........t#
#############+#######################+#########################+################
#.....l..........l..........l..........l..........l..........l..........l......#
#######+###############+###################+###################+##########+#####
#..t.......t...########.########.........................#..........~~~#.......#
#..............##t....#l#....t##..#...#...#...#...#...#..#..........~F~#...l.^.#
#..............##.....+.+.....##1........................#..........~~~#.......#
