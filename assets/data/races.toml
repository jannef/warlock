# Races (spec §8 "Character creation"): the first choice of a new run, in the order offered.
#
# Fields:
#   id, name      the race's id (for the command line and saves) and its name
#   description   one line, shown when choosing
#   vision        the race's eyes: a profile in vision.toml; the player starts with it
#   age           [youngest, oldest]: a new character's age in years, picked at random from the
#                 run seed (1 to 1000)
#   stats         adjustments to the starting scores, by stat id (strength, dexterity, toughness,
#                 intelligence, willpower, presence; a missing one 0): a number (`2`, `-1`) or
#                 dice (`"1d2+1"`, `"-1d3"`), rolled when the character is made; every result
#                 within -10 to 10
#   potential     adjustments to the potentials, the same way (hidden from the player)
#   hp            hit points (spec §8 "Combat"; default 0): a character's maximum is their
#                 Toughness plus their race's and their class's (classes/)
#   mana          mana (spec §8 "Mana"; default 0, at most 1000): a character's maximum is
#                 their race's and their class's plus the modifiers of their Intelligence,
#                 Willpower, and Presence
#   natural       natural armour, as a creature's (creatures/README.toml): { defence = 0,
#                 protection = 1, name = "scales" }: Defence in the Natural category and
#                 Protection, each 0 to 20 (not both 0), added to what the character wears; the
#                 name is what a blow glances off ("The arrow glances off your scales."). Default
#                 none
#   resist        what the character resists, in percent per damage type (damage_types.toml),
#                 as a creature's: { poison = 25 }, -100 (twice the harm) to 100 (immune), added
#                 to what they wear (spec §8 "Damage types"); the game names it in words only
#                 ("Resistant to poison"). Default none
#   light_blind   eyes that strong light dazzles: { glare = 250, sight = 10, to_hit = -1 }.
#                 While the light on the character's own cell, as their eyes perceive it (the
#                 status bar's Light), is at least `glare` bright (the sun well up, a bright fire
#                 close by), they are dazzled: they see nothing farther than `sight` cells (1 to
#                 40) and every attack they make is `to_hit` worse (-20 to 0). The game says
#                 when it begins and ends, and shows Dazzled while it lasts. Default none
#   disease_check points added to the character's checks against diseases (spec §8 "Diseases";
#                 diseases.toml): resisting one they are exposed to, and each progression (-10 to
#                 10, default 0)
#   eats_rotten   whether the character eats rotten food without harm (spec §8 "Hunger";
#                 hunger.toml's [rotten]): it feeds them as plain food would, and never makes them
#                 vomit or sick or carries a disease (default false)
#   alignment     the race's part of a new character's hidden alignment score (spec §8
#                 "Alignment"; alignment.toml; -1000 evil to 1000 good, default 0), added to
#                 their class's: most races only lean, never alone out of Neutral; the evil
#                 races start Callous (-200) or Evil (-450)
#   size         a size in sizes.toml (default "medium"; spec §8 "Burden"): how much the
#                 character can carry, 1.5 kg × (2 × Strength + Toughness), is scaled by its carry
#   ignores_burdened  whether being Burdened, the first level of burden, costs the character
#                 nothing (no slowdown, no cap on Dexterity in Defence, no louder steps; default
#                 false); from Strained on they are treated like everyone else
#   passive_search  which hidden features (secret doors, hidden traps; spec §8 "Searching") the
#                 character notices in passing without the Spot skill (for traps, Detect
#                 traps): "all", "stone" (those on stone, terrain.toml `stone`), or "traps"
#                 (hidden traps only); default none: only with the skill trained
#   search        points added to searching and to noticing in passing alike (-10 to 10,
#                 default 0)
#   skills        the skills the race trains (spec §8 "Skills"; skills.toml), by skill id: dice
#                 (`"1d6+4"`) or a number, rolled when the character is made, every result within
#                 0 to 100; added to the class's (a skill both train sums the two)
#   optional_skills  skills a new character of the race may or may not start with, as a
#                 class's (classes/README.toml): `{ chance = 40, dice = "2d4" }`, rolled after the
#                 class's from the same stream (so no class's roll moves); none is one of `skills`;
#                 a skill the class trains too sums the two (default none; the drow's Sneak attack)
#   class_skill  dice added to one of the class's skills, picked from the run seed when the
#                 character is made (default none; humans: one extra class skill)
#   rolls         skill rolls each level gives beyond the class's (spec §8 "Skills"; 0 to 10,
#                 default 0; humans 1). A level-up roll on a skill the race trains (`skills`)
#                 adds 1 (classes/README.toml)
#   talents       talents the race grants (spec §8 "Talents"), by id: `granted` talents of the
#                 `racial` tree in talents/, held from the start and never picked (default none;
#                 humans: Versatile). The race's other talents are picks that ask for the race
#   hunger       how much the character needs to eat, in percent of a human (spec §8 "Hunger";
#                 10 to 1000, default 100): game time burns their nutrition this much faster
#   experience    how much experience a level needs, in percent (spec §8 "Experience"; 50 to
#                 200, default 100): multiplied with the class's onto every threshold in
#                 experience.toml. Long-lived races pay more, short-lived ones less
#   weapon_skills starting ranks in weapon skills (spec §8 "Weapon skills"), by skill id in
#                 weapon_skills.toml: a number or dice, every result within 0 to 10; added to
#                 the class's (at most 10), then each raises the skills it defaults to
#   kit           a few racial items for the starting kit (spec §8 "Character creation"), after
#                 the class's: lines as in classes/README.toml's `kit` (a string is carried; `wield`,
#                 `wear`, `trained`, `gender`, `magic`, and `"a|b"` work the same, `trained`
#                 asking what the class trained). Every race without darkvision has a lantern
#                 ready (`{ wield = "lantern" }`: the Tool slot, unlit; spec §5 "Light sources")
#
# A new character's score in each stat is 10 (the average), plus the race's adjustment, plus the
# gender's (male: strength +1; female: dexterity +1; other: +1 to a stat picked from the run
# seed), plus the class's (classes/), plus their birth sign's animal and element
# (horoscope.toml), kept within 1 to 40. Its potential in each stat is `base_potential` plus the
# race's potential adjustment, within 1 to 40 and never below the starting score. Dice are rolled
# from the run seed and the choices, so the same seed and choices make the same character.
#
# Races are mostly fixed numbers, their identity, with a little dice where it fits. Balance is
# not a goal: some choices are poor on purpose.

base_potential = 15

[[race]]
id = "elf"
name = "Elf"
description = "Graceful and long-lived, keen of mind and eye but frail; elven eyes need little light."
vision = "low_light"
age = [90, 300]
stats = { strength = -1, dexterity = "1d2+1", toughness = -2, intelligence = 1, presence = 1 }
potential = { strength = -2, dexterity = 3, toughness = -3, intelligence = 2, willpower = 1, presence = 1 }
hp = 2
mana = 3
alignment = 50
size = "medium"
skills = { listen = "1d6+4", spot = "1d6+4" }
# Keen eyes: elves notice every hidden thing in passing, and find it more easily.
passive_search = "all"
search = 2
hunger = 80
experience = 140
weapon_skills = { long_blades = 1, bows = 1 }
# An elven long bow of hardwood and a quiver of arrows, and elven waybread: light, filling, and
# slow to go stale.
kit = [
    { wield = "long_bow:hardwood" },
    { wield = "arrow*20" },
    { wield = "lantern" },
    "waybread*3",
]

[[race]]
id = "half_elf"
name = "Half-elf"
description = "Of two peoples and at home in neither: adaptable and charming, with some of the elves' eyes."
vision = "low_light"
age = [20, 60]
stats = { dexterity = 1, presence = "1d2" }
potential = { dexterity = 1, toughness = -1, intelligence = 1, presence = 2 }
hp = 3
mana = 2
size = "medium"
skills = { bluff = "1d4+2", spot = "1d4+2" }
hunger = 90
experience = 105
weapon_skills = { bows = 1 }
# From the elven side: a short bow of hardwood and arrows, a keepsake silver ring, and waybread.
kit = [
    { wield = "short_bow:hardwood" },
    { wield = "arrow*20" },
    { wear = "silver_ring" },
    { wield = "lantern" },
    "waybread*2",
]

# No gift and no flaw, but the most room to grow (rolled).
[[race]]
id = "human"
name = "Human"
description = "Short-lived, ambitious, and everywhere: no gift and no flaw."
vision = "normal"
age = [16, 35]
potential = { strength = "1d2", dexterity = "1d2", toughness = "1d2", intelligence = "1d2", willpower = "1d2", presence = "1d2" }
hp = 4
mana = 1
size = "medium"
# One extra class skill: one of the class's skills, picked when the character is made.
class_skill = "2d4+4"
# Quick to learn: one more skill roll every level.
rolls = 1
# Versatile: one more talent at creation and at level 30 (talents/versatile.toml).
talents = ["versatile"]
hunger = 100
experience = 100
# No gift and no flaw: bread, like anyone's, and a little money.
kit = [{ wield = "lantern" }, "bread*2", "gold_coin*5"]

[[race]]
id = "dwarf"
name = "Dwarf"
description = "Stout, stubborn folk of the deep halls: hard to kill, hard to hurry, and at home in the dark."
vision = "darkvision"
age = [40, 120]
stats = { strength = 1, dexterity = -1, toughness = "1d2+2", willpower = 1, presence = -2 }
potential = { strength = 2, dexterity = -2, toughness = 4, willpower = 1, presence = -2 }
hp = 6
size = "medium"
skills = { metalcraft = "1d6+4", search = "1d6+4" }
weapon_skills = { axes = 1, crossbows = 1 }
# Dwarves carry loads all their lives: being Burdened costs them nothing.
ignores_burdened = true
# They know stonework: they notice what is hidden in stone in passing (most of a dungeon).
passive_search = "stone"
hunger = 110
experience = 115
# A dwarf never goes anywhere without a pick-axe (readied in the Tool slot), and goes in good
# steel: the pick, gauntlets, and iron-shod boots. Dried meat.
kit = [
    { wield = "pick_axe:steel" },
    { wear = "gauntlets:steel" },
    { wear = "iron_shod_boots:steel" },
    "dried_meat*3",
]

[[race]]
id = "halfling"
name = "Halfling"
description = "Small, quick, and unflappable, with nimble fingers and quiet feet; no match for anything big."
vision = "normal"
age = [20, 50]
stats = { strength = -3, dexterity = 3, willpower = 1 }
potential = { strength = -4, dexterity = 3, willpower = 1, presence = 1 }
hp = 2
mana = 1
alignment = 50
size = "small"
skills = { listen = "1d6+4", stealth = "1d6+4" }
# Second breakfast.
hunger = 125
experience = 95
weapon_skills = { slings = 1 }
# A sling and a pouch of stones, a pipe, and a lantern (no apples: a small character with a heavy
# class kit would start burdened).
kit = [{ wield = "sling" }, { wield = "sling_stone*10" }, { wield = "lantern" }, "pipe"]

[[race]]
id = "gnome"
name = "Gnome"
description = "Small, tireless tinkerers and illusionists, curious about everything; they see well by little light."
vision = "low_light"
age = [40, 150]
stats = { strength = -2, toughness = 1, intelligence = "1d2+1", willpower = -1 }
potential = { strength = -3, dexterity = 1, toughness = 1, intelligence = 3 }
hp = 3
mana = 3
size = "small"
skills = { appraise = "1d6+4", listen = "1d6+4" }
hunger = 90
experience = 120
weapon_skills = { crossbows = 1 }
# A tinkerer's pockets: a scroll of light, a candle stub, and a curious stone.
kit = [{ wield = "lantern" }, "scroll_of_light", "candle", "gem:zircon"]

[[race]]
id = "half_orc"
name = "Half-orc"
description = "Strong, tough, and sharp-eyed in the dark, but slow with letters and short on charm."
vision = "darkvision"
age = [14, 30]
stats = { strength = "1d2+2", toughness = 1, intelligence = "-1d3", presence = -2 }
potential = { strength = 4, toughness = 2, intelligence = -3, presence = -3 }
hp = 6
alignment = -50
size = "medium"
skills = { intimidate = "1d6+4" }
hunger = 120
experience = 90
weapon_skills = { axes = 1 }
# A hand axe at the belt, and meat for the road.
kit = ["hand_axe", "dried_meat*3"]

# The evil races (#255): each starts on the evil side, Callous or Evil (alignment.toml), with its
# own gifts and flaws. Some are poor choices on purpose, and level faster for it. A good creature
# scorns an Evil character by their alignment, not their race; and no creature takes a side by
# race: hostile kobolds attack a kobold too.

# The quick, crappy one: short-lived, and levels fast.
[[race]]
id = "goblin"
name = "Goblin"
description = "Small, weak, and short-lived, but quick-handed, sneaky, and at home in the dark; goblins eat little."
vision = "darkvision"
age = [10, 30]
stats = { strength = -2, dexterity = 1, toughness = -1 }
potential = { strength = -3, dexterity = 2, toughness = -2, intelligence = -1 }
hp = 2
alignment = -200
size = "small"
# Sneaking and hiding are one skill: Stealth.
skills = { listen = "1d4+2", stealth = "1d6+6" }
hunger = 80
experience = 80
weapon_skills = { short_blades = 1, slings = 1 }
# A sneaky knife, and scraps enough for a few days.
kit = ["stiletto", "dried_meat*2"]

[[race]]
id = "drow"
name = "Drow"
description = "The elves of the deep dark: graceful, sharp, and long-lived but frail, hard to poison, and dazzled by strong light."
vision = "darkvision"
age = [100, 400]
stats = { dexterity = "1d2+1", toughness = -2, intelligence = 1, presence = 1 }
potential = { strength = -1, dexterity = 3, toughness = -3, intelligence = 2, willpower = 1, presence = 1 }
hp = 2
resist = { poison = 25 }
# Light-blind: in strong light (the sun well up, a bright fire close by) they see no farther
# than ten cells, and fight a little worse.
light_blind = { glare = 250, sight = 10, to_hit = -1 }
alignment = -450
size = "medium"
skills = { spot = "1d6+4", stealth = "1d4+2" }
# The knife in the dark: a drow of any class may start knowing where to put it.
optional_skills = { sneak_attack = { chance = 40, dice = "2d4" } }
# Keen eyes, like the elves': they notice every hidden thing in passing.
passive_search = "all"
hunger = 80
experience = 130
weapon_skills = { short_blades = 1, crossbows = 1 }

# The weakest of all, with huge families: the cheapest experience of any race.
# A crossbow and steel-headed bolts, waybread from the deep, and a scroll of light for the surface.
kit = [
    { wield = "crossbow" },
    { wield = "bolt:steel*12" },
    "waybread*2",
    "scroll_of_light",
]

[[race]]
id = "kobold"
name = "Kobold"
description = "Small, scaly, and the weakest of all, but clever with traps and quick to spot them; kobolds live fast and die young."
vision = "darkvision"
age = [6, 20]
stats = { strength = -3, toughness = -1, presence = -1 }
potential = { strength = -4, dexterity = 1, toughness = -2, intelligence = 1, presence = -2 }
hp = 1
alignment = -200
size = "small"
skills = { detect_traps = "1d4+2", disable_device = "1d6+4" }
# Good with traps: they notice hidden traps in passing (not secret doors), trained in finding
# them, and find hidden things more easily.
passive_search = "traps"
search = 2
hunger = 80
experience = 75
weapon_skills = { slings = 1, spears = 1 }

# Cold-blooded: slower in the cold, once temperature has effects.
# Candles to see by, and a strip of dried meat.
kit = ["candle*2", "dried_meat"]

[[race]]
id = "lizardfolk"
name = "Lizardfolk"
description = "Strong, tough swamp folk with scaly hides, cold-blooded and slow of wit, and alien to everyone else."
vision = "normal"
age = [12, 50]
stats = { strength = 1, toughness = "1d2+1", intelligence = -1, presence = -2 }
potential = { strength = 2, toughness = 3, intelligence = -2, presence = -3 }
hp = 5
# Scaly hide: natural armour, as a creature's.
natural = { protection = 1, name = "scales" }
alignment = -200
size = "medium"
skills = { survival = "1d4+2", swim = "1d6+4" }
hunger = 90
experience = 95
weapon_skills = { spears = 1, thrown = 1 }
# Dried meat, as much as they can stomach.
kit = [{ wield = "lantern" }, "dried_meat*3"]

[[race]]
id = "duergar"
name = "Duergar"
description = "The dwarves' grey cousins of the deepest dark: tough, dour, and joyless, unbowed by loads and wise in stonework."
vision = "darkvision"
age = [40, 300]
stats = { toughness = 2, willpower = 1, presence = -2 }
potential = { strength = 1, toughness = 3, willpower = 2, presence = -3 }
hp = 6
alignment = -450
size = "medium"
skills = { metalcraft = "1d6+4", stealth = "1d4+2" }
weapon_skills = { crossbows = 1, maces = 1 }
# Like dwarves, they carry loads all their lives and know stonework.
ignores_burdened = true
passive_search = "stone"
hunger = 90
experience = 115
# A pick for the stone, and meat.
kit = [{ wield = "pick_axe" }, "dried_meat*3"]

[[race]]
id = "ratfolk"
name = "Ratfolk"
description = "Small, nimble scavengers of sewers and ruins: weak and shunned, but hard to sicken, and they eat anything, rotten or not."
vision = "low_light"
age = [8, 40]
stats = { strength = -2, dexterity = "1d2+1", presence = -1 }
potential = { strength = -3, dexterity = 3, toughness = 1, presence = -2 }
hp = 2
alignment = -200
size = "small"
skills = { listen = "1d4+2", stealth = "1d6+4" }
# Hard to sicken: four more on every check against a disease.
disease_check = 4
eats_rotten = true
hunger = 110
experience = 85
weapon_skills = { daggers = 1 }
# Whatever was lying about.
kit = [{ wield = "lantern" }, "turnip", "apple", "dried_meat"]
