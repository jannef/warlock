# Only at character creation, and only for an aristocrat (#1405, the owner): a larger stipend
# (../stipend.toml, world/stipend.rs): twice the gold, a loot roll at every level-up, and magic
# and rare finds in it far likelier.
[[talent]]
id = "landed_noble"
name = "Landed noble"
tree = "heritage"
description = "Your family holds land, and the rents come in: the stipend they put by for you is far richer, in gold and in finer things."
needs = { creation = true, class = "aristocrat" }
effects = [{ kind = "stipend_more", gold = 100, chance = 15, magic = 200 }]
systems = ["experience", "magic_items"]
