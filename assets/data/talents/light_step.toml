[[talent]]
id = "light_step"
name = "Light step"
tree = "finesse"
description = "You tread lightly: a trap you step onto may not go off under you, and you find it, and pits never catch you. Your footsteps are two fifths quieter, and the doors you open and close make no sound."
systems = ["traps", "stealth", "hearing"]
needs = { stats = { dexterity = 12 } }
effects = [
    { kind = "sure_step" },
    { kind = "pit_proof" },
    { kind = "footsteps_percent", value = -40 },
    { kind = "silent_doors" },
]
