# #705: shop favour for a story well told, the more for its rare and fateful lines
# (world::shop::favour reads TalentMods::storyteller and background::tiers).
[[talent]]
id = "storyteller"
name = "Storyteller"
tree = "scholar"
description = "You tell your tale wherever you trade, and tell it well: shopkeepers warm to you, and the more for a tale worth the hearing."
needs = { stats = { presence = 12 } }
effects = [{ kind = "storyteller", value = 5, rare = 5, fateful = 10 }]
systems = ["background", "shops"]
