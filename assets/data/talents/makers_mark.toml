# The craftsperson's class ability from level 60 (spec §8 "Class abilities": Maker's mark; the
# craftsperson design §7.10): passive, one read: `world/craft_make.rs::make_out` builds the
# holder's arms, armour, and jewellery marked (`Worked::marked`). The mark is then read where
# each thing is: the worth (`Worked::value`, `worth_percent` more), the description
# (`magic/describe.rs`), the patron's bonus (`data/patron.toml`), and the capacity
# (`magic/capacity.rs`, one enchantment more).
[[talent]]
id = "makers_mark"
name = "Maker's mark"
tree = "class"
granted = true
description = "What you make bears your mark: arms, armour, and jewellery of your making are worth half again, your patron pays more for them, and they hold one enchantment more."
effects = [{ kind = "makers_mark", worth_percent = 50 }]
systems = ["skills"]
