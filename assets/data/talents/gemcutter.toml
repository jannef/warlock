# A Crafts trade (the craftsperson design §3): a craftsperson's creation pick, never one the race
# teaches everyone; trains Jewelcraft at 3d6 and hands down the tools of the trade
# (world/trade.rs). One uncut small garnet or zircon, the roughest cut.
[[talent]]
id = "gemcutter"
name = "Gemcutter"
tree = "crafts"
description = "You were apprenticed to a gemcutter: you start trained in Jewelcraft, with an uncut garnet or zircon, and your cutting grows as a gemcutter's does."
needs = { creation = true, class = "craftsperson", race_lacks = "jewelcraft" }
effects = [{ kind = "trade", skill = "jewelcraft", dice = "3d6", tools = ["gem:garnet:uncut|gem:zircon:uncut"] }]
systems = ["skills"]
