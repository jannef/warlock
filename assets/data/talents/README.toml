#   quarry_sense                  arriving on a level that holds a living creature an active
#                                 kill quest of its still asks for, it is told so
#   exact_sounds                  every sound it hears is placed where it was made
#   sky_footsteps_percent { value }   its footsteps under the open sky (no roof over the cell
