# Talents (spec §8 "Talents"), one file per talent, named by its id (`hardy.toml`); a file holds
# one `[[talent]]`. The settings (max_ranks, [coverage], the trees, the systems) stay in
# ../talents.toml, and may be set in one file only. This file holds only the notes below: a file
# of comments defines nothing. Saves name talents by id, so a new talent is a new file (never
# edited into another's), a renamed id is a renamed file, and the same id in two files is a load
# error naming both (docs/dev/content.md).
#
# Every talent defines:
#   id, name      its id (in replays: `talent:hardy`) and its name, as the game shows it
#   tree          a tree id of ../talents.toml; `class` for a class ability, which a class's level
#                 table gives (../classes/) and which needs `granted = true`
#   description   what it does, in the game's words: never a number the game hides (a modifier,
#                 a chance, a speed); where the game shows the quantity (Defence, Protection,
#                 carrying, XP) the number may be said. The wiki shows the rule.
#   systems       the systems it touches, ids from the closed list in ../talents.toml (at least
#                 one): the coverage check counts them
#   ranks         how many times it can be taken (1 to max_ranks, default 1): "Hardy 2/3"
#   choice        what it is chosen for, if it takes a choice: "weapon_skill", "style", "skill"
#                 (any skill, trained or not), "element" (a damage type that is no physical
#                 kind), "school" (a school of magic, `evocation`, or an element: a spell
#                 tag), or "tag" (a creature tag some type carries); replays write it
#                 `talent:weapon_focus:long_blades`, and each choice is a pick of its own
#   needs         what taking any rank asks, all of which must hold at the pick (nothing is
#                 checked again later):
#                   talents = { dodge = 1, hardy = 2 }   those talents at those ranks; a talent
#                                                        with a choice may be needed only by one
#                                                        of the same choice, taken for the same
#                   stats = { toughness = 14 }           the stored score, never the effective
#                   skills = { stealth = 25 }            trained, at that value at least
#                   weapon_skills = { bows = 3 }         a weapon skill or style at that rank
#                   chosen = 2                           the chosen weapon skill or style at that
#                                                        rank (talents with a choice)
#                   level = 9                            the character level
#                   race = "dwarf", class = "warrior"    the character's
#                   eyes = "darkvision"                  the race's vision profile
#                   animal = "roc", element = "fire"     the birth sign's (horoscope.toml)
#                   lucky = true                         born on a lucky day
#                   any_weapon_skill = { roles = ["melee"], of = ["unarmed"], rank = 3 }
#                                                        any one of the weapon skills of those
#                                                        roles or named, at that rank
#                   either = { stats = { intelligence = 12 }, skills = { appraise = 20 } }
#                                                        any one of what it asks (at least two;
#                                                        no `either` within it)
#   effects       what every rank held adds: a list of { kind = ..., ... } (below)
#   [[talent.rank]]  one per rank, in order (as many as `ranks`, or none): its own `needs`
#                 besides the talent's, and its own `effects` besides the per-rank ones
#   granted       true: given (by a race, a birth sign, a class), never on a pick list; a birth sign's
#                 gifts are in the `stars` tree and named by horoscope.toml's `grants`, a race's
#                 in the `racial` tree and named by races.toml's `talents`
#   flaw          true: a birth sign's flaw (granted too): shown with "but" and dimmed, never
#                 a prerequisite of another talent
#   resource      `{ id = "openings", cost = 5 }`: what using its class active costs of an
#                 alternative resource (data/resources.toml; at most its max; 0 asks only that
#                 it is held): unavailable while short, spent when used
#   alignment     `{ min = "kind" }`: the alignment bands (alignment.toml; `min` the worst, `max`
#                 the best, either or both) a holy class active works for (lay_on_hands, smite,
#                 holy_radiance, consecrate): it bars nothing (the ability is had, listed, and used
#                 whatever the band), but outside them it does nothing: a line, the time of a
#                 cast, no cooldown or mana spent
#
# Effects (each read by one rule; a new kind is a variant in content/talent.rs, a field in
# talent.rs's TalentMods, and one read):
#   dodge { value }               Defence in the Dodge category (bonuses add up)
#   natural { value }             natural armour, on top of the actor's own or an item's
#   melee_damage { value }        damage added to every blow up close (both hands)
#   ferocity { value }            damage added to every attack while below a third of its hit
#                                 points
#   threat { value }              every attack threatens a critical that many points lower
#   reroll_fumble                 a natural 2 on an attack roll is rolled again, once
#   streak { max, damage_every }  each melee blow at the creature its last blow was at (in its
#                                 turn or the next) +1 to hit per blow before it, to max (1 to 10);
#                                 with damage_every (0 to 10), +1 damage per that many blows before
#                                 it, as far as the streak counts
#   off_hand_damage { value }     its off hand's blows do that much more damage
#   best_skill_threat { value }   its attacks with the weapon skill it holds at the highest rank
#                                 (melee, unarmed, launcher, thrown; ties all count) threaten a
#                                 critical that many points lower
#   max_hp_percent { value }      maximum hit points, that percent more (at least 1)
#   max_hp_per_levels { per_levels, at_least }   hit points: one per that many character
#                                 levels, at least at_least, handed out at the pick and as each
#                                 later level comes (as levels' own hit points are)
#   stat { stat, value }          a stat's score and potential that much higher (-5 to 5),
#                                 handed out once, as it is taken or given
#   healing_percent { value }     hit points come back that percent faster (negative: slower)
#   mana_regen_percent { value }  mana comes back that percent faster (negative: slower)
#   max_mana_per_levels { per_levels, at_least }   mana: one per that many character levels,
#                                 at least at_least, handed out at the pick and as each later
#                                 level comes (as max_hp_per_levels)
#   mana_resting_percent { value }   resting brings mana back that percent faster on top of
#                                 resting's pace
#   mana_cost_percent { value }   abilities cost that percent more mana (negative: less; never
#                                 below 1)
#   blood_magic { hp, mana }      the Blood magic ability: hp hit points (never the last) given
#                                 for mana mana, for the time of a wait
#   footsteps_percent { value }   footsteps that percent louder (negative: quieter)
#   silent_doors                  the doors it opens and closes make no sound
#   hearing { value }             hears sounds that much fainter
#   threshold_percent { value }   its eyes need that percent more light (negative: less)
#   darkvision { value }          its darkvision reaches that many cells farther (from none:
#                                 that far)
#   sees_uv                       its eyes see ultraviolet light
#   scent { status, radius }      it sees creatures suffering that status (an id in
#                                 ../status.toml) in its line of sight within radius cells
#                                 (1 to 20), however dark
#   night_sight { value }         its overworld sight at night, that many cells farther
#   day_sight { value }           its overworld sight by day, that many cells farther
#   lantern_light { light }       the lit light it has ready in the Tool slot (a lantern) burns
#                                 as that light preset (../lights.toml), not while hooded
#   inner_light { light }         it always sheds that light preset where it stands; everyone
#                                 sees by it
#   ambush { dice }               its hits on a creature that has not seen it do that many dice
#                                 more damage, after Protection ("1d6")
#   carry_percent { value }       carrying limit, that percent more
#   ignore_burdened               being Burdened costs it nothing, as a dwarf's burden
#   step_slowdown_percent { value }   the slowdown its burden and Bloated put on its steps, that
#                                 percent more (negative: less)
#   carry_kg { value }            carrying limit, that many kilograms more
#   weightless_coins              coins it carries weigh nothing
#   travel_percent { value }      overworld journeys take that percent more time (negative:
#                                 quicker)
#   swimmer                       wading (water, and ground a disease is caught wading in)
#                                 costs a plain step, and never gives a disease
#   terrain_as { terrains, like } a step onto any of terrains costs what a step onto like does
#                                 (terrain ids in ../terrain.toml)
#   plunge_proof                  a plunge through the ice never hurts it
#   light_on_ice                  ice holds it as if it carried nothing
#   climb_percent { value }       climbing out onto ice costs that percent more (negative: less)
#   wading_proof                  wading never gives it a disease
#   beast_friend                  creatures of animal factions (../factions.toml) are neutral
#                                 to it until it attacks one of that type
#   forecast { hours }            it knows the weather coming within that many hours (1 to 24)
#                                 under the open sky
#   sun_healing { value }         hit points come back that percent faster under the open sun
#   hunger_percent { value }      hunger burns that percent faster (negative: slower)
#   rot_harm_percent { value }    the sickness rotten food gives, that percent more (rounded
#                                 down; negative: less)
#   smell_rot                     the eat list says how fresh food smells: fresh, turning, or
#                                 rotten
#   no_exertion                   blows, shots, and throws burn no extra nutrition
#   no_bloating                   a meal never leaves it Bloated: what does not fit is lost
#   corpse_stats_percent { value }   a fresh corpse's chances to raise its stats, that percent
#                                 more (never above certain)
#   daily_factor { value }        the daily stat check (06:00) multiplies the need by this, if
#                                 less than stats.toml's daily_factor (1 to 20)
#   potion_marks_percent { value }   the training marks a potion or an elixir gives, that
#                                 percent more
#   xp_percent { value }          experience gained, that percent more
#   skill_rolls { value }         skill rolls every level, that many more
#   extra_pick { level }          one more talent pick at that character level (1: at creation)
#   train_skill { dice }          the chosen skill (choice skill) trained at those dice, or
#                                 raised by them, as the rank is taken (the levels stream)
#   loot_magic_percent { value }  loot it finds and creatures drop: the weights of the rarities
#                                 better than the least the find may be, that percent more
#   read_percent { value }        reading a scroll takes that percent more time (negative: less)
#   scroll_kept { chance }        a scroll it reads is not used up, by that chance in percent
#   potion_kept { chance }        a potion it drinks is not used up, by that chance in percent
#   potion_smell                  an unknown potion it picks up tells its kind (never its type)
#                                 by its smell
#   potion_heals { value }        a healing potion it drinks heals that percent more
#   spares_self                   its own bursts never catch it
#   find { value }                added to its checks to find what is hidden, searching and in
#                                 passing
#   search { value }              added to its searching
#   search_reach { value }        its searching reaches that many cells farther
#   trap_damage_percent { value } the damage traps do it, that percent more (negative: less; at
#                                 least 1)
#   quest_xp_percent { value }    the experience a quest gives, that percent more
#   quest_gold_percent { value }  the gold a quest gives, that percent more
#   favour_percent { value }      shop favour, that many percent more (before the cap)
#   favour_cap { value }          the cap on shop favour, that many percent higher
#   sell_percent { value }        shops pay that percent more for what they buy from it (never
#                                 more than they ask)
#   credit { gold }               keepers let it leave owing up to that much gold (1 to 1000);
#                                 the debt stays on their bill
#   identify_trades               what it buys or sells in a shop is identified
#   pilgrim                       temple services cost half (rounded up), and a cure also mends
#                                 a point of each damaged stat
#   item_worth, gem_worth         item descriptions show what things, and each gem in them, are
#                                 worth
#   identify_carried { hours }    a magic item carried that many hours (1 to 240) from when it
#                                 has the effect is identified
#   gem_find_percent { value }    loot it finds and creatures drop is a loose gem that percent
#                                 more often (never above certain; the same draws)
#   gem_cut { value }             loose gems it finds (on levels made from then on, dropped by
#                                 kills) are cut that many grades finer (1 to 5)
#   notice { value }              notices hidden things in passing as if trained in Spot, with
#                                 that much added
#   danger_sense { value }        senses a level's danger (spec §7 "Danger levels"): at 1, how a
#                                 level feels on arrival, against its own level; at 2, a note
#                                 when a creature comes to its level (ranks add up)
#   spawn_every_percent { value } the time between attempts to bring creatures to its level
#                                 that percent longer
#   room_status_immune { status } a special room's (or a whole level's) status never takes it
#                                 (Anchored mind: Ebbing)
#   wake_percent { value }        sleepers (a teeming den's) need that percent more noise to
#                                 wake from what it does (Hush-foot: 100, twice the noise)
#   grave_warden                  nothing it kills rises in a cursed room (a `rise` effect)
#   stone_sense                   notices hidden things on stone in passing, as a dwarf does
#   stone_find { value }          added to its checks to find what is hidden on stone,
#                                 searching and in passing
#   search { value }              added to every check to find hidden things (searching and in
#                                 passing)
#   search_reach { value }        searching reaches that many cells farther
#   skill { skill, value }        that skill counts that much higher (an untrained one from 0)
#   make_way                      anyone not hostile makes way for it, those at a post too
#   distrusted                    no one makes way for it, make_way or not
#   free_blow { trigger }         a free blow: "cleave", "great_cleave", "riposte",
#                                 "opportunist", "flurry" (a melee attack with nothing in
#                                 hand strikes twice), or "gatekeeper" (a hostile stepping up
#                                 beside it is struck; spec §8 "Free blows")
#   weapon { role, skill, to_hit, damage, threat, ranks, speed, reload, ease, bash, shield, crit, at_rank }
#                                 what attacks with some weapon skills gain, as their ranks give
#                                 it (data/weapon_skills.toml): the weapon skill or style `skill`
#                                 names, else without `role` the chosen weapon skill or style's
#                                 (a talent with that choice), else every skill of the role's; `ranks` reads its benefits that many ranks
#                                 higher (a rank held, never past 10), `ease` eases both
#                                 two-weapon penalties, `bash` adds to a free bash's chance only
#                                 where there is one, `crit` adds to a confirmed critical's
#                                 multiplier (at most x5), `at_rank` asks that rank of the
#                                 skill held at least; each field 0 by default
#   launcher_range { value, skill }   the readied missile weapon shoots that many cells
#                                 farther; with `skill` (a weapon skill id), only a launcher of it
#   throw_range { value }         throws reach that many cells farther
#   missile_breaks { value }      its missiles break that percent more often (negative: less)
#   max_dex { value }             worn armour's cap on Dexterity in Defence, that much higher
#   deflection { value }          Defence in the Deflection category, on top of magic items'
#   protection { value, body_armour, shield, per_piece }   Protection, only while the armour
#                                 piece worn with the most Protection has body_armour at least
#                                 (if set), only while holding a shield (if shield = true), and
#                                 for every piece of armour worn (if per_piece = true, alone)
#   stance_to_hit { stance, percent }   that combat stance's to-hit penalty, that percent
#                                 smaller (100: none)
#   flee_percent { value }        fleeing steps cost that percent more (negative: cheaper)
#   slip_percent { value }        a step out of reach of every hostile beside it costs that
#                                 percent more (negative: cheaper), whatever its stance
#   pain { value }                every hit (a blow, a shot, a throw, a trap) does that much
#                                 less after the soak, never below 1
#   barbs { damage }              a creature whose melee blow hurts it takes that much damage:
#                                 no roll, and no experience if it dies of it
#   resist { value, damage }      resistance in percent to damage type `damage`
#                                 (../damage_types.toml), else to the chosen element (choice
#                                 element)
#   resting_percent { value }     resting heals that percent faster on top of resting's pace
#   rise_from_ashes { hp_percent, status, spell, radius, damage, damage_type }   once in its
#                                 life, what would kill it (not starving or choking) does not:
#                                 it rises with hp_percent of its hit points, damage of
#                                 damage_type strikes every creature within radius (the spell
#                                 effect, ../effects.toml), the ice there melts, and it suffers
#                                 status (spec §8 "Birth sign")
#   reborn_whole                  its rising from the ashes brings it back whole: every hit
#                                 point, every status and disease gone, and no rising status
#   second_rising                 it may rise from the ashes once more
#   starving_heals                its hit points come back while it is Starving too
#   eats_rotten                   rotten food never harms it, as a race that eats rotten food
#   wades_free                    wading costs it a plain step (it may still catch a disease)
#   second_wind { per_level, at_least, cooldown }   the Second wind ability: per_level hit points
#                                 per character level back at once (at least at_least), then the
#                                 cooldown status (an id in ../status.toml)
#   blaze { radius, damage, damage_type, spell, fire, burns, cooldown }   a birth sign's active
#                                 (Fire's Blaze, `use:blaze`): a burst of radius (1 to 3) around
#                                 the player, damage dice of damage_type to every creature in it
#                                 but them, ice melted, a fire of light preset `fire` burning
#                                 `burns` seconds on every walkable cell of it but theirs, shown
#                                 as effect `spell` (../effects.toml); then the cooldown status
#   iron_stomach                 rotten food and overeating never make it vomit; rotten food
#                                 sickens it half as much
#   status_eases { status, value }   that status eases that percent faster
#   status_lasts { status, value }   that status lasts that percent longer (each degree takes
#                                 that much more time to ease)
#   no_penalty { status }         that status never lowers its scores
#   clotting                      a big hit wounds it no more, a critical one degree less
#   wound_more { value }          a big hit that wounds it wounds that many degrees more (1 to 5)
#   penalty_percent { value }     what its statuses take off its scores, that percent more
#                                 (negative: less; raises are untouched)
#   disease_checks { value }      added to its disease checks
#   drain_checks { value }        added to its checks against a drain (spec §8 "Stats")
#   checks { stat, value }        added to every check of that stat it makes
#   disease_recovery { value }    a disease needs that many fewer checks won in a row to go
#   disease_interval_percent { value }   a disease's progressions come that percent further
#                                 apart (100: twice as far)
#   kick_die { sides }            its kicks at creatures roll one die of that many sides
#   door_kick { value }           its door kicks as if that much stronger
#   kick_noise_percent { value }  its door kicks that percent louder (negative: quieter)
#   smash_destroy_percent { value }   what a chest it kicks open holds breaks that percent more
#                                 often (negative: less; a blown-up chest is not a kick)
#   chest_wise                    it tells a locked chest from an unlocked one at a glance, and a
#                                 shut chest's trap in its sight becomes known to it
#   sees_mimics { value }         a disguised mimic within that many cells is seen for what it is
#   slick                         a mimic's grip never holds it
#   dig_percent { value }         its digging does that percent more work a turn
#   two_handed_price { value }    its blows with a two-handed weapon cost that percent more
#                                 (negative: cheaper)
#   critical_status { status }    a critical it confirms in melee leaves the target that status
#   grip { status }               a creature it hits in melee suffers that status, caused by it
#                                 (one that `blocks` steps: held), until it misses that creature,
#                                 strikes another, or moves
#   critical_confirm { value }    added to the roll that confirms its criticals
#   ability_ranks { value }       its weapon abilities (weapon_abilities/) come that many ranks
#                                 sooner: their thresholds read its ranks that much higher
#   rend_off_hand                 its Rend rolls the off hand's damage dice too
#   brace { to_hit, status }      its Brace's blow is at that much more to hit, and a foe it
#                                 hits suffers that status (one degree)
#   shield_casting { value }      with a shield in each hand, the chance a spell it casts fails
#                                 that many percentage points smaller (1 to 100)
#   both_shields { stance }       in that combat stance with a shield in each hand, both
#                                 shields' Shield bonuses add up in Defence
#   critical_penetration { value } its confirmed criticals (every attack) ignore that much more
#                                 Protection, on top of the attack's penetration
#   penetration { damage, value } its blows that can do damage of that kind ignore that much
#                                 more Protection
#   burden_dex { value }          the burden's cap on its Dexterity in Defence, that much higher
#   burden_ease { value }         that percent off the burden's slowdown, on top of Balance
#   sure_step                     a trap it steps onto first gets a Dexterity check: made, it
#                                 does not go off, and it is found
#   pit_proof                     pits never catch it
#   disarm                        the Disarm ability without Disable device
#   speed_percent { value }       it moves and acts that percent quicker (hidden in the game)
#   missile_dodge { value }       Dodge added against shots, throws, and trap missiles
#   small_target { value }        Dodge added against the attacks of creatures larger than it
#   spell_damage_percent { value }   the damage bursts and bolts do it, that percent more
#                                 (negative: less)
#   Class abilities' own (spec §8 "Class abilities"; the actives are used from the abilities
#   menu, each one's id the ability's id, `use:rage`):
#   natural_unarmoured { value }  natural armour, only while nothing is worn in a body armour slot
#   weapon_marks { role, value }  the marks its attacks earn in that role's weapon skills, that
#                                 percent more; without `role`, in every weapon skill and style
#   two_handed_crit { value }     a confirmed critical's multiplier with a two-handed weapon, that
#                                 much more (1 to 3, at most x5)
#   unarmed_die { sides }         blows with nothing in hand and kicks roll one die of that many
#                                 sides (the bigger of it and kick_die)
#   stance_costs                  changing its combat stance takes a wait's time (free otherwise)
#   stance_dodge { stance, percent }   that stance's Dodge penalty that percent smaller
#   step_percent { value, unarmoured, unburdened, no_shield }   steps cost that percent more
#                                 (negative: cheaper), only while each condition set holds
#   steadfast                     Burdened costs nothing, as a dwarf's
#   stout                         Strained costs what Burdened costs others
#   disease_immune                no disease is ever caught: no check, no infection
#   no_penalty_to { stat }        no status lowers its score in that stat
#   raise_percent { status, value }   what that status raises its scores by, that percent more
#   hardened { bonus }            each level past `hp_level` adds a level's hit points again, and
#                                 bonus more
#   rage { resource }             the active Rage: it is granted that resource (resources.toml)
#                                 and suffers the status it brings while it lasts
#   resource_build { resource, on, amount }   event `on` (a resource's `builds` events) builds
#                                 that resource that much more while it is held
#   resource_max { resource, value }   that resource holds that much more at most
#   resource_start { resource, value }   that resource is granted holding that much more (never
#                                 above its maximum)
#   resource_rate { resource, value }   that resource changes over time that percent faster
#                                 (negative: slower): regenerating comes back sooner, decaying
#                                 wears off sooner
#   unstoppable { statuses, cost }   while raging those statuses tick nothing, and a blow that
#                                 would take the last hit point leaves it for `cost` of the rage
#                                 (when that much is held; spent to nothing, the rage ends)
#   veterans_wind { per_level, at_least, cooldown }   the active Veteran's wind (as second_wind)
#   whirlwind                     the active Whirlwind: a blow at every hostile beside, for the
#                                 price of one attack
#   lay_on_hands { per_level, cooldown, degrees }   the active Lay on hands: hit points back by
#                                 the level, then that many degrees of the cooldown status
#   avatar                        Lay on hands heals fully, cures what ticks and every disease,
#                                 and its cooldown is half as long
#   smite { per_levels, sides, cooldown, degrees }   the active Smite: a blow in a direction
#                                 with one die of `sides` more per `per_levels` levels
#   radiance { status, light }    the active Holy radiance: while it suffers the status it sheds
#                                 the light
#   quivering_palm { status, severity }   the active Quivering palm: a bare-handed blow in a
#                                 direction (what it costs is the talent's `resource`: five ki)
#                                 that leaves the status
#   The casters' (spec §8 "Class abilities"; the priest's, druid's, wizard's, witch's):
#   spell_power { per_die, dice }   its spells and spell scrolls add per_die to every die (0 to
#                                 5) and roll dice dice more (0 to 5); a spell's damage never
#                                 past its cap (../spells.toml)
#   spell_mana_percent { value }  its spells cost that percent more mana (negative: less; at
#                                 least 1)
#   The Spellcraft tree's (the magic design §10, docs/dev/spells.md):
#   caster_level { value, per_levels }   caster level that much higher (-20 to 20); with
#                                 per_levels (1 to 20), value per that many character levels
#   overreach_cost_percent { value }   what a spell above its caster level's tier costs over its
#                                 price, that percent more (negative: less)
#   school_focus { cost, reach, lift }   (choice school) its spells of the chosen school or
#                                 element cost that percent more mana (negative: less), reach
#                                 that many cells farther (0 to 5), never past the spell's own
#                                 caps, and may have their damage cap lifted that many points
#                                 past their tier's `max_lift` (0 to 100; Keen mind); each
#                                 default 0, not all 0
#   study { bonus, percent }      studying a spell: bonus points off the check's difficulty, and
#                                 that percent more time (negative: less)
#   deflection_unarmoured { value }   Deflection, only while nothing is worn in a body armour slot
#   purify                        rotten food neither sickens it nor exposes it to a disease
#   corpse_harmless               a fresh corpse's own harm (on_eat sickness, vomiting) never
#   meal_heals { object, dice }   eating that object (no object: a fresh corpse) heals dice too
#   disease_still                 a failed disease check does nothing: its diseases never progress
#   status_damage { status, value }   its hits on a creature suffering that status do value more
#   reprieve { once, status, stat, by, message }   once in its life (`once` names it), what
