#   silent_unburdened             its steps make no sound while it is Unburdened
#   attack_noise_percent { value }   its attacks that percent louder (negative: quieter)
#   trap_ease { value }           hidden traps that much easier for it to find (not to disarm)
#   pick_lock, steal, throw_voice the Pick lock ability without Open lock, the Steal ability
#                                 without the Steal skill, the Throw your voice ability
#   ambush_threat { value }       its attacks on a creature that has not seen it threaten a
#                                 critical that many points lower (1 to 5; ambush dice of the
