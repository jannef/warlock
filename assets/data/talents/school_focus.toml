# School focus (the magic design §6, §10; the spell scaling design §7.2): the Spellcraft tree,
# chosen for a school of magic or an element (a spell tag). Those spells cost 10 % less mana and
# reach a cell farther (the cost and reach hooks).
[[talent]]
id = "school_focus"
name = "School focus"
tree = "spellcraft"
choice = "school"
description = "You have made one school of magic, or one element, your own: its spells cost you less and reach a cell farther."
effects = [{ kind = "spell_mod", cost = -10, cells = 1 }]
systems = ["spells", "mana"]
