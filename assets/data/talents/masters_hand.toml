# The craftsperson's class ability from level 50 (spec §8 "Class abilities": Master's hand; the
# craftsperson design §7.9): passive, added to a made check's margin as its grade or cut is read
# (`world/crafting/mastery.rs::graded_margin`, read by `craft_make.rs::make_out` and `cut.rs`), never to
# whether it is made.
[[talent]]
id = "masters_hand"
name = "Master's hand"
tree = "class"
granted = true
description = "A master's hand: every grade and every cut comes sooner."
effects = [{ kind = "grade_ease", value = 4 }]
systems = ["skills"]
