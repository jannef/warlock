# Great cleave is its second rank (#790: a chain of one effect kind is one talent's ranks).
[[talent]]
id = "cleave"
name = "Cleave"
tree = "might"
ranks = 2
description = "A blow that fells a foe carries on: when your blow kills, you strike at once at another foe beside you. At the second rank cleaving goes on while your blows kill, once at each foe beside you in a turn."
needs = { stats = { strength = 13 }, any_weapon_skill = { roles = ["melee", "unarmed"], rank = 3 } }
systems = ["free_blows"]

[[talent.rank]]
effects = [{ kind = "free_blow", trigger = "cleave" }]

[[talent.rank]]
needs = { level = 18 }
effects = [{ kind = "free_blow", trigger = "great_cleave" }]
