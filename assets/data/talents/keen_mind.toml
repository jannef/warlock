# Keen mind (the spell scaling design §7.2): the Spellcraft tree, chosen for a school of magic
# or an element (a spell tag). Those spells roll every die a size bigger (the dice hook, `sides`).
[[talent]]
id = "keen_mind"
name = "Keen mind"
tree = "spellcraft"
choice = "school"
description = "One school of magic, or one element, answers your wits more than most: its spells roll dice a size bigger for you, a d6 a d7, a d8 a d9."
effects = [{ kind = "spell_mod", sides = 1 }]
systems = ["spells"]
