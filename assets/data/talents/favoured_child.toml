# Only at character creation (#705): the story is told as the run begins, after the picks, so
# nothing later could change it (background::tell reads TalentMods::story_luck).
[[talent]]
id = "favoured_child"
name = "Favoured child"
tree = "heritage"
description = "Fortune watched over your youth: the luckier turns of your story came to you oftener than to most."
needs = { creation = true }
effects = [{ kind = "story_luck", value = 100 }]
systems = ["background"]
