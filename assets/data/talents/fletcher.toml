# The ranger's level 1 (#1021; docs/design/skill-uses.md §6.5 W1, the owner's decision): anyone trained in
# Woodcraft may make arrows and bolts with a knife and a bow ready, but a ranger does it far better: read by the
# `count = "fletch"` recipes (world/craft_make.rs; the arrows and bolts of recipes/woodcraft/).
[[talent]]
id = "fletcher"
name = "Fletcher"
tree = "class"
granted = true
description = "You make your own arrows and bolts, and make them well: in half the time, twice as many, and more surely."
effects = [{ kind = "fletcher", check = 4, count_times = 2, time_percent = 50 }]
systems = ["ranged"]
