# The ranger's level 18 (#919; docs/design/ranger-companion.md §11.1): a creature beside both the
# ranger and their companion is flanked, and the companion hunts the ranger's favoured prey as
# the ranger does (`world/allies/pack.rs`).
[[talent]]
id = "pack_tactics"
name = "Pack tactics"
tree = "class"
granted = true
description = "You and your companion hunt as one: whatever stands beside you both is beset from two sides and struck the surer by each of you, and your companion knows your favoured prey as well as you do."
effects = [{ kind = "pack_tactics", to_hit = 2 }, { kind = "shares_favoured_prey" }]
systems = ["combat", "allies"]
