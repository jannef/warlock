# Bellows (the affixes design §10, #634): the vigour tree's answer to Tireless. The stamina a
# character's magic items add to its maximum counts twice, in `Actor::resource_max`'s items term.
[[talent]]
id = "bellows"
name = "Bellows"
tree = "vigour"
description = "Your lungs work like a smith's bellows: the stamina your gear lends you counts twice over."
needs = { stats = { toughness = 12 } }
effects = [{ kind = "geared_resource_percent", resource = "stamina", value = 100 }]
systems = ["magic_items", "stamina"]
