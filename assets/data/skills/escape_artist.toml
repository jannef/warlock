[[skill]]
id = "escape_artist"
name = "Escape artist"
description = "Slipping out of bonds, grabs, and tight places."
kind = "rules"
# Marks: every automatic check against bonds, whatever comes of it (world/hold.rs), and every climb
# out of a pit, and half the tries at wriggling past a creature in the way (world/wriggle.rs).
mark = [
    { on = "escape", chance = 100 },
    { on = "climb", chance = 100 },
    { on = "wriggle", chance = 50 },
]
# Effect "escape": points added to the check against bonds (better of Strength and Dexterity
# against a hold's grip or a status's `escape`), +8 at 100, +12 at 200; trained at all, an action
# that Webbed or Pinned stops is that check, and untrained it is refused. Effect "climb": a pit's
# climb halved from 50 and skipped from 100 (world/trap.rs). No ability: the check is automatic.
benefit = [
    { effect = "escape", curve = [[0, 0], [100, 8], [200, 12]] },
    { effect = "climb", steps = [50, 100] },
]
