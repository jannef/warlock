[[skill]]
id = "metalcraft"
name = "Metalcraft"
description = "Working metal: smithing, mending arms and armour."
kind = "action"
mark = [{ on = "temper", chance = 100 }, { on = "craft", chance = 100 }, { on = "salvage", chance = 100 }]
# Working an item at a forge's anvil (spec §7 "Special rooms"; the Temper recipe, for those
# trained): added to the Strength check of an attempt, +8 at 100, +12 at 200.
# Its craft (docs/dev/crafting.md; salvage.toml; the smith's recipes, data/recipes/metalcraft/):
# the same, added to the check of salvaging a metal and of a recipe made, read for this skill
# alone (never with another profession's craft).
benefit = [
    { effect = "temper", curve = [[0, 0], [100, 8], [200, 12]] },
    { effect = "craft", curve = [[0, 0], [100, 8], [200, 12]] },
]
