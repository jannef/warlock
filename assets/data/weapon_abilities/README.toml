# Weapon abilities (spec §8 "Weapon skills", "Fighting styles"; the combat progression design
# §4): what a rank in a weapon skill or a fighting style teaches. One `[[weapon_ability]]` per
# file, named by its id; a campaign's data/weapon_abilities/ may add more. An ability names its
# skills; a skill does not list its abilities. Every number is a first guess, kept here.
#
# Fields:
#   id, name      its id and its name, as the abilities menu shows it ("Deep cut")
#   description   what it does, in the game's words (no number the game hides)
#   skills        the weapon skills, or the fighting styles (never both), whose rank teaches it
#   rank          the rank in one of them that teaches it (1 to 10); a weapon talent's ranks
#                 (Stylist, Fencing) and Early mastery bring it sooner. A style's ability works
#                 only while its holder fights in that style's grip
#   kind          "triggered": it fires by itself, instantly and for free, on its `trigger`; it
#                 has no `aim`, `stamina`, `energy`, or `cooldown`. "active": used from the
#                 abilities menu (`use:ID`), never a key of its own, paid with:
#   aim           (active) what it asks: "nothing", "direction" (a blow), or "cell" (a shot)
#   stamina       (active) the points of the stamina pool it costs (1 to 50), spent after its
#                 own refusals (a refused use costs nothing)
#   energy        (active) its time: { action = "melee", percent = 100 }, the percent (50 to
#                 300) of the price of the action it is (melee: the blow's own price, weapon,
#                 style, and stance counted; shoot: the shot's; wait), so none is instant
#   cooldown      (active, optional) a status (no tick, eases) given as it is used, while which
#                 it is unavailable; none in the catalogue: the stamina pool is the limiter
#   trigger       what it fires on, one or a list: hit, critical, big_hit, kill, sneak_attack
#                 (the actor's blow, shot, or throw; sneak_attack: one that hits with the
#                 sneak dice landing; the attack's skill and style count), struck, parried,
#                 blocked, dodged (an attack on the actor: what it holds counts; parried,
#                 blocked, and dodged are melee attacks), spell_blocked (a hostile's spell
#                 that rolls an attack on the actor, a bolt, a ray, or a touch, misses by its
#                 Shield: what it holds counts), both_hands_hit (both blows of a
#                 two-weapon attack hit one foe, which lives), approaches (a hostile steps up
#                 beside the actor: its missile weapon or what it has ready to throw counts). A
#                 switch effect (free_blow, parry_missiles) has none
#   systems       the talent table's systems it touches (talents.toml's [[system]] ids)
#   [weapon_ability.effect]   what it does, by `kind`, with only its own fields:
#                 free_blow       `trigger`: riposte, cleave, great_cleave, opportunist, or
#                                 gatekeeper: switches that free blow on (spec §8 "Free blows")
#                                 while the holder wields a weapon of the skill (or fights in
#                                 the style)
#                 status          `status` (status.toml) on the other end (`on = "target"`, the
#                                 default: the one struck, or the attacker of a parried,
#                                 blocked, or dodged attack) or on the actor (`on = "self"`):
#                                 `severity` degrees (default 1), or degrees drawn from
#                                 `turns` (dice, one draw, 1 to the status's max)
#                 extra_damage    `dice`: main_hand, off_hand (the weapons' damage dice), or
#                                 dice ("1d6"): rolled once more on the target, no bonus, after
#                                 the blow's own damage, of its kind (or `damage`, a damage
#                                 type), resisted but never soaked
#                 free_shot       (on approaches) a shot with what the actor has ready, else a
#                                 throw of what it has ready to throw, at the one who stepped
#                                 up; nothing without
#                 parry_missiles  Parry counts against shots and throws too
#                 reflect_spell   (on spell_blocked) `per_turn`: the spell is cast back at its
#                                 caster from the actor's cell, as the caster cast it (its own
#                                 attack roll, no mana spent again), at most `per_turn` times a
#                                 turn of the actor's; a reflected spell is never reflected again
#                 An active's (each its blow's own message; the aim and action in brackets):
#                 reach_blow      (direction, melee) `reach` (2 to 4): a blow at the first foe
#                                 that far along the direction, the cells between empty and
#                                 passable (a closed door blocks; nothing is sprung)
#                 sure_critical   (direction, melee) the blow is a critical if it hits
#                 ignore_defence  (direction, melee) `categories` (Defence categories: parry,
#                                 shield, ...): the blow is rolled as if the foe had none there
#                 ignore_protection  (direction, melee; or cell, shoot) Protection soaks none of
#                                 the blow or shot
#                 sweep           (nothing, melee) `to_hit`: a blow at every foe beside you,
#                                 clockwise from the north (or the direction given), each at
#                                 that to-hit; with a blade in each hand they take turns
#                 pierce_shot     (cell, shoot) a hit flies on to the next on the shot's line
#                 knockback       (direction, melee) `cells` (1), `bash` (a shield bash), and
#                                 `status`: a foe it hits is driven back if the cell behind it is
#                                 free (else it stays), then suffers the status
#                 buff            (nothing, wait) `status`, `severity` degrees on yourself
#                 double_dice     (direction, melee) `to_hit`: the blow's damage dice rolled
#                                 twice (its bonus and riders once)
