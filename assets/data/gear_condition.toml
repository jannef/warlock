# The condition creature gear spawns in (spec §8 "Creature gear"; gear/condition.rs, the
# item's state magic/worked.rs). Every piece of arms or armour a creature's gear table rolls (not a
# stack of several, ammunition, rings, or what is protected: a unique, of Proof, or what a quest
# may ask for) draws one condition: damaged (a point worse, its improvements none, its word the
# kind's below), Fine, Marvellous, or Masterwork (one, two, or three improvements, as the Temper
# ability makes them, capped at rules/temper.toml's `most`), or else as made. A fixed kit (a level
# file's placed gear) is never rolled and stays as made. Dropped, a piece keeps its condition.
#
# Deeper finds are better made (#1436): from an item level on, a depth row adds its chances of
# Fine, Marvellous, and Masterwork to every source's arms and armour, so the affix-capacity trim
# (docs/dev/enchanting.md) leaves deep finds more of their affixes. Loot (floor loot, chests,
# hoards, dens, room loot) is otherwise always as made, never damaged; creature gear adds the row
# of its level's item level to its tribe's odds, damaged giving way. The same row adds its
# `ornament` percent to loot's chance of a set gem (gems.toml `[[ornament]]`).
#
# Chances are in per mille (1000 = always); each table's four add up to at most 1000.
#
# Fields:
#   [default]      the odds of a creature of no tribe below
#     damaged      per mille damaged
#     fine         per mille Fine
#     marvellous   per mille Marvellous
#     masterwork   per mille Masterwork
#   [[tribe]]      a tribe's own odds, the four above, for a creature with its `tag`; a creature
#     tag          with several takes the first listed (so `hobgoblin` before `goblin`)
#   [[depth]]      by item level, rising: what finds from `level` on (to the next row's) take
#     level        the least item level of the row
#     fine         per mille more Fine (default 0)
#     marvellous   per mille more Marvellous (default 0)
#     masterwork   per mille more Masterwork (default 0); the three with any table's above
#                  add up to at most 1000
#     ornament     percent more of loot set with a gem, for the classes that are (default 0)
#   [kinds]        by material group (materials' `group`), the kinds damaged gear of it may show,
#                  `acid` ("corroded"), `rust` ("rusted"), `fire` ("scorched"): the one its
#                  material withstands least (a tie: the first listed), never one it always
#                  withstands (`resists` 100). None left, or a group not listed: "damaged".

[default]
damaged = 300
fine = 40
marvellous = 8
masterwork = 2

[kinds]
metal = ["rust", "acid"]

