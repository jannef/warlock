# The aristocrat's stipend (spec §8 "Class abilities": Stipend; #1405; crates/warlock-core/src/
# content/stipend.rs, world/classes/stipend.rs). A character with the Stipend class ability (the
# aristocrat's, from level 1) has their family put something by for them at every level they
# reach, a prestige class's levels too; it waits with their servant (a campaign's town's
# `servant`, data/towns/) until they speak to them.
#
# Fields:
#   gold   each: gold every level reached adds; dice: gold rolled on top, each level (about
#          200 a level all told, the owner's "plentiful")
#   loot   by `chance` percent, one loot roll per level reached, at the level as item level, through the loot code
#          (docs/dev/magic-items.md): magic is the percent more likely the magic and rare
#          rarities are (100: twice as likely), gems the percent more likely a loose gem
#          is; what comes up is kept when it is magic or rare, or of one of the `keep` item
#          classes (../item_classes.toml), and otherwise thrown away. Tuned so that 30 to 50 %
#          of level-ups add an item (the owner; world/classes/stipend_tests.rs checks the band). The
#          Landed noble talent (../talents/landed_noble.toml) raises the gold and the magic odds

gold = { each = 150, dice = "10d10" }
loot = { chance = 85, magic = 100, gems = 0, keep = ["potions", "scrolls", "gems"] }
