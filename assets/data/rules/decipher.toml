# Reading a scroll one cannot simply read (#1024; spec §8 "Scrolls"; `world/magic/decipher.rs`).
#
# Whoever is trained in Spellcraft, with a learning (skills/: `learn`, at least 1) of at least
# the scroll's spell level, reads it at once, with no check; a scroll with no spell behind it
# (restoration) counts as level 0. Everyone else rolls 2d12 + their Intelligence modifier + what
# talents add to its checks + Decipher script's `decipher` points (skills/: +8 at 100, +12 at
# 200) against:
#
#   difficulty = base + the spell's level ÷ levels_per_point (rounded down)
#
# Failed, the read's time passes, the scroll is kept, and a label stays unknown: try again.
# The Decipher ability (world/magic/decipher.rs) makes the same check on a scroll of a type not yet
# identified, without reading it: `seconds` of turns of the `decipher` action (actions.toml);
# made, the type is learned, failed, the time is gone and it may be tried again.
seconds = 600
base = 10
levels_per_point = 5
