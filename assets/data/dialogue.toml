# Dialogue (spec §7 "Dialogue", §8 "Dialogue"): what creatures say when you chat with them (`C`),
# and what some of them mutter to themselves. This file holds the shared speakers (the
# shopkeeper); a campaign's people talk in its data/dialogue/ (the showcase's:
# campaigns/showcase/data/dialogue/showcase.toml; spec §3).
#
# Each [[dialogue]] belongs to a creature type (`creature = "gardener"`) or to one unique
# character (`npc = "..."`, given to a creature by a level's legend entry with `npc = "..."`; it
# wins over its type's dialogue). Fields:
#   greet    said the first time you chat with it, instead of a line (optional)
#   greet_evil  lines a good creature says instead of its greeting and its lines while you are
#            Evil or Wicked (spec §8 "Alignment"), in turn like the one-liners (optional; same
#            length); greet_good the same for an evil creature while you are Good or Saintly
#   lines    one-liners, said in turn when you chat: each once a round, in an order of the
#            speaker's own, never the same twice in a row (at least one; at most 72 characters,
#            so they fit the message line with the speaker's name)
#   [[dialogue.topic]]  what you may ask about, on the dialogue screen that chatting opens (at
#            most 9): `id` (lower-case letters, digits, underscores; replays name it, `ask:E:id`),
#            `name` (what you pick), `reply` (at most 280 characters)
#   mutter   { chance, verb, lines }: the chance in percent per action (1 to 100) that it
#            mutters one of these lines (in turn, like the one-liners) while it goes about its
#            routine and you are within earshot; `verb` is how ("mutters" by default). You hear
#            it like any noise: the words with its name if you see it, else as a voice from
#            somewhere ("You hear a voice to the north: ..."), and only that if it was faint.
#
# A creature without a dialogue does not answer ("The giant rat doesn't answer."), and one
# hostile to you is in no mood to talk.

# Every shopkeeper (shops.toml): one-liners about trade, no topics. An outraged one, hostile to
# you, is in no mood to talk.
[[dialogue]]
creature = "shopkeeper"
greet = "Look around, take your time. What you pick up, you pay for at the door."
greet_evil = [
    "Prices are higher for your sort. Take it or leave it.",
    "Look, but keep your hands where I can see them.",
]
lines = [
    "Everything on the floor is for sale. Everything.",
    "Pay at the door, and we stay friends.",
    "Bring me what you find. I pay fair, for a shop.",
    "Gold coins only. I don't take promises.",
    "The last one who ran off without paying? I don't see him around, do you?",
    "Prices are prices. A friendly face helps, mind.",
]
