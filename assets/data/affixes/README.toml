# Affixes, one file per prefix or suffix, named by its id (`sharp.toml`, `of_the_bear.toml`); a
# file holds `[[prefix]]` or `[[suffix]]` entries only. The settings of magic items (`[rarity]`,
# `[magic]`, `[rare]`, `[names]`) stay in ../affixes.toml, and may be set in one file only. This
# file holds only the notes below: a file of comments defines nothing. The game numbers the
# affixes in path order, so a new affix is a new file (never edited into another's), a renamed id
# is a renamed file, and the same id in two files is a load error naming both
# (docs/dev/content.md).
#
# Every affix ([[prefix]] or [[suffix]]) defines:
#   id      stable name: items record their affixes by it (saves, `[[item]]` in level files)
#   name    "Sharp" (a prefix, before the item's name) or "of the Bear" (a suffix, after it)
#   category  its group, as Path of Exile's (`physical_damage`, `life`): an item never has two
#           affixes of one category. Every affix of one effect (of one skill, of one damage type)
#           names the same category, and a category on both prefixes and suffixes is one effect;
#           a category may gather a family of effects of one kind (`stealth`: stealth and the
#           Stealth skill). Damage is more than one category, so a weapon may roll more than one
#           damage affix: `physical_damage` (+damage: Sharp, Vicious), `extra_damage` (an extra
#           die: Heavy, of Wounding), and one per element (`fire_damage`: Flaming)
#   effect  what it does, one of:
#             to_hit        + to hit
#             damage        + to every roll of the damage dice
#             extra_damage  adds 1dN to every roll of the damage (the value is N)
#             elemental     adds 1dN damage of the affix's `damage_type` (an element, an id in
#                           damage_types.toml) to every roll; never soaked by armour
#             threat        widens the critical threat range by N natural rolls
#             crit          + to the critical multiplier (at most ×5)
#             attack_speed  attacks N% faster (less of their cost; at most 50 in all)
#             range         + cells it shoots or is thrown
#             draw          a bow needs N less Strength
#             durability    breaks N% less often
#             parry, armour, shield   + to the item's own Parry, Armour, or Shield
#             protection    + to the armour's own Protection (body armour, helmets, cloaks,
#                           gloves, boots)
#             max_dex       + to the most Dexterity may add to Defence while it is worn
#             weight        N% lighter
#             dodge         + Dodge (bonuses add up)
#             deflection    + Deflection (the best counts)
#             natural       + natural armour (the best counts, with a creature's own)
#             max_hp        + maximum hit points
#             regeneration  hit points come back N% faster
#             resistance    + N% resistance to the affix's `damage_type` (capped at 75 with
#                           everything else worn)
#             max_mana      + maximum mana
#             mana_regeneration  mana comes back N% faster
#             the spell hooks (the spell scaling design §7.1, docs/dev/spells.md "The hooks";
#                           on every spell of the wearer's, no tag filter): spell_rungs (rungs
#                           higher on its own casts' damage and heal ladders), spell_bonus (+ on
#                           every spell's roll, harm or healing: Potent), spell_sides (every
#                           spell die N sides bigger), spell_dice (N dice more), spell_reroll (a
#                           spell die showing N or less rolled again, once), wand_rungs (the
#                           wands it uses N rungs higher: of Wands), spell_reach (N cells of
#                           range or length: of Farcasting), spell_duration (N degrees of a
#                           buff's or a hex's status: of Lingering)
#             strength, dexterity, toughness, intelligence, willpower, presence   + to the score
#             move_speed    steps N% faster (at most 50 in all)
#             carry         + N kg carrying limit
#             stealth       footsteps N% quieter
#             light         the wearer carries the light of a preset (lights.toml)
#             skill         + to the value of the affix's `skill` (an id in skills.toml) for
#                           what that skill gives, trained or not
#           Attack effects (to_hit through durability) on a weapon, a missile weapon, or
#           ammunition change the attacks made with it (local); on anything else every attack
#           (global). parry, armour, protection, shield, max_dex, and weight change the item
#           itself; the rest change whoever wears or wields it. An item has at most one affix of
#           each category, and so of each effect
#           (of each skill, for skill affixes; of each damage type, for elemental and
#           resistance affixes).
#   bases   the kinds of item that may roll it: weapon, launcher, ammo, body, helmet, cloak,
#           gloves, boots, shield, ring, amulet. An affix whose effect the item lacks the means
#           for (range without a range, draw without a Strength to draw, durability on what never
#           breaks, armour, shield, or max_dex on what has none) does not roll on it
#   weight  how often it rolls among those that may (default 100)
#   tiers   from the lowest item level (`level`, the dungeon depth) each is found at, the range
#           its value is rolled in (`min`, `max`); a light's tiers name a `light` preset instead.
#           At most twelve tiers, on a ladder: a tier every item level or two from the first to
#           the last (usually 12), the values stepping evenly between (#637). Loot picks evenly
#           among the tiers found within four levels below its item level (the tier window).
#           A saved item whose tier a regrade moved is re-tiered when it loads, its value kept.

# Notes on the groups, in the order they were kept in:
#
# Prefixes: mostly offensive, or flat defence and life.
#
# Suffixes: mostly utility and stats, speed, criticals, and regeneration.
#
# Skill suffixes (spec §8 "Skills"): `effect = "skill"` with the `skill` (an id in skills.toml)
# whose value it raises for what the skill gives, trained or not (untrained, from 0).
# The skills whose benefit is gated on being trained at all (Spot, Open lock, Disable device,
# Heal, Steal, Survival's foraging: `Skills::trains_effect`) give the untrained nothing, so their
# suffixes (of the Eagle, of the Picklock, of Disarming, of the Leech, of the Cutpurse) help those
# trained in them only. A skill whose benefit nothing reads gets no suffix until something does.
