# Sleep: a cloud of true sleep, not the Sleep spell's drowsiness: those it takes sleep until a
# noise, a blow, or a cry wakes them (status.toml's Asleep), but only creatures of a level up to
# the user's caster level.
[[rod_effect]]
id = "sleep"
name = "Sleep"
description = "A cloud of slumber where you aim: creatures in it no stronger than your magic fall asleep until a noise or a blow wakes them."
shape = "burst"
range = 5
max_range = 10
per_levels = 5
radius = 1
kind = "status"
status = "asleep"
up_to_caster_level = true
