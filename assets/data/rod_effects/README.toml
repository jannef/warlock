# Rod effects (spec §8 "Magic items": "Rods", the magic design §9): what a rod does, effects no
# spell has. One `[[rod_effect]]` per file; a campaign's data/rod_effects/ may add more. A rod
# (an object's `[object.rod]`, data/objects/) names one and the mana a use costs its user.
#
# Fields:
#   id, name      the effect's id; what the player calls it once they know the rod ("Digging")
#   description   what it does, in words (the item description)
#   shape         line   every cell of a straight line toward the cell aimed at, to its reach
#                 bolt   toward the cell aimed at, to its reach, stopping at the first creature
#                        or wall
#                 burst  `radius` (1 to 3) around the cell aimed at, which must be within reach
#   range         its reach for anyone, in cells (1 to 20): the base
#   grows.range   its reach's ladder, as a spell's (data/spells/README.toml, `[spell.grows]`):
#                 a stat, then `AT CELLS` rungs, `"willpower 14 4, 18 5"`; the user whose
#                 effective score reaches a rung reaches its cells. Rungs rise strictly from
#                 `range` to at most 20. Left out, the reach never grows. No caster level is
#                 read (`max_range`, `per_levels`, `up_to_caster_level` are gone, refused)
#   noise         { sound, loudness }: the noise it makes (a burst's centre, else the user)
#   kind          what it does, each on existing code, with only its own fields:
#                 dig       (a line) every wall on it whose hardness (terrain.toml) is below
#                           `power` gives way, as dug through; the first that does not, a door,
#                           or the level's edge stops it
#                 teleport  (a bolt) the creature it hits is moved to a free cell of the level,
#                           as by a teleport trap; an attack on it, as a blow is
#                 status    (a burst) everyone in it but the user suffers `status` (an id of
#                           status.toml) at `severity` (1 to its max; default 1); with
#                           `up_to_level = N` (1 or more) only creatures whose level is at most
#                           N, the others shrug it off
