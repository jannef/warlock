# Gems (spec §7 "Gems", #191): what every gem shares. The gems themselves are materials with a
# `gem` table (materials/diamond.toml, ...): their colour, what a plain one is worth in gold, and
# how often loot finds them. A gem is worth its value × its size's × its cut's multiplier.
#
# Top-level fields:
#   object  the object a loose gem is (objects/gem.toml): made of its gem, which names it ("a large
#           fine emerald"), colours it, and prices it; its size gives its weight
#   chance  percent of finds that are a loose gem instead of an item: floor loot, vault loot cells
#           of grade `any`, and what creatures drop. Finds are rolled from the loot streams, so
#           maps never change
#
# [[size]], smallest first, and [[cut]], roughest first:
#   id, name  what items and names say ("large", "fine")
#   value     what it multiplies a gem's value by, in percent (×1 = 100)
#   weight    (sizes) what a loose gem of this size weighs, in grams
#   find      its weight in loot at item level 1; deeper adds this much for each item level
#   deeper    above the first, so deeper finds run larger and finer
#   plain     the one size and the one cut names leave unsaid ("a ruby": small, of fair cut), and
#             what a placed gem is unless it says otherwise (`"gem:ruby"` in a level file)
#   rough     (cuts) not cut at all: named before the size ("an uncut tiny garnet"), drawn duller,
#             and never set in an item
#
# [[ornament]], one per item class whose loot is now and then set with a gem (an ornament: a part
# of the item made of the gem, with a size and cut; it adds the gem's worth to the item and does
# nothing else yet):
#   class   an item class (item_classes.toml)
#   part    the part the gem becomes (parts.toml): its adjective names the item ("emerald-
#           pommelled long sword"), or its gem joins the item's material ("gold and ruby ring").
#           An object may set its own (`ornament = "tip"` in its file: a topaz-tipped staff)
#   chance  percent of the class's loot set with a gem
#   colour  the item takes its gem's colour (a ring set with a ruby is drawn red)

object = "gem"
chance = 5

[[size]]
id = "tiny"
name = "tiny"
value = 30
weight = 1
find = 40

