# Factions (spec §7): who fights whom. Every creature type in creatures.toml names its `faction`;
# the player belongs to the faction "player".
#
# Fields: id, name, hostile (faction ids), animal (default false: its creatures are animals, which
# a Beast-friend's talent makes neutral to them; spec §8 "Talents"), provoked (a faction id: one
# of its creatures the player attacks joins that one, as the Seelie turn wrathful; default none:
# it stays). Relations are symmetric: if A
# lists B as hostile, A and B are hostile to each other. Every pair not listed is neutral (a faction and itself too).
# Hostile creatures attack each other on sight; neutral ones leave each other alone. The player
# learns a creature's stance toward them from its type (look mode: "a giant rat (hostile)").

[[faction]]
id = "player"
name = "you"

# Giant rats.
[[faction]]
id = "vermin"
name = "vermin"
hostile = ["player"]
animal = true

# The kobold war band: they hunt the player and the vermin alike.
[[faction]]
id = "kobolds"
name = "kobolds"
hostile = ["player", "vermin"]

# The goblin tribes of the barrows (Cealdhlāw): they raid the kobolds' warrens and eat the vermin.
[[faction]]
id = "goblins"
name = "goblins"
hostile = ["player", "vermin", "kobolds"]

# The orc tribe (#455): war bands of orcs and the wargs they keep. They raid the kobolds' warrens,
# eat the vermin, and fight the dead and the duergar (whose mine they raid: listed on this side);
# the goblins they bully but march beside, so the two tribes leave each other be.
[[faction]]
id = "orcs"
name = "orcs"
hostile = ["player", "vermin", "kobolds", "undead", "duergar"]

# The restless dead of the barrows: skeletons, zombies, ghouls, wights. They hate the living,
# the player, the kobolds, the goblins, and the giants alike.
[[faction]]
id = "undead"
name = "undead"
hostile = ["player", "kobolds", "goblins", "giant"]

# The living things of the great fen (Fennmynster): leeches, frogs, crocodiles, wisps, mud
# golems, marsh trolls, and the bog hag they serve. Not animals as a faction (the trolls, the
# wisps, and the hag are not), so a Beast-friend calms none of them.
[[faction]]
id = "marsh"
name = "marsh things"
hostile = ["player"]

# The cult of the drowned minster (Fennmynster): cultists and their priests. They would bind the
# fen to their rites, so the marsh things fight them; the drowned dead they leave alone.
[[faction]]
id = "cult"
name = "cultists"
hostile = ["player", "marsh"]

# The hags (#451): the green hag, the sea hag, the annis hag, and the bheur hag, who keep to
# themselves and run with no one's band. The bog hag is not among them: the fen's things serve her,
# and she stays theirs (`marsh`). Hostile to the player only.
[[faction]]
id = "hags"
name = "hags"
hostile = ["player"]

# The grey dwarves of the deep delf (Fyrdelf): miners, warriors, smiths. They hate the living who
# come down their shafts, the goblins' kin (the trolls of the deep among them), the giants and
# their ogres, and the dead the fires made; the fire things they leave be.
[[faction]]
id = "duergar"
name = "duergar"
hostile = ["player", "goblins", "undead", "giant"]

# The giant tribe (#457): ogres and giants, hill, stone, frost, fire, cloud, and storm. They
# crush the player, the vermin, and the kobolds; the goblins and their kin they leave be (the
# ogres run with them), and they and the duergar are old enemies.
[[faction]]
id = "giant"
name = "giants"
hostile = ["player", "vermin", "kobolds"]

# The fire things of the volcano's deep (Fyrdelf): ember beetles, salamanders, magma crawlers,
# cinder elementals, the fire drake. They burn the player and leave everyone else alone.
[[faction]]
id = "fire"
name = "fire things"
hostile = ["player"]

# The elementals (#453): fire, earth, air, water, ice, and lightning given shape, from motes to
# the eldest. They are hostile to the player and leave everyone else alone, as the delf's fire
# things do (the cinder elemental, an elemental too, is of that faction).
[[faction]]
id = "elemental"
name = "elementals"
hostile = ["player"]

# The fey courts (#452): each fey creature joins one when it is made, by its type's `factions`
# weights (data/creatures/README.toml). The Seelie court leaves the player be, the Unseelie hunts
# them, and the two are at war; both leave every other faction alone. A Seelie fey the player
# attacks turns wrathful (`provoked`): hostile to the player from then on, still at peace with
# its court and at war with the Unseelie.
[[faction]]
id = "seelie"
name = "Seelie court"
hostile = ["unseelie"]
provoked = "wrathful_fey"

[[faction]]
id = "unseelie"
name = "Unseelie court"
hostile = ["player"]

[[faction]]
id = "wrathful_fey"
name = "wrathful fey"
hostile = ["player", "unseelie"]

# The devils of the hells (#448): lemures, imps, and the greater devils up to the pit fiend.
# They come for the player and leave everyone else be: devils bargain, they do not brawl with
# every passer-by.
[[faction]]
id = "devil"
name = "devils"
hostile = ["player"]

# The yugoloths (#446): mercenary fiends of the lower planes, who serve whoever pays. They come
# for the player and leave everyone else alone, the demons and devils included: hired by none,
# at war with none (there is no hire yet; relations are only symmetric hostile lists).
[[faction]]
id = "yugoloth"
name = "yugoloths"
hostile = ["player"]

# Folk who mean the player no harm, whatever they are: the showcase's people (the gardener, the
# bard, the hermit) by type, and others placed here by levels with `faction = "peaceful"` in a
# legend entry (the showcase hub and caverns), overriding the faction of the creature's type.
# Hostile to no one.
[[faction]]
id = "peaceful"
name = "peaceful folk"

# Deer, cave bats, and cave beetles: neutral to everyone.
[[faction]]
id = "wildlife"
name = "wildlife"
animal = true

# Shopkeepers (shops.toml): they trade with everyone and fight no one...
[[faction]]
id = "merchants"
name = "merchants"

# ...until wronged: a shopkeeper robbed or attacked joins the outraged (shops.toml `outraged`),
# hostile to the player, and comes after them. So does anyone who catches the player stealing
# from them (steal.toml `caught`).
[[faction]]
id = "outraged"
name = "outraged shopkeepers"
hostile = ["player"]
