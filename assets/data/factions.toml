# Factions (spec §7): who fights whom. Every creature type in creatures.toml names its `faction`;
# the player belongs to the faction "player".
#
# Fields: id, name, hostile (faction ids), animal (default false: its creatures are animals, which
# a Beast-friend's talent makes neutral to them; spec §8 "Talents"). Relations are symmetric: if A
# lists B as hostile, A and B are hostile to each other. Every pair not listed is neutral (a faction and itself too).
# Hostile creatures attack each other on sight; neutral ones leave each other alone. The player
# learns a creature's stance toward them from its type (look mode: "a giant rat (hostile)").

[[faction]]
id = "player"
name = "you"

# Giant rats.
[[faction]]
id = "vermin"
name = "vermin"
hostile = ["player"]
animal = true

# The kobold war band: they hunt the player and the vermin alike.
[[faction]]
id = "kobolds"
name = "kobolds"
hostile = ["player", "vermin"]

# The goblin tribes of the barrows (Cealdhlāw): they raid the kobolds' warrens and eat the vermin.
[[faction]]
id = "goblins"
name = "goblins"
hostile = ["player", "vermin", "kobolds"]

# The restless dead of the barrows: skeletons, zombies, ghouls, wights. They hate the living,
# the player, the kobolds, and the goblins alike.
[[faction]]
id = "undead"
name = "undead"
hostile = ["player", "kobolds", "goblins"]

# The living things of the great fen (Fennmynster): leeches, frogs, crocodiles, wisps, mud
# golems, marsh trolls, and the bog hag they serve. Not animals as a faction (the trolls, the
# wisps, and the hag are not), so a Beast-friend calms none of them.
[[faction]]
id = "marsh"
name = "marsh things"
hostile = ["player"]

# The cult of the drowned minster (Fennmynster): cultists and their priests. They would bind the
# fen to their rites, so the marsh things fight them; the drowned dead they leave alone.
[[faction]]
id = "cult"
name = "cultists"
hostile = ["player", "marsh"]

# The grey dwarves of the deep delf (Fyrdelf): miners, warriors, smiths. They hate the living who
# come down their shafts, the goblins' kin (the ogres and trolls of the deep among them), and
# the dead the fires made; the fire things they leave be.
[[faction]]
id = "duergar"
name = "duergar"
hostile = ["player", "goblins", "undead"]

# The fire things of the volcano's deep (Fyrdelf): ember beetles, salamanders, magma crawlers,
# cinder elementals, the fire drake. They burn the player and leave everyone else alone.
[[faction]]
id = "fire"
name = "fire things"
hostile = ["player"]

# Folk who mean the player no harm, whatever they are: the showcase's people (the gardener, the
# bard, the hermit) by type, and others placed here by levels with `faction = "peaceful"` in a
# legend entry (the showcase hub and caverns), overriding the faction of the creature's type.
# Hostile to no one.
[[faction]]
id = "peaceful"
name = "peaceful folk"

# Deer, cave bats, and cave beetles: neutral to everyone.
[[faction]]
id = "wildlife"
name = "wildlife"
animal = true

# Shopkeepers (shops.toml): they trade with everyone and fight no one...
[[faction]]
id = "merchants"
name = "merchants"

# ...until wronged: a shopkeeper robbed or attacked joins the outraged (shops.toml `outraged`),
# hostile to the player, and comes after them. So does anyone who catches the player stealing
# from them (steal.toml `caught`).
[[faction]]
id = "outraged"
name = "outraged shopkeepers"
hostile = ["player"]
