# Classes (spec §8 "Character creation"): the third choice of a new run, in the order offered.
# A class adjusts the starting scores (see races.toml for how they add up), gives hit points,
# trains the character in skills and weapon skills, and gives a starting kit: no spells come with
# it.
#
# Fields: id and name (the class's id, for the command line and saves, and its name), description
# (one line, shown when choosing), and stats (adjustments to the starting scores by stat id:
# strength, dexterity, toughness, intelligence, willpower, presence; a missing one 0). An
# adjustment is a number (`1`, `-2`) or dice (`"1d3+1"`, `"-1d2"`), rolled in the background when
# the character is made, ADOM-like; every result within -10 to 10. Each class rolls its key
# stats; penalties may be rolled too. hp: what the class adds to the hit points (spec §8
# "Combat"; default 0): a character's maximum is their Toughness plus their race's (races.toml)
# and their class's. skills: the skills the class trains (spec §8 "Skills"; skills.toml), by skill
# id: dice (`"2d6+10"`) or a number, rolled when the character is made, every result within 0 to
# 100; added to the race's. Each class has a few skills it is known for (2d6+10) and a few more
# (2d4+4); every other skill is untrained. weapon_skills: starting ranks in weapon skills (spec §8
# "Weapon skills"), by skill id in weapon_skills.toml, a number or dice (every result within 0 to
# 10), added to the race's (at most 10); weapon_skill_choice: two or more such sets, of which one
# is picked at random when the character is made (the barbarian's axes or great blades). Each
# starting rank then raises the weapon skills it defaults to. styles and style_choice: the same
# for fighting styles (spec §8 "Fighting styles"; the styles in weapon_skills.toml), rolled after
# everything else (the thief's Twin Blades or Duelist).
#
# kit: what the class starts with (spec §8 "Character creation"), first in the pack; the race's
# kit (races.toml) and any the birth sign gives (horoscope.toml) come after it, and a scenario's
# `carry` on top. Each line is one item, or a few of one, as level files place objects
# (`"ration*2"`, `"gem:ruby"`): a string is carried, and a table says how it is kept:
#   { carry = "..." }   in the pack (the same as a plain string)
#   { wield = "..." }   wielded or readied: a weapon or shield in hand (a second light weapon
#                       goes to the off hand), a missile weapon or missiles, a tool; each in the
#                       first free slot it fits (one that finds none is carried)
#   { wear = "..." }    worn: armour, cloaks, gloves, boots, rings, amulets
# and may add:
#   trained = "id"      only if the class trained that weapon skill or fighting style: its
#                       weapon_skills or styles, or the set of its choice that was picked (the
#                       barbarian's great axe with axes, the thief's second dagger with Twin
#                       Blades)
#   gender = "female"   only for that gender (male, female, or other)
#   magic = "any"       a base item (one with a `kind`) made as loot makes it, its rarity rolled:
#                       "any" (perhaps magic), "magic" (magic or rare), or "rare"; unidentified
# `"a|b|c"` is one of them, picked at random when the character is made (from its own stream,
# so no other roll moves). Food is as fresh as the run is new. Nobody starts Strained; only the
# aristocrat and the merchant may start Burdened, by their wealth.
#
# The adventurers come first, then everyday folk. Balance is not a goal: some choices are poor on
# purpose.

[[class]]
id = "barbarian"
name = "Barbarian"
description = "A warrior of the wild lands, fueled by fury: mighty and hardy, with no patience for books or manners."
stats = { strength = "1d3+1", dexterity = 1, toughness = "1d3", intelligence = "-1d2", presence = -1 }
hp = 8
skills = { athletics = "2d6+10", survival = "2d6+10", intimidate = "2d4+4", listen = "2d4+4", swim = "2d4+4" }
weapon_skills = { unarmed = 1 }
weapon_skill_choice = [{ axes = 2 }, { great_blades = 2 }]
styles = { great_weapon = 1 }
# The wild lands' arms: a great weapon of the kind the barbarian learned, and furs.
kit = [
    { wield = "great_axe", trained = "axes" },
    { wield = "great_sword", trained = "great_blades" },
    { wear = "fur_cloak" },
    { wear = "bone_amulet", magic = "any" },
    "dried_meat*3",
    "gold_coin*4",
]

[[class]]
id = "bard"
name = "Bard"
description = "A wandering singer and teller of tales who gets by on charm, quick fingers, and a quicker tongue."
stats = { strength = -1, dexterity = 1, toughness = -1, intelligence = "1d2", presence = "1d3+1" }
hp = 2
skills = { bluff = "2d6+10", music = "2d6+10", appraise = "2d4+4", decipher_script = "2d4+4", knowledge = "2d4+4", tumble = "2d4+4" }
weapon_skills = { short_blades = 1, daggers = "1d2" }
styles = { duelist = 1 }
# A blade for the road, a lute for the inn, and the night's takings.
kit = [
    { wield = "short_sword|scimitar" },
    { wear = "travelling_cloak" },
    "dagger",
    "lute",
    "bread",
    "gold_coin*30",
]

[[class]]
id = "priest"
name = "Priest"
description = "A servant of a god, schooled in rite and scripture: strong of will and voice, soft of hand."
stats = { strength = -1, dexterity = -1, intelligence = 1, willpower = "1d3+1", presence = "1d2" }
hp = 4
skills = { heal = "2d6+10", knowledge = "2d6+10", concentration = "2d4+4", decipher_script = "2d4+4" }
weapon_skills = { maces = 2, shield_block = 1 }
styles = { sword_and_board = 1 }
# Mace and buckler, the holy symbol, and candles for the rites.
kit = [
    { wield = "mace" },
    { wield = "buckler" },
    { wear = "wool_cloak" },
    { wear = "amber_amulet" },
    "scroll_of_light",
    "candle*3",
    "bread",
    "gold_coin*10",
]

[[class]]
id = "druid"
name = "Druid"
description = "A keeper of the old ways who speaks for forest and beast: hardy and patient, and uneasy in towns."
stats = { toughness = "1d2", willpower = "2d2", presence = -1 }
hp = 4
skills = { handle_animal = "2d6+10", survival = "2d6+10", concentration = "2d4+4", heal = "2d4+4", listen = "2d4+4" }
weapon_skills = { staves = 2, slings = 1 }
styles = { staff_fighter = 1 }
# Staff and sling, a stone pouch, and the forest's gifts: a healing root and windfall apples.
kit = [
    { wield = "quarterstaff" },
    { wield = "sling" },
    { wield = "sling_stone*20" },
    { wear = "travelling_cloak" },
    "angelica_root",
    "apple*4",
    "gold_coin*3",
]

[[class]]
id = "monk"
name = "Monk"
description = "A disciple of a cloister's discipline, body and mind trained as one: quick, enduring, inward-turned."
stats = { dexterity = "1d3", toughness = 1, willpower = "1d3", presence = -1 }
hp = 5
skills = { balance = "2d6+10", tumble = "2d6+10", athletics = "2d4+4", concentration = "2d4+4", escape_artist = "2d4+4", listen = "2d4+4" }
weapon_skills = { unarmed = 2, staves = 1 }
style_choice = [{ brawler = 1 }, { staff_fighter = 1 }]
# A vow of poverty: a staff or bound hands, alms in copper, and an apple or three.
kit = [
    { wield = "quarterstaff", trained = "staff_fighter" },
    { wear = "leather_gloves", trained = "brawler" },
    { wear = "wool_cloak" },
    "apple*3",
    "copper_coin*7",
]

[[class]]
id = "paladin"
name = "Paladin"
