# Classes (spec §8 "Character creation"): the third choice of a new run, in the order offered.
# A class adjusts the starting scores (see races.toml for how they add up), gives hit points, and
# trains the character in skills and weapon skills: no equipment or spells come with it.
#
# Fields: id and name (the class's id, for the command line and saves, and its name), description
# (one line, shown when choosing), and stats (adjustments to the starting scores by stat id:
# strength, dexterity, toughness, intelligence, willpower, presence; a missing one 0). An
# adjustment is a number (`1`, `-2`) or dice (`"1d3+1"`, `"-1d2"`), rolled in the background when
# the character is made, ADOM-like; every result within -10 to 10. Each class rolls its key
# stats; penalties may be rolled too. hp: what the class adds to the hit points (spec §8
# "Combat"; default 0): a character's maximum is their Toughness plus their race's (races.toml)
# and their class's. experience: how much experience a level needs, in percent (spec §8
# "Experience"; 50 to 200, default 100), multiplied with the race's onto every threshold in
# experience.toml: the patient callings pay more, everyday folk less. skills: the skills the
# class trains (spec §8 "Skills"; skills.toml), by skill id: dice (`"2d6+10"`) or a number,
# rolled when the character is made, every result within 0 to 100; added to the race's. Each class has a few skills it is known for (2d6+10) and a few more
# (2d4+4); every other skill is untrained. weapon_skills: starting ranks in weapon skills (spec §8
# "Weapon skills"), by skill id in weapon_skills.toml, a number or dice (every result within 0 to
# 10), added to the race's (at most 10); weapon_skill_choice: two or more such sets, of which one
# is picked at random when the character is made (the barbarian's axes or great blades). Each
# starting rank then raises the weapon skills it defaults to. styles and style_choice: the same
# for fighting styles (spec §8 "Fighting styles"; the styles in weapon_skills.toml), rolled after
# everything else (the thief's Twin Blades or Duelist).
#
# The adventurers come first, then everyday folk. Balance is not a goal: some choices are poor on
# purpose.

[[class]]
id = "barbarian"
name = "Barbarian"
description = "A warrior of the wild lands, fueled by fury: mighty and hardy, with no patience for books or manners."
stats = { strength = "1d3+1", dexterity = 1, toughness = "1d3", intelligence = "-1d2", presence = -1 }
hp = 8
experience = 90
skills = { athletics = "2d6+10", survival = "2d6+10", intimidate = "2d4+4", listen = "2d4+4", swim = "2d4+4" }
weapon_skills = { unarmed = 1 }
weapon_skill_choice = [{ axes = 2 }, { great_blades = 2 }]
styles = { great_weapon = 1 }

