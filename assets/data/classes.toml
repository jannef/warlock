hp = 5
skills = { spot = "2d6+10", survival = "2d6+10", woodcraft = "2d6+10", athletics = "2d4+4", handle_animal = "2d4+4", listen = "2d4+4", swim = "2d4+4" }
weapon_skills = { bows = 2, short_blades = 1 }
styles = { marksman = 1 }
# Bow and quiver, a short sword, and leathers for the borderlands.
kit = [
    { wield = "short_bow" },
    { wield = "arrow*24" },
    { wield = "short_sword" },
    { wear = "leather_jerkin" },
    { wear = "leather_boots" },
    "dried_meat*3",
    "gold_coin*8",
]

[[class]]
id = "thief"
name = "Thief"
description = "A cutpurse, burglar, and picker of locks who lives by nimble fingers and a quick wit."
stats = { strength = -1, dexterity = "1d3+1", intelligence = "1d2-1", willpower = -1 }
hp = 3
skills = { open_lock = "2d6+10", steal = "2d6+10", stealth = "2d6+10", tumble = "2d6+10", appraise = "2d4+4", disable_device = "2d4+4", escape_artist = "2d4+4", search = "2d4+4", spot = "2d4+4" }
weapon_skills = { daggers = 2, thrown = 1 }
style_choice = [{ twin_blades = 1 }, { duelist = 1 }]
# A dagger (two, for Twin Blades; a stiletto up the sleeve for the Duelist), dark leathers, and
# a purse that was someone else's.
kit = [
    { wield = "dagger" },
    { wield = "dagger", trained = "twin_blades" },
    { carry = "stiletto", trained = "duelist" },
    { wear = "leather_jerkin" },
    { wear = "wool_cloak" },
    { wear = "leather_gloves" },
    "bread",
    "gold_coin*25",
]

[[class]]
id = "wizard"
name = "Wizard"
description = "A scholar of the arcane who traded sunlight for candlelight: brilliant of mind, frail of body."
stats = { strength = -2, toughness = "-1d2", intelligence = "2d2+1", willpower = 1 }
hp = 0
skills = { concentration = "2d6+10", knowledge = "2d6+10", spellcraft = "2d6+10", decipher_script = "2d4+4", use_magic_device = "2d4+4" }
weapon_skills = { staves = 1 }
# A staff, candles for the long nights, and three scrolls: light, identify, and one spell to
# be reckoned with.
kit = [
    { wield = "quarterstaff" },
    { wear = "wool_cloak" },
    "scroll_of_light",
    "scroll_of_identify",
    "scroll_of_fireball|scroll_of_frost|scroll_of_lightning",
    "candle*4",
    "bread",
    "gold_coin*15",
]

[[class]]
id = "witch"
name = "Witch"
description = "A hedge-magician of herbs, hexes, and old bargains: cunning, wise in strange ways, and feared."
