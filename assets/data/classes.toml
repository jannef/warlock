kit = [
    { wield = "dagger" },
    { wear = "travelling_cloak" },
    { wear = "leather_boots" },
    "gem:garnet|gem:amethyst|gem:topaz",
    "gem:garnet|gem:amethyst|gem:topaz",
    "gold_coin*120",
    "wool_cloak*2",
    "candle*10",
    "rope",
    "dried_meat*4",
    "scroll_of_identify",
]
