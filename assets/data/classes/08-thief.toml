    { level = 1, talent = "sneak_attack" },
    { level = 1, talent = "trained_wind" },
    { level = 6, talent = "trapfinding" },
    { level = 12, talent = "pick_lock" },
    { level = 18, talent = "evasion" },
    { level = 25, talent = "uncanny_dodge" },
    { level = 32, talent = "improved_sneak_attack" },
    { level = 40, talent = "light_fingers" },
