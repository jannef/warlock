[[class]]
id = "craftsperson"
name = "Craftsperson"
description = "A smith, carpenter, or weaver who knows a trade inside out: sure hands, a patient mind, and few words."
stats = { strength = 1, dexterity = "1d3", intelligence = 1, presence = "-1d2" }
hp = 3
mana = 1
casting = 25
experience = 90
skills = { metalcraft = "2d6+10", woodcraft = "2d6+10", appraise = "2d4+4", negotiation = "2d4+4" }
known_for = ["metalcraft", "woodcraft"]
optional_skills = { athletics = { chance = 25, dice = "2d4" }, search = { chance = 20, dice = "2d4" } }
rolls = 2
weapon_skills = { axes = 1 }
# The level table (spec §8 "Class abilities"): the tricks of a trade, one by one as the levels
# come; bonus talents from Weaponcraft, Guard, and Delver.
abilities = [
    { level = 1, talent = "keen_appraisal" },
    { level = 6, talent = "whetstone" },
    { level = 12, talent = "fletching" },
    { level = 18, talent = "sturdy_work" },
    { level = 25, talent = "mining" },
    { level = 32, talent = "tinker" },
    { level = 40, talent = "jeweller" },
    { level = 50, talent = "masterwork" },
    { level = 60, talent = "artisan" },
]
bonus_talents = { levels = [10, 20, 30, 45, 55], trees = ["weaponcraft", "guard", "delver"] }
# A hand axe, work gloves and boots, and something of their own making: the weaver's rope, the
# cobbler's boots, or the smith's helm.
kit = [
    { wield = "hand_axe" },
    { wear = "leather_gloves" },
    { wear = "leather_boots" },
    "rope|leather_boots|iron_helm",
    "candle*2",
    "ration",
    "gold_coin*25",
]
