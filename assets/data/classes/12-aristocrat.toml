[[class]]
id = "aristocrat"
name = "Aristocrat"
description = "Born to wealth and command and never asked to lift anything heavier than a goblet."
stats = { strength = -2, toughness = "-1d2", intelligence = 1, willpower = -1, presence = "1d3+1" }
hp = 1
mana = 7
casting = 75
experience = 90
skills = { knowledge = "2d6+10", bluff = "2d4+4", intimidate = "2d4+4" }
known_for = ["knowledge"]
optional_skills = { appraise = { chance = 20, dice = "2d4" }, handle_animal = { chance = 30, dice = "2d4" }, music = { chance = 25, dice = "2d4" } }
rolls = 2
weapon_skills = { long_blades = 1 }
styles = { duelist = 1 }
# The level table (spec §8 "Class abilities"): their tutors' lessons and their family's name,
# one by one as the levels come; bonus talents from Weaponcraft and Delver.
abilities = [
    { level = 1, talent = "well_dressed" },
    { level = 6, talent = "fencing" },
    { level = 12, talent = "noblesse" },
    { level = 18, talent = "riposte" },
    { level = 25, talent = "connoisseur" },
    { level = 32, talent = "iron_will" },
    { level = 40, talent = "commanding" },
    { level = 50, talent = "peerless" },
    { level = 60, talent = "legacy" },
]
bonus_talents = { levels = [10, 20, 30, 45, 55], trees = ["weaponcraft", "delver"] }
# Unfair on purpose: a fine rapier (perhaps enchanted), an heirloom ring (magic or rare, as
# yet unknown), furs, a jewel, and a heavy purse, which may well weigh them down.
kit = [
    { wield = "rapier", magic = "any" },
    { wear = "gold_ring", magic = "magic" },
    { wear = "fur_cloak" },
    { wear = "leather_boots" },
    "gem:ruby|gem:sapphire|gem:emerald",
    "gold_coin*300",
    "apple*2",
]
