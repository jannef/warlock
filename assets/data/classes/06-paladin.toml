[[class]]
id = "paladin"
name = "Paladin"
description = "A holy knight sworn to an oath: strong and commanding, steadfast to a fault, and slow to doubt."
stats = { strength = "1d3", dexterity = -1, intelligence = -1, willpower = 1, presence = "1d3" }
hp = 6
mana = 3
affinity = { restoration = 2, abjuration = 1, necromancy = -3 }
experience = 110
alignment = 550
skills = { intimidate = "2d6+10", concentration = "2d4+4", decipher_script = "2d4+4", handle_animal = "2d4+4", heal = "2d4+4", spellcraft = "2d4+4" }
known_for = ["intimidate"]
optional_skills = { athletics = { chance = 25, dice = "2d4" }, knowledge = { chance = 25, dice = "2d4" } }
rolls = 2
weapon_skills = { long_blades = 2, shield_bash = 1, abjuration = 1 }
styles = { sword_and_board = 1, battle_caster = 1 }
# Sword and shield, the order's harness (a warrior's hardened leathers and iron helm, and
# gauntlets besides), and the order's symbol, perhaps blessed.
kit = [
    { wield = "long_sword" },
    { wield = "small_shield" },
    { wear = "leather_jerkin:hardened_leather" },
    { wear = "iron_helm" },
    { wear = "gauntlets" },
    { wear = "amber_amulet", magic = "any" },
    "dried_meat*2",
    "gold_coin*15",
]
# Bonus talents from Guard and Vigour.
bonus_talents = { levels = [10, 20, 30, 45, 55], trees = ["guard", "vigour"] }
# The level table (spec §8 "Class abilities"). The holy gifts used from the abilities menu work
# only for the good side (their talents' `alignment`); they bar nothing. Smite grants zeal, the
# pool Smite and Lay on hands are paid from (docs/design/paladin-smites.md).
abilities = [
    { level = 1, talent = "smite" },
    { level = 1, talent = "lay_on_hands" },
    { level = 1, talent = "trained_wind" },
    { level = 6, talent = "divine_grace" },
    { level = 6, talent = "blessing" },
    { level = 12, talent = "branding_smite" },
    { level = 12, talent = "consecrate" },
    { level = 14, talent = "brand" },
    { level = 18, talent = "purity_of_body" },
    { level = 20, talent = "unbinding" },
    { level = 25, talent = "retribution" },
    { level = 32, talent = "wrathful_smite" },
    { level = 40, talent = "holy_radiance" },
    { level = 40, talent = "holy_wrath" },
    { level = 50, talent = "banishing_smite" },
    { level = 50, talent = "bulwark" },
    { level = 60, talent = "avatar" },
]
