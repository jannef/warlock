# Classes (spec §8 "Character creation"): the third choice of a new run, one file per class
# holding one `[[class]]`. A class adjusts the starting scores (see ../races.toml for how they add
# up), gives hit points, trains the character in skills and weapon skills, and gives a starting
# kit: no spells come with it. This file holds only the notes below: a file of comments defines nothing.
#
# The classes are offered in path order, so the files are named `NN-id.toml` (`01-barbarian.toml`):
# the number keeps the order. The adventurers come first, then everyday folk; a new class takes
# the number of its place and the ones after it move up. Saves name the class by id, so a renamed
# file keeps saves; the same id in two files is a load error naming both (docs/dev/content.md).
#
# Fields:
#   id, name      the class's id (for the command line and saves) and its name
#   description   one line, shown when choosing
#   stats         adjustments to the starting scores by stat id (strength, dexterity, toughness,
#                 intelligence, willpower, presence; a missing one 0): a number (`1`, `-2`) or
#                 dice (`"1d3+1"`, `"-1d2"`), rolled in the background when the character is made,
#                 ADOM-like; every result within -10 to 10. Each class rolls its key stats;
#                 penalties may be rolled too
#   hp            what the class adds to the hit points (spec §8 "Combat"; default 0): a
#                 character's maximum is their Toughness plus their race's (races.toml) and their
#                 class's
#   mana          what the class adds to the mana (spec §8 "Mana"; default 0, at most 1000): a
#                 character's maximum is their race's and their class's plus the modifiers of their
#                 Intelligence, Willpower, and Presence, and each level up to experience.toml's
#                 mana_level adds half the class's mana plus the better of the Intelligence and
#                 Willpower modifiers
#   casting       the class's casting percent (spec §8 "Spells"; 1 to 100, default 25): a
#                 character's caster level is this percent of their level, rounded down, before
#                 talents and items. Full casters 100, the bard and the aristocrat 75, the
#                 paladin, the ranger, and the monk 50, everyone else 25: nobody casts at 0
#   affinity      the class's affinity with the schools of magic (spec §8 "Spells"): a table of
#                 school = points (-10 to 10), taken off the difficulty of studying a spell of
#                 that school (a malus when negative); schools left out are 0
#   experience   how much experience a level needs, in percent (spec §8 "Experience"; 50 to 200,
#                 default 100), multiplied with the race's onto every threshold in
#                 experience.toml: the patient callings pay more, everyday folk less
#   alignment     the class's part of a new character's hidden alignment score (spec §8
#                 "Alignment"; alignment.toml; -1000 evil to 1000 good, default 0), added to the
#                 race's: paladins start Good, thieves and witches Callous, everyone else Neutral
#   skills        the skills the class trains (spec §8 "Skills"; skills.toml), by skill id: dice
#                 (`"2d6+10"`) or a number, rolled when the character is made, every result
#                 within 0 to 100; added to the race's. Each class has a few skills it is known
#                 for (2d6+10) and a few more (2d4+4); every other skill is untrained
#   known_for     the skills the class is known for (its 2d6+10 ones; each one of `skills`): a
#                 level-up roll on one throws the die one step up the skill ladder (skills.toml
#                 `[ladder]`); a roll on one of the class's other skills adds 1 (default none)
#   optional_skills  skills a new character may or may not start with (ADOM-like), by skill id:
#                 `{ chance = 30, dice = "2d4" }`, the chance in percent (1 to 99) that it comes,
#                 rolled once when the character is made (from its own stream, so no other roll
#                 moves), then its dice (every result within 0 to 100), added to the race's. None
#                 is one of `skills`. They are pleasant surprises, not the class's core: a level-up
#                 roll on one adds nothing for the class (default none)
#   rolls         the skill rolls each level gives (spec §8 "Skills"; 0 to 10, default 2): the
#                 race's (races.toml) and Intelligence's (skills.toml `[rolls]`) are added. Most
#                 classes 2, the thief and the ranger 3, the bard 4: learning is the bard's gift
#   creation_talents  talent picks at creation beyond everyone's (experience.toml `[levels]`
#                 `creation_talents`; default 0): the bard, the lucky class, has 1
#   weapon_skills starting ranks in weapon skills (spec §8 "Weapon skills"), by skill id in
#                 weapon_skills.toml, a number or dice (every result within 0 to 10), added to the
#                 race's (at most 10). Each starting rank then raises the weapon skills it
#                 defaults to
#   weapon_skill_choice  two or more such sets, of which one is picked at random when the
#                 character is made (the barbarian's axes or great blades)
#   styles, style_choice  the same for fighting styles (spec §8 "Fighting styles"; the styles in
#                 weapon_skills.toml), rolled after everything else (the thief's Twin Blades or
#                 Duelist)
#   kit           what the class starts with (spec §8 "Character creation"), first in the pack;
#                 the race's kit (races.toml) and any the birth sign gives (horoscope.toml) come
#                 after it, and a scenario's `carry` on top. Each line is one item, or a few of
#                 one, as level files place objects (`"ration*2"`, `"gem:ruby"`): a string is
#                 carried, and a table says how it is kept:
#                   { carry = "..." }  in the pack (the same as a plain string)
#                   { wield = "..." }  wielded or readied: a weapon or shield in hand (a second
#                                      light weapon goes to the off hand), a missile weapon or
#                                      missiles, a tool; each in the first free slot it fits (one
#                                      that finds none is carried)
#                   { wear = "..." }   worn: armour, cloaks, gloves, boots, rings, amulets
#                 and may add:
#                   trained = "id"     only if the class trained that weapon skill or fighting
#                                      style: its weapon_skills or styles, or the set of its
#                                      choice that was picked (the barbarian's great axe with
#                                      axes, the thief's second dagger with Twin Blades)
#                   gender = "female"  only for that gender (male, female, or other)
#                   magic = "any"      a base item (one with a `kind`) made as loot makes it, its
#                                      rarity rolled: "any" (perhaps magic), "magic" (magic or
#                                      rare), or "rare"; unidentified
#                 `"a|b|c"` is one of them, picked at random when the character is made (from its
#                 own stream, so no other roll moves). Food is as fresh as the run is new. Nobody
#                 starts Strained; only the aristocrat and the merchant may start Burdened, by
#                 their wealth.
#   abilities     the level table (spec §8 "Class abilities"): `{ level = 6, talent = "fencing" }`
#                 rows, lowest level first, each a talent the class gives at that level (a talent
#                 of the `class` tree, ../talents/, or an ordinary one it hands out: the
#                 aristocrat's Riposte); given at rank 1 as the level comes, never picked, and
#                 not given again to one who holds it already (default none)
#   bonus_talents `{ levels = [10, 20, 30, 45, 55], trees = ["guard", "vigour"] }`: a bonus talent
#                 pick at each of those levels besides the usual ones, of a talent from those
#                 trees (no `trees`: any tree, the commoner's gift; default none)
#
# Balance is not a goal: some choices are poor on purpose.
