[[class]]
id = "bard"
name = "Bard"
description = "A wandering singer and teller of tales who gets by on charm, quick fingers, and a quicker tongue."
stats = { strength = -1, dexterity = 1, toughness = -1, intelligence = "1d2", presence = "1d3+1" }
hp = 2
mana = 5
affinity = { enchantment = 2, divination = 1 }
experience = 100
skills = { bluff = "2d6+10", music = "2d6+10", appraise = "2d4+4", negotiation = "2d4+4", decipher_script = "2d4+4", initiative = "2d4+4", knowledge = "2d4+4", spellcraft = "2d4+4", tumble = "2d4+4" }
known_for = ["bluff", "music"]
optional_skills = { listen = { chance = 30, dice = "2d4" }, spot = { chance = 30, dice = "2d4" }, steal = { chance = 15, dice = "2d4" } }
rolls = 4
creation_talents = 1
weapon_skills = { short_blades = 1, daggers = "1d2", restoration = 1 }
styles = { duelist = 1 }
# A blade for the road, a lute for the inn, and the night's takings.
kit = [
    { wield = "short_sword|scimitar" },
    { wear = "travelling_cloak" },
    "dagger",
    "lute",
    "bread",
    "gold_coin*30",
]
# The bard's levels end at 30 (the bard design §5): experience past it still counts and buys
# nothing until a calling opens a prestige class (the Hunter), when the levels banked come at once.
max_level = 30
# Bonus talents from any tree (the bard design's Q13), on the halved cadence.
bonus_talents = { levels = [5, 10, 15, 23, 28] }
# The level table (spec §8 "Class abilities"), every ability by 30 (the bard design §5: the old
# 1, 6, 12, 18, 25, 32, 40, 50, 60 halved). Fast healer is the Vigour talent, given (#790: a
# table names the pickable, never a clone). Inspire is a song paid in Inspiration (#870).
# Travelled hands takes Blessing's place (Blessing is a priest's abjuration, off the bard's
# schools). Jack of all trades takes every skill up at 12, and Master of none raises every
# skill 5 at 25 (#872). The Lullaby, the song against foes, at 20 (#873).
abilities = [
    { level = 1, talent = "mend" },
    { level = 1, talent = "trained_wind" },
    { level = 3, talent = "travelled_hands" },
    { level = 6, talent = "fast_healer" },
    { level = 8, talent = "mesmerise" },
    { level = 9, talent = "inspire" },
    { level = 12, talent = "jack_of_all_trades" },
    { level = 16, talent = "throw_voice" },
    { level = 16, talent = "bind" },
    { level = 20, talent = "lullaby" },
    { level = 25, talent = "master_of_none" },
    { level = 30, talent = "virtuoso" },
]
