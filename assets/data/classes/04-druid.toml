[[class]]
id = "druid"
name = "Druid"
description = "A keeper of the old ways who speaks for forest and beast: hardy and patient, and uneasy in towns."
stats = { toughness = "1d2", willpower = "2d2", presence = -1 }
hp = 4
mana = 9
casting = 100
affinity = { restoration = 2, transmutation = 2, evocation = 1 }
experience = 115
skills = { handle_animal = "2d6+10", survival = "2d6+10", concentration = "2d4+4", heal = "2d4+4", listen = "2d4+4" }
known_for = ["handle_animal", "survival"]
optional_skills = { spot = { chance = 20, dice = "2d4" }, swim = { chance = 20, dice = "2d4" }, woodcraft = { chance = 35, dice = "2d4" } }
rolls = 2
weapon_skills = { staves = 2, slings = 1, evocation = 1 }
styles = { staff_fighter = 1, sniper = 1 }
# Staff and sling, a stone pouch, and the forest's gifts: a healing root and windfall apples.
kit = [
    { wield = "quarterstaff" },
    { wield = "sling" },
    { wield = "sling_stone*20" },
    { wear = "travelling_cloak" },
    "angelica_root",
    "apple*4",
    "gold_coin*3",
]
# Bonus talents from Wayfarer and Vigour.
bonus_talents = { levels = [10, 20, 30, 45, 55], trees = ["wayfarer", "vigour"] }
# The level table (spec §8 "Class abilities").
# Call lightning and Flame and frost are spells paid in mana (the placeholders until the
# spell system); Woodland stride is the ranger's too.
abilities = [
    { level = 1, talent = "wild_empathy" },
    { level = 1, talent = "spark" },
    { level = 3, talent = "barkskin" },
    { level = 6, talent = "woodland_stride" },
    { level = 12, talent = "call_lightning" },
    { level = 18, talent = "natures_ward" },
    { level = 25, talent = "winters_friend" },
    { level = 50, talent = "flame_and_frost" },
]
