[[class]]
id = "priest"
name = "Priest"
description = "A servant of a god, schooled in rite and scripture: strong of will and voice, soft of hand."
stats = { strength = -1, dexterity = -1, intelligence = 1, willpower = "1d3+1", presence = "1d2" }
hp = 4
mana = 9
affinity = { restoration = 3, abjuration = 2, divination = 1, necromancy = -2 }
experience = 115
skills = { heal = "2d6+10", knowledge = "2d6+10", concentration = "2d4+4", decipher_script = "2d4+4", spellcraft = "2d6+10" }
known_for = ["heal", "knowledge"]
optional_skills = { listen = { chance = 15, dice = "2d4" } }
rolls = 2
weapon_skills = { maces = 2, shield_block = 1, restoration = 1 }
styles = { sword_and_board = 1, toucher = 1 }
# Mace and buckler, the holy symbol, and candles for the rites.
kit = [
    { wield = "mace" },
    { wield = "buckler" },
    { wear = "wool_cloak" },
    { wear = "amber_amulet" },
    "scroll_of_light",
    "candle*3",
    "bread",
    "gold_coin*10",
]
# Bonus talents from Vigour and Grit.
bonus_talents = { levels = [10, 20, 30, 45, 55], trees = ["vigour", "grit"] }
# The level table (spec §8 "Class abilities"; docs/design/priest.md). Mend, Blessing, and Cure
# wounds are spells, paid in mana; the rest is the one prayer (`use:orison`, docs/dev/prayer.md)
# deepening: its tiers (Orison, Prayer, Litany, Benediction, Miracle) and the uses between them.
# Consecrate is shared with the paladin; Communion with the dark is its dark twin, a passive
# that works only for a priest the dark answers (`alignment`, docs/dev/alignment.md).
abilities = [
    { level = 1, talent = "mend" },
    { level = 1, talent = "orison" },
    { level = 3, talent = "blessing" },
    { level = 3, talent = "cure_wounds" },
    { level = 6, talent = "daily_bread" },
    { level = 9, talent = "consecrate" },
    { level = 9, talent = "communion" },
    { level = 9, talent = "renewal" },
    { level = 12, talent = "silence" },
    { level = 12, talent = "prayer_of_cleansing" },
    { level = 18, talent = "rebuke" },
    { level = 18, talent = "prayer_of_release" },
    { level = 24, talent = "benison" },
    { level = 25, talent = "litany_of_restoring" },
    { level = 32, talent = "litany_of_the_mind" },
    { level = 40, talent = "benediction" },
    { level = 50, talent = "sanctuary" },
    { level = 60, talent = "miracle" },
]
