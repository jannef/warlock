says = ["dissolves", "dissolve"]

[[ruin]]
type = "acid"
material = "paper"
percent = 40
says = ["dissolves", "dissolve"]

[[ruin]]
type = "acid"
class = "food"
percent = 40
says = ["dissolves", "dissolve"]

[[ruin]]
type = "acid"
group = "cloth"
percent = 35
says = ["dissolves", "dissolve"]

[[ruin]]
type = "acid"
group = "hide"
percent = 25
says = ["dissolves", "dissolve"]

[[ruin]]
type = "acid"
group = "wood"
percent = 20
says = ["dissolves", "dissolve"]

