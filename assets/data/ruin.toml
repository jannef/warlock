# Force smashes the fragile.
[[ruin]]
type = "force"
class = "potions"
percent = 30
says = ["shatters", "shatter"]

[[ruin]]
type = "force"
group = "glass"
percent = 30
says = ["shatters", "shatter"]

# Death rots food and corpses.
[[ruin]]
type = "necrotic"
class = "food"
percent = 30
says = ["rots away", "rot away"]
