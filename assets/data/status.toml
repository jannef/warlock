# Status effects and passive healing (spec §8 "Status effects", "Healing").
#
# [healing]
#   resting   how fast hit points come back while you rest (R), in percent of the normal pace
#             (one hit point per max(60 s, 360 s - 12 s x Toughness) of game time)
#   mana_resting  how fast mana comes back while you rest, in percent of the normal pace (one
#             point per max(60 s, 360 s - 12 s x Willpower) of game time; default 200)
#
# [[status]], in order of importance: the status bar shows the first first, and gives way from
# the last. A status has a severity in degrees (never shown to the player) and lives in game time:
#   id         stable id, used by `on_hit` (creatures.toml) and saves
#   name       how the status bar and the character screen show it
#   seen       how look mode names it on a creature you see ("A kobold (hostile, wounded,
#              bleeding)"); none: it does not show on others
#   max        the most degrees it reaches (1 to 100)
#   stacking   how a new dose adds to one the actor has: "add" (the degrees add up, to max; the
#              default), "highest" (the stronger of the two), "refresh" (the stronger of the two,
#              and its easing starts over)
#   tick       seconds between its ticks at one degree; at n degrees it ticks n times as often
#   damage     hit points each tick costs (default 0; needs a tick)
#   eases      seconds for it to ease by one degree; at none it is gone. None: until cured
#   regen      how fast hit points come back while it lasts, in percent of the normal pace
#              (default 100; 0 none). With several statuses the slowest counts
#   mana_regen how fast mana comes back while it lasts, the same way (default 100)
#   mana_damage  mana each tick drains (default 0; needs a tick): never below 0, never a death
#   penalty    what it does to stats from a severity on: { from = 4, strength = -1 }; every rule
#              reads the stat that much lower (combat, burden, hit points); several add up. A
#              positive number raises the stat instead (-10 to 10)
#   combat     what it adds to the fighting of whoever suffers it while it lasts, as a stance does
#              (stances.toml): { to_hit = 1, damage = 2, dodge = 1, parry = 1 }, each -20 to 20,
#              0 when left out; several add up (of Parry bonuses the highest counts)
#   cost       what every action costs while it lasts, in percent of its price (50 to 1000;
#              default 100): 150 is half again as slow. Several multiply. Below 100 it hastens,
#              which only a spell's buff on its caster may do (Haste)
#   blocks     the actions refused while it lasts, by their ids in actions.toml: ["read"]; an
#              ability that costs one cannot be used either; "cast" also refuses spending mana
#   flees      true: a creature suffering it runs from the one who gave it (else the nearest foe
#              it sees) while a step takes it farther away, and fights only when cornered
#   follows    a status that begins (at one degree) as this one ends, worn off or cured: a rage's
#              exhaustion. A status with no tick that eases away is a cooldown: while it lasts,
#              the ability that gave it cannot be used again
#   wound      the blows that cause it: { big_hit = 1, critical = 2 } degrees for a hit that takes
#              at least a third of the target's hit points, and for a confirmed critical (a
#              blow that is both: the more of the two); `from` lists the kinds of damage that
#              wound this way (damage_types.toml; bleeding from slashing and piercing), none
#              listed: any
#   damage_type the kind of damage the status is (poison): a target immune to it never suffers
#              it, and a resistance shrinks each dose it is given (spec §8 "Damage types")
#   cured_by   what cures it at once (a bandage, an antidote)
#   treat      how the Heal skill treats it (the Heal ability, spec §8 "Skills"): an Intelligence
#              check plus Heal against { difficulty = 6, per_degree = 2 } (difficulty 0 to 40,
#              plus 0 to 10 for each degree); `stops = true`: made, it ends, and a failed try may
#              be made again at once; else, made, it eases a degree, and it may be tried once
#              only, whatever comes of it, until it ends. `made` and `failed` are what you are
#              told. None: Heal cannot treat it
#   start, end what the player is told as it begins and ends ("end" lets a rest go on)
#   dies       what a creature you see does when it kills it ("The giant rat bleeds to death.")
#   death      the death screen's line when it kills you
#   sleeps     true: a creature suffering it sleeps: it takes no turn and has seen no one (a
#              sneak attack lands); noise at its hearing threshold times its den's `wake`, a
#              blow, or a cry wakes it, which ends the status (spec §7 "Special rooms")
#   per_action true: it eases a degree with each action its sufferer takes, instead of with
#              time (no `eases`): at one degree it lasts until the next action, which is priced
#              with it (its `cost`). One given during an action is not eased by that action
#   hold      makes it a hold: whoever caused it holds the sufferer, and it ends when the holder
#              dies, leaves the sufferer's side, or is held or slowed (a cost above 100) itself.
#              { check = "strength", difficulty = 13, turns = "3d4" }: the held player's step is
#              a check of `check` (default strength) against the holder's grip (its on_hit
#              entry's `difficulty`, else this one, 1 to 40): made, they break free and step;
#              failed, the turn is spent. A dose's degrees are drawn from `turns` (1 to max), and
#              a hold needs `eases` (a degree a turn: 6), stacking "highest", and blocks "step"
#   light      a light of lights.toml its sufferer sheds while it lasts (Lit; spec §5); the
#              brightest of several
# Creatures' attacks may cause statuses too: `on_hit` in creatures.toml. Diseases (diseases.toml)
# show as one status here, named by their `status`.

[healing]
resting = 200
mana_resting = 200

# Wounds bleed: a hit point every 40 seconds for each degree, easing a degree a minute.
[[status]]
id = "bleeding"
name = "Bleeding"
seen = "bleeding"
max = 5
stacking = "add"
tick = 40
damage = 1
eases = 60
regen = 0
wound = { big_hit = 1, critical = 2, from = ["slashing", "piercing"] }
cured_by = ["bandage"]
# Bound with the Heal skill: easy for a scratch, hard for a deep wound; try again as often as you
# like, a quarter of a minute each.
treat = { difficulty = 6, per_degree = 2, stops = true, made = "You bind the wound.", failed = "The blood still runs." }
start = "You are bleeding."
end = "The bleeding stops."
dies = "bleeds to death"
death = "Bled to death"

# Poison works slowly: a hit point every two minutes for each degree, easing a degree every two
# minutes, so a stronger dose lasts longer; strong poison weakens. A sick head gathers mana at
# half the pace.
[[status]]
id = "poisoned"
name = "Poisoned"
max = 10
stacking = "add"
tick = 120
damage = 1
damage_type = "poison"
eases = 120
regen = 50
mana_regen = 50
penalty = { from = 4, strength = -1, dexterity = -1 }
# Cured at once by an antidote (the potion, spec §8 "Potions").
cured_by = ["antidote"]
# Eased a degree with the Heal skill, once; a failed try cannot be made again for this dose.
treat = { difficulty = 8, per_degree = 1, made = "You draw out some of the poison.", failed = "You can do no more for the poison." }
start = "You feel sick."
end = "The poison wears off."
dies = "succumbs to poison"
death = "Died of poison"

# What every disease shows as (diseases.toml): one status for them all, while at least one of
# them shows (its incubation over). Diseases give it and take it away, so it has no timers or
# cures of its own; the diseases speak for themselves (onset, symptoms, recovery), so it says
# nothing as it begins and ends. Hit points and mana come back at half the pace; a disease may
# slow them more (its own regen and mana_regen).
[[status]]
id = "diseased"
name = "Diseased"
max = 1
regen = 50
mana_regen = 50
dies = "succumbs to disease"
death = "Died of disease"

# Places' statuses (special rooms, room_effects.toml `status`): held while one stays inside, then
# eased away. Ebbing, a draining room's: a point of mana drained every 20 seconds and none coming
# back, half a minute after leaving.
[[status]]
id = "ebbing"
name = "Ebbing"
seen = "ebbing"
max = 1
stacking = "refresh"
tick = 20
mana_damage = 1
mana_regen = 0
eases = 30
start = "Your power ebbs away."
end = "Your power stops ebbing."

# A teeming den's sleepers (room_effects.toml `swarm`): asleep, a creature takes no turn and has
# seen no one, until a noise loud enough, a blow, or a waking neighbour's cry wakes it. Never by
# time: it lasts until something wakes it.
[[status]]
id = "asleep"
name = "Asleep"
seen = "asleep"
max = 1
sleeps = true

# Silenced, a silent vault's: no spell is cast, no scroll read, and no voice thrown while it
# lasts, creatures' spells too; ten seconds after leaving.
[[status]]
id = "silenced"
name = "Silenced"
seen = "silenced"
max = 1
stacking = "refresh"
eases = 10
blocks = ["cast", "read", "throw_voice"]
start = "The silence closes around you."
end = "Sound returns."

# Unwelcome, a shrine's (room_effects.toml `shrine`) on everyone of the other side inside it:
# wounds heal at half the pace and blows go a little astray; half a minute after leaving.
[[status]]
id = "unwelcome"
name = "Unwelcome"
seen = "unwelcome"
max = 1
stacking = "refresh"
eases = 30
regen = 50
combat = { to_hit = -1 }
start = "You feel unwelcome."
end = "You no longer feel unwelcome."

# Buffs and cooldowns (a class's abilities give them; the dev action `afflict:raging` too).
# A barbarian's rage: stronger and tougher, too wild to read or to cast; it lasts while their
# Rage lasts (resources.toml: the status of the rage resource, so it never eases by itself);
# then exhausted for ten minutes, and no rage until that passes.
[[status]]
id = "raging"
name = "Raging"
seen = "raging"
max = 1
stacking = "refresh"
penalty = { from = 1, strength = 2, toughness = 2, intelligence = -2 }
blocks = ["read", "study", "cast"]
follows = "exhausted"
start = "You fly into a rage!"
end = "Your rage subsides."

[[status]]
id = "exhausted"
name = "Exhausted"
max = 1
stacking = "refresh"
eases = 600
penalty = { from = 1, strength = -1 }
start = "You are exhausted."
end = "You feel rested again."

# Second wind's cooldown (the Second wind talent): a quarter of an hour before the next.
[[status]]
id = "winded"
name = "Winded"
max = 1
stacking = "refresh"
eases = 900
start = "You are winded."
end = "You have your breath back."

# The cooldown of a class's blow (Smite: one degree; Quivering palm: two), five minutes a degree.
[[status]]
id = "spent"
name = "Spent"
max = 2
stacking = "refresh"
eases = 300
start = "You are spent."
end = "You feel your strength gather again."

# A summoner's cooldown (spec §8 "Summoning", the creatures' `[creature.summon]`): a degree for
# every six seconds of its `cooldown`; while it lasts the creature summons nothing. Creatures
# only: no one sees it on them.
[[status]]
id = "summoning"
name = "Summoning spent"
max = 100
stacking = "refresh"
eases = 6

# Blaze's cooldown (the Fire-born's gift, spec §8 "Birth sign"): twelve hours before the fire in
# them kindles again. Nothing else; time is the penalty.
[[status]]
id = "burnt_out"
name = "Burnt out"
max = 1
stacking = "refresh"
eases = 43200
start = "The fire in you burns low."
end = "The fire in you kindles again."

# Lay on hands' cooldown (two degrees; one with Avatar), five minutes a degree: the paladin's
# gift waits for the mana it will cost.
[[status]]
id = "drained"
name = "Drained"
max = 2
stacking = "refresh"
eases = 300
start = "You feel drained."
end = "Your strength of spirit returns."

# Horn's grace's cooldown (a Unicorn's birth sign gift): a day before the horn mends again, three
# degrees of eight hours (Horn of plenty leaves one).
[[status]]
id = "graceless"
name = "Graceless"
max = 3
stacking = "refresh"
eases = 28800
start = "Your horn's grace is spent."
end = "Your horn's grace returns."

# The Transfixing stare's cooldown (a Basilisk's birth sign gift): two hours, two degrees of an
# hour (Petrifying gaze leaves one).
[[status]]
id = "spent_eyed"
name = "Spent-eyed"
max = 2
stacking = "refresh"
eases = 3600
start = "Your eyes ache from the stare."
end = "Your gaze is keen again."

# Rising from the ashes (a birth sign's gift, spec §8 "Birth sign"): a day of weakness after, every
# score 2 lower and hit points back half as fast.
[[status]]
id = "ashen"
name = "Ashen"
seen = "ashen"
max = 1
stacking = "refresh"
eases = 86400
regen = 50
penalty = { from = 1, strength = -2, dexterity = -2, toughness = -2, intelligence = -2, willpower = -2, presence = -2 }
start = "You are ashen and weak."
end = "The last of the ash falls from you."

# A reprieve's price (the priest's Miracle, the witch's Hag's bargain, spec §8 "Class abilities"):
# a day at the edge of death, hit points and mana back half as fast.
[[status]]
id = "worn_thin"
name = "Worn thin"
seen = "worn"
max = 1
stacking = "refresh"
eases = 86400
regen = 50
mana_regen = 50
start = "You feel worn thin."
end = "You feel whole again."

# Holy radiance: a faint light about the paladin (the light is the ability's), until they put it
# out again from the abilities menu.
[[status]]
id = "radiant"
name = "Radiant"
seen = "shining"
max = 1
stacking = "refresh"
start = "A soft light shines about you."
end = "Your light fades."

# Light's (the spell, and the scroll of light that casts it): a pale light about the caster,
# half an hour a degree; the caster's Presence lengthens it (spells.toml).
[[status]]
id = "lit"
name = "Lit"
seen = "glowing"
max = 3
stacking = "refresh"
eases = 1800
light = "spell_light"
start = "A pale light gathers about you."
end = "The light about you fades."

# Blessing's (the priest's spell): ten minutes of a god's favour, blows truer and the will firmer.
# Up to three degrees: the caster's Presence lengthens it (a degree is ten minutes; spells.toml).
[[status]]
id = "blessed"
name = "Blessed"
seen = "blessed"
max = 3
stacking = "refresh"
eases = 600
combat = { to_hit = 1 }
penalty = { from = 1, willpower = 1 }
start = "You feel blessed."
end = "Your blessing fades."

# Inspire (the bard's song, spec §8 "Class abilities"): five minutes of a lifted heart, a little
# surer to hit and quicker to dodge. Its price is mana, not a cooldown.
[[status]]
id = "inspired"
name = "Inspired"
seen = "inspired"
max = 1
stacking = "refresh"
eases = 300
combat = { to_hit = 1, dodge = 1 }
start = "Your song lifts your heart."
end = "The song fades from your heart."

# Inspire as a Virtuoso sings it: ten minutes, and more of it.
[[status]]
id = "inspired_greatly"
name = "Inspired"
seen = "inspired"
max = 1
stacking = "refresh"
eases = 600
combat = { to_hit = 2, dodge = 2 }
start = "Your song soars, and your heart with it."
end = "The song fades from your heart."

# A staggering blow's (the Staggering blow talent, the weapon abilities' Crushing blow, Stunning
# bash, Stunning fist, Staggering block; a fall through a collapsed floor): the next action costs
# half again as much, and that action ends it. A new dose only keeps it (refresh): one slowed
# action however many blows staggered.
[[status]]
id = "staggered"
name = "Staggered"
seen = "staggered"
max = 1
stacking = "refresh"
per_action = true
cost = 150
start = "You stagger."
end = "You find your feet again."

# The Transfixing stare's (a Basilisk's birth sign gift): a creature held by the gaze, its next
# actions twice as slow; a degree for each, eased away a turn's time (at the slowed pace) apiece.
[[status]]
id = "transfixed"
name = "Transfixed"
seen = "transfixed"
max = 4
stacking = "refresh"
eases = 12
cost = 200
start = "You are transfixed."
end = "You shake off the stare."

# The witch's hexes (spec §8 "Class abilities"), on creatures she sees: the Evil eye's minute of
# fumbling blows, the Hex of weakness's two minutes of weak and clumsy limbs, and the Curse of
# sloth's minute in which everything takes half again as long. Up to three degrees: the witch's
# Presence lengthens them (a degree is one more span of `eases`; spells.toml).
[[status]]
id = "ill_wished"
name = "Hexed"
seen = "hexed"
max = 3
stacking = "refresh"
eases = 60
combat = { to_hit = -2 }
start = "You feel hexed."
end = "The hex lifts."

[[status]]
id = "weakened"
name = "Weakened"
seen = "weakened"
max = 3
stacking = "refresh"
eases = 120
penalty = { from = 1, strength = -2, dexterity = -2 }
start = "You feel weak."
end = "Your strength returns."

[[status]]
id = "sluggish"
name = "Sluggish"
seen = "sluggish"
max = 3
stacking = "refresh"
eases = 60
cost = 150
start = "You feel sluggish."
end = "You feel quick again."

# The spells' statuses (spec §8 "Spells"): Sleep's drowsiness, in which everything takes three
# times as long; Web's strands, which hold whoever is caught where they stand (no step) a turn a
# degree; Haste's quickness, the caster's own, everything a quarter quicker; and Barkskin's bark,
# the druid's boon, harder to land a blow on. Up to three degrees (Presence lengthens them).
[[status]]
id = "drowsy"
name = "Drowsy"
seen = "drowsy"
max = 3
stacking = "refresh"
eases = 12
cost = 300
start = "You feel terribly drowsy."
end = "You shake off the drowsiness."

[[status]]
id = "webbed"
name = "Webbed"
seen = "caught in a web"
max = 6
stacking = "refresh"
eases = 6
blocks = ["step"]
start = "Sticky strands hold you fast."
end = "You tear free of the web."

[[status]]
id = "hasted"
name = "Hasted"
max = 3
stacking = "refresh"
eases = 60
cost = 75
start = "The world slows around you."
end = "The world quickens again."

[[status]]
id = "barkskin"
name = "Barkskin"
max = 3
stacking = "refresh"
eases = 60
combat = { dodge = 2 }
start = "Your skin hardens like bark."
end = "Your skin softens again."

# Hound's bay's (a Barghest's birth sign pick): a creature that heard the howl and is of a lower
# level runs from the howler, a degree for each turn, a turn's time apiece.
[[status]]
id = "frightened"
name = "Frightened"
seen = "frightened"
max = 3
stacking = "refresh"
eases = 6
flees = true
start = "You are frightened."
end = "You master your fear."

# Hound's bay's cooldown: an hour before the howl comes again.
[[status]]
id = "hoarse"
name = "Hoarse"
max = 1
stacking = "refresh"
eases = 3600
start = "Your throat is raw from the howl."
end = "Your voice is your own again."

# Held: a hold (spec §8 "Status effects"). A creature's bite may hold (on_hit, a creature's
# `{ status = "held", chance = 10, difficulty = 15 }`), and a Drowning grip (a lucky day's gift,
# spec §8 "Birth sign") holds a creature the Deep One hits in melee until they miss it, strike
# another, or move. The held cannot step (a creature fights back instead; the player struggles,
# a Strength check against the grip); it ends as the holder dies, leaves, or is held or slowed,
# and after 3d4 turns at most (a degree a turn; a new hit draws again, keeping the longer).
[[status]]
id = "held"
name = "Held"
seen = "held"
max = 12
stacking = "highest"
eases = 6
blocks = ["step"]
hold = { check = "strength", difficulty = 13, turns = "3d4" }
start = "You are held fast."
end = "You are free to move."

# The weapon abilities' (the combat progression design §6): Pinned, a missile through the foot
# (Pinning shot) or the legs taken by a staff (Trip): no step for an action a degree, a new pin
# keeping the longer, never adding (at most 3 from any one); no struggle, as it is no grip.
# Light-footed, the skirmisher's step away after a strike (Hit and run): the next action costs
# half, and it ends as that action is taken.
[[status]]
id = "pinned"
name = "Pinned"
seen = "pinned"
max = 3
stacking = "highest"
per_action = true
blocks = ["step"]
start = "You are pinned where you stand."
end = "You can move again."

[[status]]
id = "light_footed"
name = "Light-footed"
max = 1
stacking = "refresh"
cost = 50
per_action = true
