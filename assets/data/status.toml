# Status effects and passive healing (spec §8 "Status effects", "Healing").
#
# [healing]
#   resting   how fast hit points come back while you rest (R), in percent of the normal pace
#             (one hit point per max(60 s, 360 s - 12 s x Toughness) of game time)
#   mana_resting  how fast mana comes back while you rest, in percent of the normal pace (one
#             point per max(60 s, 360 s - 12 s x Willpower) of game time; default 200)
#
# [[status]], in order of importance: the status bar shows the first first, and gives way from
# the last. A status has a severity in degrees (never shown to the player) and lives in game time:
#   id         stable id, used by `on_hit` (creatures.toml) and saves
#   name       how the status bar and the character screen show it
#   seen       how look mode names it on a creature you see ("A kobold (hostile, wounded,
#              bleeding)"); none: it does not show on others
#   max        the most degrees it reaches (1 to 100)
#   stacking   how a new dose adds to one the actor has: "add" (the degrees add up, to max; the
#              default), "highest" (the stronger of the two), "refresh" (the stronger of the two,
#              and its easing starts over)
#   tick       seconds between its ticks at one degree; at n degrees it ticks n times as often
#   damage     hit points each tick costs (default 0; needs a tick)
#   eases      seconds for it to ease by one degree; at none it is gone. None: until cured
#   regen      how fast hit points come back while it lasts, in percent of the normal pace
#              (default 100; 0 none). With several statuses the slowest counts
#   mana_regen how fast mana comes back while it lasts, the same way (default 100)
#   mana_damage  mana each tick drains (default 0; needs a tick): never below 0, never a death
#   penalty    what it does to stats from a severity on: { from = 4, strength = -1 }; every rule
#              reads the stat that much lower (combat, burden, hit points); several add up. A
#              positive number raises the stat instead (-10 to 10)
#   combat     what it adds to the fighting of whoever suffers it while it lasts, as a stance does
#              (stances.toml): { to_hit = 1, damage = 2, dodge = 1, parry = 1 }, each -20 to 20,
#              0 when left out; several add up (of Parry bonuses the highest counts)
#   cost       what every action costs while it lasts, in percent of its price (100 to 1000;
#              default 100): 150 is half again as slow. Several multiply
#   blocks     the actions refused while it lasts, by their ids in actions.toml: ["read"]; an
#              ability that costs one cannot be used either; "cast" also refuses spending mana
#   flees      true: a creature suffering it runs from the one who gave it (else the nearest foe
#              it sees) while a step takes it farther away, and fights only when cornered
#   follows    a status that begins (at one degree) as this one ends, worn off or cured: a rage's
#              exhaustion. A status with no tick that eases away is a cooldown: while it lasts,
#              the ability that gave it cannot be used again
#   wound      the blows that cause it: { big_hit = 1, critical = 2 } degrees for a hit that takes
#              at least a third of the target's hit points, and for a confirmed critical (a
#              blow that is both: the more of the two); `from` lists the kinds of damage that
#              wound this way (damage_types.toml; bleeding from slashing and piercing), none
#              listed: any
#   damage_type the kind of damage the status is (poison): a target immune to it never suffers
#              it, and a resistance shrinks each dose it is given (spec §8 "Damage types")
#   cured_by   what cures it at once (a bandage: the Heal skill, later)
#   start, end what the player is told as it begins and ends ("end" lets a rest go on)
#   dies       what a creature you see does when it kills it ("The giant rat bleeds to death.")
#   death      the death screen's line when it kills you
# Creatures' attacks may cause statuses too: `on_hit` in creatures.toml. Diseases (diseases.toml)
# show as one status here, named by their `status`.

[healing]
resting = 200
mana_resting = 200

# Wounds bleed: a hit point every 40 seconds for each degree, easing a degree a minute.
[[status]]
id = "bleeding"
name = "Bleeding"
seen = "bleeding"
max = 5
stacking = "add"
tick = 40
damage = 1
eases = 60
regen = 0
wound = { big_hit = 1, critical = 2, from = ["slashing", "piercing"] }
cured_by = ["bandage"]
start = "You are bleeding."
end = "The bleeding stops."
dies = "bleeds to death"
death = "Bled to death"

# Poison works slowly: a hit point every two minutes for each degree, easing a degree every two
# minutes, so a stronger dose lasts longer; strong poison weakens. A sick head gathers mana at
# half the pace.
[[status]]
id = "poisoned"
name = "Poisoned"
max = 10
stacking = "add"
tick = 120
damage = 1
damage_type = "poison"
eases = 120
regen = 50
mana_regen = 50
penalty = { from = 4, strength = -1, dexterity = -1 }
start = "You feel sick."
end = "The poison wears off."
dies = "succumbs to poison"
death = "Died of poison"

# What every disease shows as (diseases.toml): one status for them all, while at least one of
# them shows (its incubation over). Diseases give it and take it away, so it has no timers or
# cures of its own; the diseases speak for themselves (onset, symptoms, recovery), so it says
# nothing as it begins and ends. Hit points and mana come back at half the pace; a disease may
# slow them more (its own regen and mana_regen).
[[status]]
id = "diseased"
name = "Diseased"
max = 1
regen = 50
mana_regen = 50
dies = "succumbs to disease"
death = "Died of disease"

# Buffs and cooldowns (a class's abilities give them; the dev action `afflict:raging` too).
# A barbarian's rage: stronger and tougher, too wild to read or to cast; it lasts while their
# Rage lasts (resources.toml: the status of the rage resource, so it never eases by itself);
# then exhausted for ten minutes, and no rage until that passes.
[[status]]
id = "raging"
name = "Raging"
seen = "raging"
max = 1
stacking = "refresh"
penalty = { from = 1, strength = 2, toughness = 2, intelligence = -2 }
blocks = ["read", "cast"]
follows = "exhausted"
start = "You fly into a rage!"
end = "Your rage subsides."

[[status]]
id = "exhausted"
name = "Exhausted"
max = 1
stacking = "refresh"
eases = 600
penalty = { from = 1, strength = -1 }
start = "You are exhausted."
end = "You feel rested again."

# Second wind's cooldown (the Second wind talent): a quarter of an hour before the next.
[[status]]
id = "winded"
name = "Winded"
max = 1
stacking = "refresh"
eases = 900
start = "You are winded."
end = "You have your breath back."

# The cooldown of a class's blow (Smite: one degree; Quivering palm: two), five minutes a degree.
[[status]]
id = "spent"
name = "Spent"
max = 2
stacking = "refresh"
eases = 300
start = "You are spent."
end = "You feel your strength gather again."

# Blaze's cooldown (the Fire-born's gift, spec §8 "Birth sign"): twelve hours before the fire in
# them kindles again. Nothing else; time is the penalty.
[[status]]
id = "burnt_out"
name = "Burnt out"
max = 1
stacking = "refresh"
eases = 43200
start = "The fire in you burns low."
end = "The fire in you kindles again."

# Lay on hands' cooldown (two degrees; one with Avatar), five minutes a degree: the paladin's
# gift waits for the mana it will cost.
[[status]]
id = "drained"
name = "Drained"
max = 2
stacking = "refresh"
eases = 300
start = "You feel drained."
end = "Your strength of spirit returns."

# Horn's grace's cooldown (a Unicorn's birth sign gift): a day before the horn mends again, three
# degrees of eight hours (Horn of plenty leaves one).
[[status]]
id = "graceless"
name = "Graceless"
max = 3
stacking = "refresh"
eases = 28800
start = "Your horn's grace is spent."
end = "Your horn's grace returns."

# The Transfixing stare's cooldown (a Basilisk's birth sign gift): two hours, two degrees of an
# hour (Petrifying gaze leaves one).
[[status]]
id = "spent_eyed"
name = "Spent-eyed"
max = 2
stacking = "refresh"
eases = 3600
start = "Your eyes ache from the stare."
end = "Your gaze is keen again."

# Rising from the ashes (a birth sign's gift, spec §8 "Birth sign"): a day of weakness after, every
# score 2 lower and hit points back half as fast.
[[status]]
id = "ashen"
name = "Ashen"
seen = "ashen"
max = 1
stacking = "refresh"
eases = 86400
regen = 50
penalty = { from = 1, strength = -2, dexterity = -2, toughness = -2, intelligence = -2, willpower = -2, presence = -2 }
start = "You are ashen and weak."
end = "The last of the ash falls from you."

# Holy radiance: a faint light about the paladin (the light is the ability's), until they put it
# out again from the abilities menu.
[[status]]
id = "radiant"
name = "Radiant"
seen = "shining"
max = 1
stacking = "refresh"
start = "A soft light shines about you."
end = "Your light fades."

# Inspire (the bard's song, spec §8 "Class abilities"): five minutes of a lifted heart, a little
# surer to hit and quicker to dodge. Its price is mana, not a cooldown.
[[status]]
id = "inspired"
name = "Inspired"
seen = "inspired"
max = 1
stacking = "refresh"
eases = 300
combat = { to_hit = 1, dodge = 1 }
start = "Your song lifts your heart."
end = "The song fades from your heart."

# Inspire as a Virtuoso sings it: ten minutes, and more of it.
[[status]]
id = "inspired_greatly"
name = "Inspired"
seen = "inspired"
max = 1
stacking = "refresh"
eases = 600
combat = { to_hit = 2, dodge = 2 }
start = "Your song soars, and your heart with it."
end = "The song fades from your heart."

# A staggering blow's (the Staggering blow talent): the next action, taken within a turn's time,
# costs half again as much.
[[status]]
id = "staggered"
name = "Staggered"
seen = "staggered"
max = 1
stacking = "refresh"
eases = 6
cost = 150
start = "You stagger."
end = "You find your feet again."

# The Transfixing stare's (a Basilisk's birth sign gift): a creature held by the gaze, its next
# actions twice as slow; a degree for each, eased away a turn's time (at the slowed pace) apiece.
[[status]]
id = "transfixed"
name = "Transfixed"
seen = "transfixed"
max = 4
stacking = "refresh"
eases = 12
cost = 200
start = "You are transfixed."
end = "You shake off the stare."

# Hound's bay's (a Barghest's birth sign pick): a creature that heard the howl and is of a lower
# level runs from the howler, a degree for each turn, a turn's time apiece.
[[status]]
id = "frightened"
name = "Frightened"
seen = "frightened"
max = 3
stacking = "refresh"
eases = 6
flees = true
start = "You are frightened."
end = "You master your fear."

# Hound's bay's cooldown: an hour before the howl comes again.
[[status]]
id = "hoarse"
name = "Hoarse"
max = 1
stacking = "refresh"
eases = 3600
start = "Your throat is raw from the howl."
end = "Your voice is your own again."

# Held in a Drowning grip (a lucky day's gift, spec §8 "Birth sign"): a creature the Deep One hits
# in melee cannot step until they miss it, strike another, or move; it fights back instead. No
# timer: the holder lets go.
[[status]]
id = "held"
name = "Held"
seen = "held"
max = 1
stacking = "refresh"
blocks = ["step"]
start = "You are held fast."
end = "You are free to move."
