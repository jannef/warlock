# Names for new characters (spec §8 "Character creation"): the Name step's Random draws one for
# the chosen race and gender, from the run seed, and so does a run told no name for a character
# that is not its scenario's own (scenarios name their own character).
#
# One table per race id (races.toml), each with a `male` and a `female` list; a character of the
# gender "other" draws from both. A name is 1 to 20 characters, without spaces around it. Names
# are flavour: changing them never changes a run's rolls (they draw from their own stream,
# `character/name/<race>,<gender>/<draw>`), only which name Random gives.

