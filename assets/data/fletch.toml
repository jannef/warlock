# Fletching (spec §8 "Fletching"; docs/dev/crafting.md "Arrows and bolts"): what the arrows and
# bolts recipes (recipes/woodcraft/arrows.toml, bolts.toml, `count = "fletch"`) read beyond the
# recipe itself. Their time, difficulty, and stock are the recipes'; the margin's bands are
# data/recipes.toml's.
#
# A batch makes `count` plus one for each full `value_per_count` of Woodcraft, scaled by the
# check's margin (data/recipes.toml's `half_within` and `one_within`). The ranger's Fletcher
# (talents/fletcher.toml) makes it more surely, in half the time, and twice as many.
#
# Fields:
#   count            dice: how many before Woodcraft (at least 1 is rolled)
#   value_per_count  Woodcraft's value that gives one more (1 or more)
#   knives           the weapon skill whose weapons are knives (a stack of it carried, in the
#                    pack, worn or wielded or neither, is a knife: a recipe's `knife`)
#   [[makes]]        one row per thing a launcher's `launches` may be: a recipe with `launcher`
#                    wants one ready that shoots its result (the result's `ammo`)
#     launches       what the launcher shoots (objects' `launches`, `ammo`), once
#     launcher       the launcher in a word, as the recipe's row says it ("a bow ready")

count = "1d4"
value_per_count = 25
knives = "daggers"

[[makes]]
launches = "arrow"
launcher = "bow"

[[makes]]
launches = "bolt"
launcher = "crossbow"
