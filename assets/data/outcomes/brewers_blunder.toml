# A brewer's blunder's drink (spec §8 "Potions", the potions wave 2 design §4.3;
# content/outcome.rs has the fields): as likely a stat raised greatly for a while (a greater
# boost) as a point of one drained for good (a potion or scroll of restoration, or a temple's
# mending, gives it back). A potion has no side, so nothing leans, and nothing is spent
# (`exhaust = 0`). Messages stay vague: never a number.
kinds = { boon = 45, nothing = 10, bane = 45 }
exhaust = 0

# A greater boost, one outcome a stat (the greater potions of might, grace, ...'s degrees).
[[outcome]]
kind = "boon"
tier = "moderate"
id = "greatly_fortified"
weight = 1
effect = { status = { id = "fortified", degrees = 2 } }
message = "Strength floods your limbs."

[[outcome]]
kind = "boon"
tier = "moderate"
