# A draught of chance's drink (spec §8 "Potions", the potions wave 2 design §4.3;
# content/outcome.rs has the fields): one draw of the kinds and one by weight among that kind's
# outcomes. A potion has no side, so nothing leans, and nothing is spent (`exhaust = 0`). Mostly
# a small good, sometimes nothing, sometimes a sickness. Messages stay vague: never a number.
kinds = { boon = 50, nothing = 20, bane = 30 }
exhaust = 0

[[outcome]]
kind = "boon"
tier = "minor"
id = "mended"
weight = 30
effect = { heal = "4d8" }
message = "Warmth spreads through you, and your wounds close."

[[outcome]]
kind = "boon"
tier = "minor"
id = "clear_headed"
weight = 15
effect = { mana = "half" }
message = "Your head clears, and power wells up in you."

