# A forgotten altar's prayer (spec §7 "Special rooms"; content/outcome.rs has the fields): ADOM's
# pool with another flavour. A prayer takes a minute; at its end one draw of the kinds (leaned by
# the altar's hidden side against the player's band: agreement moves `lean` points from bane to
# boon, opposition from boon to bane), then one by weight among that kind's outcomes. After a
# completed prayer the altar is spent with `exhaust` percent, unless it blew apart. Weights are
# within each kind (each kind's sum to 100). The great tier (#407) is rare: 6 in each of the
# boon and the bane. Messages stay vague: never a number, never the side.
seconds = 60
kinds = { boon = 35, nothing = 30, bane = 35 }
lean = 15
exhaust = 50
spent = "spent_altar"

# Nothing happens: flavour only, never a hint of anything true.

[[outcome]]
kind = "nothing"
tier = "minor"
id = "silence"
weight = 25
message = "Silence answers you."

[[outcome]]
kind = "nothing"
tier = "minor"
id = "echo"
weight = 15
message = "Your words echo, and fade."

[[outcome]]
kind = "nothing"
tier = "minor"
id = "dust"
weight = 15
message = "Dust sifts down from the ceiling."

[[outcome]]
kind = "nothing"
tier = "minor"
id = "flicker"
weight = 15
message = "The altar's glow flickers, then steadies."

[[outcome]]
kind = "nothing"
tier = "minor"
id = "breath"
weight = 10
message = "A cold breath brushes your neck, and is gone."

[[outcome]]
kind = "nothing"
tier = "minor"
id = "omen"
weight = 20
messages = [
    "The smoke of your breath bends toward the stairs.",
    "For a moment you smell rain.",
    "Somewhere far below, a bell rings once.",
    "The carvings seem to shift under your eyes, and are still.",
]

