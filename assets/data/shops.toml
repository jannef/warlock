# Shops (spec §7 "Shops"; #145), ADOM-like: a room with goods on its floor and a named shopkeeper
# by its door. Everything lying in a shop is for sale while its keeper lives and is not angry:
# look mode and stepping onto it show the price, picking it up adds the price to what you owe,
# and you pay with `p` (or at the door: "Pay 40 gold and leave"). Dropping something the shop buys
# gets an offer; dropping something you have not paid for puts it back. The keeper turns you back
# at the door while you owe anything; leaving with unpaid goods any other way (through a wall dug
# open) is theft: the keeper turns hostile and comes after you, and so does one you attack. A dead
# keeper's goods are free to take.
#
# Prices: an object's `value` (objects.toml) times the shop's `markup`, and for what it buys its
# `pays`, both in percent; your Presence moves both in your favour or against you (`presence`
# percent for each point of its hidden modifier) and so does the Negotiation skill, if you are
# trained in it (its `bargain` benefit, skills.toml), together at most half. A shop never pays
# more for something than it asks for it. Only gold prices are ever shown.
#
# Shops sell and buy by item class (item_classes.toml: "melee_weapons", "body_armour", "food",
# ...; every object names its class). Nothing worth nothing (value 0) and never the currency is
# traded.
#
# Top-level fields:
#   currency  the object shops are paid in (stackable): gold coins
#   outraged  the faction a robbed or attacked shopkeeper joins (factions.toml; one hostile to the
#             player)
#   presence  percent better (or worse) prices for each point of the Presence modifier
#   chance    percent of generated rooms-and-corridors levels with a shop (at most one a level):
#             a room with a single door, not the arrival room, no stairs, no special room, and no
#             patrol through it. Caverns have none. Its kind is picked uniformly
#   names     shopkeepers' names for generated shops, picked uniformly
#   bundle    [least, most]: how many of a stackable object lie in one stack of generated stock
#             (least at least 1)
#   [keeper]  every shopkeeper: `creature` (creatures.toml), what it carries (`carry`, as in level
#             legends: `"gold_coin*250"` is its purse, which pays for what it buys), and what of
#             that it wields and wears (`wield`, `wear`)
#
# Each [[shop]]:
#   id        the kind's id (level files name it: `[[shop]] kind = "general_store"`)
#   name      what it is, without an article ("general store"), for the wiki
#   title     its sign, with the keeper's name for `{keeper}` ("{keeper}'s General Store")
#   stock     the classes generated shops stock (each item drawn from those objects by its loot
#             `frequency`, objects.toml, 100 for what is never loot: a spell scroll of a low spell
#             level lies in a general store more often than one of a high level)
#   always    objects a generated shop always lays out first, a stack of each (as many as its
#             count of stacks allows): the general store always has scrolls of identify (spec §8
#             "Scrolls")
#   never     objects a generated shop never lays out, though it stocks their class: elixirs
#             the costly flasks, and the gambles (draught of chance, troll's blood, brewer's
#             blunder; spec §8 "Potions") are never in a general store or a provisioner's, only
#             in an alchemist's
#   buys      the classes it buys from you
#   items     [least, most]: how many stacks of goods a generated shop lays out
#   markup    its prices, in percent of the value
#   pays      what it pays for what it buys, in percent of the value
#   generated whether generated levels draw the kind (default true; a branch's own `kinds`,
#             dungeons.toml, may still name it): false for a town's own kinds, laid out by its
#             level file, Cēaptūn's smithy and town store

currency = "gold_coin"
outraged = "outraged"
presence = 3
# Rooms levels are five of the Depths' eight, and not every one has a room that suits a shop (a
# single door, not locked, nothing lying in it), so about one level in six has one.
chance = 70
names = [
    "Grimbold", "Hilda", "Osmund", "Berengar", "Mildrith", "Tobias", "Ysolde", "Dunstan",
    "Wulfgar", "Leofwine", "Brannoc", "Wilfrida", "Cuthbert", "Eadgyth", "Fenwick", "Isolde",
]
bundle = [6, 15]

[keeper]
creature = "shopkeeper"
carry = ["spear", "small_shield", "chain_mail", "iron_helm", "gold_coin*300"]
wield = ["spear", "small_shield"]
wear = ["chain_mail", "iron_helm"]

[[shop]]
id = "general_store"
name = "general store"
title = "{keeper}'s General Store"
stock = [
    "melee_weapons", "missile_weapons", "missiles", "shields", "body_armour", "helmets",
    "cloaks", "gloves", "boots", "light_sources", "tools", "materials", "food", "potions",
    "scrolls", "wands", "rods",
]
always = ["scroll_of_identify"]
never = [
    "blasting_flask", "brewers_blunder", "draught_of_chance", "elixir_of_grace",
    "elixir_of_might", "elixir_of_presence", "elixir_of_vigour", "elixir_of_will",
    "elixir_of_wit", "flask_of_fire", "flask_of_frost", "flask_of_thunder", "pitch_fire",
    "trolls_blood",
]
buys = [
    "melee_weapons", "missile_weapons", "missiles", "shields", "body_armour", "helmets",
    "cloaks", "gloves", "boots", "clothing", "light_sources", "tools", "household", "materials",
    "food", "potions", "scrolls", "wands", "rods", "gems",
]
items = [6, 10]
markup = 150
pays = 30

# Cēaptūn's general store (#1248): everything but arms and armour, which its smithy sells. A
# town's own kind: no generated level has one.
[[shop]]
id = "town_store"
name = "town store"
title = "{keeper}'s General Store"
stock = [
    "cloaks", "light_sources", "tools", "materials", "food", "potions", "scrolls", "wands", "rods",
]
never = [
    "blasting_flask", "brewers_blunder", "draught_of_chance", "elixir_of_grace",
    "elixir_of_might", "elixir_of_presence", "elixir_of_vigour", "elixir_of_will",
    "elixir_of_wit", "flask_of_fire", "flask_of_frost", "flask_of_thunder", "pitch_fire",
    "trolls_blood",
]
buys = [
    "cloaks", "clothing", "light_sources", "tools", "household", "materials", "food", "potions",
    "scrolls", "wands", "rods", "gems",
]
items = [6, 10]
markup = 140
pays = 30
generated = false

[[shop]]
id = "weaponsmith"
name = "weaponsmith"
title = "{keeper}'s Forge"
stock = ["melee_weapons", "missiles"]
buys = ["melee_weapons", "missiles", "materials"]
items = [5, 9]
markup = 130
pays = 40

[[shop]]
id = "armourer"
name = "armourer"
title = "{keeper}'s Armoury"
stock = ["shields", "body_armour", "helmets", "cloaks", "gloves", "boots"]
buys = ["shields", "body_armour", "helmets", "cloaks", "gloves", "boots", "materials"]
items = [5, 9]
markup = 130
pays = 40

# Cēaptūn's smithy (#1248): arms, missiles, and armour, the weaponsmith's and the armourer's
# trades under one roof (cloaks are the general store's), and ingots to forge with. A town's own kind: no generated level
# has one.
[[shop]]
id = "smithy"
name = "smithy"
title = "{keeper}'s Smithy"
stock = [
    "melee_weapons", "missile_weapons", "missiles", "shields", "body_armour", "helmets", "gloves",
    "boots", "materials",
]
buys = [
    "melee_weapons", "missile_weapons", "missiles", "shields", "body_armour", "helmets", "gloves",
    "boots", "materials",
]
items = [5, 9]
markup = 130
pays = 40
generated = false

# A provisioner's potions are few among its wares, the commoner the more often (healing,
# antidote: spec §8 "Potions").
[[shop]]
id = "provisioner"
name = "provisioner"
title = "{keeper}'s Provisions"
stock = ["light_sources", "tools", "food", "potions"]
never = [
    "blasting_flask", "brewers_blunder", "draught_of_chance", "elixir_of_grace",
    "elixir_of_might", "elixir_of_presence", "elixir_of_vigour", "elixir_of_will",
    "elixir_of_wit", "flask_of_fire", "flask_of_frost", "flask_of_thunder", "pitch_fire",
    "trolls_blood",
]
buys = ["light_sources", "tools", "food", "potions"]
items = [6, 10]
markup = 120
pays = 30

# The alchemist sells and buys potions only (spec §8 "Potions"), healing first; an elixir
# (frequency 2 among the potions' hundreds) lies there very rarely.
[[shop]]
id = "alchemist"
name = "alchemist"
title = "{keeper}'s Apothecary"
stock = ["potions"]
always = ["potion_of_healing"]
buys = ["potions"]
items = [5, 8]
markup = 140
pays = 40

[[shop]]
id = "fletcher"
name = "fletcher"
title = "{keeper}'s Fletchery"
stock = ["missile_weapons", "missiles"]
buys = ["missile_weapons", "missiles", "materials"]
items = [5, 8]
markup = 125
pays = 40
