# The spells' statuses (spec §8 "Spells"): Sleep's drowsiness, in which everything takes three
# times as long; Web's strands, which hold whoever is caught where they stand (no step) a turn a
# degree; Haste's quickness, the caster's own, everything a quarter quicker; and Barkskin's bark,
# the druid's boon, harder to land a blow on. Up to three degrees (Presence lengthens them).
[[status]]
id = "drowsy"
name = "Drowsy"
seen = "drowsy"
max = 3
stacking = "refresh"
eases = 12
cost = 300
cured_by = ["clear_head"]
start = "You feel terribly drowsy."
end = "You shake off the drowsiness."
