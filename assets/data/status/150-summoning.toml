# A summoner's cooldown (spec §8 "Summoning", the creatures' `[creature.summon]`): a degree for
# every six seconds of its `cooldown`; while it lasts the creature summons nothing. Creatures
# only: no one sees it on them.
[[status]]
id = "summoning"
name = "Summoning spent"
max = 100
stacking = "refresh"
eases = 6
