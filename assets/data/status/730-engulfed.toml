# Engulfing (docs/design/monster-dread.md §5.7, G7): a hold with a tick. The charnel heap's mass,
# a greater water elemental's drowning wave closes over its victim: no step, no shot, no throw,
# no reading, and every tick inside costs hit points (a tick every 6 s a degree, so the more
# turns the hold has left the faster it hurts). A blow and a spell still go: hack your way out,
# or break free with the struggle (the hold's rules, world/health/hold.rs). Size makes no difference.
