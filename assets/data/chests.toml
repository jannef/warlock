# Chests (spec §7 "Chests", §8 "Chests"; docs/design/chests-and-treasure.md): what a chest of each
# level is called and what it is like. A chest is a fixture of a cell (the `chest` terrains,
# terrain.toml) with a level: its floor's (a branch floor's depth, a hand-made level's
# item_level), or what a level's legend gives it (`chest = "kist"`: that band's `from`; `chest =
# 7`). The band is the last whose `from` the level reaches: it names the chest and gives its
# numbers. The band is never saved, only the level, so bands may be renamed or re-cut freely.
# Fields:
#   id, name      the band ("banded chest"), as look mode and messages say it
#   description   what look mode adds after the name
#   fg            its colour on the map
#   from          the least level of the band (1 up; bands in rising order, the first from 1)
#   sturdiness    a kick breaks it with a chance of the kicker's Strength in this, as a door's
#                 (terrain.toml), 1 to 100
#   hardness      what a blast must beat to blow it apart, as a wall's (1 to 10000)
#   locked        percent of generated chests of the band that come locked (0 to 100)
#   trapped       percent that come trapped, from the branch's traps that fit (0 to 100)
#   mimic         percent that are a mimic instead (0 to 100)
#   hold          a mimic of the band holds its victim with this chance on a hit, in percent
#   loot          what a generated one holds: items = dice, loot_level = levels above the
#                 floor's, magic = percent of items at least magic, rare = percent rare (counted
#                 in magic too), gold = { dice, each } (coins: the dice times each), gems = dice (a
#                 result of 0 or less: none)
# (`locked`, `trapped`, `mimic`, `hold`, and `loot` are read by generated chests, mimics, and
# their loot, which come in later slices; they are checked now.)
# [smash]
#   destroyed     percent of each stack destroyed when a chest is kicked open or blown apart

