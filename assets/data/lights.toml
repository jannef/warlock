# Light presets (spec §5). Referenced by terrain (`light = "..."`), level legends, creatures,
# and scenarios (the player's lantern).
#
# Fields:
#   id
#   color   = [r, g, b, uv] at the source; 255 per channel = fully lit, more = overbright.
#             Brightness for vision thresholds is luma (54r + 183g + 19b) / 256, plus UV for eyes
#             that see UV.
#   radius  = reach in cells; light falls off as color · (R² − d²) / R² with R² = radius² + radius.
#   hooded  = the light this one burns as with its hood lowered (the player's lantern, spec §5): a
#             light id here, itself without a hood. Optional: without it the light has no hood.
#   hollow  = true: its own cell gets none of its light (a hooded lantern lights the cells around
#             its bearer but not them). Default false.
#   stability.* — how the drawn light varies over time (spec §4.4). Visual only (renderer);
#             gameplay never reads it, and the `flicker` effect switch turns it off. Every part is
#             optional; a light without any is perfectly stable (constant hue and intensity), as
#             magical light should be. Keep it subtle: felt more than noticed, nothing strobing.
#     stability.intensity = { amount, speed } — brightness drifts smoothly within ±amount
#             (0.1 = ±10 %, usually about a third of that), changing about `speed` times a second.
#     stability.hue = { degrees, speed } — the hue drifts within ±degrees around the light's
#             color, luminance kept (positive toward yellow, negative toward deeper red).
#     stability.dips = { depth, every, length } — about once every `every` seconds, at an
#             irregular moment, the light eases down by up to `depth` (0.1 = 10 %) and back over
#             `length` seconds; with hue drift the dip also turns it toward deeper red.
#             `amount` and `depth` are at most 0.25 each, `degrees` at most 30.

# Tuning: open flames (torches, braziers, lava) are gently alive: a soft flicker, the hue drifting
# between deeper orange and yellow, and a rare soft dip. Enclosed flames (lamps, the lantern) burn
# calmer. Magical light (crystals, fungus, runes, the altar) is perfectly steady.

# Carried by creatures (kobolds).
[[light]]
id = "torch"
color = [300, 180, 90, 0]
radius = 6
stability.intensity = { amount = 0.1, speed = 1.0 }
stability.hue = { degrees = 8, speed = 0.4 }
stability.dips = { depth = 0.12, every = 7, length = 0.8 }

# Wall torches in sconces.
[[light]]
id = "sconce"
color = [280, 170, 90, 0]
radius = 7
stability.intensity = { amount = 0.08, speed = 0.8 }
stability.hue = { degrees = 7, speed = 0.35 }
stability.dips = { depth = 0.1, every = 9, length = 0.9 }

[[light]]
id = "brazier"
color = [360, 210, 100, 0]
radius = 8
stability.intensity = { amount = 0.1, speed = 0.7 }
stability.hue = { degrees = 8, speed = 0.3 }
stability.dips = { depth = 0.1, every = 11, length = 1.0 }

# Hanging oil lamps (corridors, nooks).
[[light]]
id = "lamp"
color = [230, 200, 150, 0]
radius = 6
stability.intensity = { amount = 0.04, speed = 0.35 }
stability.hue = { degrees = 2, speed = 0.2 }

# A burning arrow where it lies (objects.toml: a flaming arrow, loosed): a small open flame,
# livelier than a torch.
[[light]]
id = "arrow_fire"
color = [260, 145, 60, 0]
radius = 5
stability.intensity = { amount = 0.12, speed = 1.4 }
stability.hue = { degrees = 9, speed = 0.5 }
stability.dips = { depth = 0.12, every = 5, length = 0.6 }

# The player's lantern (see scenarios).
[[light]]
id = "lantern"
color = [250, 215, 160, 0]
radius = 5
hooded = "lantern_hooded"
stability.intensity = { amount = 0.05, speed = 0.6 }
stability.hue = { degrees = 4, speed = 0.3 }
stability.dips = { depth = 0.06, every = 14, length = 0.8 }

# The lantern as a Lamplighter tends it (talents/lamplighter.toml): a trimmed wick, a cell farther.
[[light]]
id = "lantern_bright"
color = [265, 228, 170, 0]
radius = 6
stability.intensity = { amount = 0.05, speed = 0.6 }
stability.hue = { degrees = 4, speed = 0.3 }
stability.dips = { depth = 0.06, every = 14, length = 0.8 }

# The lantern with its hood lowered: half its light and less than half its reach, and hollow, so it
# lights the cells around its bearer but not their own: they see their neighbours, and eyes that
# need light see them only by other light.
[[light]]
id = "lantern_hooded"
color = [125, 108, 80, 0]
radius = 2
hollow = true
stability.intensity = { amount = 0.04, speed = 0.6 }
stability.hue = { degrees = 3, speed = 0.3 }

# Water garden altar: magical, so steady (its glyph pulses instead).
[[light]]
id = "altar_glow"
color = [220, 180, 90, 0]
radius = 5

# Forgotten altars (spec §7 "Special rooms"): steady like every magical light; the colour shows
# the altar's hidden side (gold good, grey neutral, red evil). The terrain gives the neutral one;
# a good or an evil altar's cell carries its own as a placed light.
[[light]]
id = "altar_good"
color = [240, 190, 80, 0]
radius = 4

[[light]]
id = "altar_neutral"
color = [180, 180, 190, 0]
radius = 4

[[light]]
id = "altar_evil"
color = [240, 50, 40, 0]
radius = 4

# Light hall crystals: steady colored light.
[[light]]
id = "crystal_red"
color = [340, 50, 40, 0]
radius = 7

[[light]]
id = "crystal_green"
color = [60, 300, 80, 0]
radius = 7

[[light]]
id = "crystal_blue"
color = [60, 110, 380, 0]
radius = 7

[[light]]
id = "crystal_amber"
color = [320, 220, 40, 0]
radius = 7

# The will-o'-wisp (creatures/will_o_wisp.toml): a pale, cold light that lights a few cells
# around it; magical, so steady.
[[light]]
id = "wisp"
color = [110, 190, 170, 0]
radius = 3

# The lightning elementals (#453): a cold blue-white light that lights a few cells about them;
# lightning is never quite still, so it shivers a little.
[[light]]
id = "storm"
color = [150, 170, 360, 0]
radius = 4
stability.intensity = { amount = 0.08, speed = 1.2 }

# Darkness chamber: too faint for normal eyes (even in pairs, bounce included: brightness 37 < 40);
# low-light eyes (12) see it and the floor glowing about two cells around it.
[[light]]
id = "fungus"
color = [0, 24, 13, 0]
radius = 3

# Darkness chamber: ultraviolet only, visible with UV sight.
[[light]]
id = "uv_rune"
color = [0, 0, 0, 180]
radius = 4

# Effects room: a lava pool.
[[light]]
id = "lava"
color = [300, 110, 30, 0]
radius = 4
stability.intensity = { amount = 0.08, speed = 0.4 }
stability.hue = { degrees = 6, speed = 0.2 }
stability.dips = { depth = 0.08, every = 15, length = 1.6 }

# Inner light (a birth sign's gift, spec §8 "Birth sign"): a dim ember about its bearer, enough
# to make out the cells beside them in the dark; a soft flicker, as a banked fire.
[[light]]
id = "ember"
color = [180, 110, 50, 0]
radius = 1
stability.intensity = { amount = 0.04, speed = 0.4 }
stability.hue = { degrees = 3, speed = 0.2 }

# Inner light under a full moon (horoscope.toml's [flavour]): the ember burns a little brighter
# and a cell farther.
[[light]]
id = "ember_full"
color = [200, 125, 60, 0]
radius = 2
stability.intensity = { amount = 0.04, speed = 0.4 }
stability.hue = { degrees = 3, speed = 0.2 }

# Glowing magic items (affixes.toml: Radiant, of Light): their wearer carries a faint, cool,
# steady light (magic, so it never flickers). Dimmer than a lantern: enough to see by up close.
[[light]]
id = "item_glow_faint"
color = [70, 80, 105, 0]
radius = 2

[[light]]
id = "item_glow"
color = [95, 105, 140, 0]
radius = 3

[[light]]
id = "item_glow_bright"
color = [125, 135, 175, 0]
radius = 4
