# Materials, one file per material, named by its id (`iron.toml`). This file holds only the notes
# below: a file of comments defines nothing. The game numbers the materials in path order, so a
# new material is a new file, a renamed id is a renamed file, and the same id in two files is a
# load error naming both (docs/dev/content.md).
#
# Materials objects are made of, part by part (spec §7; objects/README.toml, `materials`), and
# what an item made of another material than its base item is like (spec §7 "Materials", #193,
# #194: "a bronze long sword"). Every property is on one scale, steel's (steel = weight 100, to
# hit 0, damage 0, protection 100, value 100).
# Fields:
#   id        what objects name it by (`materials = ["iron"]`, `of = "iron"`)
#   name      as names and descriptions write it
#   precious  a gem or a precious metal (default false): the names of items it is part of show
#             it ("gold and ruby amulet", "ruby-pommelled long sword"); plain materials show only
#             in an item's description, unless an item is made of one instead of its base
#             item's material ("a bronze long sword")
#   group     what construction lists name it by with the others of its kind (objects/README:
#             `made_of`): metal, wood, bone, stone, hide, sinew, cloth, glass, resin. A material
#             without one (paper, wax, food, and the gems, which are set but never made into
#             anything) is never another item's material: `made_of = ["any"]` (jewellery) is
#             every material of a group
#   color     "#rrggbb": the glyph of an item made of it where its base item is made of another
#             material (default: the base item's own colour)
#   weight    what an item of it weighs, in percent of the same item of steel (default 100, at
#             least 1): an item made of another material weighs its base item's weight with each
#             part's share scaled by its material's weight over the base part's. Metals by their
#             real densities; the organic materials by an effective weight for items of them
#   to_hit    to hit as a weapon's working part (a blade, a head), and
#   damage    to every roll of its damage: an item made of another material
#             strikes with the difference of the two materials' modifiers. A material with
#             neither cannot be a weapon's working part (leather, cloth); one given, the other is 0
#   dice      dice more of a weapon's own size a weapon of it rolls (default 0, steel's): an item
#             made of another material rolls the difference more, never fewer (adamantium 1: a
#             long sword's 1d9 is 2d9). What has dice of its own takes them: a melee weapon, a
#             thrown one, a launcher; ammunition strikes with its launcher's dice
#   protection what of an armour's Protection an armour of it keeps, in percent: an
#             armour made of another material has its Protection × its material's protection
#             over its base item's, rounded. None: it cannot be armour (flint, obsidian)
#   defence   what of a shield's Defence a shield of it gives, in percent (default 100, steel's):
#             a shield made of another material has its Defence × its material's defence over
#             its base item's, rounded (adamantium 200: a tower shield's 3 is 6)
#   value     what it is worth, in percent of steel (default 100): an item made of
#             other parts than its base item is worth the base item's value times what its parts
#             are worth (each part's share of the weight times its material's value) over what
#             the base item's are (a gem part an item carries is worth what its gem is, below)
#   rarity    how often loot makes an item of it instead of its base item's own material, among
#             the other materials it may be made of (its construction list; the own material is
#             not weighed: it takes 90% of finds at level 1, 80% from level 21, #1191, variant.rs
#             `variant_percent`): { weight = 800, deeper = -40,
#             level = 1 }, a weight at item level 1, `deeper` more (or less: never below 0) each
#             item level past the first, and none below `level` (default 1). None: loot never
#             makes anything of it. A material worse in a fight than an item's own (to hit or
#             damage lower on a weapon, Protection lower on armour) and dearer weighs at most 10
#             (very rare) for that item, whatever it says here; jewellery is never worse
#   gear      the same for what creatures carry (what they drop), by the creature's level instead
#             of the item level: primitive materials for kobolds, steel for tougher creatures (a
#             creature's faction may favour materials besides: data/factions.toml `gear`)
#   fit       how well it suits an item by its use (#1191), `fit = { weapon = "odd", armour =
#             "poor" }`: weapon (what strikes or is shot), armour (with shields), jewellery
#             (rings and amulets), other; each "good" (the default: its weight as given),
#             "poor" (a tenth), or "odd" (a hundredth, at least 1: a tin long sword, a wool ring)
#   resists   its chance in percent to withstand each kind of item damage (none: nothing),
#             `{ acid = 20, rust = 10, fire = 95 }` (world/item_damage.rs). An item is damaged by
#             its main part's material: acid and rust by a creature's `corrodes`
#             (creatures/README.toml), fire by one whose `corrodes` kind is fire. Withstood,
#             nothing happens; else the item is damaged (the smith's one state, mended by Temper
#             or Whittle), and one damaged already is destroyed. A failed Temper or Whittle is
#             never withstood. The scale: the noble metals, mithril, adamantium, dragonscale, and
#             gems near 100 for all; iron and steel rust and corrode, but stand heat; copper and
#             its alloys corrode but hardly rust; the soft metals (tin, pewter, lead, zinc,
#             cadmium, bendalloy) melt; cloth, flesh, plant, paper, and wax nothing but rust;
#             wood burns; stone and glass stand acid and heat
#   proof     never damaged by anything (default false): it withstands acid, rust, and heat, a
#             failed Temper only fails to improve it, a spell's ruin spares it, and a creature's
#             gear of it is never found damaged (world/item_damage.rs). Adamantium alone
#   work      how hard it is to work (default 0, steel's): a signed modifier on the check of every
#             salvage and recipe that works it (docs/design/professions.md §4; the profession
#             that works it is its group's in stock.toml). Soft metals −3, adamantium +8
#   binding   how well it holds magic, −2 to +2 (default 0, steel's): a term of the affix
#             capacity of an item whose main part is of it (docs/dev/enchanting.md). Silver −2;
#             the soft metals and knapped stone −1; gold, electrum, ironwood, ivory, jade, amber,
#             and silk +1; adamantium +1 (a fighting metal: its gift is `dice` and Protection);
#             mithril, dragonbone, and dragonscale +2. Deeper finds
#             come of the high-binding materials more often (#1436): their `rarity` starts
#             shallower than their worth alone would and grows by `deeper`
#   gem      makes it a gem (spec §7 "Gems"; precious, with no group): an inline
#             table of
#               color   "#rrggbb": a loose gem's glyph, and a ring set with it
#               value   what a plain one (of the plain size and cut in gems.toml) is worth, in
#                       gold; a gem is worth value × its size's × its cut's multiplier
#               rarity  how often loot finds it among the gems, a weight (0: never found)
#               plural  "rubies" (default: the name plus s)
#             `gem = { color = "#d3213b", value = 300, rarity = 5, plural = "rubies" }`
#
# How often, in words (the wiki uses these): very common 800, common 300, uncommon 100, rare 40,
# very rare 10 (as loot, at item level 1).
# Properties not yet modelled: hardness, burning, and wear.
