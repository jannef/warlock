# A wand of lightning bolt (spec §8 "Magic items": "Wands"): ready it in the missile weapon slot and
# use it as a missile weapon (`t`), and it casts Lightning bolt, a level-11 spell, at its own caster
# level, a charge a cast instead of mana. Its charges are its own; it is never recharged. Level
# and frequency by its spell's level (objects/README.toml): the lower, the commoner the wand.
[[object]]
id = "wand_of_lightning_bolt"
name = "wand of lightning bolt"
plural = "wands of lightning bolt"
glyph = "-"
fg = "#c8a8ff"
class = "wands"
materials = ["wood"]
weight = 200
value = 600
slot = "missile_weapon"
level = 8
frequency = 5

[object.wand]
spell = "lightning_bolt"
charges = 7
rungs = { min = 0, max = 2 }
