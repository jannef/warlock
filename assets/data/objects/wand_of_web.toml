# A wand of web (spec §8 "Magic items": "Wands"): ready it in the missile weapon slot and
# use it as a missile weapon (`t`), and it casts Web, a level-7 spell, at its own caster
# level, a charge a cast instead of mana. Its charges are its own; it is never recharged. Level
# and frequency by its spell's level (objects/README.toml): the lower, the commoner the wand.
[[object]]
id = "wand_of_web"
name = "wand of web"
plural = "wands of web"
glyph = "-"
fg = "#c8a8ff"
class = "wands"
materials = ["wood"]
weight = 200
value = 400
slot = "missile_weapon"
level = 5
frequency = 7

[object.wand]
spell = "web"
charges = 9
