# A wand of web (spec §8 "Magic items": "Wands"): ready it in the missile weapon slot and
# use it as a missile weapon (`t`), and it casts Web, a tier-2 spell, at its own caster
# level, a charge a cast instead of mana. Its charges are its tier's (data/spells.toml); it is
# never recharged. Level and frequency by its tier: the lower the tier, the commoner the wand.
[[object]]
id = "wand_of_web"
name = "wand of web"
plural = "wands of web"
glyph = "-"
fg = "#c8a8ff"
class = "wands"
materials = ["wood"]
weight = 200
value = 400
slot = "missile_weapon"
level = 5
frequency = 7

[object.wand]
spell = "web"
