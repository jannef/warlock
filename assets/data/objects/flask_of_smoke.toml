# A flask of smoke (spec §8 "Potions": "Flasks"; the potions wave 2 design §4.4): thrown, it
# shatters into the Fume spell's thick smoke where it breaks, which no eye sees into or through;
# drunk, it chokes its drinker a moment. Smoke is ash grey.
[[object]]
id = "flask_of_smoke"
name = "flask of smoke"
plural = "flasks of smoke"
glyph = "!"
fg = "#9a9a94"
class = "potions"
materials = ["glass"]
weight = 250
value = 40
stackable = true
level = 2
frequency = 20

[object.drink]
kind = "harm"
dice = "1"
status = "stunned"
colour = "ash grey"

[object.throw]
spell = "fume"
words = "Smoke billows from the shards."
