# A magic crystal (docs/design/enchanting.md §5; docs/dev/enchanting.md): the ward and the light. Caught
# from an affix of its colour's families by salvaging an identified magic item (rules/salvage.toml,
# crystals.toml), and an Enchanting input (Kindle and the other recipes); anyone may consume one for mana (the Consume
# crystal ability). Never floor loot (no `level` or `frequency`) and never stocked. Made of
# stone, as the essences are, so it neither burns nor rusts.
[[object]]
id = "crystal_white"
name = "white crystal"
glyph = "*"
fg = "#ececf4"
class = "materials"
materials = ["stone"]
weight = 20
value = 25
stackable = true
