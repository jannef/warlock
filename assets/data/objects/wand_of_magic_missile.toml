# A wand of magic missile (spec §8 "Magic items": "Wands"): ready it in the missile weapon slot and
# use it as a missile weapon (`t`), and it casts Magic missile, a tier-1 spell, at its own caster
# level, a charge a cast instead of mana. Its charges are its tier's (data/spells.toml); it is
# never recharged. Level and frequency by its tier: the lower the tier, the commoner the wand.
[[object]]
id = "wand_of_magic_missile"
name = "wand of magic missile"
plural = "wands of magic missile"
glyph = "-"
fg = "#c8a8ff"
class = "wands"
materials = ["wood"]
weight = 200
value = 250
slot = "missile_weapon"
level = 3
frequency = 10

[object.wand]
spell = "magic_missile"
