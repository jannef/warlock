# A scroll of identify (spec §8 "Scrolls", "Magic items", "Spells"): read it (`r`) on an
# unidentified item you carry, and it casts Identify on it, free of mana: you know what it is from
# then on; read on an unknown scroll, you know that kind of scroll from then on. Study it (`L`), and
# you may learn the spell for good. Common (the most frequent scroll in loot), and every generated
# general store has some (`always` in data/shops.toml).
[[object]]
id = "scroll_of_identify"
name = "scroll of identify"
plural = "scrolls of identify"
glyph = "?"
fg = "#d4c4f0"
class = "scrolls"
materials = ["paper"]
weight = 50
value = 80
stackable = true
frequency = 300

[object.read]
kind = "spell"
spell = "identify"
