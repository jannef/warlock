# A wand of shatter (spec §8 "Magic items": "Wands"): ready it in the missile weapon slot and
# use it as a missile weapon (`t`), and it casts Shatter at a rung of its own, a charge a cast
# instead of mana. Its charges are its own; it is never recharged. Level and frequency by its
# spell's level (objects/README.toml): the lower, the commoner the wand.
[[object]]
id = "wand_of_shatter"
name = "wand of shatter"
plural = "wands of shatter"
glyph = "-"
fg = "#c8a8ff"
class = "wands"
materials = ["wood"]
weight = 200
value = 500
slot = "missile_weapon"
level = 7
frequency = 5

[object.wand]
spell = "shatter"
charges = 9
rungs = { min = 0, max = 2 }
