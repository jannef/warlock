# A wand of burning hands (spec §8 "Magic items": "Wands"): ready it in the missile weapon slot and
# use it as a missile weapon (`t`), and it casts Burning hands, a level-4 spell, at its own caster
# level, a charge a cast instead of mana. Its charges are its own; it is never recharged. Level
# and frequency by its spell's level (objects/README.toml): the lower, the commoner the wand.
[[object]]
id = "wand_of_burning_hands"
name = "wand of burning hands"
plural = "wands of burning hands"
glyph = "-"
fg = "#c8a8ff"
class = "wands"
materials = ["wood"]
weight = 200
value = 250
slot = "missile_weapon"
level = 3
frequency = 10

[object.wand]
spell = "burning_hands"
charges = 12
rungs = { min = 0, max = 2 }
