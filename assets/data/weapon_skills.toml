# Defaults (The Riddle of Steel): skill with one weapon carries over to related ones, less a
# penalty, both ways. When a rank is gained in A, every B with rank(A) - penalty > rank(B) rises to
# rank(A) - penalty, and its marks start again from 0. Long blades 8 gives short blades 6.
# Skills not listed here are unrelated: no default.
[[default]]
between = ["long_blades", "short_blades"]
penalty = 2

[[default]]
between = ["long_blades", "great_blades"]
penalty = 2

[[default]]
between = ["short_blades", "daggers"]
penalty = 2

