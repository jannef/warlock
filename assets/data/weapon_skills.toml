# Weapon skills (spec §8 "Weapon skills"): the categories of weapons the player and creatures
# train with, ADOM-like. And the fighting styles (spec §8 "Fighting styles"), after AD&D 2e's
# Complete Fighter's Handbook: how the weapons are held and used, skills with the same ranks,
# marks, and benefits (at the end).
#
# Ranks go from 0 (untrained: no benefits, but marks still count) to 10. The player sees their
# ranks and a bar of their marks toward the next one (the weapon skills screen, `W`); the numbers
# here are rules and never shown in the game.
#
# Marks (ADOM-like): every use of a skill earns `attempt` marks (an attack, hit or miss), a
# success `hit` more (a hit), scaled by
# 100 + per_level x (the opponent's level - the rank) percent, kept within 0 and 100, and
# rounded to the nearest mark (halves up): fewer against weak opponents and as the rank rises,
# never more than the full marks against strong ones (#1095). A rank is gained when the marks reach what its curve asks for the
# next rank; the marks left over count toward the one after.
[marks]
attempt = 1
hit = 2
per_level = 20

# The marks each rank asks for, ranks 1 to 10 (#1095): the weapons' curves steepen sharply from
# rank 7, so that for a fighter who fights the monsters of their level rank 6 comes about level
# 10, rank 8 about 25, and rank 10 about 45 (docs/balance.md "Weapon pace"). Missile weapons ask
# two thirds of the melee marks. The caster styles, trained by far fewer casts than blows, keep a
# gentle curve, doubling to rank 7 and flatter after it, at three times the marks it first asked
# (#1251: ranks came too fast), so that rank 10 is the end of a long career (docs/balance.md
# "Caster style pace").
[curves]
melee = [15, 45, 190, 500, 1750, 4000, 17500, 38000, 68000, 88000]
missile = [10, 30, 125, 330, 1170, 2670, 11700, 25300, 45300, 58700]
caster = [30, 60, 120, 240, 480, 960, 1920, 3600, 6000, 9000]

# Fighting with a weapon in each hand (two-weapon fighting; the off hand holds only a light
# weapon, `light_weapon` in objects.toml): both hands strike every melee attack, the main hand
# at `main` to hit, the off hand at `off` (D&D's -4 and -8). The Twin Blades style
# eases both (`ease_main`, `ease_off` below), never past 0.
[two_weapons]
main = -4
off = -8

# Fighting with a shield in each hand (two-shield fighting, #611; any shield fits either hand):
# every blow is a shield bash, at `to_hit`, every attack `slow` percent dearer, and
# every spell its bearer casts with their own mana fails by a chance of `spell_failure` percent
# (the mana and the time are spent all the same). The Two Shields style eases each (`ease_bash`,
# `ease_slow`, `ease_spell` below), never past nothing.
[two_shields]
to_hit = -6
slow = 50
spell_failure = 75

# Spells that roll to hit (a ray, a bolt, or a touch whose resolution is an attack roll; spells/)
# aim with the caster style they are cast in (the caster styles below). A spell cast from afar is
# at a Sniper's best (`far_to_hit`, `far_threat`) from `far` cells away (the larger of the two
# distances).
[spell_attacks]
far = 5

# Every skill defines:
#   id      stable name: weapons name it (`category` in objects.toml), races, classes, and
#           creatures give ranks in it, saves record ranks by its place in this file
#   name    as the weapon skills screen lists it
#   phrase  what a rank gained says of it: "You feel more skilled <phrase>."
#   role    what uses it:
#             melee        weapons wielded in a hand name it; their blows train it, and its
#                          `parry` defends while one is wielded
#             launcher     missile weapons name it; their shots train it
#             thrown       every throw trains it (things only thrown, a rock, name it too)
#             unarmed      bare hands and natural attacks
#             shield_bash  bashing with a held shield (an ability; spec §6 "Abilities")
#             style        a fighting style (below)
#           unarmed, thrown, and shield_bash may have one skill each
#   curve   the curve above it trains along
# and what each rank gives, as 11 numbers for ranks 0 to 10 (a list left out is all 0; all but
# `to_hit`, `damage`, `parry`, `shield`, `far_to_hit`, `bonus`, and `cells` are 0 to 255):
#   to_hit  added to the to-hit of attacks with it
#   damage  added to every roll of their damage dice
#   threat  how many natural rolls lower a critical threatens from (19-24 instead of 20-24)
#   crit    added to a confirmed critical's damage multiplier (never past x5)
#   speed   percent off the attack's cost (melee, shoot, throw; actions.toml; never a caster
#           style's)
#   parry   melee: added to the wielded weapon's Parry bonus to Defence
#   reload  launcher: percent off the cost of reloading (a crossbow)
#   shield  a shield style (sword_and_board, two_shields): added to the held shield's Shield
#           bonus to Defence
# Rank 10 is where later active or triggered abilities will hang.

