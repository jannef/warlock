# Fighting styles (spec §8 "Fighting styles"), after AD&D 2e's Complete Fighter's Handbook: skills
# of how weapons are held and used, with the same ranks, marks, curves, and benefits as weapon
# skills. Every attack the player makes in a style's configuration (a blow, a bash, a shot or a
# throw at someone) earns marks in the style as well as in the weapon's skill, and the style's
# benefits add to the weapon skill's. A style also defines:
#   grip     the configuration it is fought in: for blows, what the hands hold (which counts for
#            Defence too), else the kind of attack:
#              one_weapon         one one-handed weapon, every other hand empty
#              two_weapons        a weapon in each hand (both strike; see [two_weapons])
#              two_handed         a two-handed weapon
#              weapon_and_shield  a one-handed weapon and a shield
#              two_shields        a shield in each hand (every blow a bash; see [two_shields])
#              unarmed            nothing in the hands
#              launcher           a shot from a missile weapon
#              thrown             a throw
#              ranged_spell       a spell that rolls to hit at range (a ray, a bolt)
#              touch_spell        a touch spell that rolls to hit
#              armoured_spell     a spell that rolls to hit, cast in armour that hinders casting
#                                 (anything worn with a spell_cost_percent): before the two above
#   weapons  the weapon skills it is fought with (a launcher's for `launcher`, what is thrown for
#            `thrown`; none for the spell grips); left out: every weapon of its grip that no
#            other style of the grip names.
#            One configuration is one style: at most one style of a grip leaves it out, and none
#            names a weapon skill another of its grip names
# and may give, beyond the benefits above (parry only for the grips that wield a weapon, shield
# only for weapon_and_shield and two_shields, reload only for launcher):
#   ease_main  two_weapons: points off the main hand's penalty
#   ease_off   two_weapons: points off the off hand's penalty
#   bash       weapon_and_shield: the chance in percent of a free shield bash after a blow that
#              hits (it draws on and trains shield bashing); two_shields: the same, with the
#              other shield after a bash that hits
#   ease_bash  two_shields: points off the to-hit penalty
#   ease_slow  two_shields: percent points off the slowness
#   ease_spell two_shields: percent points off the chance a spell fails
#   far_to_hit ranged_spell: added to the to-hit at a target [spell_attacks] `far` or more away
#   far_threat ranged_spell: added to the threat widening at such a target
#   armour     armoured_spell: percent off what worn armour adds to every spell's mana cost,
#              whatever is cast (spells.toml's armour percents)
#   hidden     true: listed (the weapon skills screen, the dumps, talents that ask for it) only
#              once its owner has marks or a rank in it; nobody starts with it
# Styles default only to styles (below). Rank 10 is where a style's later active or triggered
# abilities will hang (a duelist's riposte, a staff fighter's trip).
[[skill]]
id = "duelist"
name = "Duelist"
phrase = "at dueling"
role = "style"
grip = "one_weapon"
curve = "melee"
to_hit = [0, 1, 1, 1, 2, 2, 2, 3, 3, 4, 5]
parry = [0, 1, 1, 2, 2, 3, 3, 4, 5, 6, 7]

