# Animated objects (spec §8 "Animated objects"; docs/dev/animated.md; the design:
# docs/design/animated-objects.md): things a will set moving and left. Each of them is an ordinary
# creature type, generated when content loads from this file and data/animated/, and made of real
# objects: a household thing of its body (data/animated/<id>.toml).
#
# Numbers by level L (the undead roster's formulas, #383), rounded down part by part:
#   Strength 11 + 0.4 L, Toughness 12 + 0.4 L, Dexterity 10 + 0.25 L, Willpower 16 + 0.35 L,
#   Intelligence and Presence 2 (mindless); then the tier's `stats`
#   hit points beyond Toughness 2.5 × L × `hp_factor`
#   damage dice: the ladder's nearest (1d2, 1d3 ... 5d12) to 2 + 0.55 L (to L20, then
#   13 + 0.25 (L − 20)), moved `dice_steps` along it
#   experience: the guideline's (data/experience.toml)

# What becomes of what an animated thing is made of when it falls.
[drops]
intact = 50            # percent each component (its body) falls whole; else it breaks into its parts
pieces = 50            # percent of a broken part's weight that falls as pieces of its material

# What every animated type is.
[creature]
faction = "animated"
tags = ["animated", "construct"]
vision = "darkvision"
sight = 8
hearing = 10
# Nothing lives in it to sicken, no blood or breath to carry poison, no blood to bleed.
immune = ["diseased", "poisoned", "bleeding"]

# A household body's base material (its object's first) by its group: what it resists, its
# natural Protection (a hide by the group's name), and the verb of its death line. A material of
# no group (paper) takes none of it, and dies by the tier's `dies`.
[[group]]
id = "metal"
resist = { electricity = -25 }
protection = 2
dies = "clatters to the floor"

[[group]]
id = "wood"
resist = { fire = -50 }
protection = 1
dies = "splinters"

[[group]]
id = "cloth"
resist = { fire = -50, slashing = -25 }
dies = "falls in a heap"

[[group]]
id = "hide"
resist = { fire = -25 }
dies = "falls in a heap"

[[group]]
id = "glass"
resist = { bludgeoning = -25 }
protection = 1
dies = "shatters"

[[group]]
id = "stone"
resist = { bludgeoning = -25 }
protection = 1
dies = "shatters"

[[group]]
id = "bone"
resist = { bludgeoning = -25 }
protection = 1
dies = "shatters"

# The household tier: one type per body file in data/animated/, at the body's level. Small and
# almost harmless: two dice steps under the curve.
[[tier]]
id = "household"
name = "Household"
bodies = true          # one type per body file
levels = [1, 8]        # the bodies' levels lie within these
stats = { strength = -4, dexterity = 4, toughness = -4 }
hp_factor = 0.5
dice_steps = -2
size = "small"
footsteps = 20
dies = "falls still"

# Blades: a melee weapon that dances alone, one type per level (`animated_blade_5` …
# `animated_blade_20`), the family `animated_blade` (what populations and quests name). Quick and
# fragile, hard to hit; it wields its weapon (its damage, threat, and riders, with its Strength
# and a rank in the weapon's skill), and that weapon is the prize. A number by level `{ from,
# base, per_level, most }` is nothing below `from`, else base + per_level × (L − from), rounded
# down, at most `most`.
[[tier]]
id = "blade"
name = "Blades"
creature = "animated blade"   # every member's name
levels = [5, 20]
stats = { dexterity = 5, toughness = -2 }
hp_factor = 0.6
size = "small"
footsteps = 0                 # it floats
dies = "falls in pieces"
glyph = ")"                   # its own; it shows as its weapon does, in its material's colour
fg = "#a8b0b8"
shown_by = "main_hand"
item_glyph = true
rarity = "uncommon"
speed = { base = 1200, per_level = 5, most = 1600 }
defence = { base = 2, per_level = 0.1 }     # its thin edge: 2 + L/10
hide = "thin edge"
resist = { piercing = 50, bludgeoning = -25 }
# What it is made of: a base item of the classes, of level at most L, by frequency, made at
# item level L, at least magic by `magic` percent (rare among them by `rare`).
slots = [{ slot = "main_hand", classes = ["melee_weapons"], chance = 100 }]
magic = { base = 0, per_level = 2, most = 40 }
rare = { from = 15, base = 1, per_level = 1, most = 5 }
weapon_rank = { base = 1, per_level = 0.1, most = 8 }   # ranks in its weapon's skill: 1 + L/10

# Hollow armour: a suit with nobody inside, one type per level (`animated_armour_12` …
# `animated_armour_35`), the family `animated_armour`. Slow, hard to hurt, and loud; it fights
# with its gauntlets (its own blow, the curve's dice), while the shield's Defence and the armour's
# Protection are its pieces'. Shown as `A`, in its body armour's colour. A slot line's `from` is
# the least level it is tried at (none: every level), and `count` how many times it is tried (a
# ring for each hand: each further piece goes to a free slot of the same kind). The lines are
# tried in order, so a slot taken already (the off hand beside a two-handed weapon) is passed
# over with nothing drawn.
[[tier]]
id = "armour"
name = "Hollow armour"
creature = "animated armour"
levels = [12, 35]
stats = { strength = 5, dexterity = -2, toughness = 5 }
hp_factor = 1.2
size = "medium"
footsteps = 60
dies = "collapses with a clang"
glyph = "A"
fg = "#a8b0b8"
shown_by = "body"
rarity = "uncommon"
speed = { base = 900, per_level = 3, most = 1100 }
resist = { piercing = 25 }    # blows pass through the hollow
opens_doors = true            # gauntlets
attack = { damage_type = "bludgeoning", name = "gauntlets", verb = "slams" }
slots = [
  { slot = "body", classes = ["body_armour"] },
  { slot = "head", classes = ["helmets"], chance = 70 },
  { slot = "off_hand", classes = ["shields"], chance = 40 },
  { slot = "hands", classes = ["gloves"], chance = 30 },
]
magic = { base = 10, per_level = 1, most = 40 }
rare = { from = 20, base = 1, per_level = 1, most = 10 }

# The panoply: the full kit of a knight with no knight, one type per level
# (`animated_panoply_20` … `animated_panoply_70`), the family `animated_panoply`. It wields and
# wears everything, and everything its pieces' magic does works for it, a ring's and an amulet's
# too (from level 50). Its shield line is passed over beside a two-handed weapon.
[[tier]]
id = "panoply"
name = "Panoplies"
creature = "animated panoply"
levels = [20, 70]
stats = { toughness = 2 }
hp_factor = 1.2
size = "medium"
footsteps = 60
dies = "collapses with a clang"
glyph = "A"
fg = "#a8b0b8"
shown_by = "body"
rarity = "rare"
speed = { from = 20, base = 1000, per_level = 4, most = 1200 }
opens_doors = true
slots = [
  { slot = "body", classes = ["body_armour"] },
  { slot = "main_hand", classes = ["melee_weapons"] },
  { slot = "off_hand", classes = ["shields"], chance = 60 },
  { slot = "head", classes = ["helmets"], chance = 75 },
  { slot = "hands", classes = ["gloves"], chance = 50, from = 30 },
  { slot = "feet", classes = ["boots"], chance = 50, from = 30 },
  { slot = "cloak", classes = ["cloaks"], chance = 50, from = 40 },
  { slot = "neck", classes = ["amulets"], chance = 30, from = 50 },
  { slot = "left_ring", classes = ["rings"], chance = 30, from = 50, count = 2 },
]
magic = { base = 20, per_level = 1, most = 80 }
rare = { from = 20, base = 1, per_level = 0.5, most = 30 }
weapon_rank = { base = 1, per_level = 0.1, most = 8 }   # 1 + L/10
shield_rank = { per_level = 0.0667 }                    # L/15 in Sword and board, beside a shield
