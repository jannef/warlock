# Objects: things that lie on the floor and are picked up and carried (spec §7).
#
# Every object defines:
#   id        stable name used by level files (`objects = ["dagger", "arrow*12"]`)
#   name      singular, without an article ("dagger"); `plural` defaults to the name plus "s"
#   glyph     the character it is drawn with; fg its color
#   material  an id in materials.toml
#   weight    grams for one, at least 1
#   stackable several lie in one stack (coins, arrows); default false: a stack of one each
#
# Glyphs follow ADOM loosely: ) weapons, } missile weapons, / missiles, [ armor, ( tools,
# ! potions, ? scrolls, % food, * stones and gems, $ coins, = rings, " amulets.

# Weapons
[[object]]
id = "dagger"
name = "dagger"
glyph = ")"
fg = "#c8ccd4"
material = "steel"
weight = 450

