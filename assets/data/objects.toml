name = "dagger"
glyph = ")"
fg = "#c8ccd4"
material = "steel"
weight = 450
slot = "main_hand"
damage = "1d4"
threat = 20
# Balanced for throwing: it tumbles end over end.
range = 5
missile = "†"
spins = true

