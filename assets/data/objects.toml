# Objects: things that lie on the floor and are picked up and carried (spec §7).
#
# Every object defines:
#   id        stable name used by level files (`objects = ["dagger", "arrow*12"]`)
#   name      singular, without an article ("dagger"); `plural` defaults to the name plus "s"
#   glyph     the character it is drawn with; fg its color
#   material  an id in materials.toml
#   weight    grams for one, at least 1
#   stackable several lie in one stack (coins, arrows); default false: a stack of one each
#
# Things that can be worn or wielded also say where they go (equipment, slots.toml):
#   slot       the slot it goes in, by id (`slot = "body"`), or what a slot fits (`slot = "ring"`
#              goes on either hand); none: it cannot be worn or wielded
#   two_handed takes both hands (main and off hand); default false
#   ammo       the kind of ammunition it is (`ammo = "arrow"`)
#   launches   the kind of ammunition a missile weapon shoots (`launches = "arrow"`); launchers
#              and ammunition pair by that kind, and some object must be that kind of ammunition
#
# Weapons and armour say what they do in a fight (spec §8 "Combat"; only for things with a slot):
#   damage     a weapon's damage dice (`1d8`); a launcher's are those of its shots and carry its
#              draw weight (`1d8+2`). Melee blows add the wielder's Strength modifier; shots add
#              nothing. A missile weapon must have them
#   threat     the lowest natural roll (2d12, 2 to 24) that threatens a critical: 22 (the
#              default) for most weapons, 20 for swords and daggers, 19 for the keenest
#   crit       how many times a confirmed critical rolls the damage: 2 (default) to 5
#   to_hit     a weapon's own bonus to hit (default 0)
#   strength   the Strength a bow needs: each point short is -1 to hit and -1 damage
#   parry      Defence while wielded (the Parry category)
#   armour     Defence while worn (the Armour category); max_dex the most a worn armour lets
#              Dexterity add to Defence
#   shield     Defence while held (the Shield category)
# Within a category only the best bonus counts.
#
# Ranged combat (spec §8 "Ranged combat"; fire with `f`, throw with `t`):
#   range      how far a missile weapon shoots, in cells (required for one); anything else with a
#              range is a throwing weapon, thrown that far, with its own `damage` (it needs no
#              slot: a rock). Ammunition takes its range from the missile weapon
#   reloads    a missile weapon reloaded after every shot (a crossbow): each shot takes the
#              `reload` action too (actions.toml)
#   breaks     the chance in percent that a missile (ammunition, a throwing weapon) breaks when it
#              hits; one that does not comes down where it stopped, to be picked up again
#   lit        lit as it is loosed: it flies and comes down as this object (a flaming arrow flies
#              as a burning arrow)
#   light      the light preset (lights.toml) it gives while it burns where it lies, and
#   burns      for how many seconds of game time it burns there; then it is gone. A burning
#              object cannot be picked up
# Presentation only (no rule reads them):
#   missile    the glyph it flies as, drawn pointing right and turned along its flight (default:
#              its own glyph, upright)
#   spins      it tumbles as it flies (a thrown dagger)
#   glow       how much its glyph glows where it lies (0 to 1)
#   [[object.particles]] emitters (terrain.toml has the fields): `ambient` while it lies in view
#              on top of its pile, `flight` while it flies
#
# Food (spec §8 "Hunger"; eat with `E`):
#   food       { nutrition = N, turns = T }: the nutrition points it gives (1 to 100000; a human
#              burns 1440 a day, hunger.toml) and the turns of eating it takes (1 to 100, each the
#              `eat` action); never on things worn, wielded, shot, thrown, or burned
# Corpses are not listed here: every creature that leaves one has its own (`kobold_corpse`), made
# from creatures.toml and hunger.toml, and only creatures that die leave them.
#
# Glyphs follow ADOM loosely: ) weapons, } missile weapons, / missiles, [ armor, ( tools,
# ! potions, ? scrolls, % food, * stones and gems, $ coins, = rings, " amulets.

# Weapons
