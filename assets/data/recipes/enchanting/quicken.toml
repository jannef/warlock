# Quicken (docs/design/enchanting.md §8; docs/dev/enchanting.md "The recipes"): one affix more,
# of the crystal's families and of the kind it lacks, on a magic item carried with one affix and
# room for another (its capacity). A rare with room takes a heart-crystal carried
