# Miscasts (#1271, #1288; spec §8 "Spells": "Miscasts"; `world/magic/miscast.rs`; the miscasts design
# docs/design/miscasts-review.md): every spell cast with the caster's own mana, the player's or a
# creature's, makes a Spellcraft check once it has gone off. Scrolls, wands, and flasks make none:
# their magic is the item's.
#
# The check rolls 2d12 + the modifier of `stat` + Spellcraft's `cast` points (skills.toml: +2 at
# 20, +14 at 100, +22 at 200, +40 at 999; magic items and talents that raise Spellcraft count) against:
#
#   difficulty = base + per_level × the spell's level
#                + 1 for each `armour_percent` percent the armour worn adds to a spell's cost
#                  (after Battle caster's ease)
#                − rank_ease × the caster's rank in the spell above the first (a creature's
#                  spells are rank 1)
#
# A natural 2 (1 and 1) always fails, whatever the bonus. A failure is a miscast: the spell has
# already gone off in full, and then the caster rolls on the miscast table (miscasts/):
#
#   total = `die` + per_margin × how far the check fell short
#           − Spellcraft's `ward` points (skills/: 10 at 100, 20 at 200)
#           − the stance's `miscast` (stances.toml: Defensive 5, Aggressive −5, Frenzy −10)
#
# at least 1. Higher totals are worse: the miss carries the total, the die is the small variance.
# An entry whose `to` is below `safe_below` is protected: its harm never takes the caster below 1
# hit point, and the loader refuses one that would backfire, drain, summon, lay a fire zone, or
# put on a status that ticks (miscasts/README.toml). Only a spell about ten levels beyond what
# the caster's Spellcraft and rank carry reaches the rows above it.
stat = "intelligence"
base = 8
per_level = 1
armour_percent = 10
rank_ease = 1
die = "2d12"
per_margin = 5
safe_below = 71
# "Near the caster", for a swap and a boon: within this many steps (Chebyshev) in a clear line.
# 1 to 40.
near = 6
# A backfired summon (`backfire` on a call; `world/magic/backfire.rs`) brings its creatures in this
# faction, not their own kind's: the berserk, hostile to everyone, the caster, the caster's foes,
# and one another alike (#1311). Left out: their type's own faction.
backfire_faction = "berserk"
