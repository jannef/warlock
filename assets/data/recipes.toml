# Recipes (spec §8 "Skills": professions; docs/design/professions.md §6, docs/dev/crafting.md): what
# the professions make, one file a recipe under `recipes/<skill>/`, the directory the profession.
# A skill with a directory of recipes is a profession: the abilities menu lists one row for it,
# "Metalcraft…", which opens its screen of recipes. Recipes are known by skill value, never
# learned.
#
# This file holds what the professions share (docs/design/recipes.md §10). Each profession's line
# in the abilities menu (a profession without one shows its skill's description):
#
#   [[profession]]
#     skill        the skill (skills.toml) whose directory it is
#     description  the abilities menu's line for its row
#
# and the bands the making reads (each above the last; used from the phases that make things):
#
#   fine, marvellous, masterwork  the check's margin from which a made item is Fine, Marvellous,
#                a Masterwork (docs/design/recipes.md §4; below `fine` it is plain)
#   cut_step     the margin a gem's cut rises by, a cut a step (§5)
#   half_within  how far below the difficulty a counted recipe (arrows) still makes half its count
#   one_within   ... still makes one (both as fletch.toml's, which the arrows recipe retires)
#   yield        the percent of the stock and object inputs a failure gives back
#   free_wood    the landscapes where wood is free: an arrow's shaft takes no billet
#
# A recipe file, `recipes/<skill>/<id>.toml`, holds one [[recipe]]:
#
#   id          its file name (unique across professions); `craft:ID` names it
#   name        the row's name (default: the result's name, or the action's for a `use` recipe)
#   use         a built-in recipe: `temper`, `whittle`, `fletch`, `cut`, or `set` (Jewelcraft's;
#               Set listed "not usable yet" until its phase). Its row runs that action, with its
#               own list and rules; it takes no result, parts, inputs, ornament, failure, fumble,
#               or brittle, and a `difficulty` and `seconds` only for `cut` and `set`, which
#               must give both (the others keep theirs in temper.toml and fletch.toml)
#   result      { object = "long_sword", count = 1 }: what is made (`count` dice, or "fletch" for
#               Fletch's count; above 1 only for a stackable object)
#   [recipe.parts]  the result's parts the maker chooses (`main` is the first part; a part not
#               listed is the base item's material):
#                 blade = "stock"    a stack of stock of the profession whose material the part
#                                    may be made of
#                 head = { input = "arrowhead", stock = ["bone", "stone"], optional = true }
#                                    one step offering, in order, the stacks of that input (an
#                                    input of the recipe, its material on the part's list), then
#                                    stock of the listed groups or materials (any profession's;
#                                    each on the part's list: a recipe narrows, never widens),
#                                    then None if `optional`; `input` or `stock` or both
#                 setting = { gem = true }   a cut loose gem, required (the part may be a gem)
#   inputs      used up (nothing on the result is made of the stock ones): `{ object =
#               "arrowhead", count = 20, per_made = true }`, `{ material = "sinew", count = 1 }`,
#               or `{ group = "metal", count = 1 }` (any one material of the group; never a gem)
#   ornament    true: an optional gem for the result's ornament part
#   difficulty  the check's base
#   seconds     the work's time (1 or more)
#   station     a terrain that must stand beside the maker (`anvil`)
#   knife       true: a knife carried
#   launcher    true: a bow or crossbow ready that fletching makes ammunition for
#   from        the trained value the recipe is listed from (default 0)
#   anyone      true: listed for those untrained in the skill too
#   failure     { object = "murky_draught" }: what a failed check makes instead of nothing (a
#               stackable object; the inputs are then spent whole)
#   fumble      { object = "brewers_blunder" }: what a natural 2 makes (a stackable object)
#   brittle     the object made when an `optional` part is None; a recipe with an `optional`
#               part names one, and only such a recipe
#
# Only built-in recipes exist yet; generic ones (the forge, arrows) come with the phases of the
# professions design that make them.

fine = 6
marvellous = 12
masterwork = 20
cut_step = 5
half_within = 3
one_within = 6
yield = 50
free_wood = ["forest", "dense_forest", "swamp"]

[[profession]]
skill = "jewelcraft"
description = "Your work as a gem cutter."

[[profession]]
skill = "metalcraft"
description = "Your recipes as a smith."

[[profession]]
skill = "woodcraft"
description = "Your recipes as a woodworker."
