rain = 15
heavy_rain = 5

# What each weather does (clear weather is the sky as it is):
#   direct   percent of the direct light of the sun and the moons that gets through the clouds
#            (1 to 100): shadows grow faint
#   sky      percent of the sky's own light that gets through (1 to 100)
#   scatter  percent of the direct light the clouds spread over the whole sky (0 to 100): soft
#            sky light, in the shade too, so the light is flat and grey
#   sight    cells of sight lost on the overworld (0 to 8; never below the 2 of a dark night)
# Presentation only (particle emitters as in terrain.toml, `ambient`, `rate` per cell and second;
# off with the `weather` effect switch):
#   drops    rain falling on every visible cell under the open sky (never under a roof)
#   splash   drops splashing on visible open ground
#   ripples  rings on visible still water
# `opacity` keeps them faint: rain is felt more than seen.

[overcast]
direct = 35
sky = 85
scatter = 15

[rain]
direct = 22
sky = 70
scatter = 12
sight = 2

[rain.drops]
glyphs = "│"
colors = ["#a4b6c8"]
rate = 0.3
life = 0.14
velocity = [-4.0, 16.0]
spread = [0.3, 1.5]
offset = [0.56, -2.24]
area = [0.5, 0.5]
scale = 0.6
fade = 0.4
opacity = 0.35

[rain.splash]
glyphs = "·"
colors = ["#9aacbe"]
rate = 0.1
life = 0.25
velocity = [0.0, -1.5]
gravity = 10.0
offset = [0.0, 0.2]
area = [0.4, 0.2]
scale = 0.6
fade = 0.6
opacity = 0.45

[rain.ripples]
