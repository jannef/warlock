# Weather (spec §5 "Weather", §7). One weather over every level under the open sky (outdoor areas
# and the overworld; never dungeons), changing every three hours or so: clear, overcast, rain, or
# heavy rain. It follows from the run's seed and the time alone, so it is the same however the
# time passes. Weather lasts: it mostly changes to a neighboring kind (clear and overcast, overcast
# and rain, rain and heavy rain), and the light dims and brightens over an hour as the clouds come
# and go. Without this file the sky is always clear.
#
# Chances of each weather in percent, one [[month]] per month in calendar order (exactly 12, see
# calendar.toml); each month's chances add up to 100. Over many days each weather comes up exactly
# as often as its chance says. (Snow may come later; for now winter rains too.)

[[month]] # Frostmere
clear = 40
overcast = 40
rain = 15
heavy_rain = 5

[[month]] # Thawmonth
clear = 35
overcast = 35
rain = 22
heavy_rain = 8

[[month]] # Seedtide
clear = 40
overcast = 30
rain = 22
heavy_rain = 8

[[month]] # Rainmoon: the wettest month
clear = 20
overcast = 30
rain = 35
heavy_rain = 15

[[month]] # Greenleaf
clear = 40
overcast = 30
rain = 22
heavy_rain = 8

[[month]] # Highsun: the driest month
clear = 70
overcast = 18
rain = 9
heavy_rain = 3

[[month]] # Emberheat: dry, with a rare downpour
clear = 65
overcast = 20
rain = 10
heavy_rain = 5

[[month]] # Harvestide
clear = 55
overcast = 25
rain = 14
