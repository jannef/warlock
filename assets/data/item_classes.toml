# Item classes (spec §7 "Objects and materials"; #189), as in ADOM: what kind of thing an object
# is. Every item list (the inventory, picking up, dropping, what to eat or throw, what goes in an
# equipment slot) groups its items by class, in the order of this file, each class under a header
# with its name; within a class, items keep their order. Shops sell and buy by class (shops.toml).
#
# Every object names its class (`class` in objects/). Each [[class]]:
#   id       what objects and shops name it by
#   name     the header item lists show
#   kinds    the magic item kinds (`kind` in objects/) of its objects: an object of one of these
#            kinds must be of this class, and each kind is of one class only
#   corpses  corpses are of this class (one class; needed where creatures leave corpses)
#   group    the word a vault's loot pool names it by with its fellows (`loot = { pool = "armour" }`
#            in a vault's legend, docs/dev/content.md)

[[class]]
id = "melee_weapons"
name = "Melee weapons"
kinds = ["weapon"]
group = "weapons"

[[class]]
id = "missile_weapons"
name = "Missile weapons"
kinds = ["launcher"]
group = "weapons"

[[class]]
id = "missiles"
name = "Missiles"
kinds = ["ammo"]
group = "weapons"

[[class]]
id = "shields"
name = "Shields"
kinds = ["shield"]
group = "armour"

[[class]]
id = "body_armour"
name = "Body armour"
kinds = ["body"]
group = "armour"

[[class]]
id = "helmets"
name = "Helmets"
kinds = ["helmet"]
group = "armour"

[[class]]
id = "cloaks"
name = "Cloaks"
kinds = ["cloak"]
group = "armour"

[[class]]
id = "gloves"
name = "Gloves"
kinds = ["gloves"]
group = "armour"

[[class]]
id = "boots"
name = "Boots"
kinds = ["boots"]
group = "armour"

# Clothing (#1173): everyday clothes and shoes for the body and the feet, no Defence and no
# Protection, what a new character is dressed in; never magic, never loot.
[[class]]
id = "clothing"
name = "Clothing"

[[class]]
id = "rings"
name = "Rings"
kinds = ["ring"]
group = "jewellery"

[[class]]
id = "amulets"
name = "Amulets"
kinds = ["amulet"]
group = "jewellery"

[[class]]
id = "light_sources"
name = "Light sources"

[[class]]
id = "tools"
name = "Tools"
kinds = ["tool"]

# Household goods (#483): candlesticks, teapots, brooms; what an animated household thing is made
# of and leaves behind.
[[class]]
id = "household"
name = "Household goods"

[[class]]
id = "food"
name = "Food"
corpses = true

[[class]]
id = "potions"
name = "Potions"

[[class]]
id = "scrolls"
name = "Scrolls"

# Wands (spec §8 "Magic items": "Wands"): a spell and its charges, used from the missile weapon
# slot.
[[class]]
id = "wands"
name = "Wands"

# Rods (spec §8 "Magic items": "Rods"): an effect no spell has, paid in the user's mana, used
# from the missile weapon slot.
[[class]]
id = "rods"
name = "Rods"

# Material stock (the design: docs/design/professions.md §3): pieces of a material, by weight,
# what salvage gives and recipes take ("a steel ingot", stock.toml).
[[class]]
id = "materials"
name = "Materials"

[[class]]
id = "gems"
name = "Gems"
group = "money"

[[class]]
id = "coins"
name = "Coins"
group = "money"

[[class]]
id = "miscellaneous"
name = "Miscellaneous"
