# Dungeon branches (spec §7): stacks of procedurally generated levels. This file is the field
# reference: the branches are a campaign's, in its data/dungeons/ (the showcase's Depths:
# campaigns/showcase/data/dungeons/showcase.toml; spec §3). Stairs lead into a branch
# with `to = "<id>:<depth>"` (e.g. `to = "depths:1"`), and a scenario may start in one. Each level
# is generated on its first visit from the run seed and its id, then persists like a hand-made
# level. Its `<` leads one level up (on depth 1: back where the player came from), its `>` one
# level down (the deepest level has none).
#
# Fields:
#   id         branch id; its levels are "<id>:1" to "<id>:<depth>"
#   name       level names are "<name> <depth>" (default: the id)
#   generator  "rooms" (rooms and corridors, ADOM-like) or "caves" (cellular automata)
#   depth      number of levels
#   size       [width, height]
#   creatures  creature ids generators may place on patrol (default none)
#   traps      trap ids (data/traps.toml) generators hide on each level, all hidden, never on or
#              next to stairs nor on a patrol; an id named twice comes up twice as often
#              (default none)
#   traps_per_level  [least, most] traps a level gets (default [2, 4])
#   secret_doors  [least, most] doors the rooms generator hides on a level (secret doors, spec
#              §8 "Searching"; default none): only doors the stairs and every key are reached
#              without, so a level may get fewer
#   hidden_per_depth  how much harder its hidden features (secret doors, hidden traps) are to
#              find for each level below the first (0 to 5, default 0)
#   locks_per_depth  how much harder its locks are to pick (spec §8 "Doors") for each level below
#              the first, on top of the lock's own difficulty (14 unless a vault gives it one; 0
#              to 5, default 0)
#   loot       [fewest, most] items of loot on the floor of each level, rolled at the depth as
#              item level (spec §8 "Magic items"; default none)
#   ambient    [r, g, b, uv] light everywhere (default none)
#   temperature  °C on its levels (spec §5 "Temperature"; -40 to 40, default 10, the dungeon
#              default): water there freezes below 0
#   key        a key (objects.toml, spec §8 "Doors"): the rooms generator locks the door of up to
#              two rooms that have only one, with the lock this key opens, and leaves the key
#              where the player reaches it without unlocking anything (default none: no locks)
#   danger     how dangerous its floors are (spec §7 "Danger levels"; default none: 0, and
#              nothing comes): `danger = 4` is `{ base = 4, per_depth = 1 }`, the floor at depth d
#              `base + (d - 1) × per_depth` (base 0 to 99, per_depth 0 to 5); `player = {
#              percent, from, max }` adds percent % of each player level past `from`, at most
#              `max` (an area that grows with the player). With a danger, also:
#   population  creature ids that live there (default `creatures`); each type's level is its
#              danger, and draws favour types at about the floor's
#   population_count  how many a floor holds: a number, or `{ per_1000, least, most }` by its
#              walkable cells (default { per_1000 = 35, least = 25, most = 80 }; at most 200)
#   out_of_depth  percent of draws made 1 to 3 dangers deeper (default 5)
#   spawn      `{ every = "15m", chance = 60, cap = N }` (the defaults; cap: the population):
#              while the player is on a floor, every `every` a creature comes with `chance` %
#              unless the floor holds `cap` creatures hostile to the player
#   room_effects  the branch's own special-room odds (spec §7 "Special rooms"), a table:
#              `chance` (percent a room is special, 0 to 100), `per_level` (at most this many a
#              level, 1 to 8), `effects` (ids in room_effects.toml, picked uniformly; not empty
#              while `chance` is above 0); each field defaults to room_effects.toml's (`effects`:
#              all of them), e.g. `room_effects = { chance = 25, effects = ["flooded"] }`
#   shops      the branch's own shop odds (spec §7 "Shops"), a table: `chance` (percent of its
#              rooms levels with a shop, 0 to 100), `kinds` (ids in shops.toml, picked
#              uniformly), `names` (the keepers' names), `keeper` (the keepers' creature type;
#              they carry the shared `[keeper]`'s kit); each field defaults to shops.toml's,
#              e.g. `shops = { chance = 0 }` for none
#   [[dungeon.levels]]  per-depth overrides, first match wins:
#              from, to (inclusive; default `from`), generator, size, temperature, danger,
#              room_effects, shops (each default the branch's; a danger here needs the branch's;
#              a table field by field)
#
# Generators build with the terrain void, wall, floor, door_closed, door_open, stairs_up,
# stairs_down, water, sconce, fungus and the light lamp, and stamp vaults (assets/vaults).
