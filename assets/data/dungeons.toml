# Dungeon branches (spec §7): stacks of procedurally generated levels. This file is the field
# reference: the branches are a campaign's, in its data/dungeons/ (the showcase's Depths:
# campaigns/showcase/data/dungeons/showcase.toml; spec §3). Stairs lead into a branch
# with `to = "<id>:<depth>"` (e.g. `to = "depths:1"`), and a scenario may start in one. Each level
# is generated on its first visit from the run seed and its id, then persists like a hand-made
# level. Its `<` leads one level up (on depth 1: back where the player came from), its `>` one
# level down (the deepest level has none).
#
# Fields:
#   id         branch id; its levels are "<id>:1" to "<id>:<depth>"
#   name       level names are "<name> <depth>" (default: the id)
#   arrival    a line said each time the player arrives on the first level by stairs (optional)
#   generator  "rooms" (rooms and corridors, ADOM-like) or "caves" (cellular automata)
#   depth      number of levels
#   below      a level of another bounded branch of the same campaign (`below = "fyrdelf:12"`):
#              the branch is a way up (spec §7 "Ways up"); its deepest level's `>` leads there,
#              that level gets a `<` back up near a vault it names, and its first level's `<`
#              climbs out to its way in, however it was entered (default none)
#   size       [width, height]
#   creatures  creature ids generators may place on patrol (default none)
#   traps      trap ids (data/traps.toml) generators hide on each level, all hidden, never on or
#              next to stairs nor on a patrol; an id named twice comes up twice as often
#              (default none)
#   traps_per_level  [least, most] traps a level gets (default [2, 4])
#   secret_doors  [least, most] doors the rooms generator hides on a level (secret doors, spec
#              §8 "Searching"; default none): only doors the stairs and every key are reached
#              without, so a level may get fewer
#   hidden_per_depth  how much harder its hidden features (secret doors, hidden traps) are to
#              find for each level below the first (default 0)
#   locks_per_depth  how much harder its locks are to pick (spec §8 "Doors") for each level below
#              the first, on top of the lock's own difficulty (14 unless a vault gives it one;
#              default 0)
#   loot       [fewest, most] items of loot on the floor of each level, rolled at the depth as
#              item level (spec §8 "Magic items"; default none)
#   chests     `{ chance, count }`: percent of its floors with chests and how many such
#              a floor gets, `[least, most]`, each of the floor's level, locked,
#              trapped, and filled by its band in data/chests.toml (spec §8 "Chests"; default
#              `{ chance = 20, count = [1, 1] }`: one floor in five has one)
#   ambient    [r, g, b, uv] light everywhere (default none)
#   temperature  °C on its levels (spec §5 "Temperature"; default 10, the dungeon
#              default): water there freezes below 0
#   key        a key (objects.toml, spec §8 "Doors"): the rooms generator locks the door of up to
#              two rooms that have only one, with the lock this key opens, and leaves the key
#              where the player reaches it without unlocking anything (default none: no locks)
#   danger     how dangerous its floors are (spec §7 "Danger levels"; default none: 0, and
#              nothing comes): `danger = 4` is `{ base = 4, per_depth = 1 }`, the floor at depth d
#              `base + (d - 1) × per_depth` (at most 99 a floor); `player = {
#              percent, from, max }` adds percent % of each player level past `from`, at most
#              `max` (an area that grows with the player). With a danger, also:
#   population  creature ids that live there (default `creatures`); each type's level is its
#              danger, and draws favour types at about the floor's
#   population_count  how many a floor holds: a number, or `{ per_1000, least, most }` by its
#              walkable cells (default { per_1000 = 35, least = 25, most = 80 })
#   stray      percent of draws made from the generic creature list instead of `population`
#              (default `[defaults]`'s): every type of this campaign or of none that
#              is hostile to the player, no unique, no animated object, and not marked
#              `stray = false`, whether a population names it or not, and every type that lives
#              in some branch or level with a danger of this campaign or of none, uniques left
#              out (people, shopkeepers, and guardians are not hostile or are unique, so they
#              never stray); 0: only its own folk come
#   stray_pool  where the strays come from: "all" (the default, as above) or "populations"
#              (only the types living in some branch or level with a danger of this campaign
#              or of none, uniques left out: a branch whose folk are a design's table)
#   out_of_depth  percent of draws made out of depth (default `[defaults]`'s): one
#              danger deeper, then `deeper` % again and again one deeper still, at most
#              `deeper_cap` times; where `population` weighs nothing that deep (all too weak),
#              the generic list is drawn there instead
#   deeper     percent of each further step deeper (default `[defaults]`'s)
#   deeper_cap  the most steps past the first (default `[defaults]`'s)
#   neutral    the weight, in percent of its own (default `[defaults]`'s), that a
#              type not hostile to the player by default (wildlife and the like) keeps in the
#              draws of a floor's population and its timed spawns; the hostile types take the
#              rest (a vault's pools and a teeming den draw as before)
#   dread_one_in  one draw in this many (0: none, default `[defaults]`'s) is made among the
#              dread types alone (a creature's `dread = true`), each by its level and rarity,
#              and every other draw among the rest; where the side rolled has nothing to draw,
#              the draw is made among the other. A vault's monster pool rolls none
#   spawn      `{ every = "15m", chance = 60, cap = N }` (the defaults; cap: the population):
#              while the player is on a floor, every `every` a creature comes with `chance` %
#              unless the floor holds `cap` creatures hostile to the player
#   room_effects  the branch's own special-room odds (spec §7 "Special rooms"), a table:
#              `chance` (percent a room is special), `per_level` (at most this many a level),
#              `favoured` (`{ id = share }`, ids in room_effects.toml, each its fixed percent of
#              the draws) and `banned` (ids never drawn); each field defaults to
#              room_effects.toml's, e.g. `room_effects = { chance = 25, favoured = { flooded = 40 } }`
#   shops      the branch's own shop odds (spec §7 "Shops"), a table: `chance` (percent of its
#              rooms levels with a shop), `kinds` (ids in shops.toml, picked
#              uniformly), `names` (the keepers' names), `keeper` (the keepers' creature type;
#              they carry the shared `[keeper]`'s kit); each field defaults to shops.toml's,
#              e.g. `shops = { chance = 0 }` for none
#   [[dungeon.levels]]  per-depth overrides, first match wins:
#              from, to (inclusive; default `from`), generator, size, temperature, danger,
#              dread_one_in, room_effects, shops (each default the branch's; a danger or a
#              dread_one_in here needs the branch's danger; a table field by field), and `vaults` (vault ids, shared or the branch's
#              campaign's: each stamped on every level of the range for certain, and never drawn
#              at random anywhere, e.g. `vaults = ["drakes_hoard"]`)
#
# [defaults] (this file only; required once any branch or level has a danger): the odds every
# area with a danger draws by unless it gives its own `stray`, `out_of_depth`, `deeper`,
# `deeper_cap`, `dread_one_in`, and `neutral` (spec §7 "Danger levels"; `dread_one_in` defaults
# to 100, `neutral` to 100).
#
# Generators build with the terrain void, wall, floor, door_closed, door_open, stairs_up,
# stairs_down, water, sconce, fungus and the light lamp, and stamp vaults (assets/vaults).

[defaults]
# Percent of draws from the generic creature list.
stray = 5
# Percent of draws made out of depth: one danger deeper ...
out_of_depth = 5
# ... then this percent, again and again, one deeper still ...
deeper = 5
# ... at most this many times (a safety cap: ten more at 5 % each is one in 10^13).
deeper_cap = 10
# One draw in this many is made among the dread types alone, every other among the rest
# (docs/design/monster-dread.md §8; the owner: "let's increase the default to 1-in-100").
dread_one_in = 100
# Neutral animals keep this percent of their weight in a dungeon's draws (#1195; the owner: "it's
# a game about killing stuff, not Dwarf Fortress").
neutral = 10
