# Special rooms (spec §7 "Special rooms"), ADOM-like: a room of a generated level, or an area a
# hand-made level marks with `[[room]]`, can carry an effect that changes the rules while one is
# inside it. The first time the player enters one they are told (`enter`), and from then on look
# mode names the room ("in an echoing hall"). Numbers never reach the player.
#
# Generation: every room of a rooms level but the arrival room (and vaults), and each of eight
# chambers a cave level tries, is special with `chance` percent; at most `per_level` special
# rooms a level. The effect is drawn by the effects' `weight`s among those the room is eligible
# for (a dungeon may give some a fixed share, `favoured`, and ban others, `banned`: its
# `room_effects`). With 12 % and one a level, about three levels in five have one. A cave's
# special room is a blob of its floor, away from the arrival. Rarely the effect drawn covers the
# whole level instead (`level_chance`); a level file may name one (`effect = "..."`).
#
# The effects themselves are one file each under room_effects/ (fields:
# room_effects/README.toml).

chance = 12
per_level = 1
