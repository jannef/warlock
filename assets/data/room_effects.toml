# Special rooms (spec §7 "Special rooms"), ADOM-like: a room of a generated level, or an area a
# hand-made level marks with `[[room]]`, can carry an effect that changes the rules while one is
# inside it. The first time the player enters one they are told (`enter`), and from then on look
# mode names the room ("in an echoing hall"). Numbers never reach the player.
#
# Generation: every room of a rooms level but the arrival room (and vaults), and each of eight
# chambers a cave level tries, is special with `chance` percent; at most `per_level` special
# rooms a level. The effect is drawn by the effects' `weight`s among those the room is eligible
# for (a dungeon may give some a fixed share, `favoured`, and ban others, `banned`: its
# `room_effects`). With 12 % and one a level, about three levels in five have one. A cave's
# special room is a blob of its floor, away from the arrival. Rarely the effect drawn covers the
# whole level instead (`level_chance`); a level file may name one (`effect = "..."`).
#
# Fields of an effect:
#   id       the effect's id (level files name it: `[[room]] effect = "hushed"`)
#   name     what it is called, without an article ("echoing hall"), in look mode and the wiki
#   mark     one character marking its cells in the `rooms` dev dump layer
#   enter    the message the first time the player enters such a room
#   weight   how often it is drawn against the others where no dungeon says otherwise, 1 to 100;
#            default 10
#   near     the message the first time a cell of such a room comes into view from outside it;
#            default none
#   level_chance  percent of the levels that draw it for a room that it covers whole instead
#            (the room stays plain), 0 to 100; default 0. Needs `pervade`, and never with
#            `shunned` or `floor`
#   pervade  the message each time the player arrives on a level it covers whole
#   needs_danger  drawn only on a level with a danger; default false
#   needs_below   drawn only on a dungeon level with another below it; default false
#   min_cells, max_cells  drawn only for a room of at least / at most this many floor cells;
#            default no limit
#   light    percent of all light kept inside (ambient, sky, bounce, every source: placed lights,
#            carried ones, fires, the sun and the moons), 0 to 100; default 100
#   glow     light added over the room, [r, g, b, uv] (it lights the room like ambient light);
#            default none
#   noise    percent of the loudness of every noise made inside (steps, doors, attacks), 1 to
#            1000; default 100. Louder noises carry farther; at most 300 still.
#   regen    percent of the usual pace at which hit points come back inside, 1 to 1000;
#            default 100
#   mana_regen  percent of the usual pace at which mana comes back inside, 1 to 1000; default
#            100
#   shunned  creatures hostile to the player do not step into the room (they may still reach in
#            with a blow from its edge, or shoot into it); default false
#   floor    terrain generators lay over the room's floor (walkable, not stairs, doors, or
#            running water); a hand-made level draws its own
#   status   a status (status.toml) everyone inside holds, at least at one degree, while they
#            stay, creatures too; it eases by its own `eases` once they leave (at least 10
#            seconds a degree). One immune to its kind of damage never holds it; one with no mana
#            never holds a status that only touches mana
#   swarm    a teeming den (needs `needs_danger`; never a whole level): generators fill the room
#            with sleepers (status.toml `sleeps`: Asleep) drawn by the floor's danger from the
#            branch's population (hostile types, no uniques), and their hoard.
#            { per_cells, min, max }: one sleeper per `per_cells` floor cells, `min` to `max`
#            (1 to 64); `wake`: a noise wakes a sleeper at this percent of its hearing threshold
#            (100 to 1000); `cry`: how loud a waking sleeper cries out, which may wake the next
#            (0 to 300); `loot_level`: the hoard (an item per four sleepers, at least one) is
#            this many item levels above the floor's; `themes = { kind, faction }`: percent
#            chances that every sleeper is of one type (a warren) or of one faction (a tribe);
#            `factions`: faction ids (factions.toml): its sleepers are only of these, hostile or
#            not, and it is drawn only in a branch whose own population holds one (a beast den);
#            `hoard`: `items` (the default) or `corpses`: per four sleepers (at least one) a
#            fresh corpse of a creature drawn from the branch's population and a pile of bones
#   temperature  degrees Celsius added to the level's temperature inside, -40 to 40; default 0.
#            The room sets its cells' temperature and nothing else: what the temperature does
#            (ice today) is the environment's (spec §5 "Temperature"); the status bar shows it
#   burden   percent of everyone's carrying limit inside, 10 to 1000; default 100 (a heavy
#            hall's 50 halves it: what is carried weighs on one as if it were twice as heavy)
#   mirrors  a hall of mirrors: `{ images = N }` (1 to 8) reflections of everyone inside the player
#            sees, on free floor of the room, moving each turn; they look just like what they
#            reflect. A blow or a step into one meets only glass; a missile aimed at one flies on;
#            creatures outside shooting at the player inside may aim at one. Never the whole level
#   warp     percent chance, every step onto a cell inside (the player's or a creature's), that
#            the stepper is moved to a free cell of the level as a teleport trap moves its victim;
#            default 0
#   hoard    a tempting hoard (needs `needs_danger`; never a whole level): generators lay `items`
#            items (1 to 16) on its floor, `loot_level` item levels above the floor's. The first
#            stack the player lifts inside seals the room: every door of it shuts and locks (a lock
#            of the floor's level: picked, kicked, or opened with a skeleton key), and `guardians`
#            = [least, most] (at most 16) hostiles of the level's danger + `danger` come at the
#            room's edges, out of the player's view where they can be
#   collapse a collapsed floor (needs `needs_below`; never the whole level): `{ chance, damage }`,
#            the percent chance (0 to 100) that a step of the player onto a cell inside gives
#            way, doubled while they are Burdened or worse, and the dice they take as they land
#            on the level below (they can kill); they land Staggered. A generator cracks only
#            the room's middle (`floor` there, never beside a wall, door, or its edge)
#   rise     a cursed room: `{ faction, after }`: a creature that dies inside, is not of
#            `faction` (factions.toml), and leaves a corpse rises from its corpse `after` (a
#            duration, 1s to 1h) as a creature of `faction` of its level (else the nearest level,
#            the lower on a tie), unless the corpse is gone from where it died by then. Needs
#            `needs_danger`
#   unholy   Consecrate (the priest's and the paladin's) lifts it for good: the room becomes
#            plain, or the whole level does; default false
#   feature  a terrain (not walkable, transparent) generators place at the free floor cell nearest
#            the room's middle, never where it would cut the room's floor apart; a hand-made level
#            draws its own. Never the whole level
#   sides    the room has a hidden side, good, neutral, or evil (drawn one to two to one; a level
#            file's `[[room]]` gives it: `side = "evil"`), which its feature shows by its light:
#            { good = LIGHT, evil = LIGHT } (lights.toml; a side left out keeps the terrain's)
#   offers   what the player may do beside the feature, in the abilities menu's Here group:
#            { pray = TABLE }, an outcome table in data/outcomes/ (Pray: spec §7 "Special rooms")

chance = 12
per_level = 1

[[effect]]
id = "shadowed"
name = "shadowed room"
mark = "s"
enter = "The light seems to drain away here."
weight = 10
light = 30

[[effect]]
id = "echoing"
name = "echoing hall"
mark = "e"
enter = "Your footsteps echo loudly."
weight = 8
noise = 200

[[effect]]
id = "hushed"
name = "hushed chamber"
mark = "h"
enter = "A deep hush fills this room."
weight = 8
noise = 40

[[effect]]
id = "sanctuary"
name = "sanctuary"
mark = "p"
enter = "You feel at peace here."
weight = 6
regen = 300
mana_regen = 300
glow = [60, 44, 22, 0]
shunned = true

[[effect]]
id = "flooded"
name = "flooded room"
mark = "f"
enter = "The floor here is flooded."
weight = 8
floor = "shallow_water"

[[effect]]
id = "black"
name = "black chamber"
mark = "b"
enter = "The dark here swallows your light."
weight = 5
light = 0

[[effect]]
id = "draining"
name = "draining room"
mark = "d"
enter = "You feel your power seeping out of you."
weight = 6
level_chance = 5
pervade = "Something here drinks at your power."
glow = [10, 6, 24, 8]
status = "ebbing"
unholy = true

# A teeming den: a room full of sleeping creatures of the floor's danger, and their hoard. They
# wake to noise, a blow, or a waking neighbour's cry, never by themselves.
[[effect]]
id = "teeming"
name = "teeming den"
mark = "t"
near = "A warm, rank smell drifts out of the dark ahead."
enter = "You hear slow breathing all around you."
weight = 8
needs_danger = true
min_cells = 16
swarm = { per_cells = 4, min = 4, max = 16, wake = 200, cry = 60, loot_level = 1, themes = { kind = 10, faction = 20 } }

[[effect]]
id = "hot"
name = "sweltering chamber"
mark = "o"
enter = "A wave of heat meets you."
weight = 5
glow = [30, 10, 0, 0]
temperature = 25

[[effect]]
id = "cold"
name = "frigid hall"
mark = "c"
enter = "Your breath mists in the bitter cold."
weight = 5
glow = [0, 8, 22, 0]
temperature = -25

[[effect]]
id = "silent"
name = "silent vault"
mark = "v"
enter = "Your footsteps make no sound at all."
weight = 5
noise = 1
status = "silenced"

[[effect]]
id = "heavy"
name = "heavy hall"
mark = "w"
enter = "Your pack drags at you, as if the stones pulled it down."
weight = 4
burden = 50

[[effect]]
id = "mirrors"
name = "hall of mirrors"
mark = "m"
enter = "Your reflection stares back at you from every side."
weight = 3
max_cells = 80
mirrors = { images = 2 }

[[effect]]
id = "unstable"
name = "unstable room"
mark = "u"
enter = "The floor shimmers under your feet."
weight = 4
max_cells = 60
warp = 10

# A beast den: a teeming den of animals and fen things only (the factions wildlife, vermin, and
# marsh, hostile or not), drawn only in a branch whose population holds one. Its hoard is what
# they dragged in: bones and fresh corpses of the branch's creatures (`loot_level` unused).
[[effect]]
id = "beast_den"
name = "beast den"
mark = "n"
near = "You smell musk and old blood."
enter = "Heavy shapes breathe in the dark around you."
weight = 5
needs_danger = true
min_cells = 16
swarm = { per_cells = 4, min = 4, max = 16, wake = 200, cry = 60, loot_level = 0, themes = { kind = 10, faction = 20 }, factions = ["wildlife", "vermin", "marsh"], hoard = "corpses" }

[[effect]]
id = "hoard"
name = "treasure room"
mark = "$"
near = "Something glitters ahead."
enter = "Treasure lies here, unguarded."
weight = 5
needs_danger = true
hoard = { items = 3, loot_level = 3, guardians = [2, 4], danger = 1 }

[[effect]]
id = "collapsed"
name = "collapsed floor"
mark = "k"
near = "The floor ahead is cracked and sagging."
enter = "The floor creaks under your weight."
weight = 3
needs_below = true
floor = "cracked_floor"
collapse = { chance = 15, damage = "2d6" }

# A cursed room: the dead killed inside rise two minutes later as undead of their level, unless
# their corpse is taken or eaten first. Consecrate lifts it, and the draining room.
[[effect]]
id = "cursed"
name = "cursed room"
mark = "g"
near = "A cold draught smells of the grave."
enter = "The air is cold and the dead are near."
weight = 6
needs_danger = true
level_chance = 5
pervade = "The dead do not rest on this level."
rise = { faction = "undead", after = "2m" }
unholy = true

# A forgotten altar (spec §7 "Special rooms"): ADOM's pool with another flavour. Pray beside it;
# its glow's colour is its hidden side. data/outcomes/forgotten_altar.toml has what a prayer draws.
[[effect]]
id = "altar"
name = "altar room"
mark = "a"
enter = "An old altar stands here, its god long forgotten."
near = "A faint glow rises from an altar ahead."
weight = 8
min_cells = 9
feature = "forgotten_altar"
sides = { good = "altar_good", evil = "altar_evil" }
offers = { pray = "forgotten_altar" }

# A forge (spec §7 "Special rooms"): a cold forge with an anvil. Temper beside it: ten minutes'
# work on a weapon or armour you carry, which may improve it, flaw it, or break it; Metalcraft
# leans the odds. data/outcomes/forge.toml has what tempering draws. Never spent.
[[effect]]
id = "forge"
name = "forge"
mark = "F"
enter = "A cold forge, and an anvil waiting."
near = "You smell old soot and cold iron."
weight = 3
min_cells = 9
feature = "anvil"
offers = { temper = "forge" }

# A shrine of a side (design §9.3): good or evil, one to one, shown only by its stone's light.
# One of its side heals twice as fast inside; one of the other is Unwelcome (status.toml); a
# neutral one is ignored. Creatures too, by their own side.
[[effect]]
id = "shrine"
name = "shrine"
mark = "i"
enter = "An old shrine. It ignores you."
weight = 4
min_cells = 9
feature = "shrine_stone"
sides = { good = "altar_good", evil = "altar_evil" }
shrine = { regen = 200, status = "unwelcome", welcome = "You feel welcome here.", unwelcome = "Something here wants you gone." }

# A scriptorium (spec §7 "Special rooms"): shelves at its middle, a few scrolls on its floor, and
# studying inside earns Decipher script's training marks twice as often.
[[effect]]
id = "scriptorium"
name = "scriptorium"
mark = "r"
near = "You smell dust and old vellum."
enter = "Shelves of rotting scrolls line the walls."
weight = 5
min_cells = 9
feature = "shelves"
loot = { class = "scrolls", count = [2, 4] }
train = { decipher_script = 200 }
