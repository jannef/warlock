# Terrain types. Colors are the fully lit appearance; lighting darkens and tints them.
# Fields: id, name, glyph, fg, bg (default black), walkable (default true),
# transparent (default true), move_cost (time to step onto it, in percent of the level's turn;
# default 100), opens_to / closes_to (doors), stairs ("up"/"down"),
# light (a preset in lights.toml the terrain emits), bounce (gameplay, spec §5: the tint of the
# light the surface bounces, "#rrggbb", default white = neutral), height (gameplay, spec §5
# "Sunlight": how many cells tall it stands for sun shadows, 0 to 4; default 1 if opaque, else 0),
# roofed (gameplay: under a roof, never lit by the sun or the sky; default false),
# anim (presentation-only, §4.3).
# Terrain with a "flow" anim is running water: every cell of it needs a flow direction from the
# level legend (the arrows in legend.toml).
# Presentation-only effects (spec §4.8): glow (0-1, the glyph blooms), haze (0-1, heat haze rises
# above the cell), and [[terrain.particles]] emitters:
#   on        "ambient" (default; `rate` per second while in view), "step" (a burst of `count` when
#             a creature is seen stepping in), "toggle" (a burst when a door is seen opening or
#             closing into this terrain), or "obstacle" (running water only: `rate` per second
#             where the flow runs into anything but running water; turned with the flow, so `y`
#             points downstream)
#   glyphs    glyphs to pick from; colors: color stops over the particle's life
#   life      seconds; velocity [x, y] cells/s (y down) ± spread [x, y]; gravity cells/s² (down)
#   offset    start [x, y] cells from the cell; area: random spread ± [x, y] cells around it
#   sway      sideways drift in cells; scale: glyph size
#   fade      fraction of the life spent fading out (default 0.5); glow: 0-1

[[terrain]]
id = "void"
name = "solid rock"
glyph = " "
fg = "#000000"
walkable = false
transparent = false

[[terrain]]
id = "floor"
name = "stone floor"
glyph = "."
fg = "#6a6a72"
bg = "#0d0d10"

[[terrain]]
id = "wall"
name = "stone wall"
glyph = "#"
fg = "#958c80"
bg = "#262220"
walkable = false
transparent = false

[[terrain]]
id = "door_closed"
name = "closed door"
glyph = "+"
fg = "#c08040"
bg = "#2a1a0e"
walkable = false
transparent = false
opens_to = "door_open"

# Dust shaken loose when the door swings.
[[terrain.particles]]
on = "toggle"
glyphs = "·.,"
colors = ["#8a806c", "#4a4438"]
count = 5
life = 0.7
velocity = [0.0, 0.2]
spread = [0.9, 0.4]
gravity = 0.4
area = [0.35, 0.4]
scale = 0.7
fade = 0.6

[[terrain]]
id = "door_open"
name = "open door"
glyph = "'"
fg = "#c08040"
bg = "#0d0d10"
closes_to = "door_closed"

[[terrain.particles]]
on = "toggle"
glyphs = "·.,"
colors = ["#8a806c", "#4a4438"]
count = 5
life = 0.7
velocity = [0.0, 0.2]
spread = [0.9, 0.4]
gravity = 0.4
area = [0.35, 0.4]
scale = 0.7
fade = 0.6

[[terrain]]
id = "stairs_down"
name = "staircase down"
glyph = ">"
fg = "#f0e6c8"
bg = "#0d0d10"
stairs = "down"

[[terrain]]
id = "stairs_up"
name = "staircase up"
glyph = "<"
fg = "#f0e6c8"
bg = "#0d0d10"
