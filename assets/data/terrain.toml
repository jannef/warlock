glyph = "·"
variants = "·  ·   "
fg = "#aec4da"
bg = "#2a3e53"
ice = 50
move_cost = 120
bounce = "#c8dcf4"

# Thick ice: opaque and pale, frosted all over; it holds anything that walks.
