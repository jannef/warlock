# Magic items (spec §7 "Magic items", §8 "Magic items"), after Path of Exile: the prefixes and
# suffixes base items (objects.toml, those with a `kind`) roll, and how loot rolls them. A first
# pass: the numbers are to be tuned after playtesting.
#
# Rarity: a normal item has no affixes; a magic item has a prefix, a suffix, or one of each (most
# have one); a rare item has up to three prefixes and three suffixes (usually three or four
# affixes in all) and a two-word name. Magic and rare items are found unidentified: their rarity
# shows, their affixes do not, but their effects apply all the same.
#
# Names: a magic item is its prefix and suffix around its base, "Sharp long sword of the Bear"; a
# rare item is its name and its base, "Grim Bite, long sword".

# How often loot is normal, magic, or rare (weights).
[rarity]
normal = 70
magic = 24
rare = 6

# The chance in percent that a magic item has both a prefix and a suffix; else it has one of
# either, as likely one as the other.
[magic]
both = 25

# How many affixes a rare item rolls: [count, weight] pairs. How many of them are prefixes is then
# drawn evenly (at most three of each).
[rare]
affixes = [[3, 40], [4, 35], [5, 17], [6, 8]]

# The words of rare names: a first word, and a second for the kind of item.
[names]
first = [
  "Grim", "Dread", "Storm", "Blood", "Doom", "Ash", "Gloom", "Rune", "Ember", "Frost",
  "Shadow", "Wraith", "Iron", "Thorn", "Hollow", "Raven", "Bone", "Dusk", "Pale", "Wolf",
  "Viper", "Night", "Bitter", "Ghoul", "Oath", "Hex", "Gale", "Mire", "Cinder", "Star",
]

[names.second]
weapon = [
  "Bite", "Edge", "Fang", "Thirst", "Bane", "Song", "Wound", "Razor", "Spike", "Scar",
  "Reaver", "Gnash", "Sever", "Hunger",
]
launcher = ["Song", "Bolt", "Wing", "Strike", "Flight", "Arc", "Whisper", "Thorn", "Sting", "Volley"]
ammo = ["Sting", "Barb", "Quill", "Dart", "Splinter", "Point", "Needle", "Tooth"]
body = ["Shell", "Hide", "Coat", "Carapace", "Mantle", "Ward", "Husk", "Skin", "Bastion", "Wrap"]
helmet = ["Crown", "Visage", "Brow", "Cowl", "Veil", "Mask", "Halo", "Horn", "Peak"]
cloak = ["Shroud", "Mantle", "Wing", "Veil", "Pall", "Drape", "Shade", "Cape"]
gloves = ["Grip", "Clutch", "Hand", "Claw", "Fist", "Touch", "Hold", "Knuckle"]
boots = ["Stride", "Track", "Trail", "March", "Tread", "Step", "Road", "Hoof"]
shield = ["Wall", "Guard", "Ward", "Bulwark", "Aegis", "Barrier", "Rampart", "Bastion"]
ring = ["Loop", "Band", "Coil", "Circle", "Spiral", "Hoop", "Knot", "Whorl"]
amulet = ["Charm", "Talisman", "Eye", "Heart", "Locket", "Pendant", "Beads", "Clasp"]

# Every affix ([[prefix]] or [[suffix]]) defines:
#   id      stable name: items record their affixes by it (saves, `[[item]]` in level files)
#   name    "Sharp" (a prefix, before the item's name) or "of the Bear" (a suffix, after it)
#   effect  what it does, one of:
#             to_hit        + to hit
#             damage        + to every roll of the damage dice
#             extra_damage  adds 1dN to every roll of the damage (the value is N)
#             threat        widens the critical threat range by N natural rolls
#             crit          + to the critical multiplier (at most ×5)
#             attack_speed  attacks N% faster (less of their cost; at most 50 in all)
#             range         + cells it shoots or is thrown
#             draw          a bow needs N less Strength
#             durability    breaks N% less often
#             parry, armour, shield   + to the item's own Parry, Armour, or Shield
#             max_dex       + to the most Dexterity may add to Defence while it is worn
#             weight        N% lighter
#             dodge         + Dodge (bonuses add up)
#             deflection    + Deflection (the best counts)
#             natural       + natural armour (the best counts, with a creature's own)
#             max_hp        + maximum hit points
#             regeneration  hit points come back N% faster
#             strength, dexterity, toughness, intelligence, willpower, presence   + to the score
#             move_speed    steps N% faster (at most 50 in all)
#             carry         + N kg carrying limit
#             stealth       footsteps N% quieter
#             light         the wearer carries the light of a preset (lights.toml)
#             skill         + to the value of the affix's `skill` (an id in skills.toml) for
#                           what that skill gives, trained or not
#           Attack effects (to_hit through durability) on a weapon, a missile weapon, or
#           ammunition change the attacks made with it (local); on anything else every attack
#           (global). parry, armour, shield, max_dex, and weight change the item itself; the
#           rest change whoever wears or wields it. An item has at most one affix of each effect
#           (of each skill, for skill affixes).
#   bases   the kinds of item that may roll it: weapon, launcher, ammo, body, helmet, cloak,
#           gloves, boots, shield, ring, amulet. An affix whose effect the item lacks the means
#           for (range without a range, draw without a Strength to draw, durability on what never
#           breaks, armour, shield, or max_dex on what has none) does not roll on it
#   weight  how often it rolls among those that may (default 100)
#   tiers   from the lowest item level (`level`, the dungeon depth) each is found at, the range
#           its value is rolled in (`min`, `max`); a light's tiers name a `light` preset instead.
#           Loot picks among the tiers its item level allows, evenly.

# Prefixes: mostly offensive, or flat defence and life.

[[prefix]]
id = "sharp"
name = "Sharp"
effect = "damage"
bases = ["weapon", "ammo"]
tiers = [
  { level = 1, min = 1, max = 1 },
  { level = 3, min = 1, max = 2 },
  { level = 5, min = 2, max = 3 },
  { level = 7, min = 3, max = 4 },
]

