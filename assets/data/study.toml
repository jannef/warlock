# Studying a spell from a scroll (spec §8 "Spells", the magic design §4; `study:b`). All first
# guesses, to be tuned by play.
#
# A study takes turns_per_tier turns of the `study` action (actions.toml) for each tier of the
# spell and one more: 100 turns are 10 minutes, so a tier-3 spell takes 40 minutes (Quick study:
# half). At the end the scroll is used up. A spell at or below the tier the caster level has
# reached (spells.toml's comfortable levels) is learned for certain. Above it, by `overreach`
# tiers, a 2d12 check decides:
#
#   difficulty = base + per_overreach × overreach + (tiers known, a cantrip counting 1) ÷
#                known_per_point (rounded down)
#
# against which the roll adds the Intelligence modifier, the skills' `study` benefit (Spellcraft
# and Decipher script, each its value ÷ 10), the class's affinity with the spell's school
# (classes/), and Quick study's bonus. A failure draws a mishap (mishaps/): slight below
# bad_from, bad below terrible_from, terrible from there, lucky ones beside any.
base = 12
per_overreach = 4
known_per_point = 10
turns_per_tier = 100
bad_from = 2
terrible_from = 4

# How the game tells the chance (the player never sees the number): "easy" from `easy` ways of
# the 144 the dice can fall, "a struggle" from `struggle`, "far beyond you" below; "certain" when
# there is no check.
easy = 96
struggle = 36
