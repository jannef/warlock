# Surprise (spec §8 "Surprise and sneak attacks"; #681). Optional: without it nobody is surprised.
#
# An attack (a blow, a shot, a throw, a spell that rolls to hit) that finds its target unaware of
# the attacker surprises it, and so does a hidden trap springing under the one it springs on.
# Unaware: a creature that hunts no one and does not see the attacker now (asleep, or a mimic in
# disguise, whatever it sees); the player, of a creature they do not see now and have not seen
# within `memory_turns` turns. The one surprised makes an initiative check: 2d12 + its Dexterity
# modifier (+ Wary's bonus, + its Initiative skill's) against `difficulty` plus the attacker's
# craft (its Sneak attack skill's, + the thief's Sneak attack's 2); a sleeper or a disguised mimic
# gets none. Failed, it suffers `status` (Surprised, status.toml): Dexterity and Dodge count
# nothing toward its Defence, it makes no free blows, and its next action costs half again as
# much (Initiative and Cool head ease it). The surprising attack itself is rolled without its
# Dexterity and Dodge either way. An attacker with sneak dice (the Sneak attack skill, Ambusher,
# Improved sneak attack) adds them to a hit on a target unaware or Surprised: a blow at any
# reach, a shot, a throw, or an attack spell within `missile_reach` cells.
[surprise]
status = "surprised"      # the status an actor caught unawares suffers (status.toml)
difficulty = 13           # the initiative check's difficulty before the attacker's craft
missile_reach = 6         # how far a shot, a throw, or an attack spell is still a sneak attack
memory_turns = 20         # how many turns the player stays aware of a creature they have seen
# What has no vitals to find (#682; the same as being immune to criticals): no critical is ever
# confirmed on, and no sneak attack dice or lowered threat land on, an incorporeal creature, an
# animated object, a type carrying one of these tags, or one that says `vitals = false`; it is
# surprised like anyone. Anatomist finds them in skeletons and constructs.
no_vitals = ["elemental", "skeleton", "spirit", "construct"]

# Slipping past (#683): a creature that hunts no one and would first see the player by its
# darkvision alone (their cell too dark for its eyes) makes a contest, once a stalk: 2d12 + the
# player's Dexterity modifier + their Stealth's `slip` against 2d12 + its Willpower modifier + its
# Spot. The player made it: the creature does not see them while they stay in the dark, until
# they step into light it can see by, attack it or anything it sees, it is hurt, or
# `lasts_turns` turns pass. Lost: it sees them, and rolls no more until it gives up the hunt.
[slip]
enabled = true            # false: nobody slips past anyone
lasts_turns = 60          # how long a creature slipped past stays blind to the player
