# What actions cost, in energy (spec §8 "Time"). 1000 is a normal action: it takes a creature of
# normal speed (the player's) 6 seconds; a cost of 1400 would take it 8.4 seconds. How long an
# action takes is cost / 1000 × 1000 / speed × 6 s, so a creature twice as fast takes half as
# long. Costs are 100 to 10000; an action left out costs 1000. Creature types may give their
# attacks a cost of their own (`attack_cost` in creatures.toml).

# A step onto terrain of move_cost 100; a step costs this scaled by the terrain's move_cost
# (shallow water, 200: twice as much). On the overworld a step's base is the terrain's
# travel_minutes instead of 6 seconds.
step = 1000
wait = 1000
open_door = 1000
close_door = 1000
# Lighting or dousing the lantern.
lantern = 1000
# Taking stairs, entering a location or a local area from the overworld, and walking off the
# edge of a local area.
stairs = 1000
pick_up = 1000
drop = 1000
# Attacks: the player moving into a hostile creature, and creatures' attacks; a shot from a
# missile weapon (the player's `t`, a creature's), a throw (`T`), a spell.
melee = 1000
shoot = 1000
throw = 1000
cast = 1000
# Reloading a missile weapon that needs it after every shot (a crossbow): part of each of its
# shots, so a crossbow shot takes shoot + reload.
reload = 1000
# Equipment (data/slots.toml names the action of each slot). Taking a thing off costs what
# putting it on does, and a swap pays for both: the old thing comes off, the new one goes on.
# Wielding a weapon or a shield in a hand, or putting it away.
wield = 1000
# Putting on or taking off a helmet, a cloak, gloves, boots, a ring, or an amulet.
wear = 1000
# Putting on or taking off body armor: it takes a while to strap on.
body_armor = 3000
# Readying a missile weapon, missiles, or a tool (a pick-axe), or putting them away.
ready = 1000
# Chatting with someone (`C`): a few words. Asking about a topic on the dialogue screen takes no
# time.
chat = 500
# A turn of digging into a wall with a digging tool ready (spec §8 "Digging"): digging goes on
# turn after turn until the wall gives way or something interrupts it.
dig = 1000
