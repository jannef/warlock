# What actions cost, in energy (spec §8 "Time"). 1000 is a normal action: it takes a creature of
# normal speed (the player's) 6 seconds; a cost of 1400 would take it 8.4 seconds. How long an
# action takes is cost / 1000 × 1000 / speed × 6 s, so a creature twice as fast takes half as
# long. Costs are 100 to 10000; an action left out costs 1000. Creature types may give their
# attacks a cost of their own (`attack_cost` in creatures.toml).

# A step onto terrain of move_cost 100; a step costs this scaled by the terrain's move_cost
# (shallow water, 200: twice as much). On the overworld a step's base is the terrain's
# travel_minutes instead of 6 seconds.
step = 1000
wait = 1000
open_door = 1000
close_door = 1000
# Unlocking a locked door with a key, on top of opening it: opening a locked door you have the
# key for takes unlock + open_door.
unlock = 1000
# A try at picking a lock without a key (the Pick lock ability, spec §8 "Doors"): it takes this
# whatever comes of it; a lock that gives opens its door on top of it (pick_lock + open_door).
pick_lock = 2000
# A kick (`K`): at a door, to break it in, or at a creature, an unarmed blow.
kick = 1000
# Lighting or dousing the lantern.
lantern = 1000
# Lowering or raising the lantern's hood: a flick of its shutter. Lighting a lantern that is out
# with its hood lowered takes lantern + hood.
hood = 500
# Taking stairs, entering a location or a local area from the overworld, and walking off the
# edge of a local area.
stairs = 1000
pick_up = 1000
drop = 1000
# Attacks: the player moving into a hostile creature, and creatures' attacks; a shot from a
# missile weapon (the player's `t`, a creature's), a throw (`T`), a spell.
melee = 1000
shoot = 1000
throw = 1000
cast = 1000
# Reloading a missile weapon that needs it after every shot (a crossbow): part of each of its
# shots, so a crossbow shot takes shoot + reload.
reload = 1000
# Equipment (data/slots.toml names the action of each slot). Taking a thing off costs what
# putting it on does, and a swap pays for both: the old thing comes off, the new one goes on.
# Wielding a weapon or a shield in a hand, or putting it away.
wield = 1000
# Putting on or taking off a helmet, a cloak, gloves, boots, a ring, or an amulet.
wear = 1000
# Putting on or taking off body armor: it takes a while to strap on.
body_armor = 3000
# Readying a missile weapon, missiles, or a tool (a pick-axe), or putting them away.
ready = 1000
# A turn of eating (spec §8 "Hunger"): a meal takes as many turns as the food says (`food` in
# objects.toml; corpses by their creature's size, hunger.toml).
eat = 1000
# Reading a scroll (`r`; spec §8 "Scrolls"): casting the spell written on it, or identifying an
# item. The scroll is used up.
read = 1000
# A turn of studying a spell from a scroll (spec §8 "Spells"): a study takes study.toml's
# turns_per_tier of them for each tier of the spell and one more (100: 10 minutes at tier 0).
study = 1000
# A turn of digging into a wall with a digging tool ready (spec §8 "Digging"): digging goes on
# turn after turn until the wall gives way or something interrupts it.
dig = 1000
# A turn of searching for secret doors and hidden traps around you (`s`; spec §8 "Searching"):
# searching for a while (`z`) goes on turn after turn until something is found or interrupts it.
search = 1000
# A turn of praying at a forgotten altar (the Pray ability; spec §7 "Special rooms"): a prayer
# takes its outcome table's `seconds` (data/outcomes/), a turn of this after another.
pray = 1000
# A turn of drinking at a healing spring (the Drink ability; spec §7 "Special rooms"): a drink
# takes its outcome table's `seconds` (data/outcomes/spring.toml), a turn of this after another.
drink = 1000
# Trying to disarm a trap you know of next to you (the Disarm ability; spec §8 "Disarming traps"):
# careful work, whether it comes off, fails, or sets the trap off.
disarm = 2000
# Treating yourself (the Heal ability; spec §8 "Skills"): binding a wound, or tending a poison or a
# disease, about a quarter of a minute, whatever comes of it.
heal = 2500
# Chatting with someone (`C`): a few words. Asking about a topic on the dialogue screen takes no
# time.
chat = 500
# Trying to steal from someone next to you (the abilities menu's Steal; spec §8 "Stealing"),
# whether it works or you are caught.
steal = 1000
# Throwing your voice to a place you see: a voice sounds there.
throw_voice = 1000
# Climbing out of the water onto ice (spec §5 "Ice"), on top of the step onto the ice: hauling
# oneself up out of a hole takes a few turns.
climb = 2000
