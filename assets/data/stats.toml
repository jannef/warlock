# Stat training (spec §8 "Stats"; the design is docs/design/progression.md §6): using your stats
# earns them training marks, and at every level you gain each stat gets one check to rise by a
# point. Nothing here is shown in the game: a rise says "You feel stronger." and nothing of why.
#
# - Each `[[training.use]]` below gives its stat a mark with `chance` percent (1 to 100) each
#   time you do the thing `on` names (a draw of the training stream, never the gameplay one).
#   Marks never decay and have no cap.
# - At a level, each stat in display order rises by 1 with chance marks / (marks + need), where
#   need = need_base + need_per_point × the stat's score; at or above the stat's potential the
#   chance is divided by `over_potential_divisor`, and a rise there lifts the potential with the
#   score. A rise uses up all the stat's marks; a failed check keeps them.
# - Once a game day, at 06:00, each stat gets the same check again with the need multiplied by
#   `daily_factor` (a draw of the training stream, six a day whatever the marks): stats grow
#   between levels too, slower. A rise there uses up the marks the same way.
#
# - A use that names its own stat (`drank`, `elixir`: the stat the potion names) has no `stat`;
#   every other use has one. Such a use may give several marks at once (a potion's `marks`), each
#   with the rule's chance.
#
# The uses (`on`): burdened, blow, critical, block, dig, kick, dodge, parry, shot, sneak, climb,
# hurt, big_hit, killed, resisted, plunge, found, read, identified, study, discovered, spot,
# endured, resisted_will, hungry_fight, cast, chat, trade, quest, swapped, drank, elixir (the
# wiki's Stats page says each in words). The chances are first guesses
# (docs/design/combat-progression.md §9.1).

[training]
need_base = 20
need_per_point = 3
over_potential_divisor = 4
# The daily check's need, this many times a level's (first guess, the design §9.2: 2 doubles the
# rises between levels, 5 halves them).
daily_factor = 3

# Strength: carrying, fighting, digging, kicking.
[[training.use]]
stat = "strength"
on = "burdened"
chance = 15

[[training.use]]
stat = "strength"
on = "blow"
chance = 15

[[training.use]]
stat = "strength"
on = "critical"
chance = 40

[[training.use]]
stat = "strength"
on = "block"
chance = 20

[[training.use]]
stat = "strength"
on = "dig"
chance = 10

[[training.use]]
stat = "strength"
on = "kick"
chance = 20

