# Stat training (spec §8 "Stats"; the design is docs/design/stat-training.md): using your stats
# earns them training marks, a signed pile per stat, and at every level you gain and every day at
# 06:00 each stat gets one check to move by a point. Nothing here is shown in the game: a rise
# says "You feel stronger." and nothing of why.
#
# - Each `[[training.use]]` below gives its stat a mark with `chance` percent (1 to 100) each
#   time you do the thing `on` names (a draw of the training stream, never the gameplay one).
#   Marks never decay and have no cap: the pile is the whole state.
# - A point has a price in marks: price_base + price_per_point × the stat's score. Past the
#   stat's potential it ramps: the `over`-th point past it (1 for the first) costs
#   (ramp_divisor + over × (over + 1)) / ramp_divisor times that (×1.5, ×2.5, ×4, ×6, ... at 4).
#   A trained rise never lifts the potential (elixirs do).
# - At a check (a level's: the levels stream; the day's at 06:00: the training stream; six
#   draws each whatever the marks), a pile of m marks moves its stat with chance
#   m^odds_power / (m^odds_power + price^odds_power), and not at all while quarter × m is under
#   the price. A rise pays the price (a pile short of it goes to zero; the surplus waits for the
#   next check); one move per stat per check.
# - A negative pile (from losses, a later slice) is checked the same way against the drop's
#   price: the base price of the point lost divided by `drop_share`, never ramped.
#
# - A use that names its own stat (`drank`, `elixir`: the stat the potion names) has no `stat`;
#   every other use has one. Such a use may give several marks at once (a potion's `marks`), each
#   with the rule's chance.
#
# The uses (`on`): burdened, blow, critical, block, dig, kick, dodge, parry, shot, sneak, sneak_attack, climb,
# hurt, big_hit, killed, resisted, plunge, found, read, identified, study, discovered, spot,
# endured, resisted_will, hungry_fight, cast, chat, trade, quest, swapped, drank, elixir (the
# wiki's Stats page says each in words). The chances are first guesses
# (docs/design/combat-progression.md §9.1).

[training]
price_base = 20
price_per_point = 10
ramp_divisor = 4
odds_power = 3
quarter = 4
drop_share = 2

# Strength: carrying, fighting, digging, kicking.
[[training.use]]
stat = "strength"
on = "burdened"
chance = 15

[[training.use]]
stat = "strength"
on = "blow"
chance = 15

[[training.use]]
stat = "strength"
on = "critical"
chance = 40

[[training.use]]
stat = "strength"
on = "block"
chance = 20

[[training.use]]
stat = "strength"
on = "dig"
chance = 10

[[training.use]]
stat = "strength"
on = "kick"
chance = 20

