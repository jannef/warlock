# Magic crystals (docs/design/enchanting.md §5, §9, §10; docs/dev/enchanting.md; the loader is
# content/crystal.rs): six colours, one object each, no grades. A crystal is caught from a magic
# item's affix when it is salvaged (salvage.toml, enchanting.toml) or left by a creature the
# Soulglass spell kills (spells/soulglass.toml, world/crystal.rs), and is what the Enchanting
# recipes bind (world/enchant.rs). Anyone may consume one for mana ([consume]).
#
# [[colour]]  the colours, in order; the order is the rule: a creature's colour is the first
#             colour one of whose tags it carries, and an affix's colour is the first colour whose
#             families hold its category. Each has:
#   id        the colour's id (unique)
#   name      the colour in words ("red")
#   object    the crystal object of the colour (objects/; it must stack)
#   nature    what the colour is, in words ("the blood and the fire"), for the wiki
#   tags      creature tags (creatures/; each carried by some creature): whose nature it is
#   families  affix categories (affixes/; each some affix's): what an enchanter may roll with it.
#             Every category of every affix is in at least one colour, else it could never be
#             enchanted. A category may be in two.
#
# [[family]]  each affix category once, with the words a seal names it by ("fire", "the
#             critical"): `category` and `word`. Every category of every affix has one.
#
# [yield]     the crystals a creature leaves to the Soulglass spell: one, and one more
#             from each of `levels` its level reaches (one, two from level 10, three from 20).
#
# [rare]      the rare materials (heart_crystal.toml, soul_fetter.toml):
#   materials        the two objects, drawn at even odds where one is given
#   level, chance    Soulglass on a creature of `level` or more: a `chance` % draw for one
#   tag              the creature tag (a dragon's) whose every bearer gives `dragon`
#   dragon           the one a creature tagged `tag` always gives, never a chance draw
#   heart            the one Quicken takes beside its crystal to add an affix to a rare
#                    (world/enchant.rs)
#   fetter           the one Recast takes to keep the affix chosen while the rest roll anew
#   salvage_level    salvaging a rare (identified or not) of this item level or more: after its affixes'
#   salvage_chance   checks, a `salvage_chance` % draw for one
#
# [consume]   consuming a crystal (from the Consume list, `e`, beside food and potions;
#             world/crystal.rs):
#   mana      the mana it gives, never past the maximum (flat, whatever the colour)
#   marks     the Willpower training marks it gives (stats.toml's `consumed` use, each with
#             that rule's chance): a tenth of a point's price at an average score (120 at 10)

[[colour]]
id = "black"
name = "black"
object = "crystal_black"
nature = "the grave and the shadow"
tags = ["undead", "skeleton", "spirit", "demon", "devil", "yugoloth", "fiend", "cultist", "hag"]
families = [
    "necrotic_damage", "necrotic_resistance", "poison_damage", "critical_chance",
    "critical_multiplier", "mana_on_kill", "stamina_on_kill", "stealth", "steal", "openings",
    "spell_critical",
]

