# Grave spear (the spell types design §7 entry 10): a line of necrotic bone through everyone on
# it, nothing to the undead (the necrotic type's `immune_tags`); a scroll's only.
[[spell]]
id = "grave_spear"
name = "Grave spear"
description = "A spear of grave-cold bone from your hand toward a place you aim at, through everyone on its line."
level = 14
school = "necromancy"
kind = "damage"
shape = "line"
resolution = "area"
damage_type = "necrotic"
length = 6
damage = "4d6"

[spell.cast]
effect = "arcane_bolt"
noun = "grave spear"
verb = "pierces"
noise = { sound = "chanting", loudness = 40 }

[spell.grows]
damage = "willpower 13 6d6, 16 8d6, 19 10d6, 25 10d6+2"
length = "willpower 14 7, 18 8"

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). At rank 10:
# +4 on the roll, a die more, 2s and 1s rolled again, two cells longer, a tenth off the mana, and
# a quarter off the casting time.
[spell.ranks]
2 = { reroll = 1 }
3 = { cells = 1 }
4 = { bonus = 1 }
5 = { mana_off = 10 }
6 = { cells = 1 }
7 = { bonus = 1 }
8 = { reroll = 1 }
9 = { time_off = 25 }
10 = { dice = 1, bonus = 2 }
