# Sleep (spec §8 "Spells", the first spell list): a burst of drowsiness; everyone it reaches but
# the caster, friend or foe, does everything three times as slowly a while.
[[spell]]
id = "sleep"
name = "Sleep"
description = "A breath of slumber where you aim it: everyone it reaches grows drowsy, slow in all they do, a while."
level = 6
school = "enchantment"
kind = "hex"
shape = "burst"
resolution = "area"
range = 8
radius = 1
effect = { status = "drowsy", severity = 2 }

[spell.cast]
noise = { sound = "chanting", loudness = 20 }

[spell.grows]
range = "willpower 14 9, 18 10"
degrees = "presence 14 3"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). Drowsy holds three degrees at most, so a degree is all its ranks add to the
# drowse. At rank 10: a degree longer, a cell wider, three cells farther, 30 percent off the mana,
# and a quarter off the casting time.
[spell.ranks]
2 = { mana_off = 10 }
3 = { cells = 1 }
4 = { degrees = 1 }
5 = { radius = 1 }
6 = { mana_off = 10 }
7 = { cells = 1 }
8 = { time_off = 25 }
9 = { cells = 1 }
10 = { mana_off = 10 }
