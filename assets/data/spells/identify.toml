# Identify (spec §8 "Spells"): the truth of one thing the caster carries, as the scroll of
# identify tells it. Its cost is given outright (`mana`), not by its level: a large one, so a
# caster of the first levels cannot cast it at all (see docs/dev/spells.md "Identify"). Its
# level is how hard it is to learn. The scroll of identify casts it.
[[spell]]
id = "identify"
name = "Identify"
description = "Learn the truth of one thing you carry: what it is, and what magic it holds."
level = 6
school = "divination"
kind = "utility"
shape = "self"
resolution = "auto"
mana = 60
effect = { identify = true }

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). It has no roll,
# reach, or status to grow, so its ranks make it cheaper and quicker: at rank 10 two fifths off
# the mana and half the casting time.
[spell.ranks]
2 = { mana_off = 5 }
3 = { time_off = 10 }
4 = { mana_off = 5 }
5 = { time_off = 10 }
6 = { mana_off = 10 }
7 = { time_off = 10 }
8 = { mana_off = 10 }
9 = { time_off = 20 }
10 = { mana_off = 10 }
