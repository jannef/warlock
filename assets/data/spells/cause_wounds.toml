# Cause wounds (spec §8 "Spells", the first spell list): the witch's touch that opens wounds; a
# touch, so cheap and strong, but the creature must be beside you and the blow must land.
[[spell]]
id = "cause_wounds"
name = "Cause wounds"
description = "A touch that opens wounds in a creature beside you, if it lands."
level = 4
school = "necromancy"
kind = "damage"
shape = "touch"
resolution = "touch"
damage_type = "necrotic"
damage = "2d6"

[spell.cast]
noun = "touch"
verb = "wounds"

[spell.grows]
damage = "willpower 13 4d6, 19 4d8, 25 4d8+2"
