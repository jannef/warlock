# Cause wounds (spec §8 "Spells", the first spell list): the witch's touch that opens wounds; a
# touch, so cheap and strong, but the creature must be beside you and the blow must land.
[[spell]]
id = "cause_wounds"
name = "Cause wounds"
description = "A touch that opens wounds in a creature beside you, if it lands."
level = 4
school = "necromancy"
kind = "damage"
shape = "touch"
resolution = "touch"
damage_type = "necrotic"
damage = "2d6"

[spell.cast]
noun = "touch"
verb = "wounds"

[spell.grows]
damage = "willpower 13 4d6, 19 4d8, 25 4d8+2"

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). At rank 10:
# +4 to hit, a critical threatened two rolls lower, +3 on the roll, a die more, 2s and 1s rolled
# again, and fifteen percent off the mana.
[spell.ranks]
2 = { to_hit = 1 }
3 = { bonus = 1 }
4 = { reroll = 1 }
5 = { threat = 1 }
6 = { to_hit = 2 }
7 = { bonus = 2 }
8 = { dice = 1 }
9 = { mana_off = 15, to_hit = 1 }
10 = { threat = 1, reroll = 1 }
