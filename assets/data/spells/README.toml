# Spells (spec §8 "Spells", the magic design docs/design/magic.md §3, §5, §6, the spell scaling
# design docs/design/spell-scaling.md §4 to §6): one file per spell holding one `[[spell]]`, its mana
# priced by the cost table in ../spells.toml. Spells are numbered
# in path order (saves will name them by index), so a new spell is a new file. This file holds
# only the notes below: a file of comments defines nothing. The casters' spell abilities name
# their spells here by id (a talent's `spell` effect); the one cast path casts them (#395).
#
# Fields:
#   id, name      the spell's id and its name
#   description   one line
#   level         its spell level, 0 to 70 by design: its base mana (the level, at least the
#                 cost table's `[mana] floor`, 4: every spell of level 0 to 4 costs as one of
#                 level 4) and the learning at which its grimoire teaches for certain
#                 (../study.toml). 0 and 1 are cantrips.
#   The tags (talents, abilities, items, and the wiki key on them; magic design §6):
#   school        evocation, necromancy, abjuration, restoration, transmutation, enchantment,
#                 or divination
#   kind          damage, heal, buff, hex, cleanse, utility, or summon (a summon is cast on
#                 `self` with `auto`: it calls creatures to the caster's side, spec §8 "Allies")
#   shape         ray, bolt, touch, self (single targets), cone, line, or burst (areas)
#   damage_type   a damage type of ../damage_types.toml (a `damage` spell's, its tag)
#   resolution    how it finds its targets (../spells.toml [resolution]): `area` for the area
#                 shapes and only them; `touch` only with the touch shape; `attack` with a ray
#                 or a bolt; `auto` with any single target
#   range, radius, length   its base reach, what anyone who casts it reaches: `range` for a ray,
#                 a bolt, and a burst (the farthest cell it reaches or is centred on; casting
#                 holds it to 20), `radius` for a burst (casting holds it to the length of
#                 ../spells.toml's `burst`), `length` for a cone (held to 5) and a line (to 20);
#                 each exactly where its shape has it (touch and self have none). A burst costs
#                 by its `radius`.
#   casts         its time, in `cast` actions (at least 1; default 1)
#   open_sky      true: it is cast only under the open sky (default false)
#   mana          its base mana cost given outright, in place of its level's: the floor, the
#                 shape, and the resolution do not count; the armour worn, the talents, and the
#                 ranks still do. For a spell whose price is not its difficulty (Identify)
#   damage        a `damage` spell's base roll: a roll, `"2d6"`, `"3d6+1d10"`, `"5d6+2"` (dice
#                 of 2 to 20 sides, a d7 or a d9 like any other; never below 0)
#   aim           an `attack` or `touch` damage spell's: the stat whose modifier is added to
#                 its attack roll, as a blow adds Dexterity's (default `dexterity`). A scroll's
#                 or a wand's always aims with Dexterity
#   study_difficulty  added to the study check's difficulty (default 0); above 0, a
#                 study of it is a check at any learning, never certain (the calls' scrolls
#                 are very hard to learn: the owner, #828 Q7)
#   [spell.effect]  what a spell of another kind does:
#     heal        a `heal` spell's base hit points: a roll, as `damage`
#     status, severity  a `buff`'s status on the caster, a `hex`'s on its target, a `damage`
#                 spell's on everyone it harms (a status of ../status/; severity default 1:
#                 a buff's or a hex's base degrees; the status's `max` holds them). Only a
#                 buff's status may hasten (creatures never step quicker than their type)
#     cures, diseases   a `cleanse` ends these statuses, and with `diseases = true` every
#                 disease
#     identify    true: a `utility` spell on `self` that identifies one stack the caster carries
#                 (asked for as it is cast, `use:identify:c`)
#     summon      a `summon` spell's call, `{ creatures = ["wolf"], count = "1d2", most = 1,
#                 minutes = 5, spread = 2 }`: each comes from the pool `creatures` (at least one,
#                 known types, never the player; each as likely), `count` a roll (at least 1
#                 comes), `most` of this spell's calls kept at once (past it the oldest
#                 departs), `minutes` their stay, `spread` (default 2) how far from the caster
#                 they appear
#     corpse      `consumed` or `kept`: it is aimed at a corpse the caster sees, the pile's
#                 top-most, and `consumed` uses it up; on a `damage` burst (it goes off there), a
#                 `heal` touch (the caster heals), or a `summon` on `self` with `rise`
#     rise        a `summon` spell's raising of the corpse, in place of `summon`: `{ most = 2,
#                 minutes = 10, hit_points = 50, berserk = 10, berserk_faction = "berserk",
#                 berserk_message = "..." }`: the corpse's own type stands at `hit_points`
#                 percent of its hit points, `most` and `minutes` as a summon's; `berserk`
#                 percent rise in `berserk_faction` instead, saying `berserk_message`
#     charm       a `hex` ray's or bolt's, with no `status`: `{ minutes = 5, mindless = ["undead"],
#                 message = "takes you for a friend", ends = "shakes off the charm" }`: the
#                 creature it falls on is the caster's ally for `minutes` (its
#                 `degrees` ladder grows it), then itself again where it stands; refused on a
#                 unique, an animated thing, and a creature with a `mindless` tag; `message` and
#                 `ends` follow its name as it takes and as it ends
#     mana        a `heal` spell's mana back to the caster: a roll
#     crystal     true: a `damage` spell whose kill of a creature that leaves a corpse, is no
#                 animated thing, and has a colour (../crystals.toml) leaves that colour's
#                 crystals and perhaps a rare material in place of its corpse and its body's
#                 crafting stock (Soulglass; `world/crystal.rs`)
#     arcs        a `damage` ray's, bolt's, touch's, or line's, of a type that arcs (`[types]` in
#                 ../spells.toml): that many jumps are taken without a draw, every jump of
#                 it reaching 2 cells rather than the arc's one
#     zone        `{ kind = "fire", turns = 10 }`: an area that stays on the cells of a burst's or
#                 a line's shape for that many of the player's turns (the turn is 6 s;
#                 docs/dev/spells.md "Zones"), on a `damage` spell or a `hex`: `fire` (by
#                 custom a `damage` spell of fire: burns who starts a turn on it or steps onto
#                 it, one roll of the spell's as it is laid), `fouled` (by custom a `damage`
#                 spell of poison: poisons who starts a turn in it), `slick` and `dark` (by
#                 custom a `hex` with no `status`: trips who steps on it or off it; no light
#                 reaches it)
#   [spell.cast]  how it shows and sounds (needed by a `damage` spell cast at a distance):
#     effect      the effect presentation shows (../effects.toml): a burst's for a burst or a
#                 cone, a bolt's for a ray, a bolt, or a line; none for touch or self
#     noun, verb  what hits and what it does, for messages ("the fireball burns"; default its
#                 name in lower case, and its damage type's verb)
#     message     said as it is cast
#     noise       { sound, loudness } where it goes off (a burst's centre, else the caster)
#     blast       a burst's, as a scroll's: the walls it breaks
#     heat, frost  a burst's, standing in for what its type does to ice and water (`[types]` in
#                 ../spells.toml): only for a spell that wants other than its type's
#   [spell.grows]  its ladders (the spell scaling design §4, §6): what it does as the caster's
#                 stats rise. Every key optional; a dimension left out never grows by stats.
#     damage      a `damage` spell's roll        heal      a `heal` spell's roll
#     range       a ray's, bolt's, or burst's    length    a cone's or a line's
#     radius      a burst's                      degrees   a buff's, a hex's, or a damage spell's
#     count       a `summon`'s count (a roll);             status's degrees, or a summon's or
#                 a spell with `arcs`, its jumps           a charm's minutes
#                 (whole numbers)
#                 A ladder is one string: the stat's id, then rungs separated by commas, each
#                 `AT VALUE` with one space: `"intelligence 13 3d6, 16 4d6, 19 5d6, 25 5d6+2"`.
#                 `AT` is a score, 1 to 40, strictly ascending. `VALUE` is a roll for `damage`
#                 and `heal`, whole cells or degrees for the rest (casting holds reach to 20, a
#                 cone to 5, a radius to the burst table's length, degrees to the status's
#                 `max`). A caster whose effective score reaches a rung's `AT` casts that rung;
#                 below the first, the base. Talents and items may add rungs and change the
#                 roll (the six hooks, ../talents/README.toml `spell_mod`).
#   [spell.ranks]  its ranks (spec §8 "Spells": "Ranks"; #1264): what a caster gains as they
#                 deepen the spell by reading its grimoire again. A spell is known at rank 1 as
#                 it is learned (or as a class gives it), up to rank 10. One entry a rank, keyed
#                 by the rank (`2` to `10`, any of them, in any order), each an inline table of
#                 what REACHING THAT RANK ADDS. Entries are cumulative: a cast at rank N has
#                 everything the entries for ranks 2 to N add. Rank 1 is the spell as written
#                 above and never has an entry. A spell with no `[spell.ranks]` gains nothing
#                 from its ranks (it still has them). Only a cast from mana reads them: a scroll
#                 or a wand casts at rank 1. Every field a whole number, each optional, an entry
#                 never empty:
#     reroll      faces rolled again: a die of the roll showing this or less is drawn once more
#                 (`reroll = 1`: 1s rolled again; cumulative, so a second `reroll = 1` makes 2s)
#     sides       every die of the roll this many sides bigger (`sides = 2`: d6s are d8s)
#     dice        this many dice more, of the roll's first group's kind
#     bonus       added to the roll (`bonus = 1`: 2d6 is 2d6+1)
#                 (the four above only on a spell that rolls: `damage`, `heal`, or a `summon`)
#     cells       cells farther: a ray's, bolt's, or burst's range, a cone's or line's length
#                 (only on a spell with a `range` or a `length`; casting still holds reach to 20)
#     radius      cells wider on a burst's radius (a `burst` only; held to the table's length)
#     degrees     degrees longer a buff's or a hex's status, minutes longer a summon's or a
#                 charm's stay (only with a status or minutes; the status's `max` still holds)
#     mana_off    percent off the spell's mana, with the talents' percents (`mana_off = 10`)
#     time_off    percent off the casting time (`time_off = 50`: half the time; never more than
#                 nine tenths off in all)
#     to_hit      added to the attack roll (an `attack` or `touch` damage spell only)
#     threat      the critical threat range this much wider: a natural 22 threatens for anyone,
#                 `threat = 1` makes it 21 too (the same spells; never below the blows' floor)
#                 Each entry is checked as it loads, like a ladder: a field the spell could never
#                 read is refused ("ranks: rank 3: `radius` is for a `burst`"). Nothing bounds
#                 how much a rank adds. A worked example, magic_missile.toml (an auto bolt) and
#                 ray_of_frost.toml (an attack ray, which may take `to_hit` and `threat`):
#                   [spell.ranks]
#                   2 = { bonus = 1 }
#                   3 = { cells = 1 }
#                   4 = { dice = 1 }
#                   5 = { mana_off = 10 }
#                   ...
#                   10 = { time_off = 50 }
#                 Rank 1 is the baseline. A spell that is too strong at rank 1 may hold some of
#                 its power back for its ranks (a smaller base roll, a rung moved to rank 5).
#                 The deepening itself (the time, the check) is ../study.toml's.
#
# Authoring conventions (templates, not checks; the spell scaling design §6.4):
#   [A] cells or degrees, one more a rung: Willpower for reach at 14, 18, 22, 26
#       (`range = "willpower 14 11, 18 12"`); Presence for degrees at 14, 18
#       (`degrees = "presence 14 2, 18 3"`). Every aimed spell, every buff and hex.
#   [B] a die more a rung, the spell's stat at 13, 16, 19, 22, 25
#       (`damage = "intelligence 13 3d6, 16 4d6, 19 5d6"`): the body of a damage ladder.
#   [C] a bigger die a rung (`"intelligence 16 1d8"`, `"willpower 19 2d8"`): cantrips; a d7 or
#       a d9 where a die more is too much and a bonus too flat.
#   [D] a static bonus at the top (`25 5d6+2`), where a small step fits better than a die.
#   Mixed dice (`25 3d6+1d10`) sparingly, where the spell's fiction wants them.
#   The stat by school, unless the spell says otherwise: evocation, transmutation, divination
#   Intelligence; necromancy, abjuration, restoration Willpower; enchantment Presence (Call
#   lightning, the druid's, names Willpower). Reach Willpower, degrees Presence. A new spell
#   takes the level of its mana; how much its top rung does is its author's call.
#
# Nothing checks or holds how much a spell does (the spell scaling design, decision 16): a spell
# rolls what its author writes, and the stats' rungs, the talents, the items, and a critical add
# to it.
