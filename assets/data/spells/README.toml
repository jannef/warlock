# Spells (spec §8 "Spells", the magic design docs/design/magic.md §3, §5, §6): one file per
# spell holding one `[[spell]]`, measured by the tier table in ../spells.toml. Spells are numbered
# in path order (saves will name them by index), so a new spell is a new file. This file holds
# only the notes below: a file of comments defines nothing. The casters' spell abilities name
# their spells here by id (a talent's `spell` effect); the one cast path casts them (#395).
#
# Fields:
#   id, name      the spell's id and its name
#   description   one line
#   tier          0 (a cantrip) to 9 (../spells.toml)
#   The tags (talents, abilities, items, and the wiki key on them; magic design §6):
#   school        evocation, necromancy, abjuration, restoration, transmutation, enchantment,
#                 or divination
#   kind          damage, heal, buff, hex, cleanse, or utility
#   shape         ray, bolt, touch, self (single targets), cone, line, or burst (areas)
#   damage_type   a damage type of ../damage_types.toml (needed by a `damage` spell, its tag)
#   resolution    how it finds its targets (../spells.toml [resolution]): `area` for the area
#                 shapes and only them; `touch` only with the touch shape; `attack` with a ray
#                 or a bolt; `auto` with any single target
#   The caps of its reach (Willpower grows a spell's reach and area only up to these):
#   max_range     ray, bolt, burst: the farthest cell it reaches or is centred on (1 to 20)
#   max_radius    burst: its largest radius (1 to the length of ../spells.toml's `burst`)
#   max_length    cone (1 to 5) and line (1 to 20): how far it reaches from the caster
#                 (touch and self have none of these)
#   range, radius, length   its reach before Willpower, each where its cap is, 1 to the cap
#                 (default the cap); the caster's Willpower adds a cell per `reach_step`
#                 modifier points (../spells.toml) up to the cap. A burst costs by its `radius`
#   casts         its time, in `cast` actions (1 to 10; default 1)
#   open_sky      true: it is cast only under the open sky (default false)
#   mana          its base mana cost given outright (1 to 500), in place of the tier table's:
#                 tier, overreach, shape, and resolution do not count; the armour worn and the
#                 talents still do. For a spell whose price is not its difficulty (Identify)
#   [spell.damage]  a `damage` spell's damage, rolled:
#     dice        what it rolls at the tier's comfortable caster level: dice only, `1d6`
#     per_levels  one die more per this many caster levels above that (0: never more;
#                 default 0)
#     max_dice    the cap: never more dice than this (at least dice's own; default dice's)
#     bonus       a static `+n`, rare (default 0)
#   [spell.effect]  what a spell of another kind does:
#     heal        a `heal` spell's hit points: a table as [spell.damage]
#     status, severity  a `buff`'s status on the caster, a `hex`'s on its target, a `damage`
#                 spell's on everyone it harms (a status of ../status.toml; severity 1 to 10,
#                 default 1; a buff's and a hex's grow a degree per `presence_step` of the
#                 caster's Presence modifier, up to the status's `max`)
#     cures, diseases   a `cleanse` ends these statuses, and with `diseases = true` every
#                 disease
#     identify    true: a `utility` spell on `self` that identifies one stack the caster carries
#                 (asked for as it is cast, `use:identify:c`)
#   [spell.cast]  how it shows and sounds (needed by a `damage` spell cast at a distance):
#     effect      the effect presentation shows (../effects.toml): a burst's for a burst or a
#                 cone, a bolt's for a ray, a bolt, or a line; none for touch or self
#     noun, verb  what hits and what it does, for messages ("the fireball burns"; default its
#                 name in lower case, and its damage type's verb)
#     message     said as it is cast
#     noise       { sound, loudness } where it goes off (a burst's centre, else the caster)
#     blast, heat, frost  a burst's, as a scroll's: walls it breaks, ice it melts, water it
#                 freezes
#   [spell.scroll]  how it comes on a scroll: `level`, the caster level a read casts it at
#                 (default the tier's comfortable level)
#
# The cap, checked when the content loads: no spell may roll more than its tier's ceiling times
# its resolution's `damage` percent (../spells.toml) in one cast, harm or healing: max_dice times
# the dice's sides plus the bonus. A bonus is at most a quarter of the tier's ceiling. Nothing in
# the game pushes a spell past its cap, so a spell over it is refused rather than clamped.
