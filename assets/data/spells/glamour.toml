# Glamour (the spell types design §7 entry 23): Barkskin's cousin for the arcane, blows that miss
# more often; a scroll's only.
[[spell]]
id = "glamour"
name = "Glamour"
description = "A glamour lies over you a while: you seem a little to one side of where you stand, and blows meant for you miss more often."
level = 8
school = "abjuration"
kind = "buff"
shape = "self"
resolution = "auto"
effect = { status = "glamoured" }

[spell.grows]
degrees = "presence 14 2, 18 3"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). At rank 10: two degrees longer, 30 percent off the mana, and 60 percent off
# the casting time.
[spell.ranks]
2 = { mana_off = 10 }
3 = { degrees = 1 }
4 = { time_off = 20 }
5 = { mana_off = 10 }
6 = { degrees = 1 }
7 = { time_off = 15 }
8 = { mana_off = 10 }
9 = { time_off = 15 }
10 = { time_off = 10 }
