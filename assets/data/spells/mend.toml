# Mend (spec §8 "Spells", the first spell list): the priest's and the bard's cantrip, a touch that
# closes a scratch.
[[spell]]
id = "mend"
name = "Mend"
description = "A touch that closes a scratch: a few hit points back, yours or another's beside you."
level = 1
school = "restoration"
kind = "heal"
shape = "touch"
resolution = "touch"
effect = { heal = "1d3" }

[spell.grows]
heal = "willpower 16 1d4, 22 1d6"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). At rank 10: +3 on the roll, a die more, every die two sides bigger, 1s rolled
# again, a tenth off the mana, and 35 percent off the casting time.
[spell.ranks]
2 = { reroll = 1 }
3 = { bonus = 1 }
4 = { mana_off = 10 }
5 = { sides = 1 }
6 = { time_off = 20 }
7 = { bonus = 1 }
8 = { dice = 1 }
9 = { sides = 1 }
10 = { bonus = 1, time_off = 15 }
