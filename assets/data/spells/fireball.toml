# Fireball (spec §8 "Spells", the first spell list; the wizard's Fire burst of #395 folded into it):
# a burst of fire; its ladder of Intelligence ([spell.grows]) adds dice.
[[spell]]
id = "fireball"
name = "Fireball"
description = "A ball of fire that bursts where you aim it: it breaks walls and melts ice."
level = 11
school = "evocation"
kind = "damage"
shape = "burst"
resolution = "area"
damage_type = "fire"
range = 10
radius = 2
damage = "2d6"

[spell.cast]
effect = "fireball"
noun = "fireball"
verb = "burns"
message = "A fireball streaks from your hands and explodes!"
blast = 1000
heat = true
noise = { sound = "explosion", loudness = 150 }

[spell.grows]
damage = "intelligence 13 3d6, 16 4d6, 19 5d6, 25 5d6+2"
range = "willpower 14 11, 18 12"
