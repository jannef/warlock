# Fireball (spec §8 "Spells", the first spell list; the wizard's Fire burst of #395 folded into it):
# a burst of fire; its ladder of Intelligence ([spell.grows]) adds dice.
[[spell]]
id = "fireball"
name = "Fireball"
description = "A ball of fire that bursts where you aim it: it breaks walls and melts ice."
level = 11
school = "evocation"
kind = "damage"
shape = "burst"
resolution = "area"
damage_type = "fire"
range = 10
radius = 2
damage = "4d6"

[spell.cast]
effect = "fireball"
noun = "fireball"
verb = "burns"
message = "A fireball streaks from your hands and explodes!"
blast = 1000
noise = { sound = "explosion", loudness = 150 }

[spell.grows]
damage = "intelligence 13 6d6, 16 8d6, 19 10d6, 25 10d6+2"
range = "willpower 14 11, 18 12"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). At rank 10: two cells farther, 1s rolled again, +2 on the roll, two dice more, a
# fifth off the mana, and a burst a cell wider.
[spell.ranks]
2 = { cells = 1 }
3 = { reroll = 1 }
4 = { bonus = 2 }
5 = { dice = 1 }
6 = { mana_off = 10 }
7 = { cells = 1 }
8 = { dice = 1 }
9 = { mana_off = 10 }
10 = { radius = 1 }
