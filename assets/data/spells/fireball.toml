# Fireball (spec §8 "Spells", the first spell list; the wizard's Fire burst of #395 folded into it):
# a burst of fire, a die more every four caster levels, never more than three.
[[spell]]
id = "fireball"
name = "Fireball"
description = "A ball of fire that bursts where you aim it: it breaks walls and melts ice."
tier = 3
school = "evocation"
kind = "damage"
shape = "burst"
resolution = "area"
damage_type = "fire"
range = 10
max_range = 12
max_radius = 2
damage = { dice = "2d6", per_levels = 4, max_dice = 3 }

[spell.cast]
effect = "fireball"
noun = "fireball"
verb = "burns"
message = "A fireball streaks from your hands and explodes!"
blast = 1000
heat = true
noise = { sound = "explosion", loudness = 150 }

[spell.scales]
damage = { intelligence = 10, willpower = 5 }
