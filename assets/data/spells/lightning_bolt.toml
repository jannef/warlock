# Lightning bolt (spec §8 "Spells", the first spell list): a line of lightning through everyone in
# it; its ladder of Intelligence ([spell.grows]) adds dice.
[[spell]]
id = "lightning_bolt"
name = "Lightning bolt"
description = "A bolt of lightning from you toward a place you aim at and on: everyone on its line is struck."
level = 11
school = "evocation"
kind = "damage"
shape = "line"
resolution = "area"
damage_type = "electricity"
length = 8
damage = "2d6"

[spell.cast]
effect = "lightning_bolt"
noun = "lightning bolt"
verb = "strikes"
message = "Lightning leaps from your hands!"
noise = { sound = "thunder", loudness = 120 }

[spell.grows]
damage = "intelligence 13 3d6, 16 4d6, 19 5d6, 25 5d6+2"
length = "willpower 14 9, 18 10, 22 11, 26 12"
