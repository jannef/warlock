# Magic missile (spec §8 "Spells", the first spell list): a dart of force that never misses, a
# die more a rung of its Intelligence ladder ([spell.grows]).
[[spell]]
id = "magic_missile"
name = "Magic missile"
description = "A dart of force toward a place you aim at: it never misses the first creature in its way."
level = 3
school = "evocation"
kind = "damage"
shape = "bolt"
resolution = "auto"
damage_type = "force"
range = 8
damage = "1d4"

[spell.cast]
effect = "arcane_bolt"
noun = "magic missile"
verb = "strikes"
noise = { sound = "chanting", loudness = 30 }

[spell.grows]
damage = "intelligence 13 2d4, 16 3d4, 22 3d4+1"
range = "willpower 14 9, 18 10"
