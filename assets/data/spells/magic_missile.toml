# Magic missile (spec §8 "Spells", the first spell list): a dart of force that never misses, a
# die more a rung of its Intelligence ladder ([spell.grows]).
[[spell]]
id = "magic_missile"
name = "Magic missile"
description = "A dart of force toward a place you aim at: it never misses the first creature in its way."
level = 3
school = "evocation"
kind = "damage"
shape = "bolt"
resolution = "auto"
damage_type = "force"
range = 8
damage = "2d4"

[spell.cast]
effect = "arcane_bolt"
noun = "magic missile"
verb = "strikes"
noise = { sound = "chanting", loudness = 30 }

[spell.grows]
damage = "intelligence 13 4d4, 16 6d4, 22 6d4+1"
range = "willpower 14 9, 18 10"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`): a worked example. Each entry is what reaching that rank adds; a cast at rank
# N has everything listed up to N. At rank 10: +2 on the roll, two dice more, two cells farther,
# a fifth off the mana, and half the casting time.
[spell.ranks]
2 = { bonus = 1 }
3 = { cells = 1 }
4 = { dice = 1 }
5 = { mana_off = 10 }
6 = { bonus = 1 }
7 = { cells = 1 }
8 = { dice = 1 }
9 = { mana_off = 10 }
10 = { time_off = 50 }
