# Flay (the spell types design §7 entry 7): the witch's damage over time, little harm and a
# wound that bleeds; nothing bloodless bleeds (`World::afflict`).
[[spell]]
id = "flay"
name = "Flay"
description = "Open a foe you see nearby: its skin splits and it bleeds."
level = 8
school = "necromancy"
kind = "damage"
shape = "ray"
resolution = "auto"
damage_type = "necrotic"
range = 6
damage = "2d4"
effect = { status = "bleeding", severity = 2 }

[spell.cast]
effect = "pale_ray"
noun = "flaying"
verb = "flays"
noise = { sound = "chanting", loudness = 20 }

[spell.grows]
damage = "willpower 16 2d6, 22 2d8"
range = "willpower 14 7, 18 8"
degrees = "presence 14 3, 18 4"

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). At rank 10:
# a degree more bleeding, +2 on the roll, dice two sides bigger, a die more, 1s rolled again, a
# cell farther, fifteen percent off the mana, and a quarter off the casting time.
[spell.ranks]
2 = { degrees = 1 }
3 = { bonus = 1 }
4 = { cells = 1 }
5 = { reroll = 1 }
6 = { bonus = 1 }
7 = { mana_off = 15 }
8 = { sides = 2 }
9 = { time_off = 25 }
10 = { dice = 1 }
