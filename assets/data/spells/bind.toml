# Bind (the spell types design §7 entry 12): a foe held where it stands, Pinned for a few of its
# actions; it may still strike.
[[spell]]
id = "bind"
name = "Bind"
description = "Bind a foe you see nearby where it stands: it cannot step for a few actions, though it may still strike."
level = 9
school = "enchantment"
kind = "hex"
shape = "ray"
resolution = "auto"
range = 6
effect = { status = "pinned", severity = 2 }

[spell.grows]
range = "willpower 14 7, 18 8"
degrees = "presence 14 3"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). Pinned holds three degrees at most, so a degree is all its ranks add to the
# hold. At rank 10: a degree longer, three cells farther, 35 percent off the mana, and two fifths
# off the casting time.
[spell.ranks]
2 = { cells = 1 }
3 = { mana_off = 10 }
4 = { degrees = 1 }
5 = { cells = 1 }
6 = { time_off = 20 }
7 = { mana_off = 10 }
8 = { cells = 1 }
9 = { time_off = 20 }
10 = { mana_off = 15 }
