# Acid arrow (the spell types design §7 entry 5): the first acid spell, a dart that keeps eating
# what it strikes (the acid type's Corroded); a scroll's only.
[[spell]]
id = "acid_arrow"
name = "Acid arrow"
description = "A dart of acid toward a place you aim at: it strikes the first creature in its way, if it hits, and keeps eating."
level = 5
school = "evocation"
kind = "damage"
shape = "bolt"
resolution = "attack"
damage_type = "acid"
range = 8
damage = "2d6"

[spell.cast]
effect = "acid_arrow"
noun = "acid arrow"
noise = { sound = "chanting", loudness = 30 }

[spell.grows]
damage = "intelligence 13 4d6, 16 6d6, 25 6d6+2"
range = "willpower 14 9, 18 10"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). An attack bolt: the aim first. At rank 10: +3 to hit, criticals from 20, 1s rolled
# again, two dice more, a cell farther, and a fifth off the mana.
[spell.ranks]
2 = { to_hit = 1 }
3 = { reroll = 1 }
4 = { cells = 1 }
5 = { threat = 1 }
6 = { dice = 1 }
7 = { to_hit = 1 }
8 = { mana_off = 20 }
9 = { threat = 1 }
10 = { dice = 1, to_hit = 1 }
