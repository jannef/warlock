# Slumber (the spell types design §7 entry 20): one foe asleep until something wakes it; a
# scroll's only.
[[spell]]
id = "slumber"
name = "Slumber"
description = "A foe you see nearby falls asleep where it stands, until a noise, a blow, or a cry wakes it."
level = 15
school = "enchantment"
kind = "hex"
shape = "ray"
resolution = "auto"
range = 6
effect = { status = "asleep", severity = 1 }

[spell.grows]
range = "willpower 14 7, 18 8"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). Asleep holds one degree at most, so its ranks go to the reach and the price.
# At rank 10: three cells farther, 35 percent off the mana, and half the casting time.
[spell.ranks]
2 = { cells = 1 }
3 = { mana_off = 10 }
4 = { time_off = 15 }
5 = { cells = 1 }
6 = { mana_off = 10 }
7 = { time_off = 15 }
8 = { cells = 1 }
9 = { mana_off = 10 }
10 = { mana_off = 5, time_off = 20 }
