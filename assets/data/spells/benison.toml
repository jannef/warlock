# Benison (the spell types design §7 entry 35): a heal over a burst about the caster (`range = 0`):
# the caster and their allies in it, hostiles nothing.
[[spell]]
id = "benison"
name = "Benison"
description = "A blessing spoken over all beside you: hit points back to you and every ally within reach; it takes a while to say."
level = 12
school = "restoration"
kind = "heal"
shape = "burst"
resolution = "area"
range = 0
radius = 1
casts = 2
effect = { heal = "2d6" }

[spell.grows]
heal = "willpower 16 3d6, 22 3d6+3"
radius = "willpower 18 2"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). At rank 10: +3 on the roll, a die more, every die a side bigger, 1s rolled
# again, a cell wider, 15 percent off the mana, and 30 percent off the casting time.
[spell.ranks]
2 = { bonus = 1 }
3 = { time_off = 15 }
4 = { reroll = 1 }
5 = { radius = 1 }
6 = { bonus = 1 }
7 = { mana_off = 15 }
8 = { sides = 1 }
9 = { time_off = 15 }
10 = { dice = 1, bonus = 1 }
