# Barkskin (spec §8 "Spells"): the druid's and the ranger's boon, skin hard as bark a while.
[[spell]]
id = "barkskin"
name = "Barkskin"
description = "Your skin hardens like bark a while: blows land on you less often."
level = 3
school = "transmutation"
kind = "buff"
shape = "self"
resolution = "auto"
effect = { status = "barkskin" }

[spell.grows]
degrees = "presence 14 2, 18 3"
