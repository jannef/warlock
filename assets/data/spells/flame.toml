# The druid's Flame (Flame and frost, spec §8 "Class abilities"): a ball of flame.
[[spell]]
id = "flame"
name = "Flame"
description = "A ball of flame that bursts where you aim it: it breaks walls and melts ice."
level = 12
school = "evocation"
kind = "damage"
shape = "burst"
resolution = "area"
damage_type = "fire"
range = 10
radius = 2
damage = "6d6"

[spell.cast]
effect = "fireball"
noun = "flame"
verb = "burns"
message = "A ball of flame leaps from your hands!"
blast = 1000
noise = { sound = "explosion", loudness = 150 }

[spell.grows]
damage = "intelligence 16 8d6, 19 10d6, 25 10d6+2"
range = "willpower 14 11, 18 12"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). Fireball's twin, quicker where Fireball reaches wider. At rank 10: 1s rolled
# again, a cell farther, +2 on the roll, two dice more, 15 % off the mana, 35 % off the
# casting time, and d8s for d6s.
[spell.ranks]
2 = { reroll = 1 }
3 = { cells = 1 }
4 = { time_off = 15 }
5 = { dice = 1 }
6 = { bonus = 2 }
7 = { mana_off = 15 }
8 = { dice = 1 }
9 = { time_off = 20 }
10 = { sides = 2 }
