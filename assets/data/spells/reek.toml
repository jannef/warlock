# Reek (the spell types design §7 entry 16, §7 "Zones"; #1000): Blight's little brother that stays:
# a cloud that poisons whoever starts a turn in it. It does not block sight. Scroll only.
[[spell]]
id = "reek"
name = "Reek"
description = "A cloud of foul vapour bursts where you aim it and hangs there a while: everyone in it is poisoned, and poisoned again while they stay."
level = 13
school = "necromancy"
kind = "damage"
shape = "burst"
resolution = "area"
damage_type = "poison"
range = 8
radius = 2
damage = "2d4"
effect = { zone = { kind = "fouled", turns = 10 } }

[spell.cast]
effect = "blight"
noun = "reek"
verb = "chokes"
message = "A foul cloud bursts from your hands!"
noise = { sound = "chanting", loudness = 30 }

[spell.grows]
damage = "willpower 16 4d4, 22 4d4+2"
range = "willpower 14 9, 18 10"

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). At rank 10:
# +2 on the roll, a die more, 1s rolled again, a cell farther, a cell wider, a fifth off the mana,
# and a quarter off the casting time. The cloud hangs as long at every rank.
[spell.ranks]
2 = { bonus = 1 }
3 = { cells = 1 }
4 = { mana_off = 10 }
5 = { reroll = 1 }
6 = { radius = 1 }
7 = { bonus = 1 }
8 = { mana_off = 10 }
9 = { time_off = 25 }
10 = { dice = 1 }
