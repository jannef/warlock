# Flare (the potions wave 2 design §9.3): the cantrip: a white flash where it is aimed that stuns
# everyone it reaches with eyes to see it (`only_sighted`: the eyeless take nothing). The flask of
# brilliance throws it. Scroll only.
[[spell]]
id = "flare"
name = "Flare"
description = "A blinding flash where you aim it: everyone it reaches who has eyes is stunned a moment."
level = 2
school = "evocation"
kind = "hex"
shape = "burst"
resolution = "area"
range = 8
radius = 1
effect = { status = "stunned", severity = 1, only_sighted = true }

[spell.cast]
effect = "flare"
noise = { sound = "chanting", loudness = 20 }

[spell.grows]
range = "willpower 14 9, 18 10"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). Stunned holds one degree, so a rank lengthens nothing: it reaches farther and wider,
# and costs less. At rank 10: three cells farther, a burst two cells wider, 30 % off the mana,
# and half the casting time.
[spell.ranks]
2 = { cells = 1 }
3 = { mana_off = 15 }
4 = { time_off = 25 }
5 = { radius = 1 }
6 = { cells = 1 }
7 = { mana_off = 15 }
8 = { time_off = 25 }
9 = { cells = 1 }
10 = { radius = 1 }
