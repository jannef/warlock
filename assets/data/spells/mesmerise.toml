# Mesmerise (the spell types design §7 entry 19): the Transfixing stare's status for anyone who
# learns the trick.
[[spell]]
id = "mesmerise"
name = "Mesmerise"
description = "Catch the eye of a foe you see nearby: transfixed a while, all it does takes twice as long."
level = 5
school = "enchantment"
kind = "hex"
shape = "ray"
resolution = "auto"
range = 6
effect = { status = "transfixed", severity = 2 }

[spell.grows]
range = "willpower 14 7, 18 8"
degrees = "presence 14 3, 18 4"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). Transfixed holds four degrees at most. At rank 10: two degrees longer, three
# cells farther, a fifth off the mana, and two fifths off the casting time.
[spell.ranks]
2 = { cells = 1 }
3 = { degrees = 1 }
4 = { mana_off = 10 }
5 = { cells = 1 }
6 = { degrees = 1 }
7 = { time_off = 20 }
8 = { cells = 1 }
9 = { mana_off = 10 }
10 = { time_off = 20 }
