# The witch's Evil eye (spec §8 "Class abilities"): a hex on a foe she sees.
[[spell]]
id = "evil_eye"
name = "Evil eye"
description = "Cast the evil eye on a foe you see nearby: hexed a while, its blows land worse."
level = 0
school = "enchantment"
kind = "hex"
shape = "ray"
resolution = "auto"
range = 6
effect = { status = "ill_wished" }

[spell.grows]
range = "willpower 14 7, 18 8"
degrees = "presence 14 2, 18 3"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). At rank 10: two degrees longer, three cells farther, a quarter off the mana,
# and two fifths off the casting time.
[spell.ranks]
2 = { cells = 1 }
3 = { degrees = 1 }
4 = { mana_off = 10 }
5 = { cells = 1 }
6 = { time_off = 20 }
7 = { degrees = 1 }
8 = { cells = 1 }
9 = { mana_off = 15 }
10 = { time_off = 20 }
