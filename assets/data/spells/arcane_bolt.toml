# The wizard's Arcane bolt (spec §8 "Class abilities"): raw force through everyone on its line.
[[spell]]
id = "arcane_bolt"
name = "Arcane bolt"
description = "A bolt of raw force from your hand toward a place you aim at, through everyone on its line."
level = 6
school = "evocation"
kind = "damage"
shape = "line"
resolution = "area"
damage_type = "force"
length = 6
damage = "2d6"

[spell.cast]
effect = "arcane_bolt"
noun = "arcane bolt"
verb = "strikes"
noise = { sound = "explosion", loudness = 40 }

[spell.grows]
damage = "intelligence 13 3d6, 19 3d6+2, 25 3d6+4"
length = "willpower 14 7, 18 8"
