# The wizard's Arcane bolt (spec §8 "Class abilities"): raw force through everyone on its line.
[[spell]]
id = "arcane_bolt"
name = "Arcane bolt"
description = "A bolt of raw force from your hand toward a place you aim at, through everyone on its line."
level = 6
school = "evocation"
kind = "damage"
shape = "line"
resolution = "area"
damage_type = "force"
length = 6
damage = "4d6"

[spell.cast]
effect = "arcane_bolt"
noun = "arcane bolt"
verb = "strikes"
noise = { sound = "explosion", loudness = 40 }

[spell.grows]
damage = "intelligence 13 6d6, 19 6d6+2, 25 6d6+4"
length = "willpower 14 7, 18 8"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). At rank 10: two cells longer, +2 on the roll, 1s rolled again, two dice more, a
# tenth off the mana, a quarter off the casting time, and d8s for d6s.
[spell.ranks]
2 = { cells = 1 }
3 = { bonus = 1 }
4 = { reroll = 1 }
5 = { dice = 1 }
6 = { mana_off = 10 }
7 = { cells = 1, bonus = 1 }
8 = { dice = 1 }
9 = { time_off = 25 }
10 = { sides = 2 }
