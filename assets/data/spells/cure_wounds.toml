# The priest's Cure wounds (spec §8 "Class abilities"): hit points back; it takes a while to say.
[[spell]]
id = "cure_wounds"
name = "Cure wounds"
description = "A prayer and a touch that close wounds: hit points back, yours or another's beside you; it takes a while to say."
level = 3
school = "restoration"
kind = "heal"
shape = "touch"
resolution = "touch"
casts = 2
effect = { heal = "2d6" }

[spell.grows]
heal = "willpower 16 3d6, 22 3d6+3"
