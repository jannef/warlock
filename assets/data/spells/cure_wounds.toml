# The priest's Cure wounds (spec §8 "Class abilities"): hit points back; it takes a while to say.
[[spell]]
id = "cure_wounds"
name = "Cure wounds"
description = "A prayer and a touch that close wounds: hit points back, yours or another's beside you; it takes a while to say."
level = 3
school = "restoration"
kind = "heal"
shape = "touch"
resolution = "touch"
casts = 2
effect = { heal = "2d6" }

[spell.grows]
heal = "willpower 16 3d6, 22 3d6+3"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). At rank 10: +3 on the roll, a die more, every die two sides bigger, 1s rolled
# again, 15 percent off the mana, and 35 percent off the casting time.
[spell.ranks]
2 = { bonus = 1 }
3 = { reroll = 1 }
4 = { time_off = 15 }
5 = { sides = 1 }
6 = { bonus = 1 }
7 = { dice = 1 }
8 = { mana_off = 15 }
9 = { time_off = 20 }
10 = { bonus = 1, sides = 1 }
