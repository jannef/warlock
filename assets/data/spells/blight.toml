# percent off the mana, and a cell wider.
[spell.ranks]
2 = { bonus = 1 }
3 = { degrees = 1 }
4 = { reroll = 1 }
5 = { cells = 1 }
6 = { bonus = 2 }
7 = { degrees = 1 }
8 = { mana_off = 15 }
9 = { dice = 1 }
10 = { radius = 1 }
