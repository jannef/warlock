# The witch's Blight (spec §8 "Class abilities"): a burst that withers and poisons.
[[spell]]
id = "blight"
name = "Blight"
description = "A burst of blight where you aim it: it withers flesh and poisons everyone it reaches."
level = 7
school = "necromancy"
kind = "damage"
shape = "burst"
resolution = "area"
damage_type = "poison"
range = 8
radius = 2
damage = "4d6"
effect = { status = "poisoned", severity = 1 }

[spell.cast]
effect = "blight"
noun = "blight"
verb = "withers"
message = "A sickly cloud bursts from your hands!"
noise = { sound = "explosion", loudness = 60 }

[spell.grows]
damage = "willpower 16 6d6, 22 6d6+3"
range = "willpower 14 9, 18 10"

