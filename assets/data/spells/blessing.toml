# The priest's Blessing (spec §8 "Class abilities"): a god's favour on the caster.
[[spell]]
id = "blessing"
name = "Blessing"
description = "Ask your god's favour: blessed a while, your blows land truer and your will is firmer."
level = 3
school = "abjuration"
kind = "buff"
shape = "self"
resolution = "auto"
effect = { status = "blessed" }

[spell.grows]
degrees = "presence 14 2, 18 3"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). At rank 10: two degrees longer, 30 percent off the mana, and two fifths off
# the casting time.
[spell.ranks]
2 = { time_off = 10 }
3 = { degrees = 1 }
4 = { mana_off = 10 }
5 = { time_off = 10 }
6 = { mana_off = 10 }
7 = { degrees = 1 }
8 = { time_off = 10 }
9 = { mana_off = 10 }
10 = { time_off = 10 }
