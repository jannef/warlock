# Silence (the spell types design §7 entry 17): a burst of Silenced, no spell, scroll, or song
# for a moment; short by its status's own easing.
[[spell]]
id = "silence"
name = "Silence"
description = "Silence falls where you aim it: everyone it reaches can neither cast nor read nor sing for a moment."
level = 11
school = "abjuration"
kind = "hex"
shape = "burst"
resolution = "area"
range = 8
radius = 1
effect = { status = "silenced", severity = 1 }

[spell.cast]
noise = { sound = "chanting", loudness = 10 }

[spell.grows]
range = "willpower 14 9, 18 10"
radius = "willpower 18 2"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). Silenced holds one degree at most, so its ranks go to the reach and the price.
# At rank 10: three cells farther, a cell wider, 30 percent off the mana, and half the casting
# time.
[spell.ranks]
2 = { cells = 1 }
3 = { mana_off = 10 }
4 = { time_off = 20 }
5 = { radius = 1 }
6 = { cells = 1 }
7 = { mana_off = 10 }
8 = { time_off = 20 }
9 = { mana_off = 10 }
10 = { cells = 1, time_off = 10 }
