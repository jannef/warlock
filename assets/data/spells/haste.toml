# Haste (spec §8 "Spells", the first spell list): the caster's own quickness a while.
[[spell]]
id = "haste"
name = "Haste"
description = "The world slows around you a while: all you do takes a quarter less time."
level = 11
school = "transmutation"
kind = "buff"
shape = "self"
resolution = "auto"
effect = { status = "hasted" }

[spell.grows]
degrees = "presence 14 2, 18 3"
