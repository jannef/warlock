# The witch's Curse of sloth (spec §8 "Class abilities").
[[spell]]
id = "curse_of_sloth"
name = "Curse of sloth"
description = "Curse a foe you see nearby: sluggish a while, all it does takes half again as long."
level = 3
school = "transmutation"
kind = "hex"
shape = "ray"
resolution = "auto"
range = 6
effect = { status = "sluggish" }

[spell.grows]
range = "willpower 14 7, 18 8"
degrees = "presence 14 2, 18 3"
