# Fear (the spell types design §7 entry 13): dread over a burst, Intimidate's Frightened with no
# check, on everyone it reaches but the caster.
[[spell]]
id = "fear"
name = "Fear"
description = "Dread bursts where you aim it: everyone it reaches runs from you a while, and fights only when cornered."
level = 10
school = "enchantment"
kind = "hex"
shape = "burst"
resolution = "area"
range = 8
radius = 1
effect = { status = "frightened", severity = 2 }

[spell.cast]
noise = { sound = "chanting", loudness = 30 }

[spell.grows]
range = "willpower 14 9, 18 10"
degrees = "presence 14 3"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). Frightened holds three degrees at most, so a degree is all its ranks add to
# the fright. At rank 10: a degree longer, a cell wider, three cells farther, 30 percent off the
# mana, and two fifths off the casting time.
[spell.ranks]
2 = { cells = 1 }
3 = { mana_off = 10 }
4 = { degrees = 1 }
5 = { radius = 1 }
6 = { cells = 1 }
7 = { mana_off = 10 }
8 = { time_off = 25 }
9 = { cells = 1 }
10 = { mana_off = 10, time_off = 15 }
