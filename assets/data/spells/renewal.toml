# Renewal (the spell types design §7 entry 27): wounds close four times as fast a while; a buff
# for the long walk, not a cure.
[[spell]]
id = "renewal"
name = "Renewal"
description = "Your flesh knits fast a while: wounds close at four times the pace, awake or asleep."
level = 10
school = "restoration"
kind = "buff"
shape = "self"
resolution = "auto"
effect = { status = "renewing" }

[spell.grows]
degrees = "presence 14 2, 18 3"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). At rank 10: two degrees longer, two fifths off the mana, and 55 percent off
# the casting time.
[spell.ranks]
2 = { mana_off = 10 }
3 = { degrees = 1 }
4 = { time_off = 20 }
5 = { mana_off = 10 }
6 = { degrees = 1 }
7 = { time_off = 20 }
8 = { mana_off = 10 }
9 = { time_off = 15 }
10 = { mana_off = 10 }
