# See invisible (docs/design/monster-dread.md §5.11, D8): Seeing, five minutes in which the
# invisible and the shadowy are plain to the caster's eyes (a status that `sees_unseen`).
[[spell]]
id = "see_invisible"
name = "See invisible"
description = "For a while your eyes find what hides from them: the invisible, and shadows in the dark."
level = 7
school = "divination"
kind = "buff"
shape = "self"
resolution = "auto"
effect = { status = "seeing" }

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). Seeing holds one
# degree at most, so its ranks make it cheaper and quicker: at rank 10 two fifths off the mana and
# half the casting time.
[spell.ranks]
2 = { time_off = 10 }
3 = { mana_off = 5 }
4 = { time_off = 10 }
5 = { mana_off = 10 }
6 = { time_off = 10 }
7 = { mana_off = 10 }
8 = { time_off = 20 }
9 = { mana_off = 5 }
10 = { mana_off = 10 }
