# Ray of frost (spec §8 "Spells", the first spell list): the wizard's cantrip, a thin ray of cold
# that must hit like a missile; a poor weapon beside a crossbow, which is the point.
[[spell]]
id = "ray_of_frost"
name = "Ray of frost"
description = "A thin ray of cold toward a place you aim at: it strikes the first creature in its way, if it hits."
level = 1
school = "evocation"
kind = "damage"
shape = "ray"
resolution = "attack"
damage_type = "cold"
range = 6
damage = "2d6"

[spell.cast]
effect = "frost_ray"
noun = "ray of frost"
noise = { sound = "chanting", loudness = 20 }

[spell.grows]
damage = "intelligence 16 2d8"
range = "willpower 14 7, 18 8"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`): a worked example of an attack spell's table, which may also sharpen the aim
# (`to_hit`) and widen the threat range (`threat`: a natural 21, then a 20, threatens a
# critical). At rank 10: +2 to hit, criticals from 20, 1s rolled again, d8s, a die more, two
# cells farther, and a quarter off the mana.
[spell.ranks]
2 = { to_hit = 1 }
3 = { cells = 1 }
4 = { reroll = 1 }
5 = { threat = 1 }
6 = { to_hit = 1 }
7 = { sides = 2 }
8 = { mana_off = 25 }
9 = { threat = 1, cells = 1 }
10 = { dice = 1 }
