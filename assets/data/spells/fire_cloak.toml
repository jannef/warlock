# Fire cloak (spec §8 "Spells"): found on scrolls only, the light its price.
[[spell]]
id = "fire_cloak"
name = "Fire cloak"
description = "Flames wrap you a while without burning you: whoever strikes you in melee is burnt, and you shed a little light."
level = 12
school = "abjuration"
kind = "buff"
shape = "self"
resolution = "auto"
effect = { status = "fire_cloaked" }

[spell.grows]
degrees = "presence 14 2, 18 3"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). At rank 10: two degrees longer, 45 percent off the mana, and half the casting
# time.
[spell.ranks]
2 = { degrees = 1 }
3 = { mana_off = 10 }
4 = { time_off = 20 }
5 = { degrees = 1 }
6 = { mana_off = 10 }
7 = { time_off = 15 }
8 = { mana_off = 10 }
9 = { mana_off = 15 }
10 = { time_off = 15 }
