# The witch's Hex of weakness (spec §8 "Class abilities").
[[spell]]
id = "hex_of_weakness"
name = "Hex of weakness"
description = "Hex a foe you see nearby: weakened a while, weaker and clumsier."
level = 3
school = "necromancy"
kind = "hex"
shape = "ray"
resolution = "auto"
range = 6
effect = { status = "weakened" }

[spell.grows]
range = "willpower 14 7, 18 8"
degrees = "presence 14 2, 18 3"

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). At rank 10:
# four cells farther, two degrees longer (Weakened holds three at most), a quarter off the mana,
# and half the casting time.
[spell.ranks]
2 = { cells = 1 }
3 = { degrees = 1 }
4 = { mana_off = 10 }
5 = { time_off = 20 }
6 = { cells = 1 }
7 = { degrees = 1 }
8 = { mana_off = 15 }
9 = { time_off = 30 }
10 = { cells = 2 }
