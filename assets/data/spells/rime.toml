# Rime (the spell types design §7 entry 8): the druid's cone of cold, the cold type's rule on
# everyone in it and the water in it frozen.
[[spell]]
id = "rime"
name = "Rime"
description = "A breath of killing frost from your hands toward a place you aim at: everyone in it is chilled and slowed, and the water in it freezes."
level = 9
school = "evocation"
kind = "damage"
shape = "cone"
resolution = "area"
damage_type = "cold"
length = 4
damage = "4d6"

[spell.cast]
effect = "frost_burst"
noun = "rime"
verb = "bites"
message = "Frost pours from your hands!"
noise = { sound = "explosion", loudness = 40 }

[spell.grows]
damage = "willpower 13 6d6, 16 8d6, 22 8d6+2"
length = "willpower 18 5"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`): a cone is held to 5 cells, so its reach comes early and its dice after: at
# rank 10 1s rolled again, +2 on the roll, a cell longer, every die two sides bigger, a die
# more, a fifth off the mana, and a fifth off the casting time.
[spell.ranks]
2 = { reroll = 1 }
3 = { bonus = 2 }
4 = { cells = 1 }
5 = { mana_off = 10 }
6 = { sides = 1 }
7 = { dice = 1 }
8 = { time_off = 20 }
9 = { mana_off = 10 }
10 = { sides = 1 }
