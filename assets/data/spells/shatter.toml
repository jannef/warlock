# Shatter (the spell types design §7 entry 4): force, so it breaks shut doors and thin ice as well as
# what its blast breaks; a burst look of its own.
[[spell]]
id = "shatter"
name = "Shatter"
description = "A clap of force that bursts where you aim it: it cracks walls, ice, shut doors, and shut chests, and batters everyone it reaches."
level = 8
school = "evocation"
kind = "damage"
shape = "burst"
resolution = "area"
damage_type = "force"
range = 8
radius = 1
damage = "4d6"

[spell.cast]
effect = "shatter"
noun = "shatter"
verb = "batters"
message = "The air cracks!"
blast = 1000
noise = { sound = "explosion", loudness = 100 }

[spell.grows]
damage = "intelligence 13 6d6, 19 6d6+2, 25 6d6+4"
range = "willpower 14 9, 18 10"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`): the blast's reach is its craft: at rank 10 a cell wider (more wall,
# ice, doors, and chests cracked; its price still a radius of 1's), two cells farther, two dice
# more, every die a side bigger, 1s rolled again, +1 on the roll, and a fifth off the mana.
[spell.ranks]
2 = { bonus = 1 }
3 = { cells = 1 }
4 = { reroll = 1 }
5 = { mana_off = 10 }
6 = { dice = 1 }
7 = { radius = 1 }
8 = { cells = 1 }
9 = { sides = 1, mana_off = 10 }
10 = { dice = 1 }
