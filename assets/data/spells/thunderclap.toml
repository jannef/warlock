# Thunderclap (the spell types design §7 entry 6): a burst about the caster (`range = 0`: no aim).
# Their cell is in it, so they are hit and Stunned too (the owner, Q14), and the level hears it.
[[spell]]
id = "thunderclap"
name = "Thunderclap"
description = "A clap of thunder about you: everyone beside you is battered and reels, you too, and the whole level hears it."
level = 7
school = "evocation"
kind = "damage"
shape = "burst"
resolution = "area"
damage_type = "force"
range = 0
radius = 1
damage = "2d6"
effect = { status = "stunned", severity = 1 }

[spell.cast]
effect = "shatter"
noun = "thunderclap"
verb = "batters"
message = "Thunder cracks about you!"
noise = { sound = "thunder", loudness = 150 }

[spell.grows]
damage = "presence 13 4d6, 19 4d6+2"
radius = "willpower 18 2"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`): it starts weak (2d6 until Presence 13) and grows the most of the
# evocations: at rank 10 two dice more, every die two sides bigger, 1s rolled again, +1 on the
# roll, a cell wider, three tenths off the mana, and a quarter off the casting time.
[spell.ranks]
2 = { bonus = 1 }
3 = { dice = 1 }
4 = { mana_off = 15 }
5 = { radius = 1 }
6 = { sides = 2 }
7 = { reroll = 1 }
8 = { dice = 1 }
9 = { time_off = 25 }
10 = { mana_off = 15 }
