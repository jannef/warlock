# Rebuke (the spell types design §7 entry 36): fire, for there is no holy type (the owner, Q2), on
# the undead in the burst alone, friend or foe; the living are not even touched.
[[spell]]
id = "rebuke"
name = "Rebuke"
description = "Hold up your faith against the dead, and it burns them: every undead thing where you aim it is seared, and flees from you a while."
level = 14
school = "abjuration"
kind = "damage"
shape = "burst"
resolution = "area"
damage_type = "fire"
range = 8
radius = 2
damage = "4d6"
effect = { status = "frightened", severity = 3, only_tags = ["undead"] }

[spell.cast]
effect = "blaze"
noun = "rebuke"
verb = "sears"
message = "You hold up your faith against the dead!"
noise = { sound = "chanting", loudness = 40 }

[spell.grows]
damage = "willpower 13 6d6, 16 8d6, 19 10d6, 25 10d6+2"
range = "willpower 14 9, 18 10"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). Its fright is already at Frightened's most, so its ranks go to the fire and
# the reach. At rank 10: +2 on the roll, a die more, 1s rolled again, a cell wider, two cells
# farther, and a quarter off the mana and the casting time.
[spell.ranks]
2 = { bonus = 1 }
3 = { cells = 1 }
4 = { reroll = 1 }
5 = { radius = 1 }
6 = { bonus = 1 }
7 = { mana_off = 15 }
8 = { dice = 1 }
9 = { cells = 1 }
10 = { mana_off = 10, time_off = 25 }
