# Scorching ray (spec §8 "Spells", the first spell list): a ray of fire that must hit; its
# Intelligence ladder ([spell.grows]) adds dice, and a hotter core at the top.
[[spell]]
id = "scorching_ray"
name = "Scorching ray"
description = "A ray of fire toward a place you aim at: it strikes the first creature in its way, if it hits, hotter as your power grows."
level = 7
school = "evocation"
kind = "damage"
shape = "ray"
resolution = "attack"
damage_type = "fire"
range = 8
damage = "2d6"

[spell.cast]
effect = "fire_breath"
noun = "scorching ray"
noise = { sound = "chanting", loudness = 30 }

[spell.grows]
damage = "intelligence 13 4d6, 16 6d6, 19 8d6, 25 6d6+2d10"
range = "willpower 14 9, 18 10"
