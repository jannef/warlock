# The wizard's Fire burst (spec §8 "Class abilities"): a fireball of the wizard's own.
[[spell]]
id = "fire_burst"
name = "Fire burst"
description = "A fireball of your own: it bursts where you aim it, breaks walls, and melts ice."
tier = 3
school = "evocation"
kind = "damage"
shape = "burst"
resolution = "area"
damage_type = "fire"
range = 10
max_range = 12
max_radius = 2
damage = { dice = "3d6" }

[spell.cast]
effect = "fireball"
noun = "fireball"
verb = "burns"
message = "A fireball streaks from your hands and explodes!"
blast = 1000
heat = true
noise = { sound = "explosion", loudness = 150 }
