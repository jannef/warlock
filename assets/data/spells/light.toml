# Light (spec §8 "Spells", "Scrolls"): a cantrip, a pale light about the caster a while. The
# scroll of light casts it.
[[spell]]
id = "light"
name = "Light"
description = "A pale, steady light gathers about you a while and goes where you go."
level = 0
school = "evocation"
kind = "buff"
shape = "self"
resolution = "auto"
effect = { status = "lit" }

[spell.grows]
degrees = "presence 14 2, 18 3"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`): a cantrip's ease. At rank 10 two degrees more (the full hour and a half at
# any Presence), three quarters off the mana, and four fifths off the casting time.
[spell.ranks]
2 = { degrees = 1 }
3 = { time_off = 20 }
4 = { mana_off = 25 }
5 = { degrees = 1 }
6 = { time_off = 20 }
7 = { mana_off = 25 }
8 = { time_off = 20 }
9 = { mana_off = 25 }
10 = { time_off = 20 }
