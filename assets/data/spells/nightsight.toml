# Nightsight (the spell types design §7 entry 22): the potion of cat's eyes' status, half an
# hour; it has one degree, so no ladder.
[[spell]]
id = "nightsight"
name = "Nightsight"
description = "Your eyes open to the dark a while: you see as a cat does."
level = 4
school = "transmutation"
kind = "buff"
shape = "self"
resolution = "auto"
effect = { status = "cat_eyed" }

[spell.ranks]
2 = { time_off = 15 }
3 = { degrees = 1 }
4 = { mana_off = 10 }
5 = { time_off = 15 }
6 = { degrees = 1 }
7 = { time_off = 20 }
8 = { degrees = 1 }
9 = { time_off = 10 }
10 = { mana_off = 40 }
