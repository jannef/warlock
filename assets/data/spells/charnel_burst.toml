# Charnel burst (the spell types design §7 entry 2): a corpse the caster sees bursts where it lies,
# used up, and tears everyone beside it. The stage of the corpse is not read. A kill it makes leaves
# a corpse for the next.
[[spell]]
id = "charnel_burst"
name = "Charnel burst"
description = "Burst a corpse you see: its rot and bone tear everyone beside it."
level = 9
school = "necromancy"
kind = "damage"
shape = "burst"
resolution = "area"
damage_type = "necrotic"
range = 8
radius = 1
damage = "4d6"
effect = { corpse = "consumed" }

[spell.cast]
effect = "blight"
noun = "burst"
verb = "tears"
noise = { sound = "explosion", loudness = 60 }

[spell.grows]
damage = "willpower 13 6d6, 16 8d6, 19 10d6, 25 10d6+2"
range = "willpower 14 9, 18 10"

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). At rank 10:
# +4 on the roll, a die more, 2s and 1s rolled again, a cell farther, a cell wider (from rank 7
# the corpse tears everyone two cells round), and a tenth off the mana.
[spell.ranks]
2 = { bonus = 1 }
3 = { reroll = 1 }
4 = { cells = 1 }
5 = { bonus = 1 }
6 = { mana_off = 10 }
7 = { radius = 1 }
8 = { reroll = 1 }
9 = { bonus = 2 }
10 = { dice = 1 }
