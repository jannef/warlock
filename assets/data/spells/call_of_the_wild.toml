# The druid's Call of the wild (spec §8 "Class abilities", "Allies"; #839): a wolf comes to the
# caster's side for a few minutes. One at a time: Pack leader and Lord of the wild raise the
# druid's cap. Very hard to learn from its scroll (the owner's Q7 of #828).
[[spell]]
id = "call_of_the_wild"
name = "Call of the wild"
description = "Call the wild to your side: a wolf comes out of the dark to fight beside you for a few minutes."
level = 5
school = "enchantment"
kind = "summon"
shape = "self"
resolution = "auto"
study_difficulty = 8
effect = { summon = { creatures = ["wolf"], count = "1", most = 1, minutes = 5 } }

[spell.cast]
message = "You call, and the wild answers."
noise = { sound = "chanting", loudness = 20 }

[spell.grows]
degrees = "presence 14 8, 18 12, 22 16"
