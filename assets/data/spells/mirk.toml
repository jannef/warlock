# Mirk (the spell types design §7 entry 14, §7 "Zones"; #1000): a pall of darkness that lies where
# it is aimed: no light reaches into it. Cast it on the archers, not on oneself. Scroll only.
[[spell]]
id = "mirk"
name = "Mirk"
description = "A pall of darkness bursts where you aim it and lies there a while: no light reaches into it, and eyes that need light see nothing in it."
level = 12
school = "evocation"
kind = "hex"
shape = "burst"
resolution = "area"
range = 8
radius = 2
effect = { zone = { kind = "dark", turns = 30 } }

[spell.cast]
noise = { sound = "chanting", loudness = 20 }

[spell.grows]
range = "willpower 14 9, 18 10"
radius = "willpower 18 3"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`): it rolls nothing and lays no status, so its ranks are its reach, its
# breadth, its price, and its pace: at rank 10 three cells farther, a cell wider (its price still
# a radius of 2's), two fifths off the mana, and half the casting time.
[spell.ranks]
2 = { cells = 1 }
3 = { mana_off = 10 }
4 = { time_off = 20 }
5 = { radius = 1 }
6 = { cells = 1 }
7 = { mana_off = 15 }
8 = { time_off = 30 }
9 = { cells = 1 }
10 = { mana_off = 15 }
