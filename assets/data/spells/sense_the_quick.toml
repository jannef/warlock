# Sense the quick (the spell types design §7 entry 32): Quick-sensed, the living felt as heartbeats
# at rough places (a status's `senses`).
[[spell]]
id = "sense_the_quick"
name = "Sense the quick"
description = "For a while you feel the living about you: their heartbeats, roughly placed, as you hear a footstep."
level = 5
school = "divination"
kind = "buff"
shape = "self"
resolution = "auto"
effect = { status = "quick_sensed" }

[spell.grows]
degrees = "presence 14 2, 18 3"

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). At rank 10:
# two degrees longer (Quick-sensed holds three at most), two fifths off the mana, and half the
# casting time.
[spell.ranks]
2 = { degrees = 1 }
3 = { mana_off = 10 }
4 = { time_off = 20 }
5 = { degrees = 1 }
6 = { mana_off = 10 }
7 = { time_off = 15 }
8 = { mana_off = 10 }
9 = { time_off = 15 }
10 = { mana_off = 10 }
