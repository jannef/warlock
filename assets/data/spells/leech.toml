# Leech (the spell types design §7 entry 11): half the harm it does comes back to the caster.
[[spell]]
id = "leech"
name = "Leech"
description = "A ray of hunger toward a place you aim at: it strikes the first creature in its way, if it hits, and what it takes mends you."
level = 10
school = "necromancy"
kind = "damage"
shape = "ray"
resolution = "attack"
damage_type = "necrotic"
range = 6
damage = "4d6"
effect = { leech = 50 }

[spell.cast]
effect = "pale_ray"
noun = "leeching ray"
verb = "drains"
noise = { sound = "chanting", loudness = 20 }

[spell.grows]
damage = "willpower 13 6d6, 16 8d6, 25 8d6+2"
range = "willpower 14 7, 18 8"

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). At rank 10:
# +3 to hit, a critical threatened two rolls lower, +3 on the roll (and so more mended), a die
# more, 1s rolled again, a cell farther, and fifteen percent off the mana.
[spell.ranks]
2 = { to_hit = 1 }
3 = { bonus = 1 }
4 = { cells = 1 }
5 = { threat = 1 }
6 = { reroll = 1 }
7 = { to_hit = 2 }
8 = { mana_off = 15 }
9 = { bonus = 2 }
10 = { threat = 1, dice = 1 }
