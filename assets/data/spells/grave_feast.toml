# Grave feast (the spell types design §7 entry 30): what life is left in a corpse beside the caster,
# in hit points and mana. The stage of the corpse is not read: a rotten one feeds as a fresh one.
[[spell]]
id = "grave_feast"
name = "Grave feast"
description = "Draw what life is left out of a corpse beside you: hit points and mana back."
level = 6
school = "necromancy"
kind = "heal"
shape = "touch"
resolution = "touch"
effect = { heal = "2d6", corpse = "consumed", mana = "1d6" }

[spell.grows]
heal = "willpower 16 3d6, 22 4d6"

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). At rank 10:
# +4 on the hit points it gives back, a die more, 2s and 1s rolled again, fifteen percent off the
# mana, and two fifths off the casting time. The mana it gives back does not grow.
[spell.ranks]
2 = { bonus = 1 }
3 = { reroll = 1 }
4 = { time_off = 20 }
5 = { bonus = 1 }
6 = { dice = 1 }
7 = { mana_off = 15 }
8 = { reroll = 1 }
9 = { time_off = 20 }
10 = { bonus = 2 }
