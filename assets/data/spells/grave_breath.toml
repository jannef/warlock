# Grave breath (spec §8 "Spells", the first spell list; #979): the witch's first harm, a short
# fan of the grave's cold breath; her Burning hands, in necromancy's own damage and on her
# Willpower. No hit roll and a little area: the first thing she has that hurts at all. Priced as
# Burning hands is, by the cost table at the mana floor (6; #1264).
[[spell]]
id = "grave_breath"
name = "Grave breath"
description = "The breath of an open grave toward a place you aim at: everyone in its fan withers."
level = 1
school = "necromancy"
kind = "damage"
shape = "cone"
resolution = "area"
damage_type = "necrotic"
length = 3
damage = "2d4"

[spell.cast]
effect = "blight"
noun = "grave breath"
verb = "withers"
message = "The breath of the grave rolls from your lips!"
noise = { sound = "chanting", loudness = 30 }

[spell.grows]
damage = "willpower 13 2d6, 16 4d4, 22 4d4+2"

# What rereading its grimoire adds, rank by rank (README.toml `[spell.ranks]`). At rank 10:
# +4 on the roll, a die more, 2s and 1s rolled again, two cells longer, and a tenth off the mana.
[spell.ranks]
2 = { bonus = 1 }
3 = { cells = 1 }
4 = { reroll = 1 }
5 = { mana_off = 10 }
6 = { bonus = 1 }
7 = { dice = 1 }
8 = { cells = 1 }
9 = { reroll = 1 }
10 = { bonus = 2 }
