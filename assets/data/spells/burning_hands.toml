# Burning hands (spec §8 "Spells", the first spell list; #979): the wizard's first real spell, a
# short fan of flame from the caster's hands. No hit roll and a little area, so dearer than Ray of
# frost: the cost table's cone price at the mana floor (6; its own `mana = 3` went with the floor,
# #1264), half again Magic missile's, for less reach and no aim to miss.
[[spell]]
id = "burning_hands"
name = "Burning hands"
description = "A fan of flame from your hands toward a place you aim at: everyone in it is burnt."
level = 1
school = "evocation"
kind = "damage"
shape = "cone"
resolution = "area"
damage_type = "fire"
length = 3
damage = "2d4"

[spell.cast]
effect = "blaze"
noun = "flames"
message = "Flames fan out from your hands!"
noise = { sound = "explosion", loudness = 40 }

[spell.grows]
damage = "intelligence 13 2d6, 16 4d4, 22 4d4+2"

# What rereading its grimoire adds, rank by rank (spec §8 "Spells": "Ranks"; README.toml
# `[spell.ranks]`). At rank 10: +2 on the roll, 1s rolled again, d6s for d4s, a die more, a
# fan two cells longer (the most a cone reaches), 15 % off the mana, and a quarter off the casting
# time.
[spell.ranks]
2 = { bonus = 1 }
3 = { reroll = 1 }
4 = { cells = 1 }
5 = { sides = 2 }
6 = { mana_off = 15 }
7 = { bonus = 1 }
8 = { dice = 1 }
9 = { time_off = 25 }
10 = { cells = 1 }
