# Talents (spec §8 "Talents"; #229): the settings of the talent table. The talents themselves
# are one file each under talents/ (see talents/README.toml for their fields). A character picks
# a talent at every talent_every-th level (experience.toml, [levels]); the pick is made on the
# spot, nothing is banked, and there is no respec.
#
# The game shows a talent's `description` and its prerequisites in words; the wiki shows the
# rules (cargo xtask wiki).

# The most ranks a talent may have ("Hardy 2/3").
max_ranks = 3

# The coverage bar (spec §8 "Talents"): the game refuses to load when a system below that is not
# `pending` has fewer than min_talents talents or min_class class abilities, or a tree that is
# not `pending` (nor `no_free`) has fewer than free_per_tree talents without prerequisites. So a
# system is in the list the moment it ships with its talents, and a pick from a tree is never
# impossible. min_class is 0 until every class has its table (#243–#246), then 1.
[coverage]
min_talents = 2
min_class = 0
free_per_tree = 1

# The trees, in display order. `pending = true` while a tree's prerequisite-free talent has not
# landed yet (the talent waves H1–H4 remove it as they land); `no_free = true` for a tree nothing
# picks from alone (the birth signs'); `class = true` for the class abilities' tree.

# The birth signs' gifts and flaws (horoscope.toml's `grants`), granted at birth and never on a
# pick list; the sign-limited picks join it later. Listed first: what you were born with.
[[tree]]
id = "stars"
name = "Stars"
description = "What you were born under."
no_free = true

[[tree]]
id = "vigour"
name = "Vigour"
description = "Hit points, healing, and constitution."

[[tree]]
id = "might"
name = "Might"
description = "Strength, blows, and breaking things."

[[tree]]
id = "finesse"
name = "Finesse"
description = "Dexterity, dodging, and quickness."

[[tree]]
id = "weaponcraft"
name = "Weaponcraft"
description = "Weapon skills, fighting styles, and missiles."

[[tree]]
id = "guard"
name = "Guard"
description = "Armour, Protection, and standing firm."

[[tree]]
id = "shadow"
name = "Shadow"
description = "Stealth, hearing, eyes, and light."

[[tree]]
id = "wayfarer"
name = "Wayfarer"
description = "The land, water, ice, and weather."

[[tree]]
id = "scholar"
name = "Scholar"
description = "Items, scrolls, gems, and learning."
pending = true

[[tree]]
id = "grit"
name = "Grit"
description = "Hunger, burden, and will."

[[tree]]
id = "delver"
name = "Delver"
description = "Traps, searching, doors, digging, shops, and talk."
pending = true

# The class abilities (spec §8 "Class abilities"): given by the classes' level tables
# (classes/), never picked; `class = true` keeps them off every pick list and counts them as
# class abilities, not talents, in the coverage bar.
[[tree]]
id = "class"
name = "Class abilities"
description = "What a class teaches as its levels come."
class = true

