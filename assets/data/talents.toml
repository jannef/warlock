# Talents (spec §8 "Talents"; #229): the settings of the talent table. The talents themselves
# are one file each under talents/ (see talents/README.toml for their fields). A character picks
# a talent at every talent_every-th level (experience.toml, [levels]); the pick is made on the
# spot, nothing is banked, and there is no respec.
#
# The game shows a talent's `description` and its prerequisites in words; the wiki shows the
# rules (cargo xtask wiki).

# The most ranks a talent may have ("Hardy 2/3").
max_ranks = 3

# The coverage bar (spec §8 "Talents"; docs/dev/progression.md "Coverage policy", #773): the
# game refuses to load when a system below that is not `pending` has fewer than min_talents
# talents or min_class class abilities, or a tree that is not `pending` (nor `no_free`) has fewer
# than free_per_tree talents without prerequisites. The bar is one talent: a system is something
# a build can lean on, and one talent that changes how it plays is enough; more talents are
# added only when each earns its place (the policy's bar), never to fill a count. min_class is 0
# until every class has its table (#243–#246), then 1.
[coverage]
min_talents = 1
min_class = 0
free_per_tree = 1

# The trees, in display order. `pending = true` while a tree's prerequisite-free talent has not
# landed yet (the talent waves H1–H4 remove it as they land); `no_free = true` for a tree nothing
# picks from alone (the birth signs'); `class = true` for the class abilities' tree.

# The birth signs' gifts and flaws (horoscope.toml's `grants`), granted at birth and never on a
# pick list; the sign-limited picks join it later. Listed first: what you were born with.
[[tree]]
id = "stars"
name = "Stars"
description = "What you were born under."
no_free = true

# What a family hands down (#697): talents only for character creation (`needs = { creation =
# true }`), never a level's pick (`no_free`: nothing later picks from it).
[[tree]]
id = "heritage"
name = "Heritage"
description = "What your family gave you: only at character creation."
no_free = true

[[tree]]
id = "vigour"
name = "Vigour"
description = "Hit points, healing, and constitution."

[[tree]]
id = "might"
name = "Might"
description = "Strength, blows, and breaking things."

[[tree]]
id = "finesse"
name = "Finesse"
description = "Dexterity, dodging, and quickness."

[[tree]]
id = "weaponcraft"
name = "Weaponcraft"
description = "Weapon skills, fighting styles, and missiles."

[[tree]]
id = "guard"
name = "Guard"
description = "Armour, Protection, and standing firm."

[[tree]]
id = "shadow"
name = "Shadow"
description = "Stealth, hearing, eyes, and light."

[[tree]]
id = "wayfarer"
name = "Wayfarer"
description = "The land, water, ice, and weather."

[[tree]]
id = "scholar"
name = "Scholar"
description = "Items, scrolls, gems, and learning."

# Spells (the magic design, docs/design/magic.md §10): learning and casting them. Quick study
# (#396), Overreach, and School focus (#400); Wand mastery comes with wands (#398), Channeler
# with rods (#399).
[[tree]]
id = "spellcraft"
name = "Spellcraft"
description = "Learning spells and casting them."

[[tree]]
id = "grit"
name = "Grit"
description = "Hunger, burden, and will."

[[tree]]
id = "delver"
name = "Delver"
description = "Traps, searching, doors, digging, shops, and talk."

# What a people is good at: each talent asks for its race, so nothing picks from it alone
# (`no_free`). A race's own grant (races.toml `talents`: the humans' Versatile) is a `granted`
# talent here, never on a pick list.
[[tree]]
id = "racial"
name = "Racial"
description = "What your people are good at."
no_free = true

# The class abilities (spec §8 "Class abilities"): given by the classes' level tables
# (classes/), never picked; `class = true` keeps them off every pick list and counts them as
# class abilities, not talents, in the coverage bar.
[[tree]]
id = "class"
name = "Class abilities"
description = "What a class teaches as its levels come."
class = true

# The closed list of systems a talent may name in its `systems` (the coverage matrix of the
# design, docs/design/progression.md §8). Systems are broad: a system of the game (combat,
# stealth, magic, light, hunger, ...), never a sub-feature. A single special room effect, a
# monster family's gimmick, a chest kind, or an info readout extends its parent system and is
# no tag of its own (#773 folded Mimics into chests, Prayer into special rooms, Bounties and
# Services into talk, Drains into diseases, and dropped Animated objects; #787 folded Weather
# into travel, the outdoors, and dropped Background stories). A talent names a
# system only when its effect reads that system's rules (docs/dev/progression.md "Coverage
# policy"). A system is `pending` until its talents land; the PR that brings them removes the
# flag. A new system of the game joins the list in the PR that ships its talent, never before.

[[system]]
id = "combat"
name = "Combat: to-hit, damage, criticals"

[[system]]
id = "defence"
name = "Defence: Dodge, Parry, Shield, natural armour, Deflection"

[[system]]
id = "protection"
name = "Protection and penetration"

[[system]]
id = "free_blows"
name = "Free blows"

[[system]]
id = "weapon_skills"
name = "Weapon skills and marks"

[[system]]
id = "styles"
name = "Fighting styles"

# Weapon abilities (#561; the combat progression design §4): what weapon skill and style ranks
# teach. It ships with Early mastery, Second blade's rend, and Brace of steel.
[[system]]
id = "weapon_abilities"
name = "Weapon abilities: what ranks teach"

[[system]]
id = "stances"
name = "Stances"

[[system]]
id = "ranged"
name = "Ranged combat and missiles"

[[system]]
id = "kicks"
name = "Kicks and unarmed fighting"

[[system]]
id = "hit_points"
name = "Hit points, healing, regeneration"

# Mana (#223): its maximum, its regeneration, what spends it (the Scholar tree's mana talents,
# #242, and Tidal, the Water-born's gift).
[[system]]
id = "mana"
name = "Mana"

# Spells (the magic design, docs/design/magic.md; the spell scaling design): spell levels, caster
# level, learning, casting. The Spellcraft tree (Quick study, Overreach, School focus), the casters'
# Empower, Archmage, and Arcane training, and every class's spells (#400).
[[system]]
id = "spells"
name = "Spells and caster level"

# Schools of magic (the spell scaling design §8): the seven schools' skills of ten ranks, their
# marks by casting; Schooled, Devotee, and the wizard's Magister.
[[system]]
id = "schools"
name = "Schools of magic: ranks and marks"

# Alternative resources (#225): pools beside hit points and mana (Rage, Focus, Openings, Ki,
# Inspiration); their talents are Battle trance, Inner calm, Steady hand, and Patient blade.
[[system]]
id = "resources"
name = "Resources"

# Stamina (#560, the combat progression design §4.5): the pool weapon actives pay from; the
# fighting classes' Trained wind grants it, and Deep lungs and Steady breathing change it.
[[system]]
id = "stamina"
name = "Stamina"

[[system]]
id = "status"
name = "Status effects"

# Diseases and drains (#382: the touch of some undead takes points off a stat for good, unless
# a check holds), and the checks that hold them off.
[[system]]
id = "diseases"
name = "Diseases, drains, and checks"

# Stat training (#562, the combat progression design §9.2): the marks uses earn, the checks at a
# level and once a day at 06:00. A system since the daily check (a rule a talent can change).
[[system]]
id = "stat_training"
name = "Stat training: marks and checks"

[[system]]
id = "hunger"
name = "Hunger, food, corpses, rot"

[[system]]
id = "burden"
name = "Burden and carrying"

[[system]]
id = "stealth"
name = "Stealth and noise"

# Sneak attacks (#682): the Sneak attack skill's dice, their reach, and what has vitals.
[[system]]
id = "sneak_attack"
name = "Sneak attacks: dice, reach, vitals"

[[system]]
id = "hearing"
name = "Hearing and sounds"

[[system]]
id = "light"
name = "Carried light"

[[system]]
id = "vision"
name = "Vision, darkvision, UV"

# Awareness (#681): who has seen whom, and being caught unawares (surprise.toml).
[[system]]
id = "awareness"
name = "Creature sight and awareness"

# Danger levels (#326): how dangerous a level is, and the creatures that keep coming to it.
[[system]]
id = "danger"
name = "Danger levels and creatures that come"

# Special rooms (#402): rooms, and rarely whole levels, that change the rules inside them; the
