# A forgotten altar (spec §7 "Special rooms"): the feature of an altar room, where the player may
# pray. Its own terrain, so it never reads as a temple's altar. Its light is the neutral grey; a
# good or an evil altar's cell carries a light of its own (room_effects.toml `sides`). Spent, it
# becomes the dark spent altar; blown apart, rubble.
[[terrain]]
id = "forgotten_altar"
name = "forgotten altar"
description = "An altar of worn stone. Its carvings have been rubbed smooth by hands or by time, and whatever god it served has no name left. Something here still listens."
stone = true
walkable = false
glyph = "_"
fg = "#d8d0b8"
bg = "#0d0d10"
light = "altar_neutral"
anim = { kind = "pulse", bpm = 48, amount = 0.12 }
glow = 0.25
