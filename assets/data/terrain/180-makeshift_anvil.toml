# A makeshift anvil (spec §7 "Special rooms"; the craftsperson's Field forge, `world/field_forge.rs`):
# an ingot set on a heap of stones, which serves as an anvil wherever it was set, for good. A pick
# clears it to bare floor; nothing is mined out of it.
[[terrain]]
id = "makeshift_anvil"
name = "makeshift anvil"
description = "A block of metal set on a heap of stones: a rough anvil, but it rings true enough under the hammer."
stone = true
works_as = "anvil"
walkable = false
hardness = 300
becomes = "floor"
glyph = "π"
fg = "#76787d"
bg = "#0b0b0d"
