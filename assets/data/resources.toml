# Alternative resources (spec §8 "Resources", #225): integer pools beside hit points and mana
# that a character holds once something grants them (a class ability, a talent; the class
# features of docs/design/progression.md §4.18 move onto these in follow-up changes). A character
# may hold any number of them at once; creatures hold none. The player sees each one they hold in
# the status bar after MP and on the character screen; never how fast it changes.
#
# The list is ordered: the game numbers resources in file order (saves record them), so a new
# resource is a new entry, never a reordering.
#
# Fields:
#   id, name      the resource's id and how the player reads it ("Rage")
#   short         its status bar label (`Rage 7`)
#   max           the most it holds
#   start         what it holds when granted (default: full, its maximum with what max_from
#                 adds, not talents)
#   max_from      what else the maximum grows with: { stat = "toughness", per_levels = 10,
#                 least = 5 } adds the holder's modifier in that stat and a point per that many
#                 character levels to `max`, the sum at least `least` (then talents add theirs)
#   show_max      the status bar shows the maximum too, `Focus 7/10` (default true), or the
#                 value alone, `Rage 7`
#   regenerates   one point back every this many seconds of game time, up to max (6 s is a
#                 base turn); or
#   decays        one point lost every this many seconds, down to 0 (at most one of the two)
#   resting       it changes over time while the player rests (default true)
#   ends_at_zero  at 0 the character loses it, and its bar, until something grants it again
#                 (default false: it sits at 0)
#   ended         what the player is told when it ends ("Your rage subsides."; needs
#                 ends_at_zero)
#   lacking       how the abilities menu greys out an ability it pays for while too little is
#                 held ("you are short of breath"; default: "not enough stamina")
#   status        a status (status/) its holder suffers while they hold it: it begins as the
#                 resource is granted and ends with it (and the resource with the status, if
#                 something cures that); a status that `eases` by itself may end first (rage: Raging)
#   builds        what builds it up: [{ on = "kill", amount = 5 }]; events are
#                 kill (a kill credited to the holder), hit (a blow of theirs hits), melee_hit
#                 (a melee blow of theirs hits), melee_kill (a melee blow of theirs kills),
#                 critical (a blow of theirs is a critical), struck (they are hit), sneak_attack (a sneak
#                 attack of theirs hits), feint (a feint of theirs fools its foe), and mark_kill
#                 (they kill their mark: a marked pool's)
#   marked        its points are in one creature's guard, the holder's mark (Openings; default
#                 false): the mark is the creature of their last chosen attack, a chosen attack
#                 at another living creature empties the pool, and it builds on nobody else;
#                 the mark's death clears it and keeps the pool (docs/dev/openings.md)
#
# The numbers are the progression design's first guesses (§4.18).

# The berserker's rage (the Rage ability): granted at 12, it counts down a point a base turn,
# resting too, and ends at zero, taking the Raging status with it (whose end is what the player
# is told; then Exhausted follows). Blood feeds it: a blow that hits the holder (soaked or
# resisted too), a critical of theirs, and a kill; so a rage lasts the fight and burns out
# after. Blood frenzy feeds it more by kills, Mighty rage raises its maximum, and Unstoppable
# spends it (talents/).
[[resource]]
id = "rage"
name = "Rage"
short = "Rage"
max = 20
start = 12
show_max = false
decays = 6
ends_at_zero = true
status = "raging"
lacking = "you have not the rage for it"
builds = [{ on = "struck", amount = 1 }, { on = "critical", amount = 2 }, { on = "kill", amount = 3 }]

# The ranger's focus: it comes back a point a base turn, but not while resting.
[[resource]]
id = "focus"
name = "Focus"
short = "Focus"
max = 10
regenerates = 6
resting = false

# The thief's openings: built by sneak attacks, feints the foe falls for, and killing the mark,
# a point lost every 20 base turns; they are in the guard of one creature, the mark (docs/dev/openings.md).
[[resource]]
id = "openings"
name = "Openings"
short = "Openings"
max = 5
start = 0
decays = 120
marked = true
lacking = "you have no opening"
builds = [
  { on = "sneak_attack", amount = 1 },
  { on = "feint", amount = 1 },
  { on = "mark_kill", amount = 1 },
]

# The ascetic's ki (the ki tricks design): granted full by Martial arts at level 1, a point back
# every three base turns, resting too; it never ends. Its maximum is 4, plus the Willpower
# modifier, plus a point per 6 character levels, at least 3; talents add on top (Inner calm),
# and so does the affix of Stillness. Perfect self and Inner calm bring it back faster.
[[resource]]
id = "ki"
name = "Ki"
short = "Ki"
max = 4
max_from = { stat = "willpower", per_levels = 6, least = 3 }
regenerates = 18
lacking = "your ki is spent"

# The bard's inspiration: built by the bard's own kills, a point lost every 30 base turns.
[[resource]]
id = "inspiration"
name = "Inspiration"
short = "Inspiration"
max = 5
start = 0
decays = 180
builds = [{ on = "kill", amount = 1 }]

# Stamina (the combat progression design §4.5, #560): the pool weapon actives are paid from.
# A warrior holds it from level 1 (the granted talent Charge, which spends it); anyone else gets
# it, full, from the first weapon active a rank teaches.
# It comes back a point every two base turns, resting too, and sits at 0 when spent; it is
# granted full. Its maximum is 10, plus the Toughness modifier, plus a point per 10 levels, at
# least 5; talents add on top (Deep lungs).
[[resource]]
id = "stamina"
name = "Stamina"
short = "Sta"
max = 10
max_from = { stat = "toughness", per_levels = 10, least = 5 }
regenerates = 12
lacking = "you are short of breath"

# The paladin's zeal (the Smite talent grants it at level 1; docs/design/paladin-smites.md §4):
# the fervour that mounts in a fight. A blow of the holder's that hits and a blow that hits them
# each build a point; it comes back a point every ten base turns besides, resting too, and sits
# at 0 when spent. Smite and Lay on hands spend it (talents/), and a deed toward evil empties it
# (rules/smite.toml). Its maximum is 10, plus the Presence modifier, plus a point per 10 levels, at
# least 6; it is granted at 5.
[[resource]]
id = "zeal"
name = "Zeal"
short = "Zeal"
max = 10
max_from = { stat = "presence", per_levels = 10, least = 6 }
start = 5
regenerates = 60
builds = [{ on = "hit", amount = 1 }, { on = "struck", amount = 1 }]
lacking = "your zeal is not enough"
