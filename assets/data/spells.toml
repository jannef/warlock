# Spells (spec §8 "Spells", the magic design docs/design/magic.md §3 and §5, the spell scaling
# design docs/design/spell-scaling.md §5): the cost table every spell's mana is measured by. The
# spells themselves are in spells/, one file each.
#
# A spell has a level, 0 to 70 (spells/README.toml). It is one number with two meanings: the
# spell's base mana (its level, at least 1: a cantrip of level 0 or 1 costs 1), and the caster
# level at which a scroll of it teaches for certain (study.toml). Nothing says how much a spell
# of a level may do: its own data does.
#
# A cast's mana (the one cost, magic design §5): the spell's base mana, × its shape's percent (a
# burst's at its radius), × its resolution's `cost` percent, × (100 + the `spell_cost_percent` of
# the armour worn) %, rounded to the nearest and at least 1; then the talents (Archmage, Empower,
# Brimming, School focus, Frugal caster) and the items (of Thrift). A spell's own `mana` (Identify's)
# stands in for its level, shape, and resolution. The caster level never counts: a known spell
# costs the same whoever casts it, and the mana pool is the gate.
#
# What the stats do to a spell's roll, reach, and duration is each spell's own ladders,
# `[spell.grows]` (spells/README.toml): a score reached, a rung cast. An attack aims with its
# `aim` stat (Dexterity unless it names another).
#
# [shapes]: what a shape multiplies the base cost by, in percent. Single targets (ray, bolt,
# touch, self) and the areas (cone, line, burst): area is expensive. `burst` is a list by radius,
# radius 1 first: its length is the largest radius a burst may have.
#
# [resolution]: how a spell finds its targets, and what that does to its cost, in percent
# (`cost` multiplies the base cost; an area spell's cost is its shape's).
#   attack  the 2d12 attack roll against Defence; can critical
#   auto    no roll, always hits
#   area    everyone in the shape, no roll (Evasion halves)
#   touch   an attack roll at adjacency only; cheaper
#
# First guesses, to be tuned by play (the magic design §12).

[shapes]
ray = 100
bolt = 100
touch = 100
self = 100
cone = 160
line = 180
burst = [180, 240, 300]

[resolution]
attack = { cost = 100 }
auto = { cost = 100 }
area = { cost = 100 }
touch = { cost = 70 }

# [types]: what every spell of a damage type does beyond its damage, whether cast from mana, a
# scroll, or a wand (the spell types design docs/design/spell-types-and-new-spells.md §3, §4). It
# is magic's alone: a weapon's blow never reads it. It spares no one. A type without an entry does
# nothing beyond damage. Each key optional.
#   words = "numbs"         the rule as the player reads it after the roll (`2d6 cold, numbs`)
#   rider = { status, severity, chance }   laid on every creature the spell harms, `chance` in
#            percent (default 100: certain), one draw a creature from the gameplay stream
#   ends = ["burning"]      statuses it ends on every creature it harms
#   heat = true             a burst melts ice on its cells; a ray, bolt, touch, or line the cell it
#                           strikes (a spell's own `heat` or `frost` stands in for its type's)
#   frost = 100             freezes water on those cells, that many mm thick
#   douses = true           puts out the fires on those cells
#   fire = { light = "arrow_fire", burns = 60 }   a burst leaves a fire on its centre cell: light
#            only, on that cell only (it never spreads)
[types]
fire = { words = "burns one in four", rider = { status = "burning", severity = 1, chance = 25 }, heat = true, fire = { light = "arrow_fire", burns = 60 } }
cold = { words = "numbs", rider = { status = "sluggish", severity = 1 }, ends = ["burning"], frost = 100, douses = true }
