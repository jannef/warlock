# Creature types. The player is the creature with id "player".
# Fields: id, name, glyph, fg, speed (how quickly it acts: 1000 is normal and the default, 2000
# twice as many actions in the same game time; 100 to 10000; never shown to the player), light (a
# preset in lights.toml the creature carries), anim, and the presentation-only effects glow and
# [[creature.particles]] (see terrain.toml; they move with the creature).
# Hearing (gameplay, spec §5 "Hearing"): footsteps (how loud its steps are on terrain with a
# step_noise of 100; a sound loses 10 a cell, 14 diagonally, and a closed door muffles 30; at most
# 300; default 0: it moves silently) and hearing (the faintest loudness it hears, 1 to 300; default
# none: it is deaf).

[[creature]]
id = "player"
name = "you"
glyph = "@"
fg = "#f4f4f4"
speed = 1000
footsteps = 60
hearing = 10

[[creature]]
id = "rat"
name = "giant rat"
glyph = "r"
fg = "#b08458"
speed = 1200
# Light on its feet, sharp of ear.
footsteps = 50
hearing = 5

# Bats fly: no footsteps, and the keenest ears.
[[creature]]
id = "bat"
name = "cave bat"
glyph = "b"
fg = "#9a7ab8"
speed = 2000
hearing = 3

[[creature]]
id = "kobold"
name = "kobold"
glyph = "k"
fg = "#7cb85a"
speed = 900
light = "torch"
# Clumsy and loud, and not the best listener.
footsteps = 80
hearing = 15

# Sparks from the torch it carries.
[[creature.particles]]
glyphs = "'`·"
colors = ["#ffe8a0", "#ff9030", "#802008"]
rate = 0.8
life = 0.5
velocity = [0.15, -1.2]
spread = [0.25, 0.3]
gravity = 0.4
offset = [0.2, -0.4]
area = [0.15, 0.0]
scale = 0.5
glow = 0.5

# Grazing in the meadows and woods of the overworld's local areas.
[[creature]]
id = "deer"
name = "deer"
glyph = "d"
fg = "#c89a64"
speed = 1300
footsteps = 50
hearing = 5
