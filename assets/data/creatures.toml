# Creature types. The player is the creature with id "player".
# Fields: id, name, glyph, fg, speed (how quickly it acts: 1000 is normal and the default, 2000
# twice as many actions in the same game time; 100 to 10000; never shown to the player), weight
# (the creature's own weight in grams, required; what it carries adds to it), size (a size in
# sizes.toml, default "medium": how much it can carry, 1.5 kg × (2 × Strength + Toughness) scaled
# by the size's carry, before it is burdened, spec §8 "Burden"; the player's comes from their
# race when the run has a character), light (a preset in
# lights.toml the creature carries), anim, and the presentation-only effects glow and
# [[creature.particles]] (see terrain.toml; they move with the creature; `on = "attack"` bursts
# at the target of each attack the player sees, e.g. a spell's sparkle).
# Hearing (gameplay, spec §5 "Hearing"): footsteps (how loud its steps are on terrain with a
# step_noise of 100; a sound loses 10 a cell, 14 diagonally, and a closed door muffles 30; at most
# 300; default 0: it moves silently) and hearing (the faintest loudness it hears, 1 to 300; default
# none: it is deaf).
#
# Behavior (spec §8 "Creature behavior"; nothing here is shown to the player but the faction's
# stance toward them):
#   faction      a faction id in factions.toml (required; the player's is "player")
#   vision       its eyes: a profile in vision.toml (default "normal"); it sees by the same rules
#                as the player, under the same light
#   sight        how far it sees, in cells (default 10, at most 40)
#   combat       "melee" (default: closes in and attacks from next to its target), "ranged"
#                (shoots with the missile weapon it has ready), or "caster" (casts spells, which
#                are announced only: nothing is damaged until magic is designed)
#   range        how far a ranged or caster creature reaches, in cells (2 up to its sight; it
#                needs a clear line of fire)
#   opens_doors  whether it opens closed doors in its way (default false)
#   attack_cost  what its attacks cost in energy (100 to 10000), instead of the attack's cost in
#                actions.toml (melee, shoot, or cast; 1000 is a normal action)
#
# Experience (spec §8 "Experience"; the player sees only the XP and level they earn): level (1 to 99,
# default 1) and xp (what a kill by the player is worth when the player is at that level, default 0;
# the player's own entry has neither). Kills of lower-level monsters give less and less
# (data/experience.toml).
#
# Skills (spec §8 "Skills"; never shown to the player): skills, the skills it is trained in, by
# skill id (skills.toml), with fixed values (0 to 999); every other skill is untrained. The player's
# come from their race and class, not from here. Creatures do not train (yet).
#
# Stats (spec §8 "Stats"; never shown to the player; combat and burden use them): stats, its scores
# by stat (strength, dexterity, toughness, intelligence, willpower, presence; 1 to 40, default 10,
# the average), and potential, how far each score could grow (default: the score; never below
# it). The player's stats come from the scenario, not from here.
#
# Combat (spec §8 "Combat"; never shown to the player but as words):
#   base_hp   hit points beyond its Toughness (default 0); the player's come from the scenario
#   attack    its natural attack, used when it wields no weapon (without one: bare hands, 1d3):
#             { damage = "1d4", name = "bite", verb = "bites" } and optionally threat, crit,
#             and to_hit as for weapons (objects.toml); Strength adds to hit and to damage.
#             on_hit lists the status effects (status.toml) a hit with it may cause, if the
#             target lives: [{ status = "poisoned", chance = 10, severity = 2 }] (chance in
#             percent, 1 to 100; severity in degrees, up to the status's max)
#   natural   its natural armour: { defence = 3, name = "shell" } (the Natural category of
#             Defence; "Your sword glances off the cave beetle's shell.")

[[creature]]
id = "player"
name = "you"
glyph = "@"
fg = "#f4f4f4"
speed = 1000
footsteps = 60
hearing = 10
weight = 70000

[[creature]]
id = "rat"
level = 1
xp = 5
name = "giant rat"
glyph = "r"
fg = "#b08458"
speed = 1200
faction = "vermin"
vision = "low_light"
sight = 8
# Light on its feet, sharp of ear.
footsteps = 50
hearing = 5
weight = 4000
size = "small"
stats = { strength = 10, dexterity = 17, toughness = 12, intelligence = 1, willpower = 12, presence = 4 }

# Its bite is filthy: now and then it poisons.
[creature.attack]
damage = "1d4"
name = "bite"
verb = "bites"
on_hit = [{ status = "poisoned", chance = 10, severity = 2 }]

# Bats fly: no footsteps, and the keenest ears.
[[creature]]
id = "bat"
level = 1
xp = 3
name = "cave bat"
glyph = "b"
fg = "#9a7ab8"
speed = 2000
faction = "wildlife"
vision = "darkvision"
sight = 8
hearing = 3
weight = 500
size = "small"
stats = { strength = 1, dexterity = 15, toughness = 10, intelligence = 2, willpower = 14, presence = 4 }
attack = { damage = "1d3", name = "bite", verb = "bites" }

[[creature]]
id = "kobold"
level = 2
xp = 15
name = "kobold"
glyph = "k"
fg = "#7cb85a"
speed = 900
weight = 25000
size = "small"
light = "torch"
faction = "kobolds"
vision = "darkvision"
opens_doors = true
# Clumsy and loud, and not the best listener.
footsteps = 80
hearing = 15
stats = { strength = 9, dexterity = 13, toughness = 10, intelligence = 10, willpower = 9, presence = 8 }

# Sparks from the torch it carries.
