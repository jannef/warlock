]

[[skill]]
id = "mining"
name = "Mining"
description = "Finding ore in the rock and breaking it out: digging comes easier."
kind = "rules"
# Digging (#1343, professions §9; spec §8 "Digging"): percent more work each turn of digging does,
# added to what talents and a Delving tool add: 25 at 100, 40 at 200. Marked by every wall dug
# through.
mark = [{ on = "dug", chance = 100 }]
benefit = [{ effect = "dig", curve = [[0, 0], [100, 25], [200, 40]] }]

[[skill]]
id = "music"
name = "Music"
description = "Singing: how far your songs carry into a heart, and how long they stay there."
kind = "rules"
mark = [{ on = "song", chance = 100 }]
# A song's degrees (spec §8 "Class abilities", the bard's songs): one more at 50 and at 100,
# then one more for every 100 past it, up to what the status takes. And how hard those who hear a
# song against them find it to resist: +4 to the check's difficulty at 100, +8 at 200.
benefit = [
    { effect = "song_degrees", steps = [50, 100], every = 100 },
    { effect = "song_craft", curve = [[0, 0], [100, 4], [200, 8]] },
]

[[skill]]
id = "negotiation"
name = "Negotiation"
description = "Haggling, striking a bargain, and knowing when to walk away."
kind = "rules"
mark = [{ on = "deal", chance = 25 }]
# Haggling gets better prices in shops (shops.toml), 20 % at 100 (Appraise's until #666), and
# at a healer's and a sage's (`service.rs`; a temple's price stays flat, #1031).
benefit = [{ effect = "bargain", curve = [[0, 0], [100, 20], [200, 30]] }]

[[skill]]
id = "open_lock"
name = "Open lock"
description = "Picking locks without the key."
kind = "action"
mark = [{ on = "pick", chance = 20 }]
# Picking a lock (spec §8 "Doors"; the Pick lock ability, a direction): added to the Dexterity
# check against the lock's difficulty, +8 at 100 (a lock of 14 picked by Dexterity 10 with 46 % of
# the tries becomes 93 %), +12 at 200. Trained at all, it lets you try.
benefit = [{ effect = "pick", curve = [[0, 0], [100, 8], [200, 12]] }]

[[skill]]
id = "search"
name = "Search"
description = "Finding what is hidden: secret doors, hollow walls, and caches."
kind = "rules"
mark = [{ on = "search", chance = 10 }]
# Searching (spec §8 "Searching"; `s`): added to the check (for traps Detect traps is instead), +8 at 100 (a secret door of 14 found
# with 46 % of the turns of searching at Intelligence 10 becomes 93 %), +12 at 200; from 75 on a
# search reaches a cell farther.
benefit = [
    { effect = "search", curve = [[0, 0], [100, 8], [200, 12]] },
    { effect = "search_reach", steps = [75] },
]

[[skill]]
id = "sneak_attack"
name = "Sneak attack"
description = "Finding the telling spot in a foe that has not seen you coming."
kind = "rules"
# Sneak attacks (#682; spec §8 "Surprise and sneak attacks", surprise.toml): a blow, or a shot, a
# throw, or a spell that rolls to hit within `missile_reach` cells, at a foe unaware of you or
# Surprised; never on a thing without vitals. Marked by "sneak_attack" (a sneak attack that hits).
# Effect "sneak_dice": that many d6 added after Protection to such a hit, 1d6 trained at all, +1d6
# at 25, 50, 75, and 100, then +1d6 every 50 (5d6 at 100, 7d6 at 200); the talents' ambush dice
# add to them. Effect "surprise": points added to the difficulty of the initiative check of those
# you catch unawares, +8 at 100, +12 at 200 (at most 20).
mark = [{ on = "sneak_attack", chance = 50 }]
benefit = [
    { effect = "sneak_dice", steps = [1, 25, 50, 75, 100], every = 50 },
    { effect = "surprise", curve = [[0, 0], [100, 8], [200, 12]] },
]

[[skill]]
id = "spellcraft"
name = "Spellcraft"
description = "Understanding spells: how they are woven and what they do."
kind = "rules"
# Spending mana on a spell trains it (#989), as Concentration's. Learning spells is Decipher
# script's since #1270.
mark = [{ on = "cast", chance = 25 }]
benefit = [
    # Casting (spec §8 "Spells": "Miscasts"; miscast.toml): `cast` is added to the Spellcraft check
    # every cast with one's own mana makes, +2 at 20, +14 at 100, +22 at 200, +40 at 999 (#1299:
    # slower past 100, so a wizard who puts every roll on Spellcraft is not past every spell's
    # reach by level 15, and every roll still counts); `ward` is taken off a miscast's total on
    # the table, 10 at 100, 20 at 200.
    { effect = "cast", curve = [[0, 0], [20, 2], [60, 8], [100, 14], [200, 22], [999, 40]] },
    { effect = "ward", curve = [[0, 0], [200, 20]] },
]

[[skill]]
id = "spot"
name = "Spot"
description = "Noticing what is hiding or out of place at a glance."
kind = "passive"
mark = [
  { on = "spot", chance = 50 },
  { on = "lookout", chance = 50 },
  { on = "sight", chance = 25 },
  { on = "search", chance = 3 },
]
# Noticing hidden features in passing (spec §8 "Searching"): secret doors, hollow walls, and
# disguised mimics, not traps (Detect traps); trained at all, you notice them (else only elves
# and dwarves do); added to the check, +8 at 100, +12 at 200. The lookout for a party on the
# overworld (spec §7 "Overworld encounters", encounters.toml): +8 at 100, +12 at 200.
benefit = [
  { effect = "spot", curve = [[0, 0], [100, 8], [200, 12]] },
  { effect = "lookout", curve = [[0, 0], [100, 8], [200, 12]] },
]

[[skill]]
id = "steal"
name = "Steal"
description = "Lifting a purse or a trinket without being noticed."
kind = "action"
mark = [{ on = "steal", chance = 50 }]
# Stealing (spec §8 "Stealing"; the abilities menu's Steal, steal.toml): trained at all, you can
# steal; added to your Dexterity against the victim's Willpower, +8 at 100, +12 at 200.
benefit = [{ effect = "steal", curve = [[0, 0], [100, 8], [200, 12]] }]

[[skill]]
id = "stealth"
name = "Stealth"
description = "Moving unheard and unseen: soft steps, quiet doors, and slipping past eyes that see in the dark."
kind = "passive"
mark = [{ on = "sneak", chance = 15 }]
# 60% quieter at 100, 75% at 150 and beyond; and slipping past a creature that would see you
# by darkvision alone (data/surprise.toml `[slip]`): +8 at 100, +12 at 200. Stalking unseen on
# the overworld (encounters.toml): +4 at 50, +8 at 100, +12 at 200 on the difficulty of a party's
# lookout, and on slipping away from a party that has not seen you.
benefit = [
  { effect = "quiet", curve = [[0, 0], [100, 60], [150, 75]] },
  { effect = "slip", curve = [[0, 0], [100, 8], [200, 12]] },
  { effect = "stalk", curve = [[0, 0], [50, 4], [100, 8], [200, 12]] },
]

[[skill]]
id = "survival"
name = "Survival"
description = "Living off the land and finding the easiest way through the wild."
kind = "passive"
mark = [{ on = "travel", chance = 10 }, { on = "lookout", chance = 10 }, { on = "forage", chance = 25 }]
# 20% quicker journeys at 100, at most. Foraging in the wild (spec §8 "Foraging", forage.toml;
# the Forage ability): trained at all, you can forage; +15 percent to finding food at 100, +30 at
# 200. On the overworld (spec §7 "Overworld encounters", encounters.toml): the lookout for a party,
# +4 at 100, +6 at 200; slipping away from one, +8 at 100, +12 at 200.
benefit = [
    { effect = "travel", curve = [[0, 0], [100, 20]] },
    { effect = "forage", curve = [[0, 0], [100, 15], [200, 30]] },
    { effect = "lookout", curve = [[0, 0], [100, 4], [200, 6]] },
    { effect = "evade", curve = [[0, 0], [100, 8], [200, 12]] },
    { effect = "freshness", curve = [[0, 15], [100, 35], [200, 50]] },
]

[[skill]]
id = "swim"
name = "Swim"
description = "Staying afloat and making headway in deep water."
kind = "rules"
mark = [{ on = "wade", chance = 10 }, { on = "swim", chance = 100 }, { on = "stroke", chance = 25 }]
# Percent of what wading adds to a step that is spared, under Swimmer's and Undertow's all of it;
# and points added to the Swim check of a plunge through the ice (made: half its hit points) and
# of a step in deep water (made: the step; data/swim.toml).
benefit = [
    { effect = "wade", curve = [[0, 0], [100, 60], [200, 100]] },
    { effect = "swim", curve = [[0, 0], [100, 8], [200, 12]] },
]

[[skill]]
id = "tumble"
name = "Tumble"
description = "Rolling, diving, and twisting out of harm's way."
kind = "passive"
mark = [{ on = "dodge", chance = 40 }]
# Dodge +1 at 20, 40, 60, 80, and 100, then +1 for every 25 past 100.
benefit = [{ effect = "dodge", steps = [20, 40, 60, 80, 100], every = 25 }]

[[skill]]
id = "woodcraft"
name = "Woodcraft"
description = "Working wood: carving, carpentry, and the making of bows, arrows, and bolts."
kind = "action"
mark = [{ on = "craft", chance = 100 }, { on = "whittle", chance = 100 }, { on = "wedge", chance = 100 }, { on = "salvage", chance = 100 }]
# Whittling (the Whittle ability, which anyone has with a knife; temper.toml's rules, for wood):
# the same, added to the Dexterity check of an attempt.
# Wedging (spec §8 "Doors"; the Wedge ability, for those trained): the same curve, added to the
# sturdiness of a door wedged shut.
# Its craft (docs/dev/crafting.md; salvage.toml; the hand-made recipes, data/recipes/woodcraft/):
# the same, added to the check of salvaging wood, bone, hide, sinew, horn, or knapped stone and
# of a recipe made (arrows and bolts among them: the trained value also adds to their count,
# fletch.toml), read for this skill alone.
benefit = [
    { effect = "whittle", curve = [[0, 0], [100, 8], [200, 12]] },
    { effect = "wedge", curve = [[0, 0], [100, 8], [200, 12]] },
    { effect = "craft", curve = [[0, 0], [100, 8], [200, 12]] },
]
