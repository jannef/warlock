description = "Noticing what is hiding or out of place at a glance."
kind = "passive"
mark = [{ on = "spot", chance = 50 }]
# Noticing hidden features in passing (spec §8 "Searching"): trained at all, you notice them
# (else only elves and dwarves do); added to the check, +8 at 100, +12 at 200.
benefit = [{ effect = "spot", curve = [[0, 0], [100, 8], [200, 12]] }]

[[skill]]
