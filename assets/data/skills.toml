kind = "action"

[[skill]]
id = "listen"
name = "Listen"
description = "Hearing what others miss: faint steps, a door far off."
kind = "passive"
mark = [{ on = "hear", chance = 30 }]
# One fainter for every 10 points.
benefit = [{ effect = "hearing", every = 10 }]

[[skill]]
id = "metalcraft"
name = "Metalcraft"
description = "Working metal: smithing, mending arms and armour."
kind = "action"

[[skill]]
id = "music"
name = "Music"
description = "Singing and playing an instrument."
kind = "action"

[[skill]]
id = "open_lock"
name = "Open lock"
description = "Picking locks without the key."
kind = "action"
mark = [{ on = "pick", chance = 20 }]
# Picking a lock (spec §8 "Doors"; the Pick lock ability, a direction): added to the Dexterity
# check against the lock's difficulty, +8 at 100 (a lock of 14 picked by Dexterity 10 with 46 % of
# the tries becomes 93 %), +12 at 200. Trained at all, it lets you try.
benefit = [{ effect = "pick", curve = [[0, 0], [100, 8], [200, 12]] }]

[[skill]]
id = "search"
name = "Search"
description = "Finding what is hidden: doors, traps, and caches."
kind = "rules"
mark = [{ on = "search", chance = 10 }]
# Searching (spec §8 "Searching"; `s`): added to the check, +8 at 100 (a secret door of 14 found
# with 46 % of the turns of searching at Intelligence 10 becomes 93 %), +12 at 200; from 75 on a
# search reaches a cell farther.
benefit = [
    { effect = "search", curve = [[0, 0], [100, 8], [200, 12]] },
    { effect = "search_reach", steps = [75] },
]

