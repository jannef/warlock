# Skills (spec §8 "Skills"; #132), ADOM-like: what a character or creature has trained in. The
# list order is the order the Skills screen shows them in. Adding a skill is one entry here.
#
# An actor is trained in some skills, each with a value (0 to 999; 100 is a master, and points
# past it come slowly). A skill it is not trained in does not exist for it: it is never shown and
# gives nothing (not the same as a value of 0). Races and classes train characters in skills
# (`skills` in races.toml and classes/, as dice, rolled when the character is made; a skill
# both train sums the two); creature types may list theirs (`skills` in creatures.toml). Skills
# grow by the rolls of each level ([ladder] and [rolls] below).
#
# Fields:
#   id, name      the skill's id (in data files and dumps) and its name, as the Skills screen
#                 shows it
#   description   one line: what it is about
#   kind          what it is for: "passive" (it works by itself, all the time), "action" (used as
#                 an action, once actions for it exist), or "rules" (rules read it when something
#                 calls for it)
#   mark          when it earns training marks: a list of { on = USE, chance = PERCENT }, a mark
#                 with that chance (1 to 100) on each such use, so skills used often do not race
#                 ahead. Uses: "sneak" (a step within earshot of a creature that could hear it,
#                 before stealth made it quieter), "hear" (hearing something new: a sound that is
#                 news), "search" (a turn spent searching, whatever it finds), "spot" (noticing
#                 something hidden in passing, not a trap), "find_trap" (finding a hidden trap,
#                 searching or in passing), "disarm" (an attempt to disarm a trap, whatever
#                 comes of it), "dodge" (an attack that missed because you dodged it, or a known trap you
#                 stepped past), "burdened"
#                 (an action, not waiting, while your load slows you), "travel" (a journey: a step
#                 on the overworld), "forage" (a forage that ran its time, whatever it found),
#                 "wedge" (a door wedged shut),
#                 "steal" (an attempt to steal from someone, whatever comes of
#                 it), "heal" (a try at treating yourself, whatever comes of it), "kick" (a kick
#                 at a closed door), "study" (a grimoire read to learn its spell,
#                 whatever comes of it), "pick" (a try at picking a
#                 lock), "deal" (a deal made in a shop: goods paid for, or your own sold),
#                 "appraise" (something you carry told for what it is: "identify" below),
#                 "judged" (food whose freshness you could tell, eaten: "freshness" below),
#                 "intimidate" (a war cry roared or a foe threatened, whatever comes of it),
#                 "feint" (a feint at a foe, whatever comes of it),
#                 "talk_past" (a try at talking past a party met on the overworld, whatever
#                 comes of it),
#                 "rough_step" (a step onto ground that slows and is not water: bush, reeds,
#                 rubble, ice), "staggered" (an action taken Staggered),
#                 "song" (a song sung, whatever it does), "wade" (a step wading through water
#                 or marsh), "swim" (a Swim check, whatever comes of it), "stroke" (a step in deep
#                 water, whatever comes of it), "sight" (a creature
#                 seen for the first time that has not noticed you), "sprung" (a hidden trap
#                 going off under you, or under a creature you see, half as often), "overhear"
#                 (a sound that is no news heard while resting or waiting), "listen" (a turn
#                 spent listening at a closed door, whatever is heard), "dug" (a wall you dig
#                 through, breaking it). Marks gather until a level-up roll on the skill spends them ([ladder]
#                 below). Only the player trains, for now.
#   benefit       what it gives, by its value: a list of { effect = EFFECT, ... } growing either
#                 by `steps` (one for each value reached, then one more for every `every` points
#                 past the last) or by a `curve` of [value, effect] points from value 0 (straight
#                 between them, rounded down, level after the last). Effects: "dodge" (Defence in
#                 the Dodge category, whose bonuses add up), "quiet" (percent less noise from your
#                 steps and doors), "hearing" (you hear sounds this much fainter: your hearing
#                 threshold, lower), "search" (points added to searching for hidden features,
#                 spec §8 "Searching", not traps; at most 20), "search_reach" (cells farther a search reaches
#                 than the cells around you; at most 2), "spot" (points added to noticing hidden
#                 features in passing, not traps, at most 20; trained, a skill with it lets you
#                 notice them at all), "detect_traps" (points added to finding hidden traps,
#                 searching and in passing alike, in place of "search" and "spot", at most 20;
#                 trained, a skill with it lets you notice traps in passing at all), "disarm" (points added to disarming a trap, spec §8 "Disarming
#                 traps", at most 20; trained, a skill with it lets you disarm traps at all),
#                 "burden" (percent less of your burden's slowdown), "footing" (percent of what
#                 rough ground adds to a step that is spared), "steady_ease" (percent of
#                 Staggered's extra cost that is spared), "travel"
#                 (percent less time a journey on the overworld takes), "wade" (percent of what
#                 wading adds to a step that is spared), "swim" (points added to a Swim check, at
#                 most 20; only trained is one asked), "wedge" (points added
#                 to the sturdiness of a door wedged shut, at most 12; trained, a skill with it
#                 lets you wedge doors at all),"forage" (percent added
#                 to a forage's chance of finding food, at most 30; trained, a skill with it lets
#                 you forage at all: forage.toml), "bargain" (percent better
#                 prices in shops, together with Presence at most half; shops.toml), "identify"
#                 (percent chance, each game hour, of telling one unidentified thing you carry or
#                 wear for what it is; trained only), "identify_potion" (the same, of a potion or
#                 flask whose kind you do not know; trained only), "identify_magic" (the same, of
#                 a magic thing whose magic you do not know: arms, armour, rings and amulets,
#                 wands, rods; trained only), "dig" (percent more work a turn of digging does,
#                 added to talents' and items'), "herbs" (percent chance, on a forage that found
#                 something, of one more find from the ground's `herbs`: forage.toml; trained
#                 only), "freshness" (percent chance, each game
#                 hour, of telling in words how fresh a corpse or food is; the skills' add up,
#                 trained only), "kick"
#                 (points added to the Strength a kick at a closed door is rolled against, at most
#                 40), "slip" (points added to slipping past a creature that would see you by
#                 darkvision alone, at most 20: surprise.toml [slip]), "steal" (points added to stealing from someone, at most 20; trained, a
#                 skill with it lets you steal at all: steal.toml), "heal" (points added to
#                 treating your bleeding, poison, or a disease, at most 20; trained, a skill with
#                 it lets you treat them at all: the Heal ability), "pick" (points added to
#                 picking a lock, at most 20; trained, a skill with it
#                 lets you pick locks at all: the Pick lock ability), "feint" (points added to the difficulty of a
#                 feint's Willpower check, at most 20; trained, a skill with it lets you feint at
#                 all: feint.toml), "intimidate" (points added to
#                 the difficulty of the Willpower check your war cry asks of those who hear and
#                 see you, at most 20), "song_degrees" (degrees added to what your songs give,
#                 up to the status's own most, at most 10), "song_craft" (points added to the
#                 difficulty of the check your songs ask of those who hear them against them, at
#                 most 20), "study"(points off the
#                 difficulty of studying a spell, spec §8 "Spells", at most 20). The percent effects stay
#                 within 0 to 100.
#
# The player sees their own trained skills and their values, never a benefit's number, a mark, or
# a chance (the wiki describes them as rules).

# How skills grow (spec §8 "Skills", ADOM-like): by skill rolls. Every level gives skill rolls
# (the class's `rolls`, classes/README.toml; the race's, races.toml; and Intelligence's, below),
# each spent by the player on a trained skill of their choice (`advance:SKILL`). A roll throws the
# die its skill's training marks have reached on the ladder, one step up for a skill the class is
# known for (`known_for`), +1 for any other skill the class or the race trains; it adds the result
# to the value (half, rounded up, from the soft cap on) and spends `spend` percent of the marks
# (rounded up), so the next roll on the same skill is a step or two smaller. Marks are a reservoir
# the next roll cashes in, and a skill whose marks reach `auto_at` rolls at once by itself (#1328):
# the same roll, in addition to the level's, whatever level-up is due. A skill without marks still
# rolls the lowest die.
#
# [ladder]  dice   the die of each step, lowest first (each adds at least 1)
#           marks  the marks each step starts at: 0 first, rising
[ladder]
dice = [1, "1d3", "1d5", "2d4", "3d3", "3d4", "3d5", "4d4", "4d5"]
marks = [0, 5, 12, 25, 50, 100, 200, 400, 800]

# [rolls]   intelligence_from, intelligence_every  one more roll a level at Intelligence
#                 `intelligence_from`, and one more for every `intelligence_every` points above
#                 it (14: +1, 18: +2, 22: +3)
#           spend     percent of a skill's marks a roll on it spends, rounded up
#           soft_cap  from this value on, a roll adds half its result, rounded up
#           auto_at   a skill rolls by itself as soon as its marks reach this many (0: never)
[rolls]
intelligence_from = 14
intelligence_every = 4
spend = 50
soft_cap = 100
auto_at = 100

[[skill]]
id = "alchemy"
name = "Alchemy"
description = "Brewing potions, and telling one draught from another."
kind = "action"
# Telling potions (#1343, professions §9): trained, each game hour this percent chance of telling
# one potion or flask you carry whose kind you do not know (5 % at the lowest, 25 % at 100, 40 % at
# 200), beside Appraise's look at anything.
# Its craft (docs/dev/crafting.md "Brewing"; the alchemist's recipes, data/recipes/alchemy/):
# added to the Intelligence check of a brew, +8 at 100, +12 at 200, as Metalcraft's. Marked by
# every brew that runs its time, whatever came of it.
mark = [{ on = "craft", chance = 100 }]
benefit = [
    { effect = "identify_potion", curve = [[0, 5], [100, 25], [200, 40]] },
    { effect = "craft", curve = [[0, 0], [100, 8], [200, 12]] },
]

[[skill]]
id = "appraise"
name = "Appraise"
description = "Judging what a thing is worth and what it is made of."
kind = "passive"
# Now and then an eye for things tells one unidentified thing you carry or wear for what it is
# (spec §8 "Skills"; #666): each game hour, this percent chance (2 % at the lowest, 12 % at 100,
# 20 % at 200). Trained only. Each thing told this way trains it. The shops' prices are
# Negotiation's. An eye for food (#1031): trained, each hour the chance of telling how fresh a
# corpse or food is in words (summed with Survival's), 25 % at the lowest, 60 % at 100, 80 % at
# 200; eating food whose freshness it told trains it.
mark = [{ on = "appraise", chance = 100 }, { on = "judged", chance = 10 }]
benefit = [
    { effect = "identify", curve = [[0, 2], [100, 12], [200, 20]] },
    { effect = "freshness", curve = [[0, 25], [100, 60], [200, 80]] },
]

[[skill]]
id = "athletics"
name = "Athletics"
description = "Running, jumping, climbing, and kicking: strength put to use."
kind = "rules"
# Marked by kicks, and (#548) now and then by acting under a load that slows and by journeys on the
# overworld, so the speed below grows with plain play.
mark = [
    { on = "kick", chance = 20 },
    { on = "climb", chance = 50 },
    { on = "burdened", chance = 5 },
    { on = "travel", chance = 5 },
]
# Kicking a door in (spec §8 "Doors"): added to the Strength the kick is rolled against, +8 at 100
# (a closed door: 33 % at Strength 10 becomes 60 %), +12 at 200. Speed (spec §8 "Speed", #548): percent quicker in everything, +5 at
# 100, +10 at 200, added to the talents' percent (Fleet-footed, Quick); the burden's slowdown is
# applied to prices after, independently.
benefit = [
    { effect = "kick", curve = [[0, 0], [100, 8], [200, 12]] },
    { effect = "speed", curve = [[0, 0], [100, 5], [200, 10]] },
]

[[skill]]
id = "balance"
name = "Balance"
description = "Sure footing under a heavy load or on bad ground."
kind = "passive"
mark = [
    { on = "burdened", chance = 5 },
    { on = "rough_step", chance = 10 },
    { on = "staggered", chance = 20 },
]
# Burdened ×1.25 becomes ×1.10 at 100 (Strained ×1.5, ×1.2). Footing: percent of what rough
# ground (bush, reeds, rubble, ice; not water) adds to a step that is spared. Steady ease:
# percent of Staggered's extra cost (150) that is spared (`world/footing.rs`).
benefit = [
    { effect = "burden", curve = [[0, 0], [100, 60], [200, 80]] },
    { effect = "footing", curve = [[0, 0], [100, 60], [200, 100]] },
    { effect = "steady_ease", curve = [[0, 0], [100, 50], [200, 75]] },
]

[[skill]]
id = "bluff"
name = "Bluff"
description = "Lying with a straight face, feinting, and talking your way past."
kind = "action"
# Marked by "feint" (a feint at a foe, feint.toml, the skill's use, whatever comes of it) and by
# "talk_past" (a try at talking past a party met on the overworld, an encounter entry flagged
# `talk_past`, whatever comes of it). Effect "feint": points added to the difficulty of the
# Willpower check a feint asks, and of the one a party's leader makes when you talk past them,
# +8 at 100, +12 at 200, at most 20. Being trained in it gives the Feint ability and the choice
# to talk past.
mark = [{ on = "feint", chance = 50 }, { on = "talk_past", chance = 100 }]
benefit = [{ effect = "feint", curve = [[0, 0], [100, 8], [200, 12]] }]

[[skill]]
id = "concentration"
name = "Concentration"
description = "Keeping your mind on the task, whatever happens around you: your mana comes back faster, and your pool runs a little deeper."
kind = "rules"
# Spending mana (a spell, an ability paid in it) is practice (#668).
mark = [{ on = "cast", chance = 25 }]
# Trained only (`world/concentration.rs`): mana back that percent faster, added to the items'
# and talents' percent (+5 % at 20, +40 % at 100); and points added to the maximum mana, never
# more than a fifth of the pool without them (`mana::deeper`; +1 at 25, +5 at 100).
benefit = [
  { effect = "mana_regen", curve = [[0, 0], [20, 5], [100, 40], [200, 60]] },
  { effect = "max_mana", curve = [[0, 0], [25, 1], [100, 5], [200, 8]] },
]

[[skill]]
id = "decipher_script"
name = "Decipher script"
description = "Making sense of old writing, strange alphabets, and codes."
kind = "action"
# All reading trains it (#1270): a check to make a scroll out (and a scroll of a spell one knows,
# read), any scroll read and used up, and a grimoire read to its end, whatever came of it.
mark = [
  { on = "decipher", chance = 100 },
  { on = "read", chance = 50 },
  { on = "study", chance = 100 },
]
# How those who cannot simply read a scroll read it (spec §8 "Scrolls", `data/decipher.toml`):
# `decipher` points on the check, +8 at 100, +12 at 200.
# Learning a spell from a grimoire (spec §8 "Spells": "Learning"; #1270): `learn` is the spell
# level up to which a grimoire teaches for certain, 10 at 60, 30 at the soft cap, the last spell
# level at 150 (at least 1 for anyone trained in the skill; those who are not cannot learn from a
# grimoire at all), and up to which a scroll is read with no check (spec §8 "Scrolls"). `study` is
# the skill's value / 10 off the check above that, +10 at 100, +20 at 200.
benefit = [
    { effect = "decipher", curve = [[0, 0], [100, 8], [200, 12]] },
    { effect = "learn", curve = [[0, 0], [10, 0], [60, 10], [100, 30], [150, 70]] },
    { effect = "study", curve = [[0, 0], [200, 20]] },
]

[[skill]]
id = "detect_traps"
name = "Detect traps"
description = "Finding hidden traps before they find you."
kind = "passive"
mark = [
  { on = "find_trap", chance = 50 },
  { on = "sprung", chance = 100 },
  { on = "disarm", chance = 30 },
  { on = "search", chance = 3 },
]
# Finding hidden traps (spec §8 "Searching"), on the floor, on doors, and on chests: in place of
# Search when you search and of Spot in passing; trained at all, you notice traps in passing (else
# only elves and kobolds do, and dwarves on stone); added to both checks, +8 at 100 (a trap of 14
# found with 46 % of the turns of searching at Intelligence 10 becomes 93 %), +12 at 200.
benefit = [{ effect = "detect_traps", curve = [[0, 0], [100, 8], [200, 12]] }]

[[skill]]
id = "disable_device"
name = "Disable device"
description = "Taking traps and mechanisms apart without setting them off."
kind = "action"
mark = [{ on = "disarm", chance = 20 }]
# Disarming a trap you know of (spec §8 "Disarming traps"; the Disarm ability): trained at all,
# you can try; added to the Dexterity check, +8 at 100 (an arrow trap of 14 disarmed 46 % of the
# time at Dexterity 10 becomes 93 %), +12 at 200.
benefit = [{ effect = "disarm", curve = [[0, 0], [100, 8], [200, 12]] }]

[[skill]]
id = "enchanting"
name = "Enchanting"
description = "The binding of magic into things, and the reading of what is bound."
kind = "action"
# Reading what is bound (#1343, professions §9): trained, each game hour this percent chance of
# telling one magic thing you carry or wear whose magic you do not know (5 % at the lowest, 25 % at
# 100, 40 % at 200), beside Appraise's look at anything. No marks until its craft comes.
benefit = [{ effect = "identify_magic", curve = [[0, 5], [100, 25], [200, 40]] }]

[[skill]]
id = "escape_artist"
name = "Escape artist"
description = "Slipping out of bonds, grabs, and tight places."
kind = "rules"
# Marks: every automatic check against bonds, whatever comes of it (world/hold.rs), and every climb
# out of a pit, and half the tries at wriggling past a creature in the way (world/wriggle.rs).
mark = [
    { on = "escape", chance = 100 },
    { on = "climb", chance = 100 },
    { on = "wriggle", chance = 50 },
]
# Effect "escape": points added to the check against bonds (better of Strength and Dexterity
# against a hold's grip or a status's `escape`), +8 at 100, +12 at 200; trained at all, an action
# that Webbed or Pinned stops is that check, and untrained it is refused. Effect "climb": a pit's
# climb halved from 50 and skipped from 100 (world/trap.rs). No ability: the check is automatic.
benefit = [
    { effect = "escape", curve = [[0, 0], [100, 8], [200, 12]] },
    { effect = "climb", steps = [50, 100] },
]

[[skill]]
id = "handle_animal"
name = "Handle animal"
description = "Calming, leading, and training beasts."
kind = "action"
# Its marks (spec §8 "Allies"): an order given to one's allies, an ally's kill, and a try at
# taming a beast, whatever comes of it. Effect "tame": points added to the Willpower check that
# tames a beast (world/tame.rs, the difficulty in companions.toml [tame]), +10 at 100, +20 at
# 200 (at most 20). Being trained in it gives the Tame ability.
mark = [{ on = "handle", chance = 50 }]
benefit = [{ effect = "tame", curve = [[0, 0], [100, 10], [200, 20]] }]

[[skill]]
id = "heal"
name = "Heal"
description = "Binding wounds and tending the sick."
kind = "action"
mark = [{ on = "heal", chance = 30 }]
# Treating yourself (spec §8 "Skills"; the Heal ability): trained at all, you can bind your
# bleeding and try to ease a poison or a disease; added to the Intelligence check against what it
# treats (status.toml `treat`, a disease's `difficulty`), +8 at 100, +12 at 200.
benefit = [{ effect = "heal", curve = [[0, 0], [100, 8], [200, 12]] }]

[[skill]]
id = "herbalism"
name = "Herbalism"
description = "Knowing the plants: what heals, what harms, and where it grows."
kind = "passive"
# An eye for herbs (#1343, professions §9): trained, a forage that found something has this
# percent chance of one more find, from the ground's `herbs` (forage.toml): 25 % at the lowest,
# 60 % at 100, 80 % at 200. Marked by a forage that ran its time, now and then, and by every
# gather from the glowing fungus that ran its time (Gather, herbs.toml; #1340), where a trained
# gatherer finds one herb more for every 50 of Herbalism.
mark = [{ on = "forage", chance = 25 }, { on = "gather", chance = 100 }]
benefit = [{ effect = "herbs", curve = [[0, 25], [100, 60], [200, 80]] }]

[[skill]]
id = "initiative"
name = "Initiative"
description = "Keeping your wits when something falls on you unseen."
kind = "passive"
# The initiative check (#682; spec §8 "Surprise and sneak attacks", surprise.toml): a Dexterity
# check against 13 plus the attacker's craft, made when an attack finds you unaware or a hidden
# trap springs under you. Marked by "surprise" (such a check made, whatever comes of it). Effect
# "initiative": points added to the check, +8 at 100, +12 at 200 (at most 20). Effect
# "surprise_ease": failed, your next action costs half again as much, less this percent of the
# extra: half of it at 100, three quarters at 200 (with Cool head's, at most all of it).
mark = [{ on = "surprise", chance = 100 }]
benefit = [
    { effect = "initiative", curve = [[0, 0], [100, 8], [200, 12]] },
    { effect = "surprise_ease", curve = [[0, 0], [100, 50], [200, 75]] },
]

[[skill]]
id = "intimidate"
name = "Intimidate"
description = "Making others back down with a look or a threat."
kind = "action"
# War cry's (#844; spec §8 "Class abilities", the berserker's at 25): marked by "intimidate" (a
