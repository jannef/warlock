# Quests (spec §7 "Quests", §8 "Quests"): simple, ADOM-like errands people give you. This file is
# the field reference: the quests are a campaign's, in its data/quests/ (the showcase's:
# campaigns/showcase/data/quests/showcase.toml; spec §3). Chat with
# the giver (`C`): each quest they have for you is a topic on the dialogue screen. Asking hears
# the offer, which you accept or decline; the quest log (`q`) lists what you took up. Come back
# once it is done, and they reward you.
#
# Each [[quest]] has:
#   id         lower-case letters, digits, and underscores; replays ask about it as topics:
#              `ask:E:quest-ID` (the offer, the reminder, or handing it in), `ask:E:accept-ID`,
#              and `ask:E:decline-ID` (a quest taken up is never given up, and any number may be
#              active at once)
#   name       its title in the quest log, and the topic it is asked about (at most 32
#              characters)
#   giver      who gives it: a creature type with a dialogue (data/dialogue.toml), or the npc id
#              of one
#   type       and target:
#     "kill"     target a creature type, or a tribe as `tribe:ID` (data/tribes/: any of its
#                member types): kill `count` of them (default 1; at most 99 of a type, 999 of a
#                tribe), optionally on one `level` (a level id, or a dungeon branch id for any
#                of its levels), else on every level. Only your own kills count, those before
#                you took the quest up too
#     "bring"    target an object type: hand in `count` of them (default 1) from your pack, to
#                the giver or to `to` (someone else who talks)
#     "reach"    target a level id (`depths:3` for a level of a branch): get there (having been
#                there before counts). Never repeatable
#     "deliver"  target an object type: the giver hands you one as you accept (you need room in
#                your pack), to carry to `to` and hand in there. Without it in your pack you
#                cannot hand it in
#   reward     { gold, items, xp }, each optional: gold coins, objects as levels place them
#              (`["red_potion*2"]`), and experience
#   offer, accept, reminder   what the giver says when you ask about it, accept it, and ask
#              again before it is done; decline what they say when you decline (optional)
#   done       what whoever you hand it in to says: the recipient of a bring with `to` or a
#              delivery, else the giver
#   requires   a quest loaded before this one (earlier in the table), or a list of them
#              (`["ledger", "barrow_heart"]`), that must all be done first (optional)
#   requires_alignment  the alignment bands you must be in for it to be offered (spec §8
#              "Alignment"; optional): { min = "kind" } is Kind or better, { max = "callous" }
#              Callous or worse, or both; a quest taken up is done whatever you become
#   alignment  how far completing it moves your alignment (alignment.toml; -1000 to 1000,
#              default 0): helping quests good, dark ones evil. A good giver offers no good one
#              to an Evil or Wicked character, an evil giver none to a Good or Saintly one
#   repeatable offered again once done (default false)
#   reveals    a hidden location of the overworld it reveals (a legend's `hidden`; optional):
#              { location = "ID", when = "accepted" }, `when` one of "offered", "accepted"
#              (the default), and "done". The speaker marks it on the player's map
#   where      where the goal lies, in words, after the objective in the quest log (optional)
# Texts are one line of at most 280 characters. Someone's topics (their dialogue's, one per
# quest they give or take, and one more for an offer's accept and decline) must fit the dialogue
# screen's nine.
