# Quests (spec §7 "Quests", §8 "Quests"): simple, ADOM-like errands people give you. Chat with
# the giver (`C`): each quest they have for you is a topic on the dialogue screen. Asking hears
# the offer, which you accept or decline; the quest log (`q`) lists what you took up. Come back
# once it is done, and they reward you.
#
# Each [[quest]] has:
#   id         lower-case letters, digits, and underscores; replays ask about it as topics:
#              `ask:E:quest-ID` (the offer, the reminder, or handing it in), `ask:E:accept-ID`,
#              and `ask:E:decline-ID` (a quest taken up is never given up, and any number may be
#              active at once)
#   name       its title in the quest log, and the topic it is asked about (at most 32
#              characters)
#   giver      who gives it: a creature type with a dialogue (data/dialogue.toml), or the npc id
#              of one
#   type       and target:
#     "kill"     target a creature type: kill `count` of them (default 1), optionally on one
#                `level` (a level id, or a dungeon branch id for any of its levels). Only your
#                own kills count, those before you took the quest up too
#     "bring"    target an object type: hand in `count` of them (default 1) from your pack, to
#                the giver or to `to` (someone else who talks)
#     "reach"    target a level id (`depths:3` for a level of a branch): get there (having been
#                there before counts). Never repeatable
#     "deliver"  target an object type: the giver hands you one as you accept (you need room in
#                your pack), to carry to `to` and hand in there. Without it in your pack you
#                cannot hand it in
#   reward     { gold, items, xp }, each optional: gold coins, objects as levels place them
#              (`["red_potion*2"]`), and experience
#   offer, accept, reminder   what the giver says when you ask about it, accept it, and ask
#              again before it is done; decline what they say when you decline (optional)
#   done       what whoever you hand it in to says: the recipient of a bring with `to` or a
#              delivery, else the giver
#   requires   a quest earlier in this file that must be done first (optional)
#   requires_alignment  the alignment bands you must be in for it to be offered (spec §8
#              "Alignment"; optional): { min = "kind" } is Kind or better, { max = "callous" }
#              Callous or worse, or both; a quest taken up is done whatever you become
#   alignment  how far completing it moves your alignment (alignment.toml; -1000 to 1000,
#              default 0): helping quests good, dark ones evil. A good giver offers no good one
#              to an Evil or Wicked character, an evil giver none to a Good or Saintly one
#   repeatable offered again once done (default false)
# Texts are one line of at most 280 characters. Someone's topics (their dialogue's, one per
# quest they give or take, and one more for an offer's accept and decline) must fit the dialogue
# screen's nine.

# The old hermit in the hub's stairs nook: the rats of the arena, then a look into the Depths.
[[quest]]
id = "rats"
name = "Rats in the arena"
giver = "hermit"
type = "kill"
target = "rat"
count = 3
level = "arena"
reward = { gold = 20, xp = 30 }
alignment = 20
offer = "Here we don't fight. Down in the arena, you may. The rats have the run of the pit again, and their squeaking comes up the stairs all night. Kill three of them for me, and I'll pay you for the quiet."
accept = "Good. Mind their teeth. Three, now: I'll know if you count wrong."
decline = "Then I'll sleep with my fingers in my ears. Again."
reminder = "Three rats from the arena, and not one fewer. The stairs down are right there."
done = "Three fewer rats. My ears and I thank you. Here, for your trouble."

[[quest]]
id = "depths"
name = "Three levels down"
giver = "hermit"
requires = "rats"
type = "reach"
target = "depths:3"
reward = { gold = 50, xp = 100, items = ["jade_amulet"] }
alignment = 15
offer = "You've an arm, I'll give you that. Now I want eyes. Find the Depths and go down three levels, to where the caves begin. Then come back and tell me if they've woken. I'd go myself, but my knees."
accept = "The old way in opens in the Barrowdowns, out past the courtyard. Take your lantern."
decline = "Another time. The caves have waited this long."
reminder = "Three levels down into the Depths, where the caves begin. The way in is in the Barrowdowns."
done = "Awake, are they? I thought as much. Here: this was mine, long ago. It saw me through worse."

# The courtyard's gardener: three apples.
[[quest]]
id = "apples"
name = "Three apples"
giver = "gardener"
type = "bring"
target = "apple"
count = 3
reward = { gold = 10, xp = 15 }
alignment = 10
offer = "I'm starting a new tree, and I want seed from good apples. Bring me three, would you? Windfalls will do, or the pantry in the hall below keeps a basket."
accept = "Three apples. Whole ones, mind, not half-eaten."
decline = "Suit yourself. The tree can wait. Trees are good at that."
reminder = "Still waiting on those three apples. The tree isn't getting any younger. Neither am I."
done = "Lovely. Good firm ones. Here, for your trouble. And mind the beds on your way out."

# The wandering bard: a letter for the old hermit.
[[quest]]
id = "letter"
name = "The bard's letter"
giver = "bard"
type = "deliver"
target = "sealed_letter"
to = "hermit"
reward = { gold = 5, xp = 15 }
alignment = 10
offer = "I owe the old fellow by the stairs in the hall a song, but I've a road to walk. I wrote it down for him instead. Would you carry this letter down to him? It's sealed, so no learning the tune."
accept = "My thanks! He sits by the stairs in the hall below. He mutters; you'll hear him."
decline = "Then it waits in my pocket with the others."
reminder = "The letter goes to the old hermit, by the stairs in the hall below. He's expecting it, more or less."
done = "A letter? From the bard? Hm. A song, and he's spelled half the words wrong. Thank him for me. Here, for the walk."
