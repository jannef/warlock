# The undead roster (#383, batch 6). What a lich becomes when the ages have taken everything but the
# skull: a gem-eyed skull floating in a drift of dust, a caster (its spells announced until magic is
# designed) whose cold touch dims the wits of the living for good unless the will holds (a temple's
# mending gives it back). Blades and clubs glance off its warded bone, it keeps things worth taking,
# and a world has no more than one. Not yet in any dungeon's population.
