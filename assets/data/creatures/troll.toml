# The delf wave (Fyrdelf, docs/design/campaign.md §10.1). The marsh troll's big brother, from
# the warm deep: huge, strong, and so tough that its wounds close as you watch (hit points come
# back by Toughness). Fire hurts it more than steel. The first of the troll tribe (#456), whose
# faction it is now; it once ran with the goblins' kin and still leaves them be.
[[creature]]
id = "troll"
level = 13
xp = 75
rarity = "uncommon"
loot = 20
name = "troll"
glyph = "T"
fg = "#5a8a4a"
faction = "troll"
tags = ["troll"]
alignment = "evil"
vision = "darkvision"
footsteps = 150
hearing = 10
weight = 300000
stats = { strength = 22, dexterity = 10, toughness = 26, intelligence = 5, willpower = 10, presence = 4 }
base_hp = 40
natural = { defence = 1, protection = 2, name = "hide" }
resist = { fire = -50 }
on_eat = { message = "It twitches as you chew.", vomit = 50 }
blood = "#2a5a2a"
[creature.attack]
damage = "2d6"
damage_type = "slashing"
name = "claws"
verb = "rakes"
