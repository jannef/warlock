# The gates (#1295, docs/design/miscasts-review.md §6; docs/dev/creatures/gates.md). A gate of gloom
# where there was none; hell hounds bay beyond it, and the lesser yugoloths come at their heels.
# Made only by a miscast (miscasts/gloom_gate.toml): rooted, with no attack of its own, it lets
# fiends through on its cooldown at no cost, `loosed`, at peace with them. Killing it is the fix: what came
# through stays, but no more come.
