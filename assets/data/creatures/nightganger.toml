# The undead roster (#383, batch 5). Old English nihtgenga, the night-goer: a huge, grave-dark
# walker that comes to the sleeping, whose blow drinks the Toughness out of the living, for good
# unless the body holds on (a temple's mending gives it back), and whose coming sometimes sends
# them running. Not yet in any dungeon's population.
[[creature]]
id = "nightganger"
level = 46
xp = 240
rarity = "rare"
name = "nightganger"
glyph = "Z"
fg = "#6a5a8a"
speed = 1050
faction = "undead"
tags = ["undead"]
alignment = "evil"
vision = "darkvision"
sight = 12
footsteps = 130
hearing = 12
weight = 200000
stats = { strength = 34, dexterity = 20, toughness = 35, intelligence = 28, willpower = 32, presence = 28 }
base_hp = 184
natural = { defence = 3, protection = 4, name = "dead flesh" }
resist = { poison = 100 }
on_eat = { message = "Grave-cold meat, and bitter as night.", vomit = 80, harm = "1d4" }
blood = "#202830"
[creature.attack]
damage = "3d12"
damage_type = "bludgeoning"
name = "slam"
verb = "slams"
to_hit = 4
on_hit = [
    { drain = "toughness", points = 2, chance = 10, check = "toughness", difficulty = 21 },
    { status = "frightened", chance = 15, severity = 1 },
]
