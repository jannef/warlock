[[creature]]
id = "rat"
level = 1
xp = 5
rarity = "common"
name = "giant rat"
glyph = "r"
fg = "#b08458"
speed = 1200
faction = "vermin"
tags = ["vermin"]
alignment = "neutral"
vision = "low_light"
sight = 8
# Light on its feet, sharp of ear.
footsteps = 50
hearing = 5
weight = 4000
size = "small"
stats = { strength = 10, dexterity = 17, toughness = 5, intelligence = 1, willpower = 12, presence = 4 }
# A rat too clever for the traps may be tamed, and is the warren races' starting companion (spec
# §8 "Allies").
tameable = true
nose = 4
# Nothing special, slightly gross.
on_eat = { message = "Gamey and stringy, but it stays down." }

# Its bite is filthy: once in a long while it gives filth fever (unless resisted). A starter's
# rider is rare (#1200).
[creature.attack]
damage = "1d4"
damage_type = "piercing"
name = "bite"
verb = "bites"
on_hit = [{ disease = "filth_fever", chance = 1 }]
