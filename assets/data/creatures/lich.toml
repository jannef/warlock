# The undead roster (#383, batch 3). A sorcerer who would not die, its name from Old English līc,
# a corpse: dry bones in rotting robes, a caster (its spells announced until magic is designed)
# whose cold touch holds the living fast and dims their wits for good unless the will holds (a
# temple's mending gives it back). It keeps things worth taking, opens doors, bleeds nothing, and
# leaves only dust. Not yet in any dungeon's population.
