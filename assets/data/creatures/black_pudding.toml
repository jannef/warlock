# The second wave (#1138, the dread design §15 and §12 D14). A heap of black, eating slime that
# flows along the floors of the deep and dissolves what it covers: a blade cuts it in two, and
# both halves flow on (`splits`: blunt blows, fire, and spells do not); its acid eats at the
# armour it touches and at the weapon that strikes it (`corrodes`, both ways). Slow: a mace and
# a torch, or walking away.
