# The gates (#1295, docs/design/miscasts-review.md §6; docs/dev/creatures/gates.md). A gate opened
# for the lords of the hells: a balor or a pit fiend comes through it. Made only by a miscast
# (miscasts/lords_gate.toml): rooted, with no attack of its own, it lets fiends through on its
# cooldown at no cost, as `loosed` as it is. Killing it is the fix: what came through stays, but no
# more come.
