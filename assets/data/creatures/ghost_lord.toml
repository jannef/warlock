stats = { strength = 29, dexterity = 23, toughness = 33, intelligence = 35, willpower = 39, presence = 35 }
base_hp = 106
skills = { concentration = 169, spellcraft = 174 }
natural = { defence = 7, protection = 0, name = "insubstantial form" }
incorporeal = { wall_defence = 7 }
resist = { slashing = 50, piercing = 50, bludgeoning = 50, cold = 50, poison = 100 }
corpse = false
blood = "none"
[creature.attack]
