# The undead roster (#383, batch 5). The greatest of the ghosts, a lord of the unquiet dead who
# keeps a hall of them: a caster (its spells announced until magic is designed) whose touch holds
# the living still and wears the will out of them, for good unless it holds (a temple's mending
# gives it back). It drifts through walls and doors; blades and clubs pass half through it. Not
# yet in any dungeon's population.
