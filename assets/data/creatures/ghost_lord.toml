xp = 275
rarity = "rare"
name = "ghost lord"
glyph = "G"
fg = "#f0e8f8"
speed = 1150
faction = "undead"
tags = ["undead", "spirit", "caster"]
alignment = "evil"
vision = "darkvision"
sight = 12
