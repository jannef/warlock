# The beasts (docs/dev/creatures/beasts.md; content::beast_roster_tests checks them): the
# witch's cat, *catt* (#929; docs/design/witch-familiar.md §6). It sees in the dark and walks
# without a sound, and in the old trials it was fed on a drop of its mistress's blood and sent to
# do her harm. A familiar's kind (familiars.toml), called, never tamed. Wildlife: it fights no
# one unless it is someone's, so it strays nowhere and no population names it.
