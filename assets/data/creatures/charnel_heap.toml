# The undead roster (#383, batch 3). The dead of a charnel pit grown together into one heaving
# mound of limbs and rot: slow, enormously hard to put down, and its blows carry filth fever. A
# blade cuts it in two, and both halves crawl (`splits`: blunt blows and fire do not); it closes
# over whom it slams (engulfed). Not yet in any dungeon's population.
[[creature]]
id = "charnel_heap"
level = 22
xp = 120
rarity = "uncommon"
dread = true
name = "charnel heap"
first_sight = "A charnel heap. Cut it, and there is more of it."
glyph = "Z"
fg = "#7a7048"
speed = 700
faction = "undead"
tags = ["undead"]
alignment = "evil"
vision = "darkvision"
sight = 6
footsteps = 120
hearing = 8
weight = 300000
stats = { strength = 25, dexterity = 14, toughness = 26, intelligence = 2, willpower = 24, presence = 2 }
base_hp = 151
natural = { defence = 1, protection = 1, name = "dead flesh" }
immune = ["poison"]
splits = { on = ["slashing", "piercing"], least = 8 }
on_eat = { message = "Many dead, and all of them rotten.", vomit = 90, harm = "1d6" }
blood = "#3a3420"
cry = { kind = "rattle", loudness = 50, every = 60 }
[creature.attack]
damage = "4d6"
damage_type = "bludgeoning"
name = "slam"
verb = "slams"
to_hit = 3
threat = 24
crit = 3
on_hit = [
    { disease = "filth_fever", chance = 15 },
    { status = "engulfed", chance = 15, difficulty = 18 },
]
