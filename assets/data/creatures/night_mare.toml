# The undead roster (#383, batch 5). Old English mære, the rider of sleepers: a spirit that
# crouches on the chest of the dreaming. Its touch holds the living still and wears the will out
# of them, for good unless it holds (a temple's mending gives it back). It drifts through walls
# and doors. Not yet in any dungeon's population.
