id = "night_mare"
level = 49
xp = 255
rarity = "rare"
name = "night mare"
glyph = "G"
fg = "#585078"
speed = 1300
faction = "undead"
tags = ["undead", "spirit"]
alignment = "evil"
vision = "darkvision"
sight = 12
hearing = 15
weight = 100
stats = { strength = 29, dexterity = 25, toughness = 29, intelligence = 30, willpower = 33, presence = 30 }
base_hp = 74
natural = { defence = 6, protection = 0, name = "insubstantial form" }
incorporeal = { wall_defence = 6 }
resist = { slashing = 50, piercing = 50, bludgeoning = 50, cold = 50, poison = 100 }
corpse = false
blood = "none"
[creature.attack]
damage = "3d10"
damage_type = "cold"
name = "touch"
verb = "touches"
