# The leftover fiends (#450). The hag who rides the sleeper's chest and trades in souls: a caster
# (its spells announced until creature magic is designed) whose claws pin one as she pins the
# sleeper, unable to stir (held), and bring nightmares on the mind (frightened). She carries what
# her bargains bought. Her dream-walking and
# her soul bag wait for mechanics of their own; the hags' other kin share her `hag` tag.
