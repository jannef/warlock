# The undead roster (#383, batch 3). The keening woman of the Irish tales: a pale spirit whose
# cold touch sends the living running and takes the bearing out of them, for good unless the will
# holds (a temple's mending gives it back). It drifts through walls and doors; blades and clubs
# pass half through it. Not yet in any dungeon's population.
[[creature]]
id = "banshee"
level = 23
xp = 125
rarity = "rare"
dread = true
name = "banshee"
first_sight = "A banshee. Her wail is a death-knell; do not stay to hear it out."
glyph = "G"
fg = "#c8e8d8"
speed = 1400
faction = "undead"
tags = ["undead", "spirit"]
alignment = "evil"
vision = "darkvision"
sight = 12
hearing = 15
weight = 100
stats = { strength = 18, dexterity = 19, toughness = 18, intelligence = 19, willpower = 24, presence = 19 }
base_hp = 34
natural = { defence = 4, protection = 0, name = "insubstantial form" }
incorporeal = { wall_defence = 4 }
resist = { slashing = 50, piercing = 50, bludgeoning = 50, cold = 50 }
immune = ["poison"]
corpse = false
blood = "none"
cry = { kind = "wail", loudness = 100, every = 60 }
[creature.aura]
status = "frightened"
severity = 2
radius = 6
check = "willpower"
difficulty = 15
every = 24
heard = true
loudness = 100
touch = "{the} wails, and your heart quails."
unseen = "A wail rises through the walls, and your heart quails."
[creature.attack]
damage = "2d8"
damage_type = "cold"
name = "touch"
verb = "touches"
to_hit = 5
on_hit = [
    { status = "frightened", chance = 25, severity = 2 },
    { drain = "presence", points = 1, chance = 10, difficulty = 16 },
]
