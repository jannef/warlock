# The undead roster (#383, batch 6). The reaper of Breton tales, the last dead of the year, who
# drives his creaking cart by night and gathers the dying with his scythe: it sends the living
# running and takes the life out of them, for good unless the body holds on (a temple's mending
# gives it back). It drifts through walls and doors; blades and clubs pass half through it. Not yet
# in any dungeon's population.
