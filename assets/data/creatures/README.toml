# Creature types, one file per creature, named by its id (`kobold.toml`). This file holds only the
# notes below: a file of comments defines nothing. The game numbers the creatures in path order,
# so a new creature is a new file (never edited into another's), a renamed id is a renamed file,
# and the same id in two files is a load error naming both (docs/dev/content.md).
#
# Creature types. The player is the creature with id "player".
# Fields: id, name (without an article: "giant rat"), plural (its name for more than one, for
# quest messages; default by the plural dictionary, data/plurals.toml: the name plus "s" unless
# its last word is listed there), glyph, fg, speed (how quickly it acts: 1000 is normal and the default, 2000
# twice as many actions in the same game time; 100 to 10000; never shown to the player), weight
# (the creature's own weight in grams, required; what it carries adds to it), size (a size in
# sizes.toml, default "medium": how much it can carry, 1.5 kg × (2 × Strength + Toughness) scaled
# by the size's carry, before it is burdened, spec §8 "Burden"; the player's comes from their
# race when the run has a character), light (a preset in
# lights.toml the creature carries), anim, and the presentation-only effects glow and
# [[creature.particles]] (see terrain.toml; they move with the creature; `on = "attack"` bursts
# at the target of each attack the player sees, e.g. a spell's sparkle).
# Hearing (gameplay, spec §5 "Hearing"): footsteps (how loud its steps are on terrain with a
# step_noise of 100; a sound loses 10 a cell, 14 diagonally, and a closed door muffles 30; at most
# 300; default 0: it moves silently) and hearing (the faintest loudness it hears, 1 to 300; default
# none: it is deaf).
#
# Behavior (spec §8 "Creature behavior"; nothing here is shown to the player but the faction's
# stance toward them):
#   faction      a faction id in factions.toml (required; the player's is "player")
#   factions     instead of faction: the factions each creature of the type may join, by weight
#                (1 to 1000), `{ seelie = 50, unseelie = 50 }`: each draws its own when it is made
#                (a spawn, a floor's population, a level file's entry without a faction of its
#                own), and keeps it (spec §7 "Factions"); the type counts as its heaviest
#   vision       its eyes: a profile in vision.toml (default "normal"); it sees by the same rules
#                as the player, under the same light
#   sight        how far it sees, in cells (default 10, at most 40)
#   combat       "melee" (default: closes in and attacks from next to its target), "ranged"
#                (shoots with the missile weapon it has ready), "caster" (casts the spells of
#                its `spells` list while it has the mana, else fights as melee), or "dragon"
#                (breathes its [creature.breath] whenever it is ready, else fights as melee)
#   range        how far a ranged or caster creature reaches, in cells (2 up to its sight; it
#                needs a clear line of fire); a caster casts no farther than its spells reach
#   spells       a caster's spells, and only a caster's: ids in data/spells/, in the order it
#                prefers them (spec §8 "Creature behavior": "Casters"); harm, hexes that lay a
#                plain status, heals by touch, and buffs (no zones, corpses, open sky, pushes,
#                charms, summons, cleansings, or utilities). Each cast spends the spell's cost
#                from its `mana`. Up to level 10 only level-1 harm and level 3 or lower hexes,
#                heals, and buffs, and rarity "very_rare"
#   mana         mana beyond its mental stats' modifiers (default 0): a caster's and a
#                summoner's pool, spent by each spell or summoning and back at the usual pace
#   opens_doors  whether it opens closed doors in its way (default false)
#   lurks        whether it lurks (default false; spec §8 "Creature behavior"): a hostile it
#                sees, it waits for where it stands (shooting from there if it can) until the
#                hostile is beside it or it has been harmed, then fights as any creature
#   hunts        whether it hunts the player by scent (default false): seeing no hostile, it
#                goes to where the player is on its level, and never idles (the stalker)
#   shadowy      whether it is shadowy (default false; docs/dev/creatures.md "The unseen"): on a
#                cell dim to the player's eyes, darkvision or not, they do not see it unless it
#                is beside them; "You feel a cold draught." as one comes within 2
#   invisible    `invisible = true`: the player never sees it, however lit and near (the
#                invisible stalker); or [creature.invisible] with `cooldown` (seconds, 6 to
#                600): at the start of its turn, whenever the cooldown is off, it gives itself
#                the Invisible status (data/status.toml, two minutes), free of time and mana,
#                then goes on as ever; Silenced, it cannot. Seeing, Blood scent, a companion's
#                nose, and a blow that finds it show it; it is heard as ever
#   budge       whether you can swap places with it when it is not hostile to you (spec §8
#                "Displacement"): "always" (default), "off_post" (not while it keeps its post,
#                going about its routine: a shopkeeper at its counter), or "never" (rooted)
#   attack_cost  what its attacks cost in energy (100 to 10000), instead of the attack's cost in
#                actions.toml (melee, shoot, or cast; 1000 is a normal action)
#   training    makes it a target dummy (spec §8 "Weapon skills": "Target dummies"): it never
#                acts or dies, the player strikes it by moving into it, a blow at it disturbs no
#                one and trains weapon skills and styles only, at `percent` (1 to 100) of the
#                marks, below rank `melee` (blows, bashes, kicks, throws) or `ranged` (shots);
#                a missile that reaches it stops, and is destroyed by `breaks` percent (never one
#                that never breaks), else drops beside it: { percent = 50, melee = 2, ranged = 4,
#                breaks = 25 }
#
# Tags (spec §8 "Quests", #441; never shown to the player; the wiki lists them): tags, plain
# words a quest or a rule may ask for, `tags = ["goblin", "archer"]`. One flat pool: nothing
# declares a tag, a creature carrying it is all there is, and a kill quest's `target =
# "tag:goblin"` counts every type that carries it. A tag is the base word, singular (`goblin`,
# never `goblins`), lower-case words joined by hyphens, 1 to 24 characters. Its plural, said in
# quests, comes from data/plurals.toml (default the word plus "s"): a tag or a creature name
# with an irregular plural adds its line there. **Tag every new creature** that belongs to a
# group or a role below (a new tag only when something could use it):
#   groups   kobold, goblin (the hobgoblins too; not the ogres or the troll, who only run with
#            them), hobgoblin (the goblins' second tier, #454), orc (not the wargs, who only
#            run with them), undead (every
#            creature of the "undead" faction: content::tag's test fails without it), vermin
#            (not the basilisk), marsh-thing (the fens' living things and the bog hag),
#            hag (the bog hag and her kin, every creature of the "hags" faction, the night
#            hag among them), duergar (not their trader, a merchant), fire-thing (the delf's
#            burning things), outlaw (every creature of the "outlaws" faction: the footpads
#            and the four wanted criminals, #424),
#            elemental (every elemental, #453, with its element's word: fire, earth, air, water,
#            ice, or lightning; content::elemental_roster_tests checks them),
#            fey (every creature of the fey courts, seelie or unseelie),
#            devil (every creature of the "devil" faction: content::devil_roster_tests checks it),
#            yugoloth (every creature of the "yugoloth" faction), fiend (the fiends of the lower
#            planes: every yugoloth, demon, and devil; and the fiends of no family, #450),
#            giant (every type of the "giant" faction, the ogres too), ogre (the ogres)
#            animated (every animated object, #483: generated, never written here)
#            beast (the wild animals the druid calls, wildlife: the wolf and the bear, #839;
#            content::beast_roster_tests checks them)
#   roles    archer (shoots: the goblin, kobold, and skeleton archers), caster (every
#            combat = "caster" type), cultist (the minster's cult, and the necromancer and dark
#            wizard of its kind), skeleton (walking bones), spirit (the incorporeal dead), troll
#            (every troll: the tribe, the marsh troll, and the rotting troll), construct (things
#            made, not born: the mud golem and every animated object), summoner (every type with
#            a summoning, #520: the goblin wizard, the necromancer, the dark wizard; each of some
#            other tribe too), dragon (every combat = "dragon" type, #1099: the fire drake)
# A creature may carry several: the kobold shaman is ["kobold", "caster"].
#
# Alignment (spec §8 "Alignment"; never shown to the player): alignment, where it stands between
# good and evil: "good", "neutral" (the default), or "evil" (a level legend entry may give one
# spawn another). Killing it, and eating its corpse, moves the player's alignment by it
# (alignment.toml); good folk greet an evil character coldly. race: the race it is one of (an id
# in races.toml), if any: to a character of that race, eating its corpse is eating kin.
#
# Experience (spec §8 "Experience"; the player sees only the XP and level they earn): level (1 to 99,
# default 1) and xp (what a kill by the player is worth when the player is at that level, default 0;
# the player's own entry has neither). xp_percent (optional, any whole number from 0 up, default
# 100) is a hand-set modifier of xp in percent, no formula: a kill and the first-kill bonus start
# from xp × xp_percent ÷ 100, so xp itself can stay on the guideline. Kills of lower-level
# monsters give less and less (data/experience.toml). The level is also its danger (spec §7 "Danger levels"): a dungeon
# branch's or a level's `population` draws it on floors of about that danger.
#
# Uniques (spec §7 "Danger levels"): unique = true (default false) for a type a population draws
# at most once in a run (a boss); a level legend may still place it by hand.
#
# Grades (spec §8 "Grades"; crates/warlock-core/src/grade.rs): one creature in six
# comes greater than its kind (+25 % maximum hit points, +1 to hit and +2 damage in melee, 10 %
# slower) and one in six lesser (the reverse), drawn as it is made; its kill pays its kind's
# experience. grades = false (default true) for a type that has none (the people); a unique, a
# mimic, a generated type, and a unique character placed with an `npc` never have one.
# grade_words = ["scrawny", "big"] (optional) are the words look mode gives the lesser and the
# greater ("a big kobold"); none: the tags' (undead: "withered", "ancient"), else "small", "big".
#
# Strays (spec §7 "Danger levels"): every type hostile to the player that is no unique and no
# animated object may come to any branch of its campaign (a shared type to every campaign's) as a
# stray, its population or not, the out-of-depth draws bringing the deep ones now and then; a
# type in no population is met only so. stray = false (default true) keeps a type out of the
# strays (one only placed by hand or by its own rules); a population naming it still draws it.
#
# Rarity (spec §7 "Danger levels"; never shown to the player): rarity, a tier in
# creature_rarities.toml (default "common") whose factor multiplies the type's weight when a
# population or a spawn draws it: the more dangerous and rewarding (casters, chieftains, the
# strongest of a place), the rarer. A level legend's hand-placed creatures are not drawn.
#
# Skills (spec §8 "Skills"; never shown to the player): skills, the skills it is trained in, by
# skill id (skills.toml), with fixed values (0 to 999); every other skill is untrained. The player's
# come from their race and class, not from here. Creatures do not train (yet). Those of surprise
# (spec §8 "Surprise and sneak attacks") work for creatures as for the player: sneak_attack (dice
# on a hit that finds its target unaware, and a harder initiative check for it), initiative
# (keeping its wits when caught unawares), and spot (its side of the contest to slip past it).
#
# Loot (spec §8 "Magic items"): loot, the chance in percent (default 0) that it drops a magic or
# rare item where it dies, besides what it carried; the item level is the level's.
#
# Stats (spec §8 "Stats"; never shown to the player; combat and burden use them): stats, its scores
# by stat (strength, dexterity, toughness, intelligence, willpower, presence; 1 to 40, default 10,
# the average), and potential, how far each score could grow (default: the score; never below
# it). The player's stats come from the scenario, not from here.
#
# Combat (spec §8 "Combat"; never shown to the player but as words):
#   base_hp   hit points beyond its Toughness (default 0); the player's come from the scenario
#   regen     how fast its wounds close, in percent of the normal pace (default 100, 0 to 1000;
#             a troll's 400): counted with its statuses' paces, so Burning and Corroded stop it.
#             Only a brute of its level or a dread type regenerates (the dread design §5.9)
#   corrodes  its harm to gear (the dread design §5.8, world/corrode.rs):
#             { chance = 25, what = "armour", kind = "acid" } (a hit of its damages a piece the
#             player wears) or what = "weapon" (the player's hit on it damages what struck) or
#             what = "both" (each, the rust monster's); kind is the item damage, "acid", "rust",
#             or "fire": the materials' `resists` of that kind withstand it, and a piece damaged
#             already is destroyed (world/item_damage.rs)
#   attack    its natural attack, used when it wields no weapon (without one: bare hands, 1d3):
#             { damage = "1d4", damage_type = "piercing", name = "bite", verb = "bites" } and
#             optionally threat, crit, and to_hit as for weapons (objects.toml); Strength adds
#             to hit and to damage. damage_type is the kind of damage it does (damage_types.toml,
#             spec §8 "Damage types": a bite piercing, a claw slashing, a slam bludgeoning).
#             on_hit lists the status effects (status.toml) and diseases (diseases.toml) a hit
#             with it may cause, if the target lives: [{ status = "poisoned", chance = 10,
#             severity = 2 }] (chance in percent, 1 to 100; severity in degrees, up to the
#             status's max), { disease = "filth_fever", chance = 10 } (then a check to resist it).
#             A status may be resisted too: check (a stat id) and difficulty (1 to 40) together,
#             as a drain's ({ status = "stiffening", ..., check = "toughness", difficulty = 15 }).
#             Several natural attacks, each struck in turn in one melee attack and rolled on its
#             own (a dragon's two claws and a bite): [[creature.attack]] tables, one per attack
#             (#1099); a wielded weapon's blow stands in for the first, and the rest are not struck
#   breath    a dragon's breath (spec §8 "Creature behavior": "Dragons"; enemy-only; the type
#             needs combat = "dragon", and a dragon needs it): [creature.breath] with damage
#             (dice, rolled once for everyone in the cone), damage_type (its element: one type),
#             length (the cone's, in cells, 2 to 12; a quarter turn wide, as Burning hands'),
#             cooldown (seconds before the next, 6 to 600: the `breath` status of status.toml, a
#             degree per 6 s), effect (a burst effect of effects.toml drawn over the cone), and
#             optionally noun (what strikes, in the messages: "fire"; default "breath") and verb
#             (what it does: "breathes fire"; default "breathes"), and riders (on_hit entries
#             as a gaze's: statuses and drains, each by its own chance on everyone the cone
#             harmed; the gorgon's stiffening; default none). It breathes at a hostile it
#             sees in the cone with a clear line whenever the status is off, with no roll to hit:
#             Evasion halves it and resistances take their share
#   gaze      a rider at sight, not at touch (spec §8 "Creature behavior": "Gazes"; enemy-only):
#             [creature.gaze] with range (it gazes at a hostile it sees within this many cells,
#             1 to 8), riders (on_hit entries, as for attack: statuses with a severity, drains
#             with their check, each by its own chance; never a disease or a hold), and
#             optionally chance (percent that eyes that meet it are caught, 1 to 100; default
#             100), cooldown (seconds before the next, 6 to 600: the `gaze` status of
#             status.toml, a degree per 6 s; default 12), averted (true: the player averts their
#             eyes by reflex while they see it, fighting at -4 to hit with Dodge halved and no
#             free blows; default false) and glance (with averted: the share of chance it takes
#             at against averted eyes, percent; default 25). It gazes before it throws, whenever
#             the cooldown is off, at a target with vitals; the eyes must meet both ways (the
#             player sees it, or a creature by its own eyes), else the stare is only felt
#   burst     a burst of its element (the dread design §5.3; world/creature_burst.rs):
#             [creature.burst] with damage (dice, rolled once for everyone it reaches, each in
#             full), damage_type, radius (0 to 3, around its own cell), when ("touches": a vortex,
#             which bursts beside its target instead of attacking and dies of it, and needs no
#             attack and combat melee; "dies": death throes, where it dies), effect (a burst
#             effect of effects.toml), and optionally noun (what strikes: "flame"; default
#             "burst"), verb ("comes apart in flame"; default "bursts", or "comes apart" for
#             death throes), rider ([{ status, severity, chance }], laid on those it harmed),
#             douses (a wave: Burning and fires put out), gust (piles blown a cell outward). Its
#             own type is spared
#   natural   its natural armour: { defence = 1, protection = 3, name = "shell" }: defence in
#             the Natural category of Defence, protection the damage it soaks off every hit
#             (adding up with what it wears; each 0 to 20, not both 0); "Your sword glances off
#             the cave beetle's shell." Its protection follows the body its name names, by
#             level (#563, spec §8 "Natural Protection by body and level"): none 0, hide
#             (L − 10) ÷ 8, bony (bones, scales, chitin, shell) L ÷ 6, armoured (stone, ice,
#             iron-hard skin) L ÷ 4 + 1; the peoples and types that may roll armour have none;
#             content::creature_body_tests checks it, and lists the exceptions.
#   throw     a natural ranged attack that needs no ammunition (spec §8 "Ranged combat":
#             "Creatures' throws"; the giants' boulders): [creature.throw] with object (what
#             flies, for its look: "boulder"; it never lands), damage, damage_type, range (cells,
#             2 to 20), verb (what it does as it throws: "hurls"), and optionally name (what flies
#             is called; default the object's name), cost (a throw's energy, 100 to 10000;
#             default `throw` in actions.toml), and to_hit, threat, crit, and on_hit as for
#             attack. Dexterity adds to hit, Strength to damage. Not next to its target, it throws
#             whenever the target is in range with a clear line of fire
#   incorporeal  it passes through solid terrain (walls, rock, closed doors; never the level's
#             edge) and may stand inside it (spec §8 "Incorporeal creatures"):
#             { wall_defence = 4 }: its Defence bonus while inside (the Wall category, 0 to 20)
#   vitals    false: it has no vitals to find, so it is immune to criticals and sneak attacks
#             (spec §8 "Surprise and sneak attacks"); default true. The incorporeal, animated
#             objects, and the types carrying a tag of surprise.toml's `no_vitals` have none
#             whatever this says.
#   summon    it calls forth creatures of its side (spec §8 "Summoning"; enemy-only):
#             [creature.summon] with its pool, either creatures (ids, each as likely; one named twice is twice as
#             likely: ["goblin", "goblin", "warg"]) or tag and levels (every type carrying the tag
#             with a level within [lowest, highest], uniques and itself left out; a shared type
#             calls shared types only, a campaign's its own too; a list may name the type itself,
#             a breeder), count (dice: how many at once,
#             1 to 12: "1d3"), cooldown (seconds before the next, 6 to 600: the `summoning` status
#             of status.toml, a degree per 6 s), mana (what one costs, 1 to 1000; the type then
#             needs mana; left out, it costs none), and optionally range (it summons at a hostile it sees within this many cells,
#             1 to 20; default 8), spread (how far from it they appear, 1 to 5; default 2), most
#             (how many of its summoned may live at once, 1 to 20; default 6), and verb (the
#             message's: "calls forth"; default "summons"). It summons before anything else it
#             would do; what comes takes its faction and pays its experience when killed. A type
#             with a summoning carries the tag `summoner` (content::summoner_roster_tests)
#   aura      a status it gives every hostile near it now and then (design monster-dread §5.4;
#             world/aura.rs): [creature.aura] with status (status.toml; no hold), radius (1 to 6
#             cells), touch (the words of its first touch on the player who sees it, the bearer
#             as {the}: "A chill comes off {the}."), and optionally severity (degrees, default
#             1), check and difficulty (a stat and 1 to 40: made, it does not take; none: it
#             always takes), every (seconds between touches, 6 to 600, default 12: the `aura`
#             status of status.toml, a degree per 6 s), heard = true with loudness (it reaches by
#             hearing, as a voice that loud where it stands, through walls; default 50; else by
#             line of sight), damage_type (the resistance that takes its share of the dose), and
#             unseen (the words when the player does not see it: "A wail rises through the
#             walls.")
#   innate    statuses it is made with and keeps, refreshed each turn it takes, never shown in the
#             look line: ["fire_cloaked"] (its retaliates burns whoever strikes it). No hold,
#             disguise, fear, or sleep
#   cry       an idle sound it makes now and then where it stands, heard by the hearing rules:
#             { kind = "hiss", loudness = 40, every = 60 }: kind banging, voice, howl, buzzing,
#             giggle, hiss, rattle, scream, or wail; loudness 1 to 300; every the seconds between
#             cries on average, 6 to 3600 (a chance of 6 in every on a turn it does not fight)
#   splits    a blow of a listed damage type that leaves it alive with at least twice `least`
#             hit points cuts it in two (docs/design/monster-dread.md §5.5): { on = ["slashing",
#             "piercing"], least = 8 } (least 1 to 500). It keeps the greater half; the other,
#             no gear, stands beside it; a half's kill pays a quarter and counts for no quest
#   dies_into what crawls out of its corpse as it dies: { creatures = ["grave_worm"], count =
#             "2d4", spread = 1 } (ids, each as likely, never the player, a unique, or itself;
#             count 1 to 20; spread 1 to 5 cells, default 1), of its faction, each paying a tenth
#             and counting for no quest; look mode calls it "writhing"
#   steals    a thief (docs/design/monster-dread.md §5.6; enemy-only; a type with hands):
#             { what = "small" | "any", chance = 30, cooldown = 60 }. A melee hit on the player
#             that leaves them alive, while the `theft` status of status.toml is off, takes one
#             stack from their pack by its chance (1 to 100; never what they wear or wield;
#             "small": coins, gems, potions, rings, scrolls), and the thief takes the status for
#             cooldown seconds (6 to 600, a degree per 6 s). It fights on; what it took is in its
#             pack and falls where it dies. It never steals from a creature
#   blinks    a blinker (docs/design/monster-dread.md §5.6; the blink dog's): { range = 6,
#             cooldown = 30 }. A melee fighter whose path to its target is blocked, while the
#             `blink` status is off, moves at once to a free cell beside the target within range
#             (2 to 12, Chebyshev) and in its own line of sight, and takes the status for
#             cooldown seconds (6 to 600). It never blinks away
#   disarms   a duellist's disarming blow (#1166; enemy-only; world/knock_away.rs):
#             { chance = 15, difficulty = 18 }. A melee hit on the player that leaves them alive,
#             with a weapon in their main hand and an open cell beside them, tries by its chance
#             (1 to 100) to knock it away: the player's Dexterity check against the difficulty
#             (2 to 40), plus the weapon's skill rank and their grip, keeps it; failed, it lies on
#             a random open cell beside them (a spirit weapon fades instead)
#   resist    what it resists, in percent per damage type (spec §8 "Damage types"):
#             { acid = 50 }; -100 (it takes double) to 100 (immune: nothing of the kind hurts
#             it, whatever it wears). What it wears adds up with this, capped at 75 short of
#             immunity. Never shown: the player learns it by play
#   weapon_skills  its ranks in weapon skills (spec §8 "Weapon skills"), by skill id in
#             weapon_skills.toml, 0 to 10: { spears = 1 }; fighting styles too ({ duelist = 2 },
#             spec §8 "Fighting styles"). Creatures do not
#             train (yet); the player's come from their race and class
#
# Gear (spec §8 "Creature gear"; rules only, the wiki states it): what a creature of the type
# spawns carrying, wielding, and wearing when a level gives it no fixed kit (a legend entry
# without carry, wield, or wear; a generated level's creatures). Combat reads it as it reads the
# player's, and it falls where the creature dies.
#   racial_weapon  the weapon its kind favours (an object with damage): the first gear line,
#             { chance = 90, one_of = [racial_weapon], keep = "wield" }, unless a [[creature.gear]]
#             line names it alone (with another chance). The type must have a rank in its weapon
#             skill (weapon_skills): the affinity is the rank
#   [[creature.gear]]  lines tried in order, each: chance (percent that it gives anything),
#             one_of (objects as level files place them, one drawn: ["padded_coat",
#             "leather_jerkin"], ["arrow*20"]), keep ("wield", "wear", or "carry"; default by the
#             object: what a hand, the missile weapon or missiles slot, or the Tool slot takes is
#             wielded, what another slot takes worn, the rest carried), magic (percent that the
#             piece is made magic as loot is, at the floor's item level; default 0). Each piece
#             is made of a material by the materials' `gear` at the creature's level; one that
#             would overload the creature is left out
#
# Corpses (spec §8 "Hunger"; with hunger.toml; never shown to the player before they try):
#   corpse    whether it leaves a corpse when it dies (default true): a "kobold corpse" (`%` in its
#             color) weighing what it does, feeding by its size (hunger.toml)
#   on_eat    what eating its fresh corpse does besides feeding, in this order: { message = "..."
#             (said once eaten), vomit = 25 (percent chance it comes back up and feeds nothing),
#             train = { toughness = 30 } (sure stat training marks per stat, 0 to 200),
#             widen = { toughness = 5 } (percent chance per stat that the hidden potential rises
#             by 1, 0 to 20: rare), skills = { decipher_script = { gives = 5, up_to = 30 } }
#             (an untrained eater learns the skill at `gives`, a trained one's rises by `gives`,
#             never past `up_to`; only skills with words in hunger.toml's `[corpses.skills]`:
#             literate casters teach Decipher script), heal = "1d4" (hit points), harm = "1d2" (degrees of
#             sickness: hunger.toml's `sickness`, poison), satiation = 500 (nutrition beyond its
#             size's; less if negative) }. `train` and `widen` lay over its tags' defaults
#             (hunger.toml's `[corpses.by_tag]`) per stat; 0 switches a tag's gift off. A
#             rotten corpse does none of it
#
# Blood (spec §8 "Blood"; presentation only, no rule reads it): blood, the colour of the stains it
# leaves when hurt badly or killed ("#rrggbb"; default dark red, "#6e0e0c"), or "none" for a
# bloodless creature. How much it spills goes by its size's `blood` in sizes.toml.

# Immunities and death (spec §8 "Status effects"; never shown to the player):
#   immune    status ids it never suffers (`immune = ["poisoned", "bleeding"]`; `diseased` is
#             every disease): refused where they are given, nothing rolled
#   dies      the verb of its death line, "The animated chair splinters." (default "dies")
#   depart    the words of its going as an ally whose call has run out, "The wolf slips back into
#             the dark." (default "fades away"; docs/dev/allies.md)
#
# Animated objects (spec §8 "Animated objects", #483) are not written here: their types are
# generated when content loads from data/animated.toml and data/animated/ (`animated_<body>`),
# numbered after these files and before every campaign's; an id here that one of them takes is
# an error.

# Notes on the groups, in the order they were kept in:
#
# The showcase's people (spec §3), its own types in campaigns/showcase/data/creatures/ (a
# campaign's types are its files there, numbered after these; only its own files may name them):
# folk who talk (its data/dialogue/, `C` to chat) and mutter to themselves now and then.
# Peaceful by type: they never fight, and you swap places with them when they are in your way.
#
# The undead (the roster, #383; content::undead_roster_tests checks the numbers): faction
# "undead", tags ["undead", ...] (with "skeleton" or "spirit" where they are one), alignment "evil", vision "darkvision", resist poison 100; they do not train and have
# no on_eat stat gifts (a tag's, caster or troll, switched off with train = { ... = 0 }). xp = 5 × level + 10. Stats, base_hp, dice, and speed come from the level
# and a role (shambler, brute, standard, quick, spirit, caster, small; #383's tables), within
# ±35 % of max HP and dice average. Bone types resist piercing 50 and bludgeoning −50; spirits
# resist slashing, piercing, bludgeoning, and cold 50, have an "insubstantial form" (defence
# level ÷ 10 + 2) and incorporeal = { wall_defence = 2 + level ÷ 10 }, and no footsteps. A drain
# in on_hit has difficulty 12 + level ÷ 5, checked by willpower (toughness for Toughness drains),
# and its attack is one dice step lower. Bone and spirit types leave no corpse and no blood;
# flesh types leave a rotten corpse (on_eat vomit 70 or more, harm). Glyphs: z lesser corporeal
# dead, Z greater, G spirits, W wights and wraiths, M mummies, C hounds, V vampires, D drakes, L liches, T
# the rotting troll; a colour distinct from every other type with the same glyph. Only a type in
# a population is met in its place: those of level 18 and up ship in none until a deep place takes
# them, and until then come only as strays (Strays, above).
#
# The demons (the roster, #449; content::demon_roster_tests checks the numbers): faction
# "demon", tags ["demon", "fiend"], alignment "evil", vision "darkvision", resist poison 100 and
# fire (100 for the balor), and cold and electricity 25 from level 24. The undead's formulas and
# roles (#383) give their xp, stats, base_hp, dice, to-hit, and natural Defence; a hold in on_hit
# has difficulty 12 + level ÷ 5. No corpse (a demon's body comes apart), dark ichor for blood.
# Glyphs: u the lesser demons, U the greater. The dretch and the quasit live in Fyrdelf; the rest
# ship in no population until a deep place takes them.
# The hags (#451; content::hag_roster_tests checks the numbers): the bog hag's kin, faction "hags"
# (the bog hag stays the marsh's), tags ["hag", ...] ("caster" for the casters; the bog hag
# carries "hag" too), alignment "evil", vision "darkvision", glyph h in a colour distinct from
# the bog hag's and the duergar's. Their numbers follow the undead roster's formulas above (#383:
# xp, stats, base_hp, dice, to_hit, natural defence, speed), by role (green hag and bheur hag
# casters, sea hag standard, annis hag brute); their riders are existing statuses and drains.
# In no population until a place of theirs takes them.
#
# The devils (the devil roster, #448; content::devil_roster_tests checks the numbers): faction
# "devil", tags ["devil", "fiend"], alignment "evil", vision "darkvision", on the undead roster's
# formulas (#383: xp, stats, base_hp, dice, to-hit, natural defence, speed by level and role).
# Every devil resists fire 100 and poison 50; cold 50 from the bearded devil up (the ice devil
# 100); the bone devil and the pit fiend poison 100. One natural attack each, its rider standing
# for the rest. A devil's body burns away when it dies: no corpse, a dark ichor for blood (the
# bone devil none). Glyphs: u the lemure, i the imp, U the greater devils, each in its own colour.
# Fyrdelf's population has the lemure and the imp (#531); the rest wait.
#
# The yugoloths (#446; content::yugoloth_roster_tests checks the numbers): mercenary fiends of the
# lower planes, faction "yugoloth" (hostile to the player only), tags ["yugoloth", "fiend", ...],
# alignment "evil", vision "darkvision", resist acid and poison 100, fire, cold, and electricity
# 50; no corpse (the body falls to ash), a dark ichor for blood. Their numbers follow the undead
# roster's formulas (#383) by level and role. Glyph "&", a colour each. In no population yet:
# no danger window reaches them.
#
# The hobgoblins (#454; content::hobgoblin_roster_tests checks the numbers): the goblin tribe's
# second tier, above the goblin chief. Faction "goblins", tags ["goblin", "hobgoblin", ...]
# (with "archer" or "caster" for those roles), alignment "evil", vision "darkvision", medium,
# opens doors. xp = 5 × level + 10; stats from the undead's base for aware creatures (In 9 +
# 0.2L, Wp 10 + 0.3L, Pr 8 + 0.25L), base_hp = 2.5 × level × role (soldier 1.0, archer 0.9,
# caster 0.8, officer 1.1). They fight with gear (a racial weapon and mail), not a natural
# attack. Glyph g in reds, steel, violet, and gold, apart from the goblins' green, ochre, and
# orange.
#
# The duergar (#518; content::duergar_roster_tests checks the numbers): the delf wave's miner,
# warrior, and smith and nine more, levels 8 to 40. Faction "duergar", tags ["duergar", ...]
# ("archer", "caster", "priest" by role), alignment "evil", race "duergar", darkvision, resist
# poison 25 and cold 10. xp = 5 × level + 10; St and To 12 + 0.4L, Dx 10 + 0.25L, In 9 + 0.2L,
# Wp 12 + 0.3L, Pr 6 + 0.25L, by role; base_hp = 2.5 × level × role (archer and standard 1.0,
# officer 1.1, quick 0.9, brute 1.6, caster 0.8). Armed with a racial weapon at rank 1 + L/7, or
# (the spider rider, the mindbreaker) a natural attack on #383's dice with a rider. Glyph h.
#
# The giant tribe (#457; content::giant_roster_tests checks the numbers): faction "giant", tags
# ["giant", ...] ("ogre" on the ogres, "caster" on the ogre mage and the giant shaman), levels 12
# to 50, xp = 5 × level + 10. Stats, base_hp, and dice by #383's formulas for a living brute
# (St 16 + 0.4L, To 17 + 0.4L, base_hp 4L; casters To 12 + 0.4L, base_hp 2L), within ±35 %. The
# giants' natural attack is their giant-sized weapon (one dice step up) and they hurl boulders
# ([creature.throw]: the level's dice, range 5 + L/10, the stone giant two farther; cost 2000,
# the stone giant's 1500); the ogres carry mauls and throw nothing. Glyphs: O the ogres, H the
# giants, each colour distinct. Medium with huge weights (no large size yet).
#
# The elementals (the roster, #453; content::elemental_roster_tests checks the numbers): faction
# "elemental" (the cinder elemental keeps the delf's "fire"), tags ["elemental", ELEMENT],
# alignment "neutral", resist poison 100, no corpse and no blood. The numbers are the undead
# roster's formulas (xp, stats, base_hp, dice, to_hit, natural Defence from L20), with the role by
# element (fire and water standard, earth and ice brute, air and lightning quick; motes small, `e`,
# size "small"). Each element is immune to its own damage type where it has one and hurt more by
# its opposite (fire and ice; water by electricity). Earth from the middle rung up is
# incorporeal with wall_defence 1 + level ÷ 20 (it moves through stone). Glyph `E` but motes `e`.
#
# The fey (the roster, #452; content::fey_roster_tests checks the numbers): factions = { seelie,
# unseelie } by weight, each creature joining a court when it is made; tags ["fey", ...]. Living:
# they leave corpses and bleed. xp = 5 × level + 10; stats, base_hp, and dice by the undead
# roster's formulas and roles (with the mind of the living: Intelligence and Willpower 10 + 0.4 ×
# level, Presence 12 + 0.4 × level, casters 4 more), within ±35 %. Tiny fey are small. Glyphs: f
# the small fey, F the man-sized (satyr) and the korred, n nymphs and dryads, C fey hounds; a
# colour distinct from every other type with the same glyph.
#
# The fiends of no family (#450; content::fiend_roster_tests checks the numbers): the hell
# hound, the nightmare, the succubus and the incubus (one fiend under two names, sharing their
# numbers), the night hag, the cambion, and the rakshasa. Faction "fiends" (not animals: a
# Beast-friend calms no fiend), tags ["fiend", ...] (the night hag "hag" too, the casters
# "caster"), alignment "evil", vision "darkvision", on the undead roster's formulas for their
# level and role (xp, stats, base_hp, dice, to_hit, natural defence). Their riders are existing
# ones only: fire attacks for the hound's and the steed's flames, a Toughness drain for the
# succubus's kiss, held and frightened for the hag's sleep and nightmares, transfixed and
# frightened for the rakshasa. Glyphs: C the hell hound (flame red), u the nightmare, n the
# succubus and incubus, h the night hag, p the cambion, f the rakshasa.
#
# The troll tribe (#456; content::troll_roster_tests checks the numbers): levels 13 to 42, faction
# "troll" (the marsh troll stays a marsh thing, the rotting troll undead; both carry the tag),
# tags ["troll", ...], alignment "evil", vision "darkvision", xp = 5 × level + 10. Numbers are
# the undead roster's formulas and roles (brute, standard, quick, caster) on the troll's own
# base: St 13 + 0.4 L, Dx 8 + 0.25 L, To 16 + 0.4 L (4 over the undead's: a troll heals by its
# Toughness, so it heals fast), within ±35 % of max HP and dice average. Fire hurts every troll
# (resist fire −50, the stone troll −25) but the fire troll. A hide of Defence 1 and Protection 2
# or more (the body rule's when higher; the chieftain, in armour, none); a corpse with on_eat vomit 50 (its gifts, 60 Toughness marks and a 5 % chance of a Toughness potential point, are the troll tag's, hunger.toml). Glyph T, each in a colour
# of its own. Only the troll and the hill troll live in a population
# (Fyrdelf); the rest wait for deeper places.
