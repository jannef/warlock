# The undead roster (#383, batch 5). The king laid under the greatest barrow, the wight lords'
# own lord: a caster (its spells announced until magic is designed) whose cold touch drinks the
# living's Toughness, for good unless the body holds on (a temple's mending gives it back). It
# bears the enchanted sword it was buried with, among other things worth taking, and opens doors.
# Not yet in any dungeon's population.
[[creature]]
id = "barrow_king"
level = 42
xp = 220
rarity = "rare"
loot = 80
name = "barrow king"
glyph = "W"
fg = "#3a6a5a"
speed = 1100
faction = "undead"
tags = ["undead", "caster"]
alignment = "evil"
vision = "darkvision"
sight = 12
combat = "caster"
range = 7
opens_doors = true
footsteps = 40
hearing = 15
weight = 55000
stats = { strength = 25, dexterity = 20, toughness = 29, intelligence = 31, willpower = 35, presence = 31 }
base_hp = 84
skills = { concentration = 136, spellcraft = 141 }
natural = { defence = 3, protection = 0, name = "dead flesh" }
resist = { poison = 100 }
weapon_skills = { long_blades = 6 }
corpse = false
blood = "none"
[creature.attack]
damage = "4d6"
damage_type = "cold"
name = "touch"
verb = "touches"
to_hit = 4
on_hit = [
    { drain = "toughness", points = 2, chance = 10, check = "toughness", difficulty = 20 },
]
