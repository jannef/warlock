# The undead roster (#383, batch 6). The ghost of a dragon: a vast pale shape of mist and cold that
# sends the living running, and whose bite takes the life out of them, for good unless the body
# holds on (a temple's mending gives it back). It drifts through walls and doors; blades and clubs
# pass half through it. Not yet in any dungeon's population.
[[creature]]
id = "ghost_dragon"
level = 68
xp = 350
rarity = "very_rare"
name = "ghost dragon"
glyph = "D"
fg = "#b8c8e8"
speed = 1350
faction = "undead"
tags = ["undead", "spirit"]
alignment = "evil"
vision = "darkvision"
sight = 16
hearing = 18
weight = 100
stats = { strength = 36, dexterity = 30, toughness = 36, intelligence = 40, willpower = 37, presence = 37 }
base_hp = 102
natural = { defence = 8, protection = 0, name = "insubstantial form" }
incorporeal = { wall_defence = 8 }
resist = { slashing = 50, piercing = 50, bludgeoning = 50, cold = 50, poison = 100 }
corpse = false
blood = "none"
[creature.attack]
damage = "4d12"
damage_type = "cold"
name = "bite"
verb = "bites"
to_hit = 6
on_hit = [
    { drain = "toughness", points = 2, chance = 15, check = "toughness", difficulty = 25 },
    { status = "frightened", chance = 30, severity = 3 },
]
