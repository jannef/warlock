# The beasts (docs/dev/creatures/beasts.md; content::beast_roster_tests checks them): the farm
# dog of the lanes and the ranger's commonest companion (#916; docs/design/ranger-companion.md
# §12.2). Quick, loyal, a good nose and good ears. Wildlife: it fights no one unless it is
# someone's, so it strays nowhere and no population names it.
[[creature]]
id = "hound"
level = 1
xp = 15
name = "hound"
glyph = "d"
fg = "#b89a6a"
speed = 1200
faction = "wildlife"
tags = ["beast"]
alignment = "neutral"
vision = "low_light"
sight = 10
footsteps = 40
hearing = 20
weight = 25000
stats = { strength = 11, dexterity = 14, toughness = 4, intelligence = 3, willpower = 10, presence = 5 }
base_hp = 1
tameable = true
nose = 6
depart = "slinks away into the dark"
on_eat = { message = "Dog. You try not to think about it.", vomit = 10 }
[creature.attack]
damage = "1d4"
damage_type = "piercing"
name = "bite"
verb = "bites"
