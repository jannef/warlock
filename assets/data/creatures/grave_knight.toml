# The undead roster (#383, batch 3). A knight who broke his oath and was buried in his armour,
# risen still keeping the sword-and-shield drill he knew in life: heavy mail or plate, and a long
# sword that is now and then enchanted. It opens doors. Not yet in any dungeon's population.
[[creature]]
id = "grave_knight"
level = 22
xp = 120
rarity = "uncommon"
name = "grave knight"
glyph = "Z"
fg = "#a8a8b8"
faction = "undead"
tags = ["undead"]
alignment = "evil"
vision = "darkvision"
sight = 12
opens_doors = true
footsteps = 90
hearing = 12
weight = 80000
stats = { strength = 20, dexterity = 16, toughness = 21, intelligence = 19, willpower = 24, presence = 19 }
