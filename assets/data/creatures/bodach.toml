# The undead roster (#383, batch 3). A bodach of the Highland tales: a withered grey thing that
# was once a man and comes in the night for the doomed. Its cold touch sends the living running,
# and now and then leaves them weaker for good unless the body holds on (a temple's mending gives
# it back). It opens doors. Not yet in any dungeon's population.
[[creature]]
id = "bodach"
level = 21
xp = 115
rarity = "rare"
name = "bodach"
glyph = "Z"
fg = "#5a5450"
faction = "undead"
tags = ["undead"]
alignment = "evil"
vision = "darkvision"
sight = 12
opens_doors = true
footsteps = 50
hearing = 14
weight = 55000
stats = { strength = 19, dexterity = 15, toughness = 20, intelligence = 18, willpower = 23, presence = 18 }
base_hp = 52
natural = { defence = 1, protection = 0, name = "withered hide" }
resist = { poison = 100 }
on_eat = { message = "Grey, dry, and wrong.", vomit = 80, harm = "1d4" }
blood = "#2a2826"
[creature.attack]
damage = "3d6"
damage_type = "cold"
name = "touch"
verb = "touches"
to_hit = 2
on_hit = [
    { status = "frightened", chance = 20, severity = 2 },
    { drain = "toughness", points = 1, chance = 5, check = "toughness", difficulty = 16 },
