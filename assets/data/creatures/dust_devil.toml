# The elemental roster (#453): the air line's mote rung. A little whirl of grit and wind that
# dances along the passages: very fast, and its sand scours the skin.
[[creature]]
id = "dust_devil"
level = 3
xp = 25
rarity = "uncommon"
name = "dust devil"
glyph = "e"
fg = "#c8b890"
speed = 1650
faction = "elemental"
tags = ["elemental", "air"]
alignment = "neutral"
vision = "darkvision"
sight = 8
footsteps = 20
hearing = 8
weight = 2000
size = "small"
stats = { strength = 8, dexterity = 15, toughness = 6, intelligence = 2, willpower = 17, presence = 2 }
base_hp = 3
natural = { defence = 2, protection = 0, name = "rushing wind" }
resist = { piercing = 50, electricity = 50 }
immune = ["poison"]
corpse = false
blood = "none"
# A vortex (the dread design §5.3): beside its target it bursts instead of attacking, and is
# gone; killed from afar it goes out quietly.
[creature.burst]
damage = "2d4"
damage_type = "slashing"
radius = 1
when = "touches"
effect = "shatter"
noun = "sand"
