# The delf wave (Fyrdelf, docs/design/campaign.md §10.1). A heavy, many-legged lizard of the hot
# deep, scaled like a lord's mail: its bite numbs the limbs, so that everything takes longer
# (Sluggish); its gaze turns flesh to stone (Stiffening).
[[creature]]
id = "basilisk"
level = 16
xp = 90
rarity = "very_rare"
dread = true
name = "basilisk"
glyph = "R"
fg = "#7a9a3a"
speed = 900
faction = "vermin"
alignment = "neutral"
vision = "darkvision"
footsteps = 70
hearing = 10
weight = 150000
stats = { strength = 20, dexterity = 10, toughness = 20, intelligence = 2, willpower = 16, presence = 8 }
base_hp = 44
natural = { defence = 2, protection = 2, name = "scales" }
resist = { poison = 50 }
on_eat = { message = "Your tongue goes numb.", vomit = 40, harm = "1d4" }
blood = "#4a6a1a"
cry = { kind = "hiss", loudness = 40, every = 60 }
[creature.attack]
damage = "2d8"
damage_type = "piercing"
name = "bite"
verb = "bites"
to_hit = 4
on_hit = [{ status = "sluggish", chance = 30, severity = 1 }]
# Its gaze turns flesh to stone (the dread design §5.2): whoever sees it averts their eyes by
# reflex (`averted`: Averted, a fight at -4), and it still finds a glance one time in four;
# caught, a Toughness check against 12 + level / 5, or a degree of Stiffening. Four degrees are
# stone, and what it stoned stands about as statues.
[creature.gaze]
range = 6
averted = true
glance = 25
riders = [
    { status = "stiffening", chance = 100, severity = 1, check = "toughness", difficulty = 15 },
]
