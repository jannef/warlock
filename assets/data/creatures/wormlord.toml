# The undead roster (#383, batch 5). A corpse become a living nest, its flesh heaving with green
# worms that answer to it: a caster (its spells announced until magic is designed) whose touch
# sends them burrowing into the living. Caught, burrowing worms are quick and may kill; a temple's
# cure, or a root that cures disease, ends them. It sheds grave worms while it fights, six at most
# (a summoning at no cost), and more crawl out of it when it dies (`dies_into`). Not yet in any
# dungeon's population.
[[creature]]
id = "wormlord"
level = 47
xp = 245
rarity = "rare"
dread = true
name = "wormlord"
first_sight = "A wormlord. The worms are his, and they are hungry."
glyph = "z"
fg = "#70c040"
speed = 700
faction = "undead"
tags = ["undead", "caster", "summoner"]
alignment = "evil"
vision = "darkvision"
sight = 10
combat = "caster"
range = 8
spells = ["fear", "leech", "blight"]
mana = 90
opens_doors = true
footsteps = 70
hearing = 10
weight = 72000
stats = { strength = 27, dexterity = 22, toughness = 31, intelligence = 33, willpower = 36, presence = 33 }
base_hp = 59
skills = { concentration = 151, spellcraft = 156 }
natural = { defence = 3, protection = 4, name = "dead flesh" }
immune = ["poison"]
dies_into = { creatures = ["grave_worm"], count = "3d6", spread = 2 }
on_eat = { message = "It is all moving inside.", vomit = 90, harm = "1d6", train = { intelligence = 0, willpower = 0 } }
blood = "#3a4020"
[creature.summon]
creatures = ["grave_worm"]
count = "1d2"
cooldown = 30
most = 6
spread = 1
verb = "sheds"
[creature.attack]
damage = "4d8"
damage_type = "piercing"
name = "touch"
verb = "touches"
to_hit = 6
on_hit = [
    { disease = "burrowing_worms", chance = 35 },
]
