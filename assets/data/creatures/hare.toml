# The beasts (docs/dev/creatures/beasts.md; content::beast_roster_tests checks them): the
# witch's hare, *hara* (#929; docs/design/witch-familiar.md §6), the fast one, the shape the old
# tales give the witch herself. A familiar's kind (familiars.toml), called, never tamed.
# Wildlife: it fights no one unless it is someone's.
[[creature]]
id = "hare"
level = 1
xp = 15
name = "hare"
glyph = "r"
fg = "#a8906a"
speed = 1600
faction = "wildlife"
tags = ["beast"]
alignment = "neutral"
vision = "low_light"
sight = 9
footsteps = 20
hearing = 4
weight = 3500
size = "small"
stats = { strength = 4, dexterity = 17, toughness = 4, intelligence = 2, willpower = 10, presence = 5 }
depart = "bounds away into the dark"
on_eat = { message = "Lean, gamey meat. It sits well." }
[creature.attack]
damage = "1d2"
damage_type = "bludgeoning"
name = "kick"
verb = "kicks"

# A pelt: fur, besides its tags' rows (material drops, data/drops/README.toml).
[[creature.drops]]
material = "fur"
count = "1"
chance = 50
