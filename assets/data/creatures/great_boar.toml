# The beasts (docs/dev/creatures/beasts.md; content::beast_roster_tests checks them): the boar
# that killed two hounds and a huntsman, a rare starting companion for any race (#916). Huge,
# thick-hided, and the loudest feet in the wood. Wildlife: it fights no one unless it is someone's.
[[creature]]
id = "great_boar"
level = 6
xp = 40
name = "great boar"
glyph = "q"
fg = "#5a4028"
speed = 1100
faction = "wildlife"
tags = ["beast"]
alignment = "neutral"
vision = "low_light"
sight = 8
footsteps = 70
hearing = 12
weight = 200000
stats = { strength = 19, dexterity = 11, toughness = 17, intelligence = 2, willpower = 12, presence = 5 }
base_hp = 13
natural = { defence = 2, protection = 0, name = "thick hide" }
tameable = true
nose = 6
depart = "crashes away through the brush"
on_eat = { message = "Wild pork, a great deal of it.", satiation = 1200, heal = "1d4" }
[creature.attack]
damage = "2d6"
damage_type = "piercing"
name = "tusks"
verb = "gores"
to_hit = 1

# Tusks and antlers: horn, besides its tags' rows (material drops, data/drops/README.toml).
[[creature.drops]]
material = "horn"
count = "1"
chance = 50
