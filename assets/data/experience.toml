# Experience (spec §8 "Experience"): the player's levels and what a kill is worth. XP numbers and
# the level are shown (ADOM-like); nothing else here is.
#
# Thresholds, in kills (the [kills] table): with m = n − 1, a level n costs
# k(n) = plateau × m ÷ (m + ramp) + slope_per_100 ÷ 100 × m kills of the player's own level, each
# worth the creature XP guideline, per_level × n + base. That level's XP is k(n) × guideline(n),
# times the level's early discount (the [early] table: percent[0] for level 2, percent[1] for
# level 3, ...; 100 % after the list; values 1 to 100, never decreasing), rounded once, and the
# XP total needed to reach level n is the sum of those for levels 2 to n. With 213, 5, and 285
# and the discount below: 10 kills for level 2 (192 XP; 38 and 767 undiscounted), 146 for level
# 10 (29 715 XP in all), 365 for level 60 (2 845 856 XP in all); about 2 600 kills of your own
# level to reach level 20 and 14 600 to reach level 60. From level 12 on every level costs what
# it would without the discount, so later totals are 15 892 XP lower. The first term ramps
# quickly toward a plateau, the second keeps every level costlier than the last. A character's thresholds are these times their race's and their
# class's `experience` percents (races.toml, classes/), rounded: an elf wizard needs 175 %,
# a half-orc commoner 72 %. max_level is the cap; XP beyond it still counts but buys nothing.
#
# Hit points: each level gained up to hp_level (inclusive) adds max(1, class hp ÷ 2 + the
# Toughness modifier) to the maximum, and the same to the current hit points. No runaway pools.
#
# Mana: each level gained up to mana_level (inclusive; default 0, none) adds max(0, class mana ÷ 2
# + the better of the Intelligence and Willpower modifiers) to the maximum, and the same to the
# current mana. It runs past hp_level, so casters keep growing after hit points stop.
#
# Scaling (classic World of Warcraft), for the player's own kills. A monster above the player is
# worth bonus_percent more per level of difference, up to bonus_levels levels. A monster below
# gives xp × (1 − difference ÷ ZD): the "zero difference" ZD grows with the player's level, and at
# a difference of ZD or more (a grey monster) the kill gives nothing. Any other kill gives at
# least 1.
#
# Discovery (the [discovery] table; optional, none without it): the player's first kill of each
# creature type gives first_kill percent of the type's XP once more, whatever their levels ("You
# learn something of kobolds."), and their first arrival on a level gives arrival × the level's
# item level (a dungeon level's depth; a hand-made level's `item_level`, default 1). The level a
# run starts on, the overworld, and its local areas give none. Neither draws anything at random.
#
# Levels (the [levels] table; spec §8 "Talents"): every talent_every-th level (3: levels 3, 6,
# 9, ...) brings a talent pick (talents.toml), chosen on the spot: nothing is banked. 0, or no
# table: never. A character the player chose (New run, `--character`) takes creation_talents
# picks at creation (a class may add more: classes/), on the creation Talents step or at random.

max_level = 60
hp_level = 20
mana_level = 60
bonus_percent = 5
bonus_levels = 4

# The curve in kills of the player's own level, and the creature XP guideline that turns kills
# into XP (new creatures should be worth about guideline XP at their level).
[kills]
plateau = 213
ramp = 5
slope_per_100 = 285
guideline = { per_level = 5, base = 10 }

# The early levels go faster (owner 2026-10-27): the percent of its curve XP each level from 2 on
# costs, here levels 2 to 11; level 12 and later pay 100 %.
[early]
percent = [25, 30, 35, 40, 50, 60, 70, 80, 90, 95]

[discovery]
first_kill = 100
arrival = 5

[levels]
talent_every = 3
creation_talents = 2

# ZD from each player level on, in order.
[[zero_difference]]
from = 1
zd = 5

[[zero_difference]]
from = 8
zd = 6

[[zero_difference]]
from = 10
zd = 7

[[zero_difference]]
from = 12
zd = 8

