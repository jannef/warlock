# Vault of the Ascmearc: the burning hoard, the lair of Nīðdraca the Hate-Wyrm, Grundlēas's tenth
# layer boss and its deepest (#1122; spec §7 "The endless branch"). The bottom of the hills: a
# long hall whose corners are pools of fire, a hoard heaped down its middle, and the wyrm coiled
# on it before the way down. The hall is long, so its fire reaches far. Grundlēas's boss row for
# its hundredth floor names it, so it is stamped there, for certain, until the wyrm is slain, and
# nowhere else. Its `>` is the floor's only way down: laid as plain floor, it opens when the wyrm
# dies (`world/levels/layer_boss.rs`).
name = "The burning hoard"
dungeons = ["grundleas"]
map = '''
#########################
#LLL....$.$.$.$.....LLLL#
#LL...$.$.$.$.$.$....LLL#
+.......$.$.D.$.$...>...#
#LL...$.$.$.r.$.$....LLL#
#LLL....$.$.$.$.....LLLL#
#########################
'''

[legend]
"L" = "lava"
# The Hate-Wyrm on its hoard: it wakes to what it sees or hears.
"D" = { terrain = "floor", creature = "nithdraca" }
"$" = { terrain = "floor", objects = ["gold_coin*200"] }
# The hoard's best, rolled when the level is made.
"r" = { terrain = "floor", loot = "rare" }
