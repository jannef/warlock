# Vault of the Ascmearc: the web-hall, the lair of Āttorcoppe the Spinner, Grundlēas's second
# layer boss (#1118; spec §7 "The endless branch"). A dark hall with no light in it, pillars hung
# with silk, the husks of those who came before her wrapped and hung among them, and the Spinner
# waiting at the far end, by the way down. Grundlēas's boss row for its twentieth floor names it,
# so it is stamped there, for certain, until she is slain, and nowhere else. Its `>` is the
# floor's only way down: laid as plain floor, it opens when she dies (`world/levels/layer_boss.rs`).
name = "The web-hall"
dungeons = ["grundleas"]
map = '''
#######################
#b.s.#....b....#.s..b.#
#....#.o.....o.#......#
+..s.....b.s.......S>.#
#....#.o.....r.#......#
#b.s.#....b....#.s..b.#
#######################
'''

[legend]
# The Spinner, lurking in the dark by the way down.
"S" = { terrain = "floor", creature = "attorcoppe" }
# Her brood, lurking too.
"s" = { terrain = "floor", creature = "barrow_spider" }
# The husks of those who came before.
"b" = { terrain = "floor", objects = ["bones"] }
# What they carried, rolled when the level is made.
"o" = { terrain = "floor", loot = "any" }
"r" = { terrain = "floor", loot = "rare" }
