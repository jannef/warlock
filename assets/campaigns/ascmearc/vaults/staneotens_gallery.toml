# Vault of the Ascmearc: the giant's gallery, the lair of Stānēoten the Hurler, Grundlēas's
# seventh layer boss (#1122; spec §7 "The endless branch"). A long low gallery the giants cut,
# its roof half fallen: boulders lie along it, rubble between them, and the Hurler waits at its
# far end before the way down with a hoard of the old builders' gold. The boulders are the fight:
# he hurls whenever he has a line, so whoever comes runs from one fallen stone to the next.
# Grundlēas's boss row for its seventieth floor names it, so it is stamped there, for certain,
# until he is slain, and nowhere else. Its `>` is the floor's only way down: laid as plain floor,
# it opens when he dies (`world/levels/layer_boss.rs`).
name = "The giant's gallery"
dungeons = ["grundleas"]
map = '''
#########################
#...B......,....B.....$.#
+.......B....B....,..H>.#
#...B......,....B.....o.#
#########################
'''

[legend]
"B" = "boulder"
"," = "rubble"
# The Hurler at the gallery's end: he wakes to what he sees or hears.
"H" = { terrain = "floor", creature = "staneoten" }
"$" = { terrain = "floor", objects = ["gold_coin*300"] }
# The builders' hoard, rolled when the level is made.
"o" = { terrain = "floor", loot = "rare" }
