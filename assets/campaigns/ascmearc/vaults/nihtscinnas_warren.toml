# Vault of the Ascmearc: the hollow warren, the lair of Nihtscinna the Hollow, Grundlēas's eighth
# layer boss (#1122; spec §7 "The endless branch"). A warren of short thin walls, no two in a
# line, unlit, and the Hollow waiting by the way down at its far end. The walls are the fight: it
# walks through them and waits in them, so whoever comes is never more than a step from the stone
# it comes out of. Grundlēas's boss row for its eightieth floor names it, so it is stamped there,
# for certain, until it is slain, and nowhere else. Its `>` is the floor's only way down: laid as
# plain floor, it opens when it dies (`world/layer_boss.rs`).
name = "The hollow warren"
dungeons = ["grundleas"]
map = '''
#########################
#...#...#...#...#...#...#
#.#...#...#...#...#..N>.#
+.#.#.#.#.#.#.#.#.#.#...#
#...#...#...#...#...#.o.#
#.#...#...#...#...#.....#
#########################
'''

[legend]
# The Hollow, waiting for what passes: it wakes to what it sees or hears.
"N" = { terrain = "floor", creature = "nihtscinna" }
# What the lost carried, rolled when the level is made.
"o" = { terrain = "floor", loot = "rare" }
