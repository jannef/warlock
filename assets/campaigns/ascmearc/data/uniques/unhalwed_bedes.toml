# Brother Osrick's rosary (docs/design/adventurers-guild.md §9.2; Middle English, "unhallowed
# prayer beads"): a caster who puts the lantern out, unseen, unlit, with spells from the dark.
[[unique]]
id = "unhalwed_bedes"
name = "The Unhalwed Bedes"
object = "bone_amulet"
affixes = ["mystic:3", "of_clarity:3", "of_the_owl:2", "of_shadows:2"]
level = 12
power = { vision = "darkvision", phrase = "Its wearer sees in the dark." }
lore = "Each bead is a knucklebone, and none of them a saint's."
