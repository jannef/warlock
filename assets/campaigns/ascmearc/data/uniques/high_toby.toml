# Black Wystan's long bow (docs/design/adventurers-guild.md §9.2; thieves' cant, "the high
# toby": robbery on the highway): shoot, and the foe breaks and runs; shoot it again as it comes
# back. Control at range, not damage.
[[unique]]
id = "high_toby"
name = "High Toby"
object = "long_bow"
affixes = ["hunters:3", "steady:3", "of_precision:2"]
level = 12
power = { inflict = "frightened", chance = 25, severity = 1, phrase = "Its arrows put fear in what they strike." }
lore = "Many a coach has stopped for it, and many a coachman run."
