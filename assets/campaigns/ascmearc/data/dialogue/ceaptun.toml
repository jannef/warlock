# The people of Cēaptūn, the market town (docs/design/campaign.md §6; the fields:
# data/dialogue.toml): the townsfolk (the `villager` type), and the town's unique characters,
# each placed by the town's legend with `npc = "..."` and known by a proper `name`: Sister Hild of
# the Mynster (who cures and mends for gold, §6.1), Godgifu of the Gæsthūs (rumours of the march,
# never a reveal: decision 2026-10-25, question 9), Reeve Leofric, Factor Wulfrun (who
# identifies what the player carries for gold, #432), and Wat One-Eye of the Gildhalle, the
# guildmaster of the Weyfarers' Gilde (docs/design/adventurers-guild.md §4). Their
# quests are in data/quests/ (§6.2).

# The townsfolk: one-liners and mutters, no topics.
[[dialogue]]
creature = "villager"
greet = "Market day, stranger. Mind yer purse in the crowd, innit."
greet_evil = [
    "Keep walkin'. We know yer sort 'ere.",
    "Go on, then. Nobody 'ere wants trouble.",
]
lines = [
    "Came down through the pass, did yer? Nobody goes back that way.",
    "Snow on Beorggeat already. Early, this year, ain't it.",
    "Fyrbeorg's smokin' again. Ash on the washin' by noon.",
    "Poorly? Sister Hild'll see to yer, at the Mynster. For a price.",
    "Found summat odd? Wulfrun'll tell yer what it is. For a fee, mind.",
    "Godgifu keeps a good fire at the Gæsthūs, and a better ale.",
    "Don't go pokin' at the barrows. The dead keep what's theirs.",
    "The reeve's a fair man. Tight wiv the town's coin, mind.",
    "Bread's dear since the mines closed. Everyfink's dear.",
]
mutter = { chance = 2, lines = [
    "Ash in the well again.",
    "Who'd pay that for an onion, eh?",
    "My knees say snow.",
    "Lights on the barrows last night. Saw 'em meself.",
    "Cart's late. Cart's always late.",
] }

# Sister Hild of the Mynster, Cēaptūn's temple: she heals, for gold.
[[dialogue]]
npc = "hild"
name = "Sister Hild"
greet = "Peace on you. The Mynster's door is open to all who come in peace."
greet_evil = [
    "There is blood on you. Pray first, then come back to me.",
    "Even you may be healed, in time. Not today.",
]
lines = [
    "Rest here as long as you need. Nothing hostile crosses this floor.",
    "The fen minster was our mother house, before the water took it.",
    "Pray when you can. Eat when you must. Sleep when it is dark.",
    "A fever caught in the fen is no shame. Leaving it be is.",
    "The Mynster asks gold for its cures. The roof does not mend itself.",
    "Bring me no dead man's silver unless it was given freely.",
]
mutter = { chance = 2, verb = "prays", lines = [
    "...and keep us from the cold places...",
    "...lighten our darkness...",
    "...and the ash, and the fire under the hill...",
] }

[[dialogue.topic]]
id = "mynster"
name = "The Mynster"
reply = "The Mynster is older than the town wall. Sisters have kept it since the fen minster sent us here, before the water rose over our mother house. We heal, we bury, and we pray for those who go under the hills. Rest on its floor: wounds close faster here."

[[dialogue.topic]]
id = "fen"
name = "The mother house"
reply = "Fennmynster stood in Micelfenn, the great fen, long ago. The water came up its steps a little more each year, until no one could keep it. What is left of it lies somewhere under the reeds. I would not go looking for it alone."

[[dialogue.service]]
id = "cure"
name = "A cure for what ails you"
price = 60
does = "cure"
reply = "Go in health, child. And keep out of the fen."
nothing = "Nothing ails you, child."

[[dialogue.service]]
id = "mend"
name = "A mending of body"
price = 40
does = "mend"
reply = "There. Whole again, as you were made."
nothing = "You are whole, child. Go with my blessing."

# Godgifu, the innkeeper of the Gæsthūs: rumours of the march. She knows what the quest-givers
# know, in her own words, and marks nothing on anyone's map.
[[dialogue]]
npc = "godgifu"
name = "Godgifu"
greet = "Come in out o' the cold, love! Sit by the fire. Want news, I s'pose?"
greet_evil = [
    "I'll serve yer, since I must. Drink up and hop it.",
    "No room for yer sort tonight. Nor any night.",
]
lines = [
    "Everyone passes through the Gæsthūs sooner or later. Everyone talks.",
    "Bread on the table's free to travellers. The ale ain't.",
    "The carters say the river road's flooded past Fennhām again.",
    "Keep yer boots by the fire. Nobody nicks boots 'ere. Mostly.",
    "The reeve drinks 'ere on market days. Pays, too, more than some do.",
    "Wulfrun's had no ore cart in years, yet she keeps the books.",
]
mutter = { chance = 2, verb = "hums", lines = [
    "Down by the water, under the 'ill...",
    "The fire wants wood. Fire always wants wood.",
    "Two loaves, three... who nicked the third?",
] }

[[dialogue.topic]]
id = "barrows"
name = "The barrows"
reply = "East along the road, the downs are full of them: Hlāwdūn, the barrow downs. The big one, Cealdhlāw, you can see from the road. Shepherds won't graze near it. Lights at night, and cold air breathing out of the ground. The reeve worries about it more than he says."

[[dialogue.topic]]
id = "marsh"
name = "The marsh"
reply = "South and east the land goes soft: Micelfenn, the great fen, where Blæcwæter runs out to the sea. Fevers, mostly, and worse things in the reeds. There was a minster out there once. Sister Hild could tell you more, if she's a mind to."

[[dialogue.topic]]
id = "mines"
name = "The mines"
reply = "Cēaptūn grew rich on ore from the hills under Fyrbeorg, in my grandmother's day. Then the diggings went quiet, and the men who went to see why didn't come back. Wulfrun still keeps the ledgers. Ask her, but don't ask her when she's counting."

[[dialogue.topic]]
id = "volcano"
name = "The volcano"
reply = "Fyrbeorg, the fire mountain, smokes over the north-east of the march, and has since before anyone remembers. That's where the ash comes from: grey on the snow, grey in the river. The old folk say the things under the hills answer to it. I say shut the window."

[[dialogue.topic]]
id = "pass"
name = "The pass"
reply = "Beorggeat, the mountain gate. You came down it, I expect, like everyone. It closes with the first snow and doesn't open till the thaw, and this year the snow came early. You're one of us now, for the winter at least. Welcome."

# Reeve Leofric: the town's peace and its coin.
[[dialogue]]
npc = "leofric"
name = "Reeve Leofric"
greet = "A newcomer. I am the reeve here. Keep the peace, and we shall get on."
greet_evil = [
    "I know trouble when I see it. Keep the peace, or kindly leave.",
    "One wrong step in my town and you will hang on the hill.",
]
lines = [
    "The town pays its way. The barrows, alas, take their toll.",
    "Kindly keep your blade sheathed in the square. That is the law.",
    "The pass is shut till spring. Whoever's here, stays here.",
    "We had more hands once. The barrows took some. The mines took more.",
    "Market day's the only day the town feels like itself.",
]

[[dialogue.topic]]
id = "town"
name = "Cēaptūn"
reply = "Cēaptūn, the market town. The pass road meets the river roads here, so we trade: wool, ore when there was any, whatever comes over the mountains. A store, a forge, an armourer, the provisioner, the Mynster, and Godgifu's inn. And a wall on the pass side."

[[dialogue.topic]]
id = "barrow"
name = "Cealdhlāw"
reply = "The cold barrow, east along the road in the downs. Old as the hills, and the dead in it don't lie quiet. Things come up out of it at night now, more each year. One day I'll need someone to go down there and see why."

# Factor Wulfrun: the old mines and their trade.
[[dialogue]]
npc = "wulfrun"
name = "Factor Wulfrun"
greet = "Yes? I am frightfully busy. Well, no, but I like to look it."
lines = [
    "Ore by the cartload, once. Now I keep ledgers of carts that never came.",
    "Every mine has its foreman, and every foreman his ledger.",
    "Gold is gold, but iron builds towns.",
    "The diggings didn't run dry. Something stopped the digging.",
    "One does not trust a map one did not pay for.",
    "I can value anything, given a moment and a fee. Chiefly the fee.",
]
mutter = { chance = 2, lines = [
    "Twelve carts... no, eleven...",
    "Where did I put that ledger?",
] }

[[dialogue.topic]]
id = "diggings"
name = "The old diggings"
reply = "The mines lay in the hills under Fyrbeorg, east past the ford. Deep galleries, good iron, and silver now and then. Then the shafts went quiet. The men who went to see what happened never came back, and nobody has gone since."

[[dialogue.topic]]
id = "trade"
name = "Trade"
reply = "The town lives off the road: what comes over the pass, what comes up the river, what we dig. With the pass shut and the mines dead, there's just the river. Sell to the shops on the square. They pay poorly, but they pay."

[[dialogue.topic]]
id = "appraisal"
name = "Appraisals"
reply = "I can tell a charmed blade from a plain one, and read the scrawl on a scroll. A hundred gold for each article you don't know; a bundle of the same thing counts as one, however many are in it. And I look at everything you carry, or nothing. I don't do halves."

[[dialogue.service]]
id = "identify"
name = "An appraisal of your goods"
price = 100
does = "identify"
reply = "There. Entered and accounted for. Now you know what you're carrying, which is more than most."
nothing = "You know everything you carry already. I shan't charge you for telling you so."

# Wat One-Eye, guildmaster of the Weyfarers' Gilde, in the Gildhalle (docs/design/adventurers-
# guild.md §4.2): a commoner, in Cockney. His chain's quests are his topics, one at a time
# (data/quests/wat.toml). He is neutral (creatures/guildmaster.toml), so he scorns no one and
# gives the chain to anyone, good or wicked: "the board don't care whose 'ands are dirty".
[[dialogue]]
npc = "wat"
name = "Wat One-Eye"
greet = "'Nother one off the pass? Sit if you like. Standin' costs the same."
lines = [
    "Forty year I went down 'oles for coin. Knees went first, then the nerve.",
    "Lost this eye in the barrow. Don't go lookin', it's 'ad a long day.",
    "Half them bills is for beasts long dead. I keep 'em up for the company.",
    "Town calls us when summat eats the sheep, an' crosses the road after.",
    "Cealdhlāw's woke again. Lights on the downs, same as when I was a lad.",
]

[[dialogue.topic]]
id = "guild"
name = "The Gilde"
reply = "We does the work the reeve can't pay for an' the sisters won't touch. Do a job, come back, get paid. Everyone starts Tin. Do enough an' you're Pewter, then Iron, an' folk stop callin' you 'oi, you'."

[[dialogue.topic]]
id = "board"
name = "The board"
reply = "Bills three deep, an' most of 'em older than you. There's always a job on it, mind. Ask me an' I'll tell you the next."
