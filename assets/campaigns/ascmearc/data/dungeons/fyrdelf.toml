# Fyrdelf, "the fire delving" (docs/design/campaign.md §7.1; the fields: data/dungeons.toml): the
# duergar's mine under the hills of Ascdūn, below the volcano, the deepest of the Ascmearc's
# first dungeons. Its way in on the overworld is hidden until a quest reveals it. Four levels of
# galleries, then eight of the deep workings, hotter the deeper they go, and the fire drake's
# hoard at the bottom.

[[dungeon]]
id = "fyrdelf"
name = "Fyrdelf"
arrival = "The galleries smell of sulphur."
generator = "rooms"
depth = 12
size = [80, 21]
traps = ["arrow", "spear", "fireball", "lightning_bolt", "alarm"]
# Few secret doors (the duergar dig, they do not hide), hidden things harder to find deeper down,
# and the hardest locks of the three dungeons.
secret_doors = [0, 2]
hidden_per_depth = 1
locks_per_depth = 2
loot = [3, 5]
key = "brass_key"
temperature = 10
# Danger 5 on the first floor to 16 on the twelfth (spec §7 "Danger levels"; squished from 8 to 19,
# #534); nothing scales with the player. The delf wave (with the lesser fire and the earth
# elemental, #453), and the bats, kobolds, and centipedes of the upper galleries that the shallow
# floors draw on most, the lesser demons the volcano's heart lets up (the dretch and the quasit,
# #449), the hell hound (#450), a fiend at home in the fires, and the war bands that raid the
# duergar's mine: the orcs' (#455) and the hobgoblins' (#454), who come down with the goblins'
# ogres and trolls. The fire drake is not among them: it lives only on its hoard (the vault at
# depth 12), so a run meets it there and nowhere else. Its ogres (the ogre and the mauler) are the
# giant tribe's least (#457); the giants live deeper than this.
# The hill trolls (#456) come down from the hills above to the troll's warm deep. The duergar
# smiths' work wakes: blades that dance alone (#485, the family `animated_blade`) and suits of
# armour with nobody inside (#486, `animated_armour`, level 12 and more: out of depth at first).
# The rest of the duergar (#518) hold their own mine: the slinger, the crossbowman, and the
# veteran. Types of level 17 (the veteran, the orc bowman, the rotting troll, the cinder
# elemental) come only out of depth, at the bottom; those above (the duergar priest and hulk, the
# ogre mage, the hobgoblin captain, the orc war chief) wait for deeper places, so no bounty names
# what next to never comes here.
danger = 5
population = [
    "bat", "kobold", "kobold_archer", "kobold_shaman", "giant_centipede",
    "ember_beetle", "duergar_miner", "ogre_zombie", "lesser_fire_elemental", "grave_hound",
    "dretch", "duergar_warrior", "duergar_smith", "ogre", "burning_skull", "quasit", "troll",
    "earth_elemental", "knocker", "hell_hound", "hill_troll", "fire_salamander",
    "magma_crawler", "spectre", "charred_dead", "ash_wraith", "duergar_skeleton",
    "duergar_slinger", "duergar_crossbowman", "duergar_veteran",
    "ogre_mauler", "basilisk", "cinder_elemental", "rotting_troll",
    "hobgoblin", "hobgoblin_archer", "hobgoblin_legionnaire", "hobgoblin_warcaster",
    "hobgoblin_sergeant",
    "warg", "orc_raider", "orc_shaman", "orc_berserker", "orc_veteran", "orc_bowman",
    "animated_blade", "animated_armour",
    # The rosters placed (#531), those of level 17 and less (the danger runs 5 to 16, #534): the
    # elementals of stone, fire, air, water, and lightning the mine digs into (the motes are the
    # shallow galleries' filler, as the bats are), the devils the demons' fires draw up, the
    # goblin wizard with the war bands (a rare deep threat), the meenlock in the dark, and the dead
    # that walk the deep workings. The types of level 18 and more (the necromancer, the forest
    # troll, the hill giant, the bearded devil, the air elemental, the bone wyvern, the gibbering
    # shade, the fetch, the revenant, the mummy priest) wait for deeper places.
    "stone_mote", "ember_mote", "dust_devil", "lesser_earth_elemental", "spark_mote",
    "lesser_air_elemental", "water_elemental", "lesser_lightning_elemental",
    "lemure", "imp", "goblin_wizard", "meenlock",
    "draugr", "barghest", "hand_of_glory", "vampire_spawn", "gallows_dead",
]
# How many: the default, 35 a thousand walkable cells, 25 to 80. A gallery floor (about 350 cells)
# gets the least, 25, as Cealdhlāw's passages do; the deep workings (about 3 000) the ceiling, 80.

# The duergar traders (spec §7 "Shops"): every gallery floor with a fitting room has a general
# store kept by a duergar. Shops stand on rooms levels only, so the deep workings have none.
shops = { chance = 100, kinds = ["general_store"], keeper = "duergar_trader", names = [
    "Bardek", "Drekmar", "Gorvin", "Holgrak", "Murgrim", "Skorvald",
    "Baldra", "Dregga", "Gunnra", "Hulda", "Krella", "Orna",
] }

# The galleries: each has its foreman's cabin.
[[dungeon.levels]]
from = 1
to = 4
vaults = ["foremans_cabin"]

# The deep workings: caverns, warmer with every level nearer the volcano's heart.
[[dungeon.levels]]
from = 5
to = 8
generator = "caves"
size = [120, 60]
temperature = 16

[[dungeon.levels]]
from = 9
to = 11
generator = "caves"
size = [120, 60]
temperature = 20

# The bottom: the fire drake on its hoard.
[[dungeon.levels]]
from = 12
generator = "caves"
size = [120, 60]
temperature = 24
vaults = ["drakes_hoard"]
