# Cealdhlāw, "the cold barrow" (docs/design/campaign.md §7.1; the fields: data/dungeons.toml): the
# first dungeon of the Ascmearc, under Hlāwdūn east of Cēaptūn, its way in on the overworld from
# the start. Two levels of the barrow's passages, then four of the hill's hollows.

[[dungeon]]
id = "cealdhlaw"
name = "Cealdhlāw"
arrival = "Cold air breathes up from the mound."
generator = "rooms"
depth = 6
size = [80, 21]
traps = ["arrow", "spear", "pit", "alarm"]
# As the Depths: a secret door or two a rooms level, hidden things and locks harder deeper down.
secret_doors = [1, 2]
hidden_per_depth = 1
locks_per_depth = 1
loot = [2, 4]
key = "rusty_key"
# Cold, as a barrow is.
temperature = 8
# Danger 1 on the first floor to 6 on the sixth (spec §7 "Danger levels"); nothing scales with
# the player. The barrow wave, and the vermin and kobolds that were there first; in the hill's
# hollows an orc war band (#455) camps beside the goblins.
danger = 1
population = [
    "rat", "bat", "beetle", "kobold", "kobold_archer", "kobold_shaman",
    "grave_worm", "crawling_hand", "skeletal_rat", "barrow_spider", "kobold_zombie", "goblin",
    "goblin_archer", "skeleton", "zombie", "giant_centipede", "barrow_ghoul", "skeleton_archer",
    "goblin_chief", "skeletal_wolf", "barrow_wight", "skeleton_warrior",
    "orc_runt", "orc_warrior", "orc_archer", "warg",
]
# 30 a thousand walkable cells: the least, 25, on the barrow's passages (about 350 cells), about
# 70 in the hollows (about 2 300), as the design's population table has them.
population_count = { per_1000 = 30, least = 25, most = 80 }

# The barrow's heart: the barrow chamber, with the silver chalice on its plinth (Sister Hild's
# "Grave goods"), on the second floor for certain.
[[dungeon.levels]]
from = 2
vaults = ["barrow_chamber"]

# The hill's hollows: caverns below the barrow.
[[dungeon.levels]]
from = 3
to = 6
generator = "caves"
size = [100, 40]
