# Fennmynster, "the fen minster" (docs/design/campaign.md §7.1; the fields: data/dungeons.toml):
# the cellars and crypts of the drowned minster in Micelfenn, the second of the Ascmearc's first
# dungeons. Its way in on the overworld is hidden until a quest reveals it. Eight levels of
# cellars, many rooms of them under water, and the sunken crypt at the bottom.

[[dungeon]]
id = "fennmynster"
name = "Fennmynster"
arrival = "The water is up to the third step."
generator = "rooms"
depth = 8
size = [80, 21]
traps = ["pit", "frost", "alarm", "teleport"]
# The monks hid their stores: more secret doors than the other dungeons, hidden things one harder
# to find each level down, and locks one harder a level.
secret_doors = [1, 3]
hidden_per_depth = 1
locks_per_depth = 1
loot = [2, 4]
key = "iron_key"
# The marsh is mild: its water freezes nowhere.
temperature = 6
# Danger 3 on the first floor to 10 on the eighth (spec §7 "Danger levels"; squished from 4 to 11,
# #534); nothing scales with the player. The fen wave: the marsh's beasts and things, the
# minster's drowned dead, and the cult that came to them (the bog hag, unique, comes once a run).
# Its types of level 11 (the fen ghoul, the wraith, the bog hag) come only out of depth, at the
# bottom. Fey of damp and dark places (#452) haunt its cellars too: the pixie, the boggle, and the
# darkling, each of either court. The drowned church's candlesticks, books, and lanterns stir too
# (#483: animated objects).
danger = 3
population = [
    "corpse_candle", "giant_leech", "giant_frog", "pixie", "drowned", "crocodile", "cultist",
    "lesser_water_elemental", "poltergeist", "will_o_wisp", "boggle", "ghast", "ghost", "shadow",
    "mud_golem", "cult_priest", "darkling", "marsh_troll", "bog_body", "wraith", "fen_ghoul",
    "bog_hag",
    "animated_candlestick", "animated_book", "animated_lantern", "animated_rug",
]
# How many: the default, 35 a thousand walkable cells, 25 to 80 (a cellar floor of about 350
# cells gets the least, 25).

# The fen seeps in (spec §7 "Special rooms"): a room is special one time in four, at most two a
# level; water, hush, and shadow most of the time, the dead often, and the rest whatever any
# dungeon may hold. Never a sweltering chamber. (The design's ban on forges comes with them.)
room_effects = { chance = 25, per_level = 2, favoured = { flooded = 35, cursed = 15, hushed = 15, shadowed = 15 }, banned = ["hot"] }
# No one trades in the drowned minster (spec §7 "Shops").
shops = { chance = 0 }

# The bottom: the sunken crypt, where the minster kept what the water keeps now.
[[dungeon.levels]]
from = 8
vaults = ["sunken_crypt"]
