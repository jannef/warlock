# Grundlēas, "the groundless" (#1010; spec §7 "The endless branch"): steps going down in the empty
# grass south of the Beorhtburna road, open to anyone who walks there. It has no last floor. Every
# staircase, up or down, leads to a floor that has never been: what is left behind is gone, so
# twenty floors down is twenty new floors back up.

[[dungeon]]
id = "grundleas"
name = "Grundlēas"
arrival = "Words are cut over the stair: no stair goes twice to one place."
generator = "rooms"
size = [80, 21]
traps = ["arrow", "spear", "pit", "alarm"]
secret_doors = [1, 2]
hidden_per_depth = 1
locks_per_depth = 1
loot = [2, 4]
key = "rusty_key"
temperature = 6
# Danger 1 on the first floor, 1 more each floor down, without end. No folk of its own: every draw
# is a stray, so whatever the Ascmearc holds comes here at its danger, and past the roster's top
# level a floor draws as at that top (`Content::spawning`). The rat is only what a `danger` asks
# for; it lives everywhere already, so no other branch's strays change.
danger = 1
population = ["rat"]
stray = 100
population_count = { per_1000 = 30, least = 25, most = 80 }
# A forgotten floor keeps no trade: a shop's stock and debts would be gone at every stair.
shops = { chance = 0 }

# Rooms most of the time, caves rarely; drawn as each floor is made.
[dungeon.endless]
caves = 15
caves_size = [100, 40]
# The dread come oftener the deeper it goes (docs/design/monster-dread.md §8; the owner: "Below
# 70, keep drastically increasing dread monster chance deeper you go"): one draw in 100 above
# floor 30 (the default), 80 from 30, 60 from 50, 40 from 70, the roster's top; past it, halved
# every ten floors (30 at 75, 20 at 80, 10 at 90) down to one draw in 5 from floor 100 on.
dread = { steps = [[30, 80], [50, 60], [70, 40]], halves = 10, least = 5 }

# The layer bosses (#1118; spec §7 "The endless branch", `world/levels/layer_boss.rs`): every tenth
# floor is kept by a unique boss of its own in its lair, a vault, and the floor's only way down is
# in the lair, hidden until the boss dies. Each floor of that depth makes them again until the
# boss is slain; after that, it is an ordinary floor. Past the last row, a tenth floor is an
# ordinary floor too.
[[dungeon.endless.boss]]
depth = 10
creature = "gnaegan"
vault = "gnaegans_midden"

[[dungeon.endless.boss]]
depth = 20
creature = "attorcoppe"
vault = "attorcoppes_web"

[[dungeon.endless.boss]]
depth = 30
creature = "hrimwyrm"
vault = "hrimwyrms_bed"

[[dungeon.endless.boss]]
depth = 40
creature = "wealaf"
vault = "wealafs_hall"

[[dungeon.endless.boss]]
depth = 50
creature = "grundwyrgen"
vault = "grundwyrgens_mere"

[[dungeon.endless.boss]]
depth = 60
creature = "ligetdry"
vault = "ligetdrys_stones"

[[dungeon.endless.boss]]
depth = 70
creature = "staneoten"
vault = "staneotens_gallery"

[[dungeon.endless.boss]]
depth = 80
creature = "nihtscinna"
vault = "nihtscinnas_warren"

[[dungeon.endless.boss]]
depth = 90
creature = "waelcyrge"
vault = "waelcyrges_field"

[[dungeon.endless.boss]]
depth = 100
creature = "nithdraca"
vault = "nithdracas_hoard"
