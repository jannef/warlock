# Campaign-owned: Āttorcoppe's signature gift (docs/design/profane-gifts.md §5), given sure by its
# corpse's `on_eat.gives` and never drawn (`only`, weight 0). Its tier groups it in the wiki.
[[gift]]
id = "spinners_blood"
name = "Spinner's blood"
kind = "boon"
tier = "lesser"
weight = 0
only = "attorcoppe"
description = "Her venom runs in you now: poison troubles you little, webs slough off you, and you strike hard at the unwary."
line = "Your blood runs cold and bitter, and the dark of the hall is suddenly a comfort."
effects = [
    { kind = "resist", damage = "poison", value = 100 },
    { kind = "no_penalty", status = "webbed" },
    { kind = "status_eases", status = "webbed", value = 200 },
    { kind = "ambush", dice = "1d6" },
]
