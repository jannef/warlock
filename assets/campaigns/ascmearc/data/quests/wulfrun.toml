# Factor Wulfrun's quests (docs/design/campaign.md §6.2; the fields: data/quests.toml): the
# Fyrdelf chain. The lost shaft under Fyrbeorg, which she marks on the player's map as they take it
# up (the reveal, §8), offered only to someone who has been four levels down into Cealdhlāw
# (Fyrdelf starts deeper than that) and given only from level 5 (asked before, she says `early`),
# and what woke in its deep workings; then the letter to the deep gnomes and their answer (#1435).

[[quest]]
id = "lost_shaft"
name = "The lost shaft"
giver = "wulfrun"
requires = "barrow_heart"
min_level = 5
type = "reach"
target = "fyrdelf:2"
reward = { gold = 100, xp = 220 }
alignment = 10
reveals = { location = "fyrdelf" }
offer = "You have been down in the barrow and come back, I hear. Precisely the sort of person I have been waiting for. The old diggings are called Fyrdelf, and the shaft is on the ledgers if one knows how to read them. Go down two levels and tell me whether the galleries still stand."
accept = "Splendid. I shall mark it on your map. No road goes there: follow the river north past the ford and climb into the ash hills."
early = "The old diggings? Oh, I think not, not yet. You came back from the barrow, which is very much to your credit, but what lives under Fyrbeorg would make a short meal of you. Come and see me when you are rather more seasoned."
reminder = "Fyrdelf, two levels down. It lies in Ascdūn, in the hills under Fyrbeorg."
done = "They stand, then, and something walks them. That explains the men who never came back. Here, as agreed."
where = "The shaft lies in Ascdūn, in the hills under Fyrbeorg, north of the ford."

[[quest]]
id = "fire_deep"
name = "Fire in the deep"
giver = "wulfrun"
requires = "lost_shaft"
type = "kill"
target = "fire_drake"
level = "fyrdelf"
reward = { gold = 500, xp = 900 }
alignment = 25
offer = "The last foreman wrote it down before the ledger ends: fire in the deepest working, and something in it that moved. A drake, I'd say, under the mountain. Slay it, and the town might dig again. Slay it, and I shall pay you what the mines owe me."
accept = "It lies at the bottom of the workings, twelve levels down. Take water. Take more than you think."
reminder = "The fire drake, at the bottom of Fyrdelf."
done = "Dead? Truly? Then I shall write a new page in the ledger, the first in years. Here. The mines owe me more, but this is what I have."
where = "It lies on Fyrdelf's twelfth and lowest level."

# After the drake (#1435): with the mines open again, Wulfrun wants trade with the deep gnomes'
# gem-cutters, and sends a letter (the shared `sealed_letter`) to Headman Peran of Gimmwīc, at the
# bottom of Dēopgang. Dēopgang is open to anyone (no `reveals`: its way in is never hidden), so the
# quest only tells the way. Peran pays for the walk down with a cut stone and, once that is done,
# gives the moot's answer to carry back up: the second stage, his to give, hers to take. It lives
# here, beside the letter it answers, because a quest `requires` only those loaded before it.
[[quest]]
id = "gnome_letter"
name = "A letter for the deep"
giver = "wulfrun"
requires = "fire_deep"
type = "deliver"
target = "sealed_letter"
to = "peran"
reward = { xp = 600, items = ["gem:sapphire"] }
alignment = 10
offer = "With the drake dead the mines may dig again, and stones want cutting. The traders whisper of deep gnomes, grey folk who cut gems as nobody up here can, in a town at the bottom of the Deep Way. Carry this letter to whoever speaks for them? It proposes trade, most politely."
accept = "Splendid. The Deep Way is Dēopgang: steps cut into the foot of Grægweall, in the far south-west beyond Lindwudu. Eleven levels down, I am told. Do keep the seal unbroken."
reminder = "My letter, to whoever speaks for the deep gnomes, at the bottom of Dēopgang."
done = "A letter? From up top? Well I never. Factor Wulfrun, an' a seal an' all. Trade, she says, proper polite. The moot'll want to chew on that. 'Ere, my 'ansum, for the walk down. 'Tis a fair stone, cut in Gimmwīc."
where = "Dēopgang's steps are cut into the foot of Grægweall, in the far south-west beyond Lindwudu. Gimmwīc lies at its bottom."

[[quest]]
id = "gnome_reply"
name = "The moot's answer"
giver = "peran"
requires = "gnome_letter"
type = "deliver"
target = "sealed_letter"
to = "wulfrun"
reward = { gold = 300, xp = 300 }
alignment = 10
offer = "The moot's sat on yer Factor's letter, my 'ansum, an' sat long. 'Ere's our answer, sealed proper. Carry 'un back up to 'er, would 'ee? A stone for a sack, fair weights, an' no emmets down the Deep Way without they're asked."
accept = "Mind it don't get wet. Ink runs, an' then where's we to?"
reminder = "Our answer goes up to yer Factor Wulfrun, in the market town. Dreckly'll do. Not too dreckly, mind."
done = "From the gnomes? Sealed with a garnet, of all things. Fair weights, a stone for a sack, no visitors unasked... I can live with every word of it. The town owes you, and so do I. Here."
where = "Factor Wulfrun keeps her office in Cēaptūn."
