# Factor Wulfrun's quests (docs/design/campaign.md §6.2; the fields: data/quests.toml): the
# Fyrdelf chain. The lost shaft under Fyrbeorg, which she marks on the player's map as they take it
# up (the reveal, §8), offered only to someone who has been four levels down into Cealdhlāw
# (Fyrdelf starts deeper than that) and given only from level 5 (asked before, she says `early`),
# and what woke in its deep workings.

[[quest]]
id = "lost_shaft"
name = "The lost shaft"
giver = "wulfrun"
requires = "barrow_heart"
min_level = 5
type = "reach"
target = "fyrdelf:2"
reward = { gold = 100, xp = 220 }
alignment = 10
reveals = { location = "fyrdelf" }
offer = "You have been down in the barrow and come back, I hear. Precisely the sort of person I have been waiting for. The old diggings are called Fyrdelf, and the shaft is on the ledgers if one knows how to read them. Go down two levels and tell me whether the galleries still stand."
accept = "Splendid. I shall mark it on your map. No road goes there: follow the river north past the ford and climb into the ash hills."
early = "The old diggings? Oh, I think not, not yet. You came back from the barrow, which is very much to your credit, but what lives under Fyrbeorg would make a short meal of you. Come and see me when you are rather more seasoned."
reminder = "Fyrdelf, two levels down. It lies in Ascdūn, in the hills under Fyrbeorg."
done = "They stand, then, and something walks them. That explains the men who never came back. Here, as agreed."
where = "The shaft lies in Ascdūn, in the hills under Fyrbeorg, north of the ford."

[[quest]]
id = "fire_deep"
name = "Fire in the deep"
giver = "wulfrun"
requires = "lost_shaft"
type = "kill"
target = "fire_drake"
level = "fyrdelf"
reward = { gold = 500, xp = 900 }
alignment = 25
offer = "The last foreman wrote it down before the ledger ends: fire in the deepest working, and something in it that moved. A drake, I'd say, under the mountain. Slay it, and the town might dig again. Slay it, and I shall pay you what the mines owe me."
accept = "It lies at the bottom of the workings, twelve levels down. Take water. Take more than you think."
reminder = "The fire drake, at the bottom of Fyrdelf."
done = "Dead? Truly? Then I shall write a new page in the ledger, the first in years. Here. The mines owe me more, but this is what I have."
where = "It lies on Fyrdelf's twelfth and lowest level."
