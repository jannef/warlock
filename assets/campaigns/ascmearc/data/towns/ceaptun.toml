# Cēaptūn, the market town (levels/ceaptun.toml; spec §8 "Dialogue": "Goodwill", #1247). Every
# quest its people give that the player completes (the Weyfarers' Gilde's, Wat's, included) makes
# their services 5% cheaper, on top of any other discount, up to free (world/goodwill.rs).
#
# Fields: id, name, people (who speaks for the town: npc or creature ids, as a quest's `giver`
# names them), goodwill (percent off their services per quest of theirs completed), told (said
# as such a quest is completed).
[[town]]
id = "ceaptun"
name = "Cēaptūn"
people = ["eadric", "godgifu", "hild", "leofric", "wat", "wulfrun"]
goodwill = 5
told = "Cēaptūn's folk think the better of you."

# An aristocrat's own servant (#1405; world/stipend.rs), in an aristocrat's run only (a character
# with the Stipend class ability): a squire for a man, a chambermaid for a woman, a servant for
# anyone else (`creature`, by gender), of their own race and speaking its register (`speech`: npc
# dialogues of data/dialogue/servants.toml by race id, `default` for every race not named). They
# lodge at the Gæsthūs, by its west wall, and hand over the family's stipend when spoken to.
[town.servant]
level = "ceaptun"
at = [40, 27]
creature = { male = "squire", female = "chambermaid", other = "servant" }
speech = { default = "servant", dwarf = "servant_dwarf", duergar = "servant_dwarf", elf = "servant_elf", halfling = "servant_halfling", gnome = "servant_halfling", goblin = "servant_goblin", kobold = "servant_goblin", ratfolk = "servant_goblin", drow = "servant_drow", lizardfolk = "servant_lizardfolk" }
