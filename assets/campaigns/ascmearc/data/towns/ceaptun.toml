# Cēaptūn, the market town (levels/ceaptun.toml; spec §8 "Dialogue": "Goodwill", #1247). Every
# quest its people give that the player completes (the Weyfarers' Gilde's, Wat's, included) makes
# their services 5% cheaper, on top of any other discount, up to free (world/people/goodwill.rs).
#
# Fields: id, name, people (who speaks for the town: npc or creature ids, as a quest's `giver`
# names them), goodwill (percent off their services per quest of theirs completed), told (said
# as such a quest is completed).
[[town]]
id = "ceaptun"
name = "Cēaptūn"
people = ["eadric", "godgifu", "hild", "leofric", "wat", "wulfrun"]
goodwill = 5
told = "Cēaptūn's folk think the better of you."

# Class helpers (`[[town.servant]]`, world/classes/stipend.rs), each in the run of a character with the
# class ability `talent` only: the creature type for the player's gender (`creature`), of their
# own race and speaking its register (`speech`: npc dialogues by race id, `default` for every
# race not named), placed on cell `at` of level `level` as the town is first made.
#
# An aristocrat's own servant (#1405), for the Stipend: a squire for a man, a chambermaid for a
# woman, a servant for anyone else (data/dialogue/servants.toml). They lodge at the Gæsthūs, by
# its west wall, and hand over the family's stipend when spoken to.
[[town.servant]]
talent = "stipend"
level = "ceaptun"
at = [40, 27]
creature = { male = "squire", female = "chambermaid", other = "servant" }
speech = { default = "servant", dwarf = "servant_dwarf", duergar = "servant_dwarf", elf = "servant_elf", halfling = "servant_halfling", gnome = "servant_halfling", goblin = "servant_goblin", kobold = "servant_goblin", ratfolk = "servant_goblin", drow = "servant_drow", lizardfolk = "servant_lizardfolk" }

# A craftsperson's patron (#1421; world/crafting/patron.rs), for Patron (data/dialogue/patrons.toml): a
# well-to-do burgher lodging in the Gæsthūs's north-east corner, who commissions graded work from
# the craftsperson's trades, advances the stock, and pays in full. The class ability comes at
# level 12, so the patron is placed as the ability is given if the town is made by then.
[[town.servant]]
talent = "patron"
level = "ceaptun"
at = [50, 23]
creature = { male = "patron", female = "patron", other = "patron" }
speech = { default = "patron", dwarf = "patron_dwarf", duergar = "patron_dwarf", elf = "patron_elf", halfling = "patron_halfling", gnome = "patron_halfling", goblin = "patron_goblin", kobold = "patron_goblin", ratfolk = "patron_goblin", drow = "patron_drow", lizardfolk = "patron_lizardfolk" }

# A merchant's business partner (#1407; world/classes/invest.rs), for Invest (data/dialogue/partners.toml):
# keeps the corner desk in Factor Wulfrun's office, invests the gold put with them, and says what
# the stake is worth when spoken to. `bonus`: basis points more on every week's return for each
# quest named completed (data/rules/invest.toml has the rest): Wulfrun's Fire in the deep, the fire
# drake slain and the mines reopened.
[[town.servant]]
talent = "invest"
level = "ceaptun"
at = [75, 23]
creature = { male = "business_partner", female = "business_partner", other = "business_partner" }
speech = { default = "partner", dwarf = "partner_dwarf", duergar = "partner_dwarf", elf = "partner_elf", halfling = "partner_halfling", gnome = "partner_halfling", goblin = "partner_goblin", kobold = "partner_goblin", ratfolk = "partner_goblin", drow = "partner_drow", lizardfolk = "partner_lizardfolk" }
bonus = { fire_deep = 6 }
