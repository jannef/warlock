# Campaign-owned (docs/design/campaign.md §3.6): the Ascmearc's own type, which only its files
# may name.
#
# The pedlar (docs/design/overworld-encounters.md §8): a travelling hawker of small wares, met on
# the march's roads (the `roads` encounter table, data/encounters/roads.toml). A merchant, at
# peace with everyone (his trade is a later slice, #808). He talks: the news of the
# roads, and the ways to Cealdhlāw and the ford, which his telling marks on the player's map
# (data/dialogue/road.toml). A pack of wares on his back, a staff for the lonely stretches.
[[creature]]
id = "pedlar"
level = 3
xp = 15
name = "pedlar"
glyph = "@"
fg = "#b88a4a"
faction = "merchants"
alignment = "neutral"
race = "human"
opens_doors = true
sight = 12
footsteps = 60
hearing = 12
weight = 70000
stats = { strength = 12, dexterity = 12, toughness = 13, intelligence = 12, willpower = 12, presence = 13 }
base_hp = 10
skills = { appraise = 30, negotiation = 30 }
weapon_skills = { staves = 1 }

[[creature.gear]]
chance = 90
one_of = ["quarterstaff"]

[[creature.gear]]
chance = 75
one_of = ["travelling_cloak", "wool_cloak"]

[[creature.gear]]
chance = 70
one_of = ["candle", "rope", "pipe", "ladle", "kettle"]

[[creature.gear]]
chance = 60
one_of = ["bread", "dried_meat", "hazelnuts", "turnip", "apple"]

[[creature.gear]]
chance = 30
one_of = ["potion_of_healing", "scroll_of_light", "potion_of_antidote"]
