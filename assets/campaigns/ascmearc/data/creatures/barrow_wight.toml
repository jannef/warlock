# Campaign-owned (docs/design/campaign.md §3.6, §10.1): the barrow wight is the Ascmearc's own
# type, numbered after the shared block; only the Ascmearc's files may name it.
#
# The barrow wave (Cealdhlāw, §10.1): the barrow wight, the lord of the barrows' dead, and the
# target of the barrows' last quest. A caster (its spells announced until magic is designed),
