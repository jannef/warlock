# The fifth layer boss of Grundlēas (#1118; spec §7 "The endless branch"): Grundwyrgen (Old
# English, "the she-wolf of the deep"), the Mere-Wife, who keeps a black mere at the bottom of
# the fiftieth floor and drags down what comes to it. Once a run (`unique`), in no population:
# only her mere places her. Her fight is the grip: no breath and no calling, only strength, a
# hide that turns blades, and claws that seize and hold whoever she strikes.
