# Campaign-owned (docs/design/campaign.md §3.6): the Ascmearc's own type, which only its files
# may name.
#
# The third layer boss of Grundlēas (#1118; spec §7 "The endless branch"): Hrīmwyrm (Old English
# hrīm, rime, and wyrm), the White, a wyrm of the cold under the world, the fire drake's pale
# kin, that keeps the thirtieth floor. Once a run (`unique`), in no population: only its bed, a
# hall of ice-light, places it. A dragon (#1099, spec §8 "Creature behavior": "Dragons"): it
# breathes a long cone of frost whenever its breath is ready, and between breaths fights with
# two claws and a bite. Cold cannot hurt it; fire finds it softer.
[[creature]]
id = "hrimwyrm"
level = 31
xp = 165
xp_percent = 200
rarity = "very_rare"
loot = 100
unique = true
name = "Hrīmwyrm the White"
glyph = "D"
fg = "#dff0ff"
faction = "layer_keepers"
tags = ["dragon"]
alignment = "evil"
vision = "darkvision"
sight = 14
combat = "dragon"
glow = 0.25
footsteps = 150
hearing = 14
weight = 2500000
stats = { strength = 30, dexterity = 14, toughness = 32, intelligence = 16, willpower = 22, presence = 20 }
base_hp = 160
natural = { defence = 3, protection = 5, name = "scales" }
resist = { cold = 100, fire = -25 }
everlasting = true
on_eat = { message = "The wyrm's flesh is cold as the deep, and leaves you harder.", vomit = 20, train = { strength = 150, toughness = 150 } }
blood = "#8ab0d0"
# Its breath: about a third of a level-31 fighter's hit points to everyone in a cone ten cells
# long; then six actions of claws and bite before the next.
[creature.breath]
damage = "14d8"
damage_type = "cold"
length = 10
cooldown = 36
effect = "frost_burst"
noun = "frost"
verb = "breathes frost"
[[creature.attack]]
