# Cēaptūn, "the market town" (docs/design/campaign.md §6; spec §3): the trading town at the
# crossroads below the pass, where the mountain road meets the river roads. A hand-made outdoor
# level (sky, sun, weather; the pond and the well freeze in a hard winter), entered from its cell
# on the Ascmearc's overworld, arriving on the square (@). It has no stairs: like any outdoor area
# it is left by walking off its edge (or with `<` when no enemy is about), back to its overworld
# cell (spec §7 "Leaving an outdoor area"). Walled on the pass side (west), open to the river
# (east, Beorhtburna's mill race). Everyone here is peaceful (the townsfolk, the people, and the
# merchants), so the town is safe unless the player steals.
#
# The square: the well, two braziers, and the townsfolk (villagers, 1-6) on their rounds of the
# square, the lanes, and the main street.
#
# North of the square, two shops (spec §7 "Shops"; #1248), each a timber house with its door
# open on the lane and its goods on the plank floor (the [[shop]] and [[pile]] tables at the
# end): the general store (west; everything but arms and armour: food for the road, angelica
# root, light, tools, potions, scrolls, and cloaks) and the smithy (arms, missiles, and armour; a
# fire and an anvil in the smith's corner, Temper works at the anvil). Their keepers are the
# shopkeepers of data/shops.toml, named here. East of them, private houses behind closed doors:
# a family's house with its hearth, beds, and table, and two cottages under one roof, a
# townsman at home in two of them.
#
# The town's animals (#1248), wildlife at peace with everyone and in no population, so no quest
# draws them: a dog along the lane north of the shops (e), another on the green east of the
# square (d), a cat on the strip south of the Mynster and the inn (c), and the granary's mouser
# (C).
#
# South of the square: the Mynster (stone), the temple, a sanctuary (the [[room]] table: wounds
# heal faster and nothing hostile steps in) where Sister Hild (H) cures and mends for gold; the
# Gæsthūs (the inn), where Godgifu (G) has news of the march and bread on the table for
# travellers; Reeve Leofric's house (L); Factor Wulfrun's office (F); and in the south-east corner
# the Gildhalle, the hall of the Weyfarers' Gilde (docs/design/adventurers-guild.md §4), where
# Wat One-Eye (M) gives the guild's work, its bounty board (N) beside the door; across the lane
# its yard, where training dummies (Y) stand to be struck and shot at. A shrine stone
# stands by the Mynster's door.
#
# Texture: the granary by the wall, fields inside the wall, the pond north-east, and outside
# the gate the gallows hill (a dead tree on rocky ground) beside the road from the pass.
