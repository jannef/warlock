# The overworld of the Ascmearc (spec §3, §7; docs/design/campaign.md §5): the ash march at map
# scale, 120x60. A step is a journey of the terrain's `travel_minutes` (road 20, plains 45,
# grassland 50, forest 90, hills 120, swamp and dense forest 150, a ford 30).
#
# The player comes in by Beorggeat (P), the pass in Grægweall, the western wall: a closed way back,
# with no level behind it. The road runs five cells east to Cēaptūn (T), the market town at the
# crossroads, then on east over Hlāwdūn, the barrow downs, past Cealdhlāw (1, the cold barrow), to
# the ford (%) over Blæcwæter and the village beyond (Fordwīc's site, the road's end at 94, 28).
# South, the road crosses Beorhtburna by the bridge (b) and follows its south bank to Fennhām's
# site (the road's end at 62, 43); north, it runs to the edge of Holegnwudu.
#
# Rivers (arrows, the way they flow), two cells wide so only a bridge or the ford crosses them:
# Blæcwæter from the foot of Rēcbeorgas south through Micelfenn into Grægsæ (w), and Beorhtburna
# from the western wall east into Blæcwæter. The volcano, Fyrbeorg (^), smokes on the south face
# of Rēcbeorgas. Two dungeons are hidden until a quest reveals them: Fennmynster (2) in the
# swamp of Micelfenn and Fyrdelf (3) in the hills of Ascdūn; no road leads to either.
#
# The locations that lead nowhere yet (the town, the barrow, the hidden two) get their levels
# from later work (the town, the dungeon branches); the rest of the design's forty sites
# are plain cells kept free for now, six cells or more apart.
#
# Drawn from the design's 1:2 sketch, then edited by hand; keep every walkable cell in a region
# (a test checks).
