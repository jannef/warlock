# Hryre, "the fall" (#1684): the eighth crypt under Līctūn, below Cildra Ærn, reached by the
# stairs that open there once its places are filled (spec §7 "Graves"; `docs/dev/graves.md`).
# Its stairs up (<) lead back to Cildra Ærn. No danger, nobody here.
#
# Once a long hall of two aisles on pillars (P), niches all along both walls. Its roof came down
# in the middle long ago: a mound of fallen earth (E) fills the centre, rubble and cracked stone
# round it, the niches under it buried. The way on is round the mound's edge, over the rubble.
# Coffins stand at both ends of the hall, out of the fall's reach. In the east apse lies the
# mason who built the roof (F), places for statues by him and at the hall's end (S), and behind
# him the way down to the next crypt (v), shut until every place here is filled.
#
# Places: 25 niches and 6 sarcophagi, 31 in all, filled in row order.
name = "Hryre"
arrival = "Hryre, the fall: a pillared hall, its middle buried under the roof that came down."
temperature = 6
ambient = [6, 6, 8, 0]
