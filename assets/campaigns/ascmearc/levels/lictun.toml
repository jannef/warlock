# Līctūn, "the corpse-yard" (#1258, #1682): Cēaptūn's churchyard, beside the road that runs south
# from the town, four cells out (the Ascmearc's overworld, g, at 19, 32). A hand-made outdoor
# level (sky, sun, weather), entered from that cell, arriving on the road outside the gate (@).
# Like any outdoor area it is left by walking off its edge (or with `<` when no enemy is about),
# back to its overworld cell (spec §7 "Leaving an outdoor area"). No danger: nothing comes, and
# nobody here but the sexton.
#
# A drystone wall round the yard, the lych-gate on the road; a yew in each corner. The path runs
# from the gate to the chapel in the middle: stone, a door between two sconces, stools for pews,
# the altar between two lamps, and a back door onto a flagged path that ends in a slab among the
# flowers. Ten old graves of Cēaptūn's own stand by the chapel (1-0); forty plots kept for graves
# lie in four rows of ten, two north of the chapel and two south. Old Dudda the sexton (K) walks
# his rounds between them.
#
# The burial ground (spec §7 "Graves"; `docs/dev/graves.md`): the top of the chain `lictun`, its
# crypts below (`lictun_crypt_01`, ...). Every one of the graveyard's dead but the petrified gets a
# plot, the oldest death first; once all forty are filled the slab at the end of the flagged path
# (v) opens as the stairs down to the first crypt.
name = "Līctūn"
kind = "outdoor"
arrival = "Līctūn, Cēaptūn's churchyard: rows of plots in the grass, and a little chapel."
item_level = 1
map = '''
.,..................................................
.,..###############################################.
.,..#.Y.........................................Y.#.
.,..#.............................................#.
.,..#....P...P...P...P...P...P...P...P...P...P....#.
.,..#.............................................#.
.,..#....P...P...P...P...P...P...P...P...P...P....#.
.,..#................1..2..3..4...................#.
.,..#...K.........................................#.
.,..#..............WWWWWWWWWWWWW..................#.
.,..#.......*......WpppppppppppW...........*......#.
.,..#..............WpsspsspsplpW...*.*............#.
.,..#..............tpppppppppppW.......9..........#.
.,@:'::::::::::::::+ppppppppp_p+::::v.............#.
.,..#..............tpppppppppppW.......0..........#.
.,..#..............WpsspsspsplpW...*.*............#.
.,..#.......*......WpppppppppppW...........*......#.
.,..#..............WWWWWWWWWWWWW..................#.
.,..#.............................................#.
