'''

[burial]
chain = "lictun"
depth = 0
epitaph = "Here lies {name}, {death}."

[legend]
"." = "grass"
"," = "dirt_road"
":" = "flagstones"
"*" = "flowers"
"#" = "drystone_wall"
"'" = "gate_open"
"P" = "grave_plot"
"Y" = "tree"
"W" = "wall"
"p" = "plank_floor"
"l" = { terrain = "plank_floor", light = "lamp" }
"s" = "stool"
"t" = "sconce"
"_" = "altar"
"+" = "door_closed"
"@" = { terrain = "dirt_road", spawn = "player" }
# The way down to the first crypt: a flagstone until every plot is filled.
"v" = { terrain = "flagstones", burial_stairs = "stairs_down" }
# Old Dudda, the sexton, on his rounds of the stones (campaigns/ascmearc/data/dialogue/lictun.toml).
"K" = { terrain = "grass", creature = "sexton", npc = "dudda", route = "E36 S10 W36 N10" }
# Cēaptūn's own dead, by the chapel: one entry each, the words as they are cut.
"1" = { terrain = "gravestone", epitaph = "Here lies Ælfric atte Welle, reeve of Cēaptūn, 1361–1419. He kept the peace and the tally both." }
"2" = { terrain = "gravestone", epitaph = "Here lieth Eadgyth Webbe, 1372–1430. Her cloth went as far as Holtwīc." }
"3" = { terrain = "gravestone", epitaph = "Pray for the soul of Brother Cēolmund, priest of this chapel, 1338–1401." }
"4" = { terrain = "gravestone", epitaph = "Wulfstan Smyth, 1389–1427. The anvil is quiet." }
"5" = { terrain = "gravestone", epitaph = "Here resteth Mildred Bacere, 1366–1433. Her loaves were the best in the march." }
"6" = { terrain = "gravestone", epitaph = "Leofwine Hunta, 1402–1424. He went up to the pass and was not found. This stone keeps his name." }
"7" = { terrain = "gravestone", epitaph = "Here lies Wynburh, wife of Godwine, 1380–1412, and her child, unnamed." }
"8" = { terrain = "gravestone", epitaph = "Osmund Fiscere, 1350–1421. The river took him at the ford." }
"9" = { terrain = "gravestone", epitaph = "Here lies Dunstan Swān, sexton of this yard, 1330–1404. He dug for all of them. — D." }
"0" = { terrain = "gravestone", epitaph = "In memory of Hereward Lang, soldier, 1395–1439. Gone under the hill." }
