# Līctūn, "the corpse-yard" (#1258): Cēaptūn's churchyard, beside the road that runs south from
# the town, four cells out (the Ascmearc's overworld, g, at 19, 32). A hand-made outdoor level
# (sky, sun, weather), entered from that cell, arriving on the road outside the gate (@). It has
# no stairs: like any outdoor area it is left by walking off its edge (or with `<` when no enemy
# is about), back to its overworld cell (spec §7 "Leaving an outdoor area"). No danger: nothing
# comes, and nobody here but the sexton.
#
# A drystone wall round the yard, the lych-gate on the road; inside, fifty gravestones in four
# rows of twelve on the grass and two beside the chapel, a yew in each corner, flowers on the
# newer graves. The path runs from the gate to the chapel in the middle: stone, a door between
# two sconces, stools for pews, and the altar between two lamps. Old Dudda the sexton (K) walks
# his rounds of the stones.
#
# The stones (spec §7 "Graves"; `world/fixtures/graves.rs`): each gravestone cell gets an inscription as
# the yard is made, from the `[graves]` words at the end: one stone in ten names one of the
# graveyard's fallen (every character who has died, as the game's graveyard file remembers them),
# the rest the town's own dead, a name and a byname of Cēaptūn's folk and plausible years before
# the year the yard is first seen. Look mode reads them.
name = "Līctūn"
kind = "outdoor"
arrival = "Līctūn, Cēaptūn's churchyard: rows of stones in the grass, and a little chapel."
item_level = 1
