############N#N##########,,,#########N#N#N##########
##########N,,i,,##########.##########,,i,,##########
#########N,,,,,,,#########.#########,,,,,,,N########
##########,,,,,,,.####.........####.,,,,,,,#########
##########N#,,,###...S.........S...###,,,#N#########
###################...............##################
###################....i..F..i....##################
###################...............##################
############,,,###...S.........S...###,,,#N#########
#########N,,,,,,,.####.........####.,,,,,,,#########
#########N,,,,,,,#########.#########,,,,,,,N########
###########,,,,,##########.##########,,,,,##########
###########N#N#N#########,,,#########N#N#N##########
#######################,,,i,,,######################
#######################,,,,,,,######################
#######################N,,v,,N######################
#########################N#N########################
####################################################
####################################################
####################################################
'''

[burial]
chain = "lictun"
depth = 7
epitaph = "Here lies {name}, {death}. Laid among the little ones, to keep them company."

[legend]
"," = "dusty_floor"
"N" = "empty_niche"
"i" = "candles"
"t" = "sconce"
"<" = { terrain = "stairs_up", to = "lictun_crypt_06" }
"S" = { terrain = "floor", statue_place = true }
"v" = { terrain = "dusty_floor", burial_stairs = "stairs_down" }
"F" = { terrain = "sarcophagus", epitaph = "Here lie the children of Cēaptūn whom the spotted fever took in the winter of 1009, forty-one of them. Suffer them to come." }
