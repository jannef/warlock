# Līctūn crypt 9, "the death-pit" (#1684): the ninth crypt under Līctūn, below Līctūn crypt 8, reached by the
# stairs that open there once its places are filled (spec §7 "Graves"; `docs/dev/graves.md`).
# Its stairs up (<) lead back to Līctūn crypt 8. No danger, nobody here.
#
# No crypt but a pit, dug in haste in a year of plague and roofed over after. Its walls are bare
# earth; a rough tunnel comes down to it from the north-west. In the middle the plague's dead lie
# heaped and walled in with their own bones (B), one niche sealed in the heap with words for all
# of them (F). Round it a ring of trodden earth, niches cut later into the pit's outer wall,
# places for statues on its rim (S). A second tunnel leaves to the south-east, to the way down
# to the next crypt (v), shut until every place here is filled.
#
# Places: 26 niches, filled in row order.
name = "Līctūn crypt 9"
arrival = "Līctūn crypt 9, the death-pit: a round pit dug in bare earth, and a heap of bones in the middle."
temperature = 5
ambient = [6, 6, 8, 0]
item_level = 1
