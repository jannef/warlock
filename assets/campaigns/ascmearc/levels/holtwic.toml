# Holtwīc, "the dwelling at the wood" (#1140): the farming village at the end of the road that
# runs north from Cēaptūn, on the edge of Holegnwudu, the holly wood. A hand-made outdoor level
# (sky, sun, weather; the well freezes in a hard winter), entered from its cell on the Ascmearc's
# overworld (V, at 18, 17), arriving on the lane from the south (@) where the road comes in. It has
# no stairs: like any outdoor area it is left by walking off its edge (or with `<` when no enemy
# is about), back to its overworld cell (spec §7 "Leaving an outdoor area"). Everyone here is
# peaceful, and nothing comes: no danger, no shop.
#
# The green in the middle, with the well; six cottages round it; the fields to the north and
# west behind their hedges (barley standing, a field of stubble). The cottars (1-5, the `cottar`
# type) go about the green, the lanes, and the fields. East, the wood comes right up to the
# village: at its edge, apart from the rest, is the cottage of the village's wise-woman, Gammer
# Wynflæd (H), a hearth fire and a lamp inside and her herb garden at the door, and north of it an
# old hoar-stone with rowan hung on it. South-east of the green, the chicken pen: a fence, a
# gate, and the village's hens (#1248); a dog on the grass south of the green and a cat in a
# cottage, wildlife at peace with everyone and in no population, so no quest draws them. The fairy mound she knows of lies seven cells north-east
# on the overworld, hidden (`ascmearc.toml`, E).
name = "Holtwīc"
kind = "outdoor"
arrival = "Holtwīc: thatch, woodsmoke, and the holly wood dark beyond the last field."
