# Gimmwīc, "the gem dwelling" (#1434): the deep gnomes' town at the bottom of Dēopgang, cut out of
# the rock. A hand-made level below the branch's eleventh floor (data/dungeons/deopgang.toml's
# `bottom`): its stairs up (<) lead back there, and the player arrives on them. Nothing comes: no
# danger, no population. Everyone here is peaceful (the townsfolk, the people, the traders), so
# the town is safe unless the player steals. Deep gnomes see in the dark; the lamps, torches, and
# the Glimmering's crystals are for their guests and their work.
#
# North of the street, from the west: the arrival cave and its stairs; the moot hall, where
# Headman Peran (P) speaks for the town at its long table; across the lane the Glimmering, the
# temple, a sanctuary (the [[room]] table: wounds heal faster and nothing hostile steps in) lit by
# its crystals, where Mother Senara (M) cures and mends for gold beside the altar; and Kerensa's
# Stones, the gem dealer, who also appraises (identifies) what the player carries for gold.
#
# South of the street: Jory's Outfitters, the makers' stock (ingots, billets, herbs, essences),
# the deep's tools, and food; the cutting floor, the town's open workshop, with three anvils
# (every Metalcraft and Jewelcraft recipe that asks for one is made here, Temper too), two
# forge braziers, and the workbenches, where Old Tregear (T) teaches Jewelcraft for gold and
# Morwenna (C), the crystal-reader, warms herself by a brazier and talks of what each magic
# crystal binds (docs/dev/enchanting.md); two houses with a gnome at home in one; the mushroom
# garden and its pool, east; and down the lane
# the fungus farm and a third house.
#
# The townsfolk (deep gnomes, 1-6) go about the street, the lane, the farm, and the garden.
name = "Gimmwīc"
arrival = "Lamplight, and the ring of hammers on small anvils: Gimmwīc, the deep gnomes' town."
# The deep's stable cold, a little warmed by the forges.
