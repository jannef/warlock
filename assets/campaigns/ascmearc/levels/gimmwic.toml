# portal into Meyn Bew, hidden (plain floor) until she gives her quest (data/quests/ysella.toml).
"K" = { terrain = "floor", creature = "deep_gnome_binder", npc = "ysella" }
"O" = { terrain = "floor", hidden = { id = "meyn_bew", terrain = "crystal_portal", to = "meynbew:1", name = "Meyn Bew", opens = "Ysella sings one long note. The rock beside her rings, and opens on a ring of crystal light." } }

