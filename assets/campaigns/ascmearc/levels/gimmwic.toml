# dark, and a guest without darkvision must see him to talk to him (#1435's letter goes to him).
"P" = { terrain = "floor", light = "lamp", creature = "deep_gnome_headman", npc = "peran" }
"M" = { terrain = "floor", creature = "deep_gnome_priest", npc = "senara" }
