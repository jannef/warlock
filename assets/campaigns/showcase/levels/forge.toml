# The forge (spec §7 "Special rooms"): a cold smithy with an anvil to temper at (the Temper
# ability, the abilities menu's Here group, beside it). Arms and armour lie on the bench to work
# on: a long sword, a dagger, a coat of chain mail, an iron helm, and a small shield. Each
# attempt takes ten minutes and may improve or damage the piece, and mend a damaged one or break
# it; data/temper.toml has the numbers. Beside the anvil lies the smith's stock to forge from
# (Metalcraft's recipes, docs/dev/crafting.md): steel, iron, and mithril ingots, and a ruby and an
# emerald for a pommel; and flint, wood billets, and sinew for Woodcraft's hand-made weapons (a
# flint spear, a short bow, with the bench's dagger for a knife); past them, leather hides for
# Woodcraft's hide gear (a leather jerkin).
arrival = "Soot blackens the walls of an old smithy. The anvil still stands."
name = "The Forge"
ambient = [6, 6, 8, 0]
map = '''
#############
#t.........t#
#...........#
#.....A.....#
#....@......#
#...........#
#...........#
#...........#
#############
'''

[legend]
"@" = { terrain = "floor", spawn = "player" }
"A" = "anvil"
"t" = "sconce"

[[room]]
effect = "forge"
area = [0, 0, 12, 8]

[[pile]]
at = [3, 6]
objects = ["long_sword"]

[[pile]]
at = [4, 6]
objects = ["chain_mail", "iron_helm"]

[[pile]]
at = [5, 6]
objects = ["small_shield"]

[[pile]]
at = [6, 6]
objects = ["dagger"]

[[pile]]
at = [6, 4]
objects = ["piece*8", "piece:iron*4", "piece:mithril*3", "piece:flint*2", "piece:wood*8", "gem:ruby", "gem:emerald", "piece:sinew*2"]

[[pile]]
at = [7, 4]
objects = ["piece:leather*4"]
