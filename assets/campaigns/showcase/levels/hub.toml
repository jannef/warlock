# Magic items (#149): a rack of magic arms in the storeroom. Identified, a magic sword and a rare
# helm that glows when worn; not yet identified, a rare bow and a magic ring (their rarity shows,
# their affixes do not, yet their effects apply). Look at them in the inventory (a letter). The
# sword's pommel is an emerald (gems, #191): its name and its description show it.
[[item]]
at = [19, 14]
object = "long_sword"
affixes = ["sharp:2", "of_the_bear:2"]
identified = true
parts = [{ part = "pommel", of = "emerald", size = "small", cut = "fine" }]

# Gems (#191): the secret closet's reward besides its gold, an uncut tiny garnet, duller than a
# cut gem, and on top a medium sapphire of fine cut.
[[item]]
at = [17, 18]
object = "gem"
parts = [{ of = "garnet", size = "tiny", cut = "uncut" }]

[[item]]
at = [17, 18]
object = "gem"
parts = [{ of = "sapphire", size = "medium", cut = "fine" }]

[[item]]
at = [19, 14]
object = "iron_helm"
name = "Dread Visage"
affixes = ["hale:2", "accurate:1", "radiant:2", "of_the_owl:1"]
identified = true

[[item]]
at = [18, 14]
object = "short_bow"
name = "Storm Song"
affixes = ["hunters:1", "glinting:2", "of_celerity:1"]

[[item]]
at = [18, 14]
object = "silver_ring"
