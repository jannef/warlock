[[pile]]
at = [19, 15]
objects = ["long_bow"]

[[pile]]
at = [18, 15]
objects = ["crossbow", "bolt*16"]

[[pile]]
at = [19, 13]
objects = ["sling", "sling_stone*20"]

[[pile]]
at = [20, 14]
objects = ["rock*5"]

[[pile]]
at = [17, 15]
objects = ["rope", "club"]

[[pile]]
at = [21, 13]
objects = ["small_shield", "quarterstaff"]

[[pile]]
