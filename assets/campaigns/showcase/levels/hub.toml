# The showcase hub (spec §3). Each room demonstrates one engine capability:
# top row: light hall (M3), darkness chamber (M3), water garden (M4);
# bottom row: start room, door corridor, patrol gallery, effects room (M4), stairs nook (> down to
# the Vast Caverns, v down to the arena, Q down to the quarry, g down to the Frost Grotto, T down
# to the trap hall, < up and out to the overworld, ^ up to the courtyard).
#
# Temperature and ice (M26): the hub is a mild 10 °C, like every dungeon by default, so its water
# never freezes; the Frost Grotto (g, down) is below freezing, with a frozen pool to walk on.
#
# Lighting (M3): no ambient light. Rooms are lit by wall torches (t), lamps (l), and a brazier (B);
# the light hall has colored crystals (R G U A) between pillars that cast colored shadows; the
# darkness chamber has only faint fungus (f, low-light vision) and a UV rune (u, UV sight); the
# patrol gallery is dark in the middle, where only the kobold's torch lights the way.
#
# Speed (M10): in the patrol gallery a cave beetle (1) and a cave bat (3) run down parallel lanes,
# the bat faster; the torch-carrying kobold (2) circles them a little slower than you walk.
#
# Factions and behavior (M10): the beetle and the bat are wildlife, neutral to everyone, so they
# keep to their lanes; the kobold is of the peaceful faction (`faction = "peaceful"` overrides its
# type's hostile one), so the showcase is safe and it just walks its round. The arena (v, down)
# is where creatures hunt, fight each other, and fight you.
#
# Effects (M4): the effects room has a brazier (sparks, glow, heat haze), a lava pool (=, embers,
# haze), a fountain (F) in a pool to wade through (splashes), and dusty floor (:, drifting motes);
# doors puff dust when they open or close, and the stairs fade the screen on the way down.
#
# Water (M8): the water garden's ponds are still water (~); a fast spring (⇐) runs out of the east
# wall into the east pond, and a rill (←) carries its overflow into the west pond. Arrows are
# running water flowing that way (data/legend.toml).
#
# Sunlight (M9): the stairs nook's staircase up (^ in the map, drawn `<`) climbs to the courtyard,
# a garden under the open sky.
#
# Special rooms (M25): the stairs nook is a sanctuary (the [[room]] table at the end): a faint warm
# glow, wounds heal three times as fast, and nothing hostile to you steps in. You are told the
# first time you enter it ("You feel at peace here."), and look mode names it from then on.
#
# NPCs (#146): an old hermit (H) sits in the stairs nook's corner, beside the quarry stairs. Chat
# with him (`C`): he knows the hall's rooms and tells you about them. He is peaceful, and walking
# into him (or any creature that is not hostile) swaps places with him (#147).
#
# Objects (M11): gold and a small pile in the start room to pick up (`,` or `g`); the door
# corridor's west room is a storeroom of arms and armor and its east room a pantry; an amulet lies
# in the dark of the darkness chamber, and a ring before the water garden's altar. The patrolling
# kobold carries a sword and some coins, and wields the sword. The piles are placed with [[pile]]
# tables at the end.
#
# Equipment (M16): the storeroom has something for every slot but the rings and the neck (the
# ring and the amulets lie elsewhere): a helm, mail, a cloak, weapons (a quarterstaff and a
# great sword for both hands), a shield, gloves, boots, and a bow with arrows. Wear and wield them
# with `e`. The start room's dagger is light: it goes in the off hand beside the spear or the
# club, for fighting with two weapons (spec §8 "Fighting styles").
#
# Materials (#193, #194): the great sword under the spear is bronze, not steel, as a placement
# may say (`"great_sword:bronze"`): heavier, a little weaker, and cheaper, drawn in bronze's
# colour; look at it in the inventory.
#
# Doors (M19): the pantry's west door (P) is locked; the iron key to it lies in the storeroom.
# Unlock it by opening it with the key, or kick it in (`K`): a broken door stays open for good.
# Hunger (M23): the pantry keeps food: food rations, loaves of bread, dried meat, and apples. Eat
# with `E`.
#
# Ranged combat (M16): the storeroom also has a long war bow, a crossbow with bolts, a sling with
# stones, rocks to throw, and flaming arrows beside the short bow's arrows. Ready a bow and arrows
# with `e`, then shoot with `t` (`T` throws from the pack): a flaming arrow shot into the patrol gallery's
# dark middle lights it where it lands until it burns out.
#
# Magic items (#149): two piles in the middle of the storeroom hold magic and rare arms ([[item]]
# tables at the end): a Sharp emerald-pommelled long sword of the Bear (gems, #191: its pommel is
# a small emerald of fine cut) and a rare helm, Dread Visage, both identified (the helm glows when
# worn), and an unidentified rare bow and magic ring.
# Digging (M19): the storeroom has a pick-axe for the Tool slot; use it with `U` toward a wall.
# The stairs nook's Q leads down to the quarry, the place to dig.
#
# Searching (#140): the hall below the storeroom and the pantry hides a secret door (S) at its
# west end, behind which a closet keeps a little gold and two gems (#191). It looks like the wall until it is found:
# search beside it (`s`, or `z` for a while), or notice it in passing (elves, dwarves, and anyone
# trained in Spot, like the showcase's thief).
name = "The Hub"
ambient = [0, 0, 0, 0]
map = '''
################################################################################
#..........................#................ff.#t.........t.........t.........t#
#..#.....#.....#.....#.....#.....f.............#..~~~~~~~.........~~~~~~~......#
#..........................#....#####.#####....#.~~~~~~~~~←←←←←←←~~~~~~~~~.....#
#.....R.....G.....U.....A..#....#.......f.#....#.~~~~~~~~~...._..~~~~~~~~~⇐⇐⇐⇐⇐#
#..........................#....#....u....#....#.~~~~~~~~~.......~~~~~~~~~.....#
#..#.....#.....#.....#.....#....###########....#..~~~~~~~.........~~~~~~~......#
#..........................#...................#...............................#
#..........................#.ff................#t.........t.........t.........t#
#############+#######################+#########################+################
#.....l..........l..........l..........l..........l..........l..........l......#
#######+###############+###################+###################+##########+#####
#..t.......t...########.########.........................#..........~~~#.......#
#..............##t....#l#....t##..#...#...#...#...#...#..#..........~F~#...l.^.#
#..............##.....+.P.....##1........................#..........~~~#.......#
#......@.......##.....#.#.....##3........................#......B......#.......#
#..............####+###.###+####..#...#...#...#...#...#..#.............#.<.>.v.#
#..............####...........##2........................#.===.....::::#.......#
#..............##.S....t......##.........................#.===.....::::#.T.g.QH#
#..t.......t...#################t.......................t#.........::::#.......#
################################################################################
'''

[legend]
"@" = { terrain = "floor", spawn = "player" }
"1" = { terrain = "floor", creature = "beetle", route = "E24 W24" }
"2" = { terrain = "floor", creature = "kobold", faction = "peaceful", route = "E24 N5 W24 S5", carry = ["short_sword", "copper_coin*7"], wield = "short_sword" }
# Beside the beetle, a cave bat on a parallel lane: it is faster (creatures.toml `speed`), so it
# pulls ahead and laps the beetle.
"3" = { terrain = "floor", creature = "bat", route = "E24 W24" }
">" = { terrain = "stairs_down", to = "vast" }
"<" = { terrain = "stairs_up", to = "overworld" }
"t" = "sconce"
"B" = "brazier"
"l" = { terrain = "floor", light = "lamp" }
"f" = "fungus"
"u" = "uv_rune"
"R" = { terrain = "crystal", light = "crystal_red" }
"G" = { terrain = "crystal", light = "crystal_green" }
"U" = { terrain = "crystal", light = "crystal_blue" }
"A" = { terrain = "crystal", light = "crystal_amber" }
"=" = "lava"
"F" = "fountain"
":" = "dusty_floor"
# Stairs up (drawn `<`) to the courtyard.
"^" = { terrain = "stairs_up", to = "courtyard" }
# Stairs down (drawn `>`) to the arena.
"v" = { terrain = "stairs_down", to = "arena" }
# The pantry's west door is locked (spec §8 "Doors"); its key, the iron key, lies in the storeroom
# across the corridor. Open it with the key, or kick it in (`K`).
"P" = { terrain = "door_closed", lock = "pantry" }
# Stairs down (drawn `>`) to the quarry, the place to dig.
"Q" = { terrain = "stairs_down", to = "quarry" }
# A secret door (spec §8 "Searching"): a closed door that looks like the wall until it is found.
"S" = { terrain = "door_closed", secret = true }
# Stairs down (drawn `>`) to the Frost Grotto, where the cold has frozen a pool.
"g" = { terrain = "stairs_down", to = "frost_grotto" }
# Stairs down (drawn `>`) to the trap hall (spec §8 "Traps"): the showcase has no traps.
"T" = { terrain = "stairs_down", to = "trap_hall" }
# The old hermit, by the stairs.
"H" = { terrain = "floor", creature = "hermit" }

# Special rooms (data/room_effects.toml): the stairs nook, walls and door included, is a sanctuary.
[[room]]
effect = "sanctuary"
area = [71, 11, 79, 20]

# Objects, top of each pile first.
# The secret closet's reward.
[[pile]]
at = [17, 18]
objects = ["gold_coin*25"]

# The start room.
[[pile]]
at = [10, 14]
objects = ["gold_coin*12"]

[[pile]]
at = [5, 17]
objects = ["leather_jerkin", "dagger", "candle*2"]

# The storeroom (the door corridor's west room).
[[pile]]
