# The test world's door into the Hunter (docs/design/prestige-classes.md §4.2): the same door as
# the Ascmearc's, made by another deed. The hermit by the hub's stairs knows the oath's first
# words (data/dialogue/showcase.toml): a bard whose class is full asks him of them and is called.
# No spirit and no encounter: those are the Ascmearc's alone.
[[calling]]
class = "hunter"
from = ["bard"]
level = 30
message = "The oath is in you now, as a blade is in its sheath. You are a hunter."
