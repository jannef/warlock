# Warlock keymap: every command's keys, by where they are read. A key is the character it
# types ("k", ">", "?") or a key name ("ArrowUp", "Numpad8", "Enter", "F5"); an empty
# list leaves a command without a key. Import it in Controls or with
# `warlock --import-keys FILE`: commands it does not list keep their keys. Esc is fixed.
version = 1

[play] # In play
move_n = ["Numpad8", "ArrowUp"]
move_ne = ["Numpad9"]
move_e = ["Numpad6", "ArrowRight"]
move_se = ["Numpad3"]
move_s = ["Numpad2", "ArrowDown"]
move_sw = ["Numpad1"]
move_w = ["Numpad4", "ArrowLeft"]
move_nw = ["Numpad7"]
wait = [".", "Numpad5"]
search = ["s"]
search_long = ["S"]
open = ["o"]
close = ["c"]
kick = ["k"]
descend = [">"]
ascend = ["<"]
pick_up = [",", ";"]
drop = ["d"]
inventory = ["I"]
equipment = ["i"]
character = ["@"]
skills = ["A"]
weapon_skills = ["W"]
quests = ["q"]
talents = ["G"]
messages = ["v"]
rest = ["b"]
eat = ["e"]
read = ["r"]
study = ["L"]
look = ["l"]
missile = ["t"]
throw = ["T"]
more_aggressive = ["+"]
more_defensive = ["-"]
abilities = ["a"]
repeat_ability = ["X"]
bash = []
throw_voice = []
disarm = []
pick_lock = []
steal = []
pay = ["p"]
use_tool = ["u"]
chat = ["C"]
help = ["?"]
quit = []

[aim] # Aiming
next_target = ["Tab"]
prev_target = []
loose = ["Enter", "NumpadEnter"]

[prompt] # Rest prompt
rest_hour = ["h"]
rest_dawn = ["d"]
rest_dusk = ["n"]

[more] # More messages (--more--)
more_next = ["Space", "Enter", "NumpadEnter"]
more_skip = []

[menu] # Menus and screens
menu_up = ["ArrowUp", "k"]
menu_down = ["ArrowDown", "j"]
menu_left = ["ArrowLeft", "h"]
menu_right = ["ArrowRight", "l"]
confirm = ["Enter", "NumpadEnter"]
back = []
erase = ["Delete", "Backspace"]
mark = ["Space"]
mark_all = [","]
next_list_page = [">", "PageDown"]
prev_list_page = ["<", "PageUp"]

[text] # Text fields
text_confirm = ["Enter", "NumpadEnter"]
text_erase = ["Backspace", "Delete"]
text_random = ["Tab"]
text_back = []

[pages] # Info pages
page_1 = ["1"]
page_2 = ["2"]
page_3 = ["3"]
page_4 = ["4"]
page_5 = ["5"]
page_6 = ["6"]
page_7 = ["7"]
page_8 = ["8"]
page_9 = ["9"]
next_page = ["Tab"]
prev_page = []

[dialog] # Dialogs
yes = ["y"]
no = ["n"]

[dev] # Developer
dev_reveal_map = ["F2"]
dev_next_vision = ["F3"]
dev_light_values = ["F4"]
dev_snapshot = ["F5"]
dev_skip_hour = ["F6"]
dev_next_weather = ["F7"]
dev_identify_all = ["F8"]
dev_load_snapshot = ["F9"]
