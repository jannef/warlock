# Warlock keymap: every command's keys, by where they are read. A key is the character it
# types ("k", ">", "?") or a key name ("ArrowUp", "Numpad8", "Enter", "F5"); in play
# it may be held with Ctrl, Alt, Super, or Shift ("Ctrl+r", "Alt+ArrowUp", "Super+s").
# An empty list leaves a command without a key. Import it in Controls or with
# `warlock --import-keys FILE`: commands it does not list keep their keys. Esc is fixed.
version = 1

[play] # In play
move_n = ["Numpad8", "ArrowUp"]
move_ne = ["Numpad9"]
move_e = ["Numpad6", "ArrowRight"]
move_se = ["Numpad3"]
move_s = ["Numpad2", "ArrowDown"]
move_sw = ["Numpad1"]
move_w = ["Numpad4", "ArrowLeft"]
move_nw = ["Numpad7"]
run_n = ["Alt+Numpad8", "Alt+ArrowUp"]
run_ne = ["Alt+Numpad9"]
run_e = ["Alt+Numpad6", "Alt+ArrowRight"]
run_se = ["Alt+Numpad3"]
run_s = ["Alt+Numpad2", "Alt+ArrowDown"]
run_sw = ["Alt+Numpad1"]
run_w = ["Alt+Numpad4", "Alt+ArrowLeft"]
run_nw = ["Alt+Numpad7"]
wait = ["Numpad5", "s"]
search_long = ["Alt+Numpad5", "Alt+s"]
open = ["o"]
close = ["c"]
kick = ["k"]
descend = [">"]
ascend = ["<"]
pick_up = [",", ";"]
drop = ["d"]
inventory = ["I"]
equipment = ["i"]
character = ["@"]
skills = ["A"]
weapon_skills = ["W"]
quests = ["q"]
talents = ["G"]
messages = ["v"]
rest = ["b"]
eat = ["e"]
read = ["r"]
look = ["l"]
missile = ["t"]
throw = ["T"]
more_aggressive = ["+"]
more_defensive = ["-"]
abilities = ["a"]
repeat_ability = ["X"]
bash = []
throw_voice = []
disarm = []
pick_lock = []
steal = []
pay = ["p"]
use_tool = ["u"]
chat = ["C"]
help = ["?"]
quit = []

[aim] # Aiming
prev_target = []

[more] # More messages (--more--)
more_next = ["Space", "Enter", "NumpadEnter"]
more_skip = []

[menu] # Menus and screens
back = []

[text] # Text fields
text_back = []

[pages] # Info pages
prev_page = []

[dev] # Developer
dev_reveal_map = ["F2"]
dev_next_vision = ["F3"]
dev_light_values = ["F4"]
dev_snapshot = ["F5"]
dev_skip_hour = ["F6"]
dev_next_weather = ["F7"]
dev_identify_all = ["F8"]
dev_load_snapshot = ["F9"]
